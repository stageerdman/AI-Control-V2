<script data-module="js/core.js">
"use strict";
/* ============================================================
   core.js — shared primitives every module may use.
   Public: PALETTE, COLOR_NAMES, HUES, hueHex(), shade(), hexTint(),
           escapeHtml(), escapeAttr(), reducedMotion(), toast(),
           fireConfetti(), sparkle(), announce(), openSheet(), closeSheet(),
           go(route), currentRoute()
   No DOM rendering of screens here; no knowledge of other modules.
   ============================================================ */

/* The 7 character hues (+ sun-deep, a gear/UI accent only). */
const PALETTE = {
  sun: '#ffc24b', 'sun-deep': '#ff9b3d', coral: '#ff6f73', teal: '#2fd3c3',
  sky: '#4ea8ff', grape: '#9b6cff', mint: '#8be88b', rose: '#ff9ecf',
};
const COLOR_NAMES = { sun: 'Amber', coral: 'Coral', teal: 'Teal', sky: 'Sky', grape: 'Grape', mint: 'Mint', rose: 'Rose' };
const HUES = Object.keys(COLOR_NAMES);

/* palette key or hex → hex */
function hueHex(k) { return PALETTE[k] || k || PALETTE.sun; }

/* lighten (+) / darken (−) a hex by a flat amount per channel */
function shade(hex, amt) {
  const n = parseInt(hueHex(hex).slice(1), 16);
  const r = Math.max(0, Math.min(255, (n >> 16) + amt));
  const g = Math.max(0, Math.min(255, (n >> 8 & 255) + amt));
  const b = Math.max(0, Math.min(255, (n & 255) + amt));
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function hexTint(key, a = 0.2) {
  const n = parseInt(hueHex(key).slice(1), 16);
  return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`;
}

function escapeHtml(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function escapeAttr(s) { return String(s ?? '').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
function reducedMotion() { return matchMedia('(prefers-reduced-motion:reduce)').matches; }

/* ---------- feedback ---------- */
let _toastTimer = null;
function toast(msg, ms = 2800) {
  const t = document.getElementById('toast');
  t.innerHTML = msg; t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}
function fireConfetti() {
  if (reducedMotion()) return;
  const c = document.getElementById('confetti'); const cols = Object.values(PALETTE);
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('i'); p.style.left = Math.random() * 100 + 'vw';
    p.style.background = cols[i % cols.length]; p.style.animationDuration = (1.4 + Math.random() * 1.4) + 's';
    p.style.animationDelay = (Math.random() * .3) + 's'; p.style.transform = `rotate(${Math.random() * 360}deg)`;
    c.appendChild(p); setTimeout(() => p.remove(), 3200);
  }
}
/* small scoped burst; x/y in vw/vh (default centre) */
function sparkle(x = 50, y = 40) {
  if (reducedMotion()) return;
  const c = document.getElementById('confetti'); const cols = [PALETTE.mint, PALETTE.sun, PALETTE.teal];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('i'); p.style.left = (x - 15 + Math.random() * 30) + 'vw'; p.style.top = y + 'vh';
    p.style.background = cols[i % cols.length]; p.style.animationDuration = (1 + Math.random()) + 's';
    p.style.transform = `rotate(${Math.random() * 360}deg)`;
    c.appendChild(p); setTimeout(() => p.remove(), 2200);
  }
}
function announce(msg, assertive) { document.getElementById(assertive ? 'alertlive' : 'live').textContent = msg; }

/* ---------- focus-trapped sheet (dialog) ---------- */
let _lastFocused = null, _trapHandler = null;
function openSheet(contentEl, label, opts = {}) {
  const scrim = document.getElementById('scrim');
  _lastFocused = document.activeElement;
  scrim.innerHTML = '';
  const sheet = document.createElement('div');
  sheet.className = 'sheet' + (opts.wide ? ' wide' : '');
  sheet.setAttribute('role', 'dialog'); sheet.setAttribute('aria-modal', 'true');
  sheet.setAttribute('aria-label', label || 'Dialog'); sheet.style.position = 'relative';
  sheet.appendChild(contentEl);
  scrim.appendChild(sheet); scrim.hidden = false;
  scrim.onclick = e => { if (e.target === scrim) closeSheet(); };
  const focusables = () => sheet.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"]),[contenteditable="true"]');
  setTimeout(() => { const f = focusables(); if (f.length) f[0].focus(); }, 40);
  _trapHandler = e => {
    if (e.key === 'Escape') { closeSheet(); return; }
    if (e.key !== 'Tab') return;
    const f = focusables(); if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };
  document.addEventListener('keydown', _trapHandler);
  return sheet;
}
function closeSheet() {
  const scrim = document.getElementById('scrim');
  scrim.hidden = true; scrim.innerHTML = '';
  if (_trapHandler) { document.removeEventListener('keydown', _trapHandler); _trapHandler = null; }
  if (_lastFocused && _lastFocused.focus) { try { _lastFocused.focus(); } catch (e) { /* gone */ } }
}
function sheetOpen() { return document.getElementById('scrim').hidden === false; }

/* ---------- routing ----------
   Routes are hashes: #projects, #cast, #cast/teams, #access, #blueprint,
   #office/<projectId>[/<sub>], #gallery[/<section>]. go() only changes the
   hash; app.js listens and renders. */
function go(route) {
  const h = '#' + String(route).replace(/^#/, '');
  if (location.hash === h) window.dispatchEvent(new HashChangeEvent('hashchange'));
  else location.hash = h;
}
function currentRoute() { return location.hash.replace(/^#/, '') || 'projects'; }

</script>
<script data-module="js/hero.js">
"use strict";
/* ============================================================
   hero.js — Character system v4: little robot minions.
   THE way every screen draws a character (spec-cast §1 interface).

   Public (unchanged from v3):
     hero(agent, opts) → HTMLDivElement.hero
     heroSVG(agent, opts) → string (same markup; setPose etc. still work on it)
     setPose(el, pose, {seated, props, holding, moving}?)
     setFacing(el, facing, {dir, look}?)        animated screen-face turn (250ms)
     setLook(el, {x,y} | 'viewer' | null)       glowing eyes slide on the screen
     heroHeadAnchor(el) → {x, y} px inside el (antenna/gear top, for overlays)
     castOf(agent, mood, size)                  v2 shim
     POSES, FACINGS, BUILDS, HAIR, ACCESSORIES, HOLDINGS, ROLE_GEAR, HERO_SIZES,
     MOOD_TO_POSE, POSE_TEXT, MAT
   opts: size 'xs'|'sm'|'md'|'xl'|px · pose · facing 'side'|'three-quarter'|'front'
         dir 'right'|'left' · look · seated · props · holding
         'mug'|'envelope'|'paper'|'binder'|'pen'|'none' · role (override)
         captain · armband <hex> · ghost · label · moving

   The bot: a screen face (dark glass, big glowing eyes) on a rounded head
   shell, an antenna, a small chassis, mitten arms, and a hover base — no
   legs. Identity = hue (shell) + build (chassis silhouette) + "hair"
   (antenna style) + accessory (screen/head extra). Role = headgear + tool
   + chassis decal + badge.
     build   hero → squircle head, barrel chassis, jet hover
             sprout → orb head, tiny chassis, hover pad
             bruiser → box head, wide chassis, one wheel
             lanky → dome head on a stalk neck, tall chassis, hover ring
   Semantics for a legless bot:
     seated  = hovering low (rig drops 18 units, base hidden) behind a desk —
               the screen face always clears the desk top.
     walking = gliding: slight forward lean, arms trail, thruster brighter.
   Geometry: viewBox 0 0 120 160, ground y=152, centred on x=60.
   Coordinate spaces: head-local (shell ≈ r30), torso-local (40×42),
   hand-local (origin = hand centre, long axis up, kept upright).
   ============================================================ */

const MAT = { metal: '#c9c3dd', steel: '#8e86ad', wood: '#b9773f', paper: '#fff6e9' };
const HERO_INK = '#241a44';
const BOT_SCREEN = '#1c1636';

const BOT_HALO = '#7fe7ff';

const POSES = ['idle', 'walking', 'typing', 'writing', 'reading', 'carrying', 'talking', 'chilling', 'sleeping',

const HERO_SIZES = { xs: 48, sm: 96, md: 160, xl: 360 };
const MOOD_TO_POSE = { neutral: 'idle', idle: 'idle', working: 'typing', blocked: 'needs-input', celebrate: 'celebrating' };

/* per pose: screen mouth, eyes, whether the role tool shows, default hand-held
   item, rig-level desk prop, seated by default, fx overlay. Static key poses
   (arms, lean, look…) live in hero.css as custom properties on .pose-<name>. */
const POSE_DEF = {

/* Builds → bot silhouettes. head: neck pivot = cy + bottom*k; torso = chassis box. */
const BUILD_DEF = {
  hero: { head: { cx: 60, cy: 58, r: 30 }, shape: 'squircle', bottom: 28, torso: { x: 41, y: 88, w: 38, h: 34 }, sh: 95, base: 'jet' },

  box: 'M-21 -26 H21 C29 -26 33 -22 33 -14 V14 C33 22 29 26 21 26 H-21 C-29 26 -33 22 -33 14 V-14 C-33 -22 -29 -26 -21 -26Z',
  dome: 'M-29 8 C-31 -22 -18 -31 0 -31 C18 -31 31 -22 29 8 C29 19 22 24 0 24 C-22 24 -29 19 -29 8Z',
};
const CHASSIS = {

  sprout: 'M7 0 H33 C38 0 40 3 40 8 C40 28 32 42 20 42 C8 42 0 28 0 8 C0 3 2 0 7 0Z',
  bruiser: 'M6 0 H34 C38 0 40 2 40 6 V34 C40 39 37 42 32 42 H8 C3 42 0 39 0 34 V6 C0 2 2 0 6 0Z',
  lanky: 'M11 0 H29 C33 0 35 3 35 7 L40 33 C40 39 36 42 31 42 H9 C4 42 0 39 0 33 L5 7 C5 3 7 0 11 0Z',
};

let _heroSeq = 0;

/* ---------- geometry helpers ---------- */
/* map an absolute path (M L C Q S T H V Z) from torso-local 40×42 to rig coords */
function _tp(d, sx, sy, tx, ty) {
  let cmd = 'M', i = 0;
  return d.replace(/([MLCQSTHVZ])|(-?\d*\.?\d+)/g, (m, c, n) => {
    if (c) { cmd = c; i = 0; return c; }
    const v = parseFloat(n);
    let out;
    if (cmd === 'H') out = v * sx + tx;
    else if (cmd === 'V') out = v * sy + ty;
    else out = (i % 2 === 0) ? v * sx + tx : v * sy + ty;
    i++;
    return +out.toFixed(2);
  });
}
const _r = n => +n.toFixed(2);

/* ============================================================
   ROLE GEAR — {accent, look, top, outfit, headgear, tool, badge}
   outfit = a paint decal on the chassis (no clothes — it's a bot).
   ctx: {c, dark, light, accent, cloth, T(d), TC(x,y,r,attrs), MAT}
   headgear/tool/badge are authored in head-/hand-/badge-local coords.
   `top` = highest headgear point in head-local units (for the head anchor).
   ============================================================ */
const O = 'class="o"', O2 = 'class="o2"';
const ROLE_GEAR = {

      <g class="h-trim">${[6, 16, 26, 34].map(v => x.TC(v, 32, 1.3, `fill="${MAT.metal}"`)).join('')}</g>`,
    headgear: x => `<path d="M-30 -10 C-20 -26 20 -26 30 -10" fill="none" stroke="${HERO_INK}" stroke-width="8" stroke-linecap="round"/>

/* ---------- "hair" = antenna style (head-local, drawn behind the shell) ---------- */
const ANT_TOP = { none: -48, tuft: -50, spikes: -47, swoop: -46, bob: -40, bun: -42, curl: -52 };
function _antenna(name, x) {
  const stalk = d => `<path class="h-ant" d="${d}" fill="none" stroke="${HERO_INK}" stroke-width="5" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="${MAT.steel}" stroke-width="2.2" stroke-linecap="round"/>`;
  const ball = (cx, cy, r = 4.6) => `<circle class="o h-bulb" cx="${cx}" cy="${cy}" r="${r}" fill="${x.light}"/>
    <circle class="h-fine" cx="${_r(cx - r * .32)}" cy="${_r(cy - r * .32)}" r="${_r(r * .32)}" fill="#fff" opacity=".8"/>`;
  const ears = (big) => big
    ? `<g>${[-1, 1].map(s => `<path ${O} fill="${MAT.metal}" d="M${s * 29} -6 C${s * 44} -14 ${s * 46} 10 ${s * 31} 8Z"/><circle ${O2} cx="${s * 36}" cy="1" r="2.4" fill="${x.light}"/>`).join('')}</g>`
    : `<rect ${O} x="-36" y="-8" width="9" height="16" rx="4" fill="${MAT.steel}"/><rect ${O} x="27" y="-8" width="9" height="16" rx="4" fill="${MAT.steel}"/>`;
  switch (name) {
    case 'tuft': return ears() + stalk('M0 -26 L5 -42') + `<circle class="h-fine" cx="6" cy="-45" r="8" fill="${x.light}" opacity=".3"/>` + ball(6, -45, 5.4);
    case 'spikes': return ears() + stalk('M-8 -25 L-14 -40 M8 -25 L14 -40') + ball(-14, -42, 4) + ball(14, -42, 4);
    case 'swoop': return ears() + stalk('M0 -26 C0 -42 14 -48 18 -38') + ball(18, -37, 4.4);
    case 'bob': return ears(true) + stalk('M0 -26 V-34') + ball(0, -36, 3.6);
    case 'bun': return ears() + `<path ${O} fill="${x.dark}" d="M-11 -24 C-11 -38 11 -38 11 -24Z"/>` + ball(0, -37, 3.6);
    case 'curl': return ears() + stalk('M0 -26 L-5 -30 L5 -34 L-5 -38 L5 -42 L0 -45') + ball(0, -48, 4.4);
    default: return ears() + stalk('M0 -26 V-41') + ball(0, -44, 4.6);
  }
}

/* ---------- accessory (screen or shell extra) — {near, far, face, fixed} ---------- */
function _acc(name, x) {
  const ring = (c, w = 2.2) => `<ellipse rx="9.6" ry="10.6" fill="none" stroke="${c}" stroke-width="${w}"/>`;
  switch (name) {
    case 'glasses': return { near: ring(MAT.metal), far: ring(MAT.metal), face: `<path d="M-1.4 1 H1.4" stroke="${MAT.metal}" stroke-width="2.2"/>` };
    case 'shades': return { face: `<path class="h-shades" d="M-21 -7 H21 C21 4 17 8 11 8 C6 8 3 4 0 2 C-3 4 -6 8 -11 8 C-17 8 -21 4 -21 -7Z" fill="${HERO_INK}" opacity=".62"/>
      <path d="M-17 -4 L-9 -4" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>` };
    case 'monocle': return { far: `${ring(PALETTE.sun, 2.4)}`, face: `<path class="h-fine" d="M19 11 C20 15 19 17 17 19" fill="none" stroke="${PALETTE.sun}" stroke-width="1.4"/>` };
    case 'mustache': return { face: `<path fill="${BOT_GLOW}" opacity=".9" d="M0 9 C-3 7 -8 7 -10 10 C-11 12 -10 13.5 -9 13.5 C-8 11.5 -4 11.5 0 11.5 C4 11.5 8 11.5 9 13.5 C10 13.5 11 12 10 10 C8 7 3 7 0 9Z"/>` };
    case 'freckles': { const dots = pts => pts.map(([a, b]) => `<circle cx="${a}" cy="${b}" r="1.1"/>`).join('');
      return { face: `<g fill="${PALETTE.rose}" opacity=".8">${dots([[-19, 8], [-16, 10.5], [-19.5, 12]])}<g class="h-acc-far">${dots([[16, 10.5], [19, 8], [19.5, 12]])}</g></g>` }; }
    case 'bow': { const bc = x.hueKey === 'coral' || x.hueKey === 'rose' ? PALETTE.sun : PALETTE.coral;
      return { fixed: `<g transform="translate(-22 -24) rotate(-20)"><path ${O2} fill="${bc}" d="M0 0 L-9 -6 L-9 6Z M0 0 L9 -6 L9 6Z"/><circle ${O2} r="3" fill="${shade(bc, -30)}"/></g>` }; }
    case 'flower': return { fixed: `<g transform="translate(-24 -20)">${[0, 72, 144, 216, 288].map(a => `<ellipse ${O2} rx="3.6" ry="5.6" fill="${MAT.paper}" transform="rotate(${a}) translate(0 -5)"/>`).join('')}<circle ${O2} r="3.2" fill="${PALETTE.sun}"/></g>` };
    default: return {};
  }
}

"use strict";
/* ============================================================
   office-layout.js — turns an office config into a floor plan.
   Pure geometry: no DOM, no art, no story. See spec-office-config.md.

   Public: officeLayout(cfg) → PLAN
     cfg  = { teams: [{ id, members: [agentId…] }], solo: [agentId…] }
     PLAN = {
       W                    room width (≥ 1600; grows so pods never overflow)
       rows: [y…]           seat y of each desk row (1 or 2 rows)
       pods: [{ id, teamId|null, row, rug:{x,y,w,h}, seats:[seatId…] }]
       seats: { seatId: {x, y, row, pod} }
       home:  { agentId: seatId }        every configured agent's desk
       director: {x,y} · couch: [{x,y}] (couch-1..3)
       lanes: { back, mid } · gaps: [x]  (where walkers cross between lanes)
       objects: { door, outbox, console, dossier, whiteboard, health, clock } {x,y,w,h,stand?}
       windows: [{x}] · lamps: [x]
     }
   Room is a dollhouse: wall y −40…380, floor 380…900, right column (400 wide)
   is the Director's corner (top) + the couch (bottom).
   ============================================================ */

const OL = { DX: 124, RUG: 140, GAP: 72, LEFT: 50, RIGHT: 440, MIN_W: 1600, STEP: 40, PER_POD: 6 };

function officeLayout(cfg) {
  /* blocks: one desk row per team (≤ 6), solo agents share neutral blocks */
  const blocks = [];
  (cfg.teams || []).forEach(t => {
    for (let i = 0; i < t.members.length; i += OL.PER_POD) blocks.push({ teamId: t.id, members: t.members.slice(i, i + OL.PER_POD) });
  });
  const solo = cfg.solo || [];
  for (let i = 0; i < solo.length; i += OL.PER_POD) blocks.push({ teamId: null, members: solo.slice(i, i + OL.PER_POD) });
  blocks.forEach(b => { b.w = (b.members.length - 1) * OL.DX + OL.RUG; });

  /* pack into ≤ 2 rows; widen the room until it fits */
  const pack = W => {
    const avail = W - OL.RIGHT - OL.LEFT; const rows = [[]]; let used = 0;
    for (const b of blocks) {
      const need = (rows[rows.length - 1].length ? OL.GAP : 0) + b.w;
      if (used + need > avail && rows[rows.length - 1].length) { rows.push([]); used = 0; }
      rows[rows.length - 1].push(b); used += (rows[rows.length - 1].length > 1 ? OL.GAP : 0) + b.w;
      if (b.w > avail) return null;
    }
    return rows.length <= 2 ? rows : null;
  };
  let W = OL.MIN_W, rows = pack(W);
  while (!rows && W < 6000) { W += OL.STEP; rows = pack(W); }
  rows = rows || [blocks];
  /* 3+ pods that happen to fit one row still use both rows — fills the floor evenly */
  const rowW = r => r.reduce((s, b, i) => s + b.w + (i ? OL.GAP : 0), 0);
  if (rows.length === 1 && blocks.length >= 3) rows.push(rows[0].splice(Math.ceil(blocks.length / 2)));

  const rowY = rows.length === 1 ? [604] : [530, 794];
  const plan = { W, rows: rowY, pods: [], seats: {}, home: {} };
  const areaL = OL.LEFT, areaR = W - OL.RIGHT;
  const count = {};
  rows.forEach((r, ri) => {
    let x = areaL + (areaR - areaL - rowW(r)) / 2;
    r.forEach(b => {
      const key = b.teamId || 'solo'; count[key] = count[key] || 0;
      const y = rowY[ri];
      const pod = { id: key + '@' + plan.pods.length, teamId: b.teamId, row: ri, rug: { x, y: y - 72, w: b.w, h: 136 }, seats: [] };
      b.members.forEach((agentId, i) => {
        const sid = `${key}-${++count[key]}`;
        plan.seats[sid] = { x: x + OL.RUG / 2 + i * OL.DX, y, row: ri, pod: pod.id };
        plan.home[agentId] = sid; pod.seats.push(sid);
      });
      plan.pods.push(pod);
      x += b.w + OL.GAP;
    });
  });

  plan.director = { x: W - 208, y: 512 };
  plan.couch = [{ x: W - 308, y: 798 }, { x: W - 222, y: 798 }, { x: W - 136, y: 798 }];
  plan.lanes = { back: 432, mid: 664 };
  /* crossing columns: left edge, every gap between row-0 rugs, the right column's edge */
  const r0 = plan.pods.filter(p => p.row === 0).sort((a, b) => a.rug.x - b.rug.x);
  plan.gaps = [30];
  r0.forEach((p, i) => { const n = r0[i + 1]; if (n) plan.gaps.push((p.rug.x + p.rug.w + n.rug.x) / 2); });
  plan.gaps.push(W - OL.RIGHT + 24);
  if (rows.length === 1) plan.gaps = []; /* one row: lanes never need crossing */

  /* the wall: door + ship corner on the LEFT, planning wall centred over the pods */
  const center = (areaL + areaR) / 2;
  const gx = Math.max(392, Math.min(center - 388, W - 400 - 40 - 776));
  plan.objects = {
    door: { x: 26, y: 136, w: 136, h: 250, stand: { x: 96, y: 414 } },
    clock: { x: 64, y: 40, w: 60, h: 60 },
    outbox: { x: 196, y: 262, w: 62, h: 86, stand: { x: 227, y: 424 } },
    console: { x: 282, y: 318, w: 72, h: 96, stand: { x: 318, y: 430 } },
    dossier: { x: gx, y: 96, w: 80, h: 112, label: 'Features' },
    whiteboard: { x: gx + 104, y: 44, w: 528, h: 264, stand: { x: gx + 104 + 300, y: 416 }, label: 'Whiteboard' },
    health: { x: gx + 104 + 528 + 28, y: 76, w: 116, h: 160, label: 'Health check' },
  };
  plan.windows = [];
  for (let x = gx + 776 + 70; x + 180 <= W - 440 && plan.windows.length < 2; x += 260) plan.windows.push({ x });
  plan.lamps = [];
  const nl = Math.max(3, Math.round(W / 520));
  for (let i = 0; i < nl; i++) plan.lamps.push(Math.round(W * (i + 0.5) / nl));
  return plan;
}

function renderFreshness(fl) {

function renderTree(ul, nodes) {

<script data-module="js/cast.js">

/* ============================================================

      if (t.id) cxSaved(p);
      announce(`Emblem: ${emblemById(v).name}`);
    },
  });
  g.addEventListener('mouseover', e => { const b = e.target.closest('.cx-radio'); if (b) _paintMark(z, t, b.dataset.value); });
  g.addEventListener('mouseleave', () => _paintMark(z, t));
  pk.appendChild(g);
  (g.querySelector('[aria-checked="true"]') || g.querySelector('.cx-radio')).focus();
}

/* ============================================================
   Panel — member view (role override, job, captain, remove)
   ============================================================ */
function _selectMember(z, agentId) {
  const t = SQ.team; const m = memberOf(t, agentId); const a = agentById(agentId); if (!m || !a) return;
  if (SQ.strip) _closeStrip(true);
  SQ.sel = agentId; _lookAtSelected(z);
  const selB = z.querySelector(`.sq-m[data-id="${agentId}"]`); if (selB) cxHop(selB.querySelector('.hero'));
  const first = shortName(a);
  const p = _tEl('div', 'z-panel drill-in');
  p.innerHTML = `<div class="zp-scroll">
    <div class="zp-top"><button type="button" class="zp-crumb"><span aria-hidden="true">←</span> ${escapeHtml(t.name || 'New team')}</button><span class="zp-saved" aria-hidden="true">Saved ✓</span></div>
    <div class="sq-mhead"><span class="sq-mfig"></span><div><h2 id="sqMember" tabindex="-1">${escapeHtml(a.name)}</h2>
      <p>${roleBadge(a.role, 14)}${escapeHtml(a.role)} in the cast · <a href="#cast/agent/${escapeAttr(a.id)}" class="zp-link">Open agent page</a></p></div></div>
    <section class="zp-sec sq-mrole"><h3 class="zp-label">Role on this team</h3>
      <button type="button" class="zp-link sq-reset" hidden></button></section>
    <section class="zp-sec"><h3 class="zp-label"><label for="sqJob">Job on this team</label></h3>
      <textarea class="zp-area" id="sqJob" rows="4" placeholder="What is ${escapeAttr(first)}’s job on this crew?"></textarea>
      <p class="zp-hint-line">${escapeHtml(first)} runs with: their own brain <span aria-hidden="true">▸</span> the team rules <span aria-hidden="true">▸</span> this job.</p></section>
    <div class="sq-mactions"></div>

  const $ = s => p.querySelector(s);

  const paintReset = () => { reset.hidden = !m.role; reset.innerHTML = `↺ Use cast role (${escapeHtml(a.role)})`; };
  const applyRole = r => {

    if (b) {
      const isCap = t.captain === a.id; const old = b.querySelector('.hero');
      cxCostume(old, () => hero(a, { size: parseFloat(old.style.getPropertyValue('--hpx')), facing: 'front', role: m.role || undefined, captain: isCap, armband: isCap ? teamHex(t) : null }));
      const pl = b.querySelector('.sq-plate span'); if (pl) pl.innerHTML = `${isCap ? `${STAR} Captain · ` : ''}${escapeHtml(r)}`;
      b.setAttribute('aria-label', `${a.name}, ${r}${isCap ? ', Captain' : ''}. Edit on this team`);
    }
    paintHead(); paintReset(); saved();
    announce(`${a.name}’s role on ${t.name || 'this team'}: ${r}`);
  };
  const tiles = roleTiles(a, m.role || a.role, applyRole, { label: 'Role on this team', castRole: a.role });
  $('.sq-mrole').insertBefore(tiles, reset);
  paintReset();
  reset.onclick = () => { tiles.set(a.role); applyRole(a.role); };

  const job = $('#sqJob'); job.value = m.instr || '';
  job.addEventListener('input', () => { m.instr = job.value; clearTimeout(job.t); job.t = setTimeout(saved, 350); });

  const acts = $('.sq-mactions');
  const paintActs = () => {
    const isCap = t.captain === a.id;
    acts.innerHTML = (isCap ? `<span class="sq-capbadge">${STAR} Captain of this crew</span>` : `<button type="button" class="btn-team sq-mkcap">${STAR} Make captain</button>`)
      + '<button type="button" class="zp-link danger sq-remove">Remove from team</button>';
    const mk = acts.querySelector('.sq-mkcap'); if (mk) mk.onclick = () => { _makeCaptain(z, a.id); paintActs(); paintHead(); acts.querySelector('.sq-capbadge')?.setAttribute('tabindex', '-1'); acts.querySelector('.sq-capbadge')?.focus(); };

function _backToTeam(z) {
  const id = SQ.sel;
  _panelTeam(z, { drill: true });

}

function _makeCaptain(z, id) {
  const t = SQ.team; if (t.captain === id) return;
  const before = _formationRects(z);
  setCaptain(t, id);
  _renderFormation(z, { before });
  _captainCheer(z, id);
}
function _captainCheer(z, id) {
  const t = SQ.team; const a = agentById(id);
  announce(`${a.name} is now captain of ${t.name || 'the new team'}.`);
  if (reducedMotion()) return;
  setTimeout(() => {
    const b = z.querySelector(`.sq-m[data-id="${id}"]`); if (!b) return;
    const r = b.getBoundingClientRect();
    sparkle((r.left + r.width / 2) / innerWidth * 100, (r.top + r.height * 0.35) / innerHeight * 100);
    z.querySelectorAll('.sq-m[data-id] .hero').forEach(h => { setPose(h, 'celebrating'); setTimeout(() => h.isConnected && setPose(h, 'idle'), 900); });

function _removeFromCrew(z, id) {
  const t = SQ.team; const a = agentById(id);
  const wasCap = t.captain === id;
  const b = z.querySelector(`.sq-m[data-id="${id}"]`);
  const finish = () => {
    const before = _formationRects(z);
    const res = removeMember(t, id); if (!res) return;
    SQ.sel = null;
    _renderFormation(z, { before });
    _panelTeam(z, { drill: true });
    z.querySelector('#sqTitle').focus();
    const promoted = wasCap && t.captain ? agentById(t.captain) : null;
    if (promoted) _captainCheer(z, t.captain);
    announce(`${a.name} left the crew.${promoted ? ` ${promoted.name} is now captain.` : ''}`);
    toast(`${escapeHtml(a.name)} left the crew <button type="button" class="toast-undo">Undo</button>`, 6000);
    const u = document.querySelector('#toast .toast-undo');
    if (u) u.onclick = () => {
      if (memberOf(t, id) || t.members.length >= TEAM_MAX) return;
      t.members.splice(res.index, 0, res.rec); if (wasCap) t.captain = id;
      document.getElementById('toast').classList.remove('show');
      announce(`${a.name} is back on ${t.name}.`);
      _refreshTeamViews(t);
    };
  };
  if (!b || reducedMotion()) { finish(); return; }
  const h = b.querySelector('.hero');
  b.classList.remove('sel'); setPose(h, 'waving'); setFacing(h, 'front');
  setTimeout(() => {
    setPose(h, 'walking'); setFacing(h, 'side', { dir: 'right' });
    const st = z.querySelector('.sq-stage').getBoundingClientRect(); const r = b.getBoundingClientRect();
    cxAfter(b.animate([{ transform: 'none', opacity: 1 }, { transform: `translateX(${st.right - r.left + 40}px)`, opacity: 0 }], { duration: 520, easing: 'ease-in', fill: 'forwards' }), finish);
  }, 380);
}
/* after Undo, refresh whatever view shows this team */
function _refreshTeamViews(t) {
  const z = document.querySelector('#scene-cast .zoom-squad');
  if (z && SQ.team === t) { _renderFormation(z); if (!SQ.sel) _panelTeam(z); return; }
  const host = document.querySelector('#scene-cast #castBody');
  if (host && CAST.tab === 'teams' && !z) renderTeams(host);
}
function _deleteTeam(t) {
  const i = TEAMS.indexOf(t); if (i < 0) return;
  TEAMS.splice(i, 1);
  go('cast/teams');
  announce(`${t.name} deleted. Agents stay in your cast.`);
  setTimeout(() => {
    toast(`${escapeHtml(t.name)} deleted <button type="button" class="toast-undo">Undo</button>`, 6000);
    const u = document.querySelector('#toast .toast-undo');
    if (u) u.onclick = () => {
      if (!TEAMS.includes(t)) TEAMS.splice(Math.min(i, TEAMS.length), 0, t);
      document.getElementById('toast').classList.remove('show');
      announce(`${t.name} restored.`); _refreshTeamViews(t);
    };
  }, 60);
}
/* a draft becomes a real team once it has a name and one member */
function _commitDraft(z) {
  const t = SQ.team;
  if (!SQ.draft || t.id || !t.name.trim() || !t.members.length) return false;
  t.id = 't-' + t.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 16) + '-' + Date.now().toString(36).slice(-4);
  TEAMS.push(t); SQ.draft = null; SQ.id = t.id;
  history.replaceState(null, '', '#cast/teams/' + t.id); APP.sub = 'teams/' + t.id;

/* ============================================================
   Add to crew — the lineup strip rising from the stage floor
   ============================================================ */
function _openStrip(z) {
  const t = SQ.team;
  if (t.members.length >= TEAM_MAX) { announce(`Crew full — ${TEAM_MAX} is the max. The director can call more than one team.`); return; }
  if (SQ.sel) _panelTeam(z, { drill: true });

  const strip = z.querySelector('.sq-strip'); strip.hidden = false;
  z.querySelector('.sq-stage').classList.add('strip-open');

}
function _paintStrip(z) {
  const t = SQ.team; const strip = z.querySelector('.sq-strip');
  const cands = AGENTS.filter(a => !memberOf(t, a.id));
  strip.innerHTML = `<div class="sq-strip-head"><b>Who joins the crew?</b><span>${t.members.length}/${TEAM_MAX} · max ${TEAM_MAX} per crew</span>
      <button type="button" class="btn-glass sq-strip-done">Done</button></div>
    <div class="sq-strip-list" role="list"></div>`;
  const list = strip.querySelector('.sq-strip-list');
  if (!cands.length) list.innerHTML = '<p class="zp-empty">Everyone in the cast is already on this crew.</p>';
  cands.forEach(a => {
    const li = _tEl('div', 'sq-cand-li'); li.setAttribute('role', 'listitem');
    const b = _tEl('button', 'sq-cand'); b.type = 'button'; b.dataset.id = a.id;
    b.setAttribute('aria-label', `Add ${a.name}, ${a.role}`);
    b.innerHTML = `<span class="sq-cand-fig"></span><b>${escapeHtml(a.name)}</b><span>${escapeHtml(a.role)}</span>`;
    b.querySelector('.sq-cand-fig').appendChild(hero(a, { size: 'sm', facing: 'front' }));
    b.addEventListener('mouseenter', () => cxHop(b.querySelector('.hero')));
    b.onclick = e => { e.stopPropagation(); _addFromStrip(z, a.id, b); };
    li.appendChild(b); list.appendChild(li);
  });
  strip.querySelector('.sq-strip-done').onclick = e => { e.stopPropagation(); _closeStrip(); };
}
function _addFromStrip(z, id, candBtn) {
  const t = SQ.team; const a = agentById(id);
  const from = candBtn.querySelector('.hero').getBoundingClientRect();
  const first = !t.members.length;
  if (!addMember(t, id)) return;
  const before = _formationRects(z);
  _renderFormation(z, { before, walkIn: id, walkFrom: from });
  if (!SQ.sel) _crewList(z, z.querySelector('.z-panel'));
  const next = candBtn.parentElement.nextElementSibling || candBtn.parentElement.previousElementSibling;
  candBtn.parentElement.remove();
  z.querySelector('.sq-strip-head span').textContent = `${t.members.length}/${TEAM_MAX} · max ${TEAM_MAX} per crew`;
  announce(`${a.name} joined ${t.name || 'the crew'}. ${t.members.length} of ${TEAM_MAX}.`);
  if (first) _captainCheer(z, id);

}
function _closeStrip(silent) {
  const z = document.querySelector('#scene-cast .zoom-squad'); if (!z) return;
  SQ.strip = false;
  z.querySelector('.sq-strip').hidden = true;
  z.querySelector('.sq-stage').classList.remove('strip-open');
  _floorBar(z);
  if (!silent) (z.querySelector('.sq-add') || z.querySelector('#sqTitle')).focus();

/* squad keyboard: Esc backs out one level (picker → strip → member → team → list) */
document.addEventListener('keydown', e => {
  if (APP.view !== 'studio' || APP.stage !== 'cast') return;
  const z = document.querySelector('#scene-cast .zoom-squad'); if (!z) return;
  if (e.key === 'Tab') { cxTrap(e, z); return; }

  if (SQ.strip) { _closeStrip(); return; }
  if (SQ.sel) { _backToTeam(z); return; }
  go('cast/teams');
});

<script data-module="js/office-theme.js">
"use strict";
/* ============================================================
   office-theme.js — the Office's ART (spec-office §1). Pure drawing:
   knows what a couch looks like, never what an agent is doing.
   Everything is placed from the floor plan (office-layout.js), so the room
   grows with the team. Calm by design: few objects, no labels you must read.

   Public (attached to THEME_OFFICE):
     art(plan, ctx)         → SVG string, the dollhouse room (viewBox 0 -70 W 1062)
                              ctx = { title, teams: {teamId: team} }
     sync(svgRoot, ws)      → live bits: whiteboard (ring, bars, list), health grades,
                              outbox flag
     desk(kind, o)          → SVG string of one desk (local coords, origin = seat)
     chair(hue)             → SVG string of the chair behind a seat
     couchFront(plan)       → SVG string of the couch's front cushions (occludes sleepers)
     glyph(name, hue)       → monitor screen content (32×26 box)
     deskSync(el, s)        → update a desk element: glyph, lamp, tray
     door(root, open)       → toggle the door leaf
   ============================================================ */

const OT_INK = '#241a44';
const OT = {
  wall: '#f6e2c6', wallHi: '#fbeedb', wallLo: '#ecd0ad', stripe: '#f0d7b6',
  wains: '#93c4b0', wainsLo: '#7db29d', rail: '#b9773f', base: '#7a4b2c',
  floor: '#d9a46b', floorLo: '#c48a51', seam: '#b97d45',
  wood: '#c98a50', woodLo: '#a96d3a', woodHi: '#e8b77f', metal: '#c9c3dd', steel: '#8e86ad',
  paper: '#fff6e9', glass: '#bfe6ff', screen: '#1d1638', bezel: '#3a2f5c',
  boss: '#ffe0a3', bossStripe: '#ffd27f', carpet: '#e9b38a',
};
const _o = (w = 3) => `stroke="${OT_INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
/* gentle one-point perspective for things on the floor: x drifts outward as y nears */
let _otCX = 800;
const _otP = (x, y) => +(_otCX + (x - _otCX) * (0.9 + 0.1 * (y - 380) / 520)).toFixed(1);

/* ---------------------------------------------------------------- room */
function _otDefs() {
  return `<defs>
    <linearGradient id="otWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${OT.wallLo}"/><stop offset=".35" stop-color="${OT.wall}"/><stop offset="1" stop-color="${OT.wallHi}"/></linearGradient>
    <linearGradient id="otBoss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7cf86"/><stop offset="1" stop-color="${OT.boss}"/></linearGradient>
    <linearGradient id="otFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${OT.floorLo}"/><stop offset=".5" stop-color="${OT.floor}"/><stop offset="1" stop-color="#e2ad72"/></linearGradient>
    <linearGradient id="otSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a4bb0"/><stop offset=".55" stop-color="#c77bb7"/><stop offset="1" stop-color="#ffb487"/></linearGradient>
    <radialGradient id="otPool" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3cf" stop-opacity=".5"/><stop offset="1" stop-color="#fff3cf" stop-opacity="0"/></radialGradient>
    <radialGradient id="otGlow" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#fff1c4" stop-opacity=".45"/><stop offset="1" stop-color="#fff1c4" stop-opacity="0"/></radialGradient>
    <linearGradient id="otSpill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2c2" stop-opacity=".85"/><stop offset="1" stop-color="#fff2c2" stop-opacity="0"/></linearGradient>
    <pattern id="otBossPaper" width="36" height="36" patternUnits="userSpaceOnUse"><rect width="18" height="36" fill="${OT.bossStripe}" opacity=".45"/></pattern>
    <pattern id="otKnit" width="14" height="10" patternUnits="userSpaceOnUse"><path d="M0 5 L7 0 L14 5 M0 10 L7 5 L14 10" fill="none" stroke="#000" stroke-opacity=".06" stroke-width="2"/></pattern>
  </defs>`;
}

function _otShell(plan) {
  const W = plan.W, wallR = W - 400;
  const seams = [];
  for (let x = -40; x <= W + 40; x += 64) seams.push(`<path d="M${_otP(x, 380)} 380 L${x} 900" stroke="${OT.seam}" stroke-width="2" opacity=".4"/>`);

  <rect x="0" y="-40" width="${W}" height="420" fill="url(#otWall)"/>
  <rect x="0" y="262" width="${wallR}" height="118" fill="${OT.wains}"/>
  ${Array.from({ length: Math.ceil(wallR / 132) }, (_, i) => `<rect x="${14 + i * 132}" y="280" width="112" height="78" rx="6" fill="${OT.wainsLo}" opacity=".45"/>`).join('')}
  <rect x="0" y="252" width="${wallR}" height="12" fill="${OT.rail}" ${_o(2.5)}/>
  <rect x="0" y="368" width="${W}" height="14" fill="${OT.base}"/>
  <path d="M0 380 H${W} V900 H0Z" fill="url(#otFloor)"/>
  ${seams.join('')}
  <path d="M0 380 H${W}" stroke="${OT_INK}" stroke-width="3"/>

}

function _otCut(plan) {
  const W = plan.W;
  return `
  <path d="M-12 -70 H${W + 12} V-36 H-12Z" fill="#4b3570"/>
  <path d="M-12 -46 H${W + 12}" stroke="#6a4c94" stroke-width="5"/>
  <path d="M-12 -40 H${W + 12}" stroke="${OT_INK}" stroke-width="3"/>
  <path d="M-12 -70 V930 H0 V-70Z" fill="#4b3570"/><path d="M${W} -70 V930 H${W + 12} V-70Z" fill="#4b3570"/>
  <path d="M-12 900 H${W + 12} V930 H-12Z" fill="#4b3570"/>
  <path d="M-12 904 H${W + 12}" stroke="#6a4c94" stroke-width="5"/>
  <path d="M0 -40 V900 M${W} -40 V900 M0 900 H${W}" stroke="${OT_INK}" stroke-width="3" fill="none"/>
  ${plan.lamps.map(x => `<g transform="translate(${x} -40)">
      <path d="M0 0 V34" stroke="${OT_INK}" stroke-width="2.5"/>
      <path d="M-30 58 C-30 34 30 34 30 58Z" fill="${PALETTE.sun}" ${_o()}/>
      <ellipse cx="0" cy="60" rx="11" ry="5" fill="#fff7d6" ${_o(2)}/>
      <path d="M-28 60 L-120 330 H120 L28 60Z" fill="url(#otGlow)" opacity=".5"/>
    </g>`).join('')}`;
}

/* door + a plain wall clock above it (decor — not interactive) */
function _otDoor() {
  const ticks = Array.from({ length: 12 }, (_, i) => { const a = i * 30 * Math.PI / 180; const r1 = i % 3 ? 20 : 17;
    return `<path d="M${(Math.sin(a) * r1).toFixed(1)} ${(-Math.cos(a) * r1).toFixed(1)} L${(Math.sin(a) * 23).toFixed(1)} ${(-Math.cos(a) * 23).toFixed(1)}" stroke="${OT_INK}" stroke-width="${i % 3 ? 1.6 : 2.8}" stroke-linecap="round"/>`; }).join('');
  return `<g id="otDoor">
    <rect x="22" y="132" width="144" height="252" rx="4" fill="${OT.woodLo}" ${_o()}/>
    <rect x="34" y="144" width="120" height="236" fill="#3b2d5e"/>
    <g id="otDoorOpen" style="display:none">
      <path d="M34 144 H154 V380 H34Z" fill="#ffe9b0"/>
      <path d="M34 380 H154 L210 470 H-6Z" fill="url(#otSpill)"/>
      <path d="M34 144 L58 152 V372 L34 380Z" fill="${OT.wood}" ${_o(2.5)}/>
    </g>
    <g id="otDoorLeaf">
      <rect x="34" y="144" width="120" height="236" fill="${OT.wood}" ${_o(2.5)}/>
      <rect x="50" y="160" width="88" height="58" rx="5" fill="${OT.glass}" ${_o(2.5)}/>
      <path d="M62 170 L78 208 M84 168 L96 196" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7"/>
      <rect x="50" y="236" width="88" height="56" rx="5" fill="none" stroke="${OT.woodLo}" stroke-width="3"/>
      <rect x="50" y="304" width="88" height="62" rx="5" fill="none" stroke="${OT.woodLo}" stroke-width="3"/>
      <circle cx="140" cy="272" r="6" fill="${PALETTE.sun}" ${_o(2)}/>
    </g>
    <g transform="translate(94 70)">

const _GRADE = { A: ['Great', PALETTE.mint], B: ['Good', PALETTE.sun], C: ['Needs work', PALETTE.coral] };
function _otSync(root, ws) {
  if (!root) return;
  const $ = id => root.querySelector('#' + id);
  const pct = ws.overall;
  $('wbPct').textContent = pct + '%';
  $('wbRing').setAttribute('stroke-dasharray', `${(315 * pct / 100).toFixed(1)} 315`);
  const now = ws.features.filter(f => f.status === 'now').slice(0, 3);
  $('wbBars').innerHTML = now.map((f, i) => {
    const y = 112 + i * 52; const w = 180 * f.pct / 100;
    return `<text x="404" y="${y - 8}" font-size="13" font-weight="900" fill="${OT_INK}">${escapeHtml(f.name.split(' ')[0])}</text>
      <rect x="404" y="${y}" width="180" height="14" rx="7" fill="none" stroke="${OT_INK}" stroke-width="2"/>
      <rect x="406" y="${y + 2}" width="${Math.max(0, w - 4).toFixed(1)}" height="10" rx="5" fill="${f.blocked ? PALETTE.coral : PALETTE.teal}"/>`;
  }).join('');
  const items = ws.checklist.slice(-7);
  $('wbList').innerHTML = items.map((k, i) => {
    const y = 104 + i * 24; const len = 56 + ((k.text.length * 7) % 56);
    return `<rect x="616" y="${y - 9}" width="12" height="12" rx="2" fill="none" stroke="${OT_INK}" stroke-width="2"/>
      ${k.done ? `<path d="M617 ${y - 3} l4 5 9 -12" stroke="${PALETTE.mint}" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
      <path d="M636 ${y - 3} h${len}" stroke="${k.done ? '#cfc9de' : OT_INK}" stroke-width="3" stroke-linecap="round" opacity="${k.done ? 1 : .6}"/>`;
  }).join('');
  $('outFlag').setAttribute('transform', `translate(62 70)${ws.github.fresh ? '' : ' rotate(90)'}`);
  const short = { modularity: 'Modular', cleanliness: 'Clean', reusability: 'Reuse' };
  $('otGrades').innerHTML = ws.checkup.items.map((it, i) => {
    const col = (_GRADE[it.grade] || _GRADE.B)[1]; const y = 58 + i * 34;
    return `<circle cx="30" cy="${y}" r="12" fill="${col}" stroke="${OT_INK}" stroke-width="2"/>
      <text x="30" y="${y + 5}" text-anchor="middle" font-size="14" font-weight="900" fill="${OT_INK}">${it.grade}</text>
      <text x="50" y="${y + 4}" font-size="11" font-weight="900" fill="${OT_INK}">${short[it.key] || it.name}</text>`;
  }).join('');
}

    case 'code': return [[3, 4, 14, PALETTE.grape], [6, 9, 18, PALETTE.teal], [6, 14, 11, PALETTE.sun], [9, 19, 15, PALETTE.rose]].map(([x, y, w, col]) => `<rect x="${x}" y="${y}" width="${w}" height="3" rx="1.5" fill="${col}" opacity=".9"/>`).join('');

/* chair behind the seat — always just a chair (no jackets, nothing body-shaped) */
function _otChair(hue) {

<script data-module="js/office-engine.js">
"use strict";
/* ============================================================
   office-engine.js — moves actors around the floor plan (spec-office §7).
   Knows anchors, poses and timing; never knows what a couch looks like
   (THEME_OFFICE draws) or what the story is (office-sim.js decides).

   Public: ACTIVITY (one row per activity kind)
     OE.mount(boxEl) / OE.unmount()
     OE.anchor(id)              → {x,y} (seat id · 'director' · 'couch-N' · object stand)

const ACTIVITY = {
  reading: { icon: '📖', tag: 'Reading', pose: 'reading', holding: 'binder', glyph: 'read', seated: true },
  planning: { icon: '💭', tag: 'Planning', pose: 'thinking', glyph: 'caret', seated: true },
  coding: { icon: '⌨️', tag: 'Coding', pose: 'typing', glyph: 'code', seated: true },
  commit: { icon: '📮', tag: 'Pushing', pose: 'typing', glyph: 'code', seated: true },
  testing: { icon: '🧪', tag: 'Testing', pose: 'waiting', glyph: 'dots', seated: true },
  'tests-green': { icon: '✅', tag: 'All green', pose: 'celebrating', glyph: 'green', seated: true },
  'tests-red': { icon: '❌', tag: 'Failing', pose: 'frustrated', glyph: 'red', seated: true },
  'needs-input': { icon: '❗', tag: 'Needs you', pose: 'needs-input', glyph: 'pause', seated: false },
  waiting: { icon: '⏳', tag: 'Waiting', pose: 'waiting', glyph: 'hourglass', seated: true },
  handoff: { icon: '📨', tag: 'Handing off', pose: 'typing', glyph: 'code', seated: true },
  reviewing: { icon: '🔍', tag: 'Reviewing', pose: 'writing', holding: 'pen', glyph: 'diff', seated: true },
  talking: { icon: '💬', tag: 'Syncing', pose: 'talking', glyph: 'code', seated: true },
  deploying: { icon: '🚀', tag: 'Deploying', pose: 'pressing', glyph: 'rocket' },
  idle: { icon: '☕', tag: 'Free', pose: 'chilling', holding: 'mug', glyph: 'emblem', seated: true },
  sleeping: { icon: '💤', tag: 'Off shift', pose: 'sleeping', glyph: 'off', seated: true },
  shipped: { icon: '🎉', tag: 'Shipped!', pose: 'celebrating', glyph: 'check', seated: true },
  arriving: { icon: '👋', tag: 'Just joined', pose: 'walking', glyph: 'emblem' },
  leaving: { icon: '👋', tag: 'Clocked off', pose: 'walking', glyph: 'off' },
  writing: { icon: '🖊️', tag: 'Updating plan', pose: 'writing', holding: 'pen', glyph: 'caret' },

const OE = {
  actors: {}, desks: {}, box: null, world: null, cam: null, art: null, plan: null, W: 1600,
  speed: 1, instant: false, zoom: { z: 1, tx: 0, ty: 0, obj: null }, k: 1, _convos: 0,

  /* ---------------------------------------------------------- build */
  mount(box) {
    const plan = this.plan = THEME_OFFICE.plan; this.W = plan.W;
    this.box = box; this.actors = {}; this.desks = {};
    box.style.width = plan.W + 'px';
    const teams = {}; wsTeamIds().forEach(t => { teams[t] = teamById(t); });
    box.innerHTML = `<div class="o-cam"><div class="o-world" style="width:${plan.W}px">${THEME_OFFICE.art(plan, { teams, title: (projById(WS.project) || {}).name || '' })}<div class="o-layer"></div><div class="o-fx"></div></div></div>`;
    this.cam = box.querySelector('.o-cam'); this.world = box.querySelector('.o-world');
    this.art = box.querySelector('.ot-art'); this.layer = box.querySelector('.o-layer'); this.fxLayer = box.querySelector('.o-fx');
    THEME_OFFICE.sync(this.art, WS);
    /* team pods: every member's desk; solo desks appear only when someone sits there */
    plan.pods.forEach(p => { if (p.teamId) p.seats.forEach(sid => this._desk(sid, 'pod', plan.seats[sid], teamById(p.teamId).color)); });
    WS.agents.filter(a => a.onProject && a.seat && !this.desks[a.seat]).forEach(a => this._desk(a.seat, 'hot', plan.seats[a.seat], null));
    this._desk('director', 'boss', plan.director, 'sun');
    const cf = document.createElement('div'); cf.className = 'o-prop o-couchfront'; cf.innerHTML = THEME_OFFICE.couchFront(plan);
    cf.style.zIndex = 818; this.layer.appendChild(cf);
    this._actor(WS.director);
    WS.agents.forEach(a => this._actor(a));
    this.deskSync();
    this.fit();
  },
  unmount() { Object.values(this.actors).forEach(a => { a.walkTok = -1; clearTimeout(a._rt); }); this.actors = {}; this.desks = {}; this.box = null; },

  _desk(id, kind, s, hue) {
    if (!s) return;
    const owner = id === 'director' ? WS.director : WS.agents.find(a => a.seat === id || a.home === id);
    const ag = owner ? agentById(owner.id === 'pixel' ? 'director' : owner.id) : null;
    const el = document.createElement('div'); el.className = 'o-prop o-desk'; el.dataset.seat = id;
    el.innerHTML = THEME_OFFICE.desk(kind, { hue, accent: ag && ag.hue, item: id === 'director' ? 'telescope' : ['mug', 'plant', null][Object.keys(this.desks).length % 3] });
    const sc = THEME_OFFICE.depth(s.y);
    this._place(el, s.x, s.y, s.y + 7, sc);
    const chair = document.createElement('div'); chair.className = 'o-prop o-chair'; chair.dataset.seat = id;
    chair.innerHTML = THEME_OFFICE.chair(ag ? ag.hue : (hue || 'grape'));
    this._place(chair, s.x, s.y, s.y - 3, sc);
    this.layer.append(chair, el);
    this.desks[id] = { id, el, chair, kind, x: s.x, y: s.y, hue, tray: null };
  },
  _place(el, x, y, z, s = 1) { el.style.transform = `translate(${x}px,${y}px) scale(${s})`; el.style.zIndex = Math.round(z); },

  _actor(a) {
    const ag = agentById(a.id === 'pixel' ? 'director' : a.id);
    const team = a.teamId ? teamById(a.teamId) : null;
    const isCaptain = team && wsCaptain(a.teamId) === a.id;
    const act = ACTIVITY[a.activity.kind] || ACTIVITY.idle;
    const H = a.id === 'pixel' ? 184 : 176;
    const wrap = document.createElement('div'); wrap.className = 'o-actor'; wrap.dataset.id = a.id;
    const btn = document.createElement('button'); btn.className = 'o-body'; btn.type = 'button'; btn.dataset.id = a.id; btn.tabIndex = -1;
    btn.style.setProperty('--H', H + 'px');
    const h = hero(ag, { size: H, pose: act.pose, facing: 'three-quarter', seated: act.seated, props: false, holding: act.holding || 'none',
      captain: isCaptain, armband: isCaptain ? team.color : null });
    btn.appendChild(h);
    btn.insertAdjacentHTML('beforeend', `<span class="o-blanket" style="--bk:${hueHex(ag.hue)}" aria-hidden="true"></span>
      <span class="o-over" aria-hidden="true">
        <span class="o-bubble" hidden><i></i><i></i><i></i></span>
        <span class="o-bang" hidden><b>!</b></span>
        <span class="o-card"></span>
      </span>`);
    wrap.appendChild(btn);
    this.layer.appendChild(wrap);
    const p = this.anchor(a.at);
    const rec = { id: a.id, data: a, ag, team, wrap, btn, hero: h, x: p.x, y: p.y, held: false, waiters: [], dir: 'right', walkTok: 0 };
    this.actors[a.id] = rec;
    if (!a.onProject) wrap.classList.add('gone');
    this._moveNow(rec, p.x, p.y);
    this._apply(rec);
    return rec;
  },
  /* the hover/focus card: who, where, and — only here — what they're doing */
  _card(rec) {
    const a = rec.data, ag = rec.ag, act = ACTIVITY[a.activity.kind] || ACTIVITY.idle;
    const where = rec.team ? `${emblemSVG(rec.team, 16, { decorative: true })}<span>${escapeHtml(rec.team.name.replace(/^The /, ''))}</span>` : (a.id === 'pixel' ? '<span>Director</span>' : '<span>Solo</span>');
    let doing = a.activity.detail || a.activity.label;
    if (a.activity.kind === 'needs-input') { const ask = WS.pending.find(p => p.agentId === a.id); doing = 'Needs you' + (ask ? ' — ' + ask.short : ''); }
    if (a.activity.kind === 'sleeping') doing = 'Off shift';
    const key = [a.activity.kind, doing].join('|');
    if (rec._cardKey === key) return; rec._cardKey = key;
    rec.btn.querySelector('.o-card').innerHTML = `<b>${escapeHtml(ag.name)}</b><span class="o-cmeta">${escapeHtml(a.id === 'pixel' ? 'Big picture' : ag.role)} · ${where}</span><span class="o-cact">${act.icon} ${escapeHtml(doing)}</span>`;
  },

  /* ---------------------------------------------------------- anchors */
  anchor(id) {
    const P = this.plan || THEME_OFFICE.plan;
    if (!id) return { x: P.W / 2, y: 600 };
    if (typeof id === 'object') return id;
    if (id === 'director') return { ...P.director };
    if (P.seats[id]) return { x: P.seats[id].x, y: P.seats[id].y };
    const m = /^couch-(\d)$/.exec(id); if (m) return { ...P.couch[(+m[1] - 1) % P.couch.length] };
    const o = P.objects[id]; if (o && o.stand) return { ...o.stand };

  },
  _lane(p) { const P = this.plan; return P.rows.length > 1 && p.y > (P.rows[0] + P.rows[1]) / 2 ? P.lanes.mid : P.lanes.back; },
  _route(a, b) {
    const P = this.plan, la = this._lane(a), lb = this._lane(b);
    const pts = [];
    const push = (x, y) => { const l = pts[pts.length - 1] || a; if (Math.abs(l.x - x) > 1 || Math.abs(l.y - y) > 1) pts.push({ x, y }); };
    if (la === lb) {
      if (Math.abs(a.y - la) < 24 && Math.abs(b.y - lb) < 24) { push(b.x, b.y); return pts; }
      push(a.x, la); push(b.x, la); push(b.x, b.y);
    } else {
      const g = P.gaps.reduce((best, x) => Math.abs(a.x - x) + Math.abs(b.x - x) < Math.abs(a.x - best) + Math.abs(b.x - best) ? x : best, P.gaps[0]);
      push(a.x, la); push(g, la); push(g, lb); push(b.x, lb); push(b.x, b.y);
    }
    return pts;
  },

  /* ---------------------------------------------------------- motion */
  _moveNow(rec, x, y) {
    rec.x = x; rec.y = y;
    rec.wrap.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
    rec.wrap.style.zIndex = Math.round(y);
    rec.btn.style.setProperty('--s', (THEME_OFFICE.depth(y) * (rec.id === 'pixel' ? 1.04 : 1)).toFixed(3));
  },
  _faceTo(rec, p) {
    const dx = p.x - rec.x, dy = p.y - rec.y;
    if (Math.abs(dx) > 2) { rec.dir = dx < 0 ? 'left' : 'right'; setFacing(rec.hero, 'side', { dir: rec.dir }); }
    else if (dy > 0) setFacing(rec.hero, 'front');
    else setFacing(rec.hero, 'side', { dir: rec.dir });
  },
  sleep(ms) { return this.instant ? Promise.resolve() : new Promise(r => setTimeout(r, ms / this.speed)); },
  free(id) { const r = this.actors[id]; if (!r || !r.held) return Promise.resolve(); return new Promise(res => r.waiters.push(res)); },
  /* one continuous glide at constant speed (rAF). A newer walk cancels an older one
     and starts from wherever the actor really is — no stalls, no jumps. */
  async walkTo(id, target, o = {}) {
    const rec = this.actors[id]; if (!rec) return;
    await this.free(id);
    const to = typeof target === 'string' ? this.anchor(target) : target;
    const tok = ++rec.walkTok;
    rec.walking = true;
    setPose(rec.hero, o.pose || 'walking', { seated: false, holding: o.holding || 'none', props: false, moving: true });
    rec.btn.style.setProperty('--lift', '0px');
    rec.wrap.classList.add('walking');
    if (this.instant || reducedMotion()) {
      if (!this.instant && reducedMotion()) { rec.wrap.classList.add('blink-out'); await new Promise(r => setTimeout(r, 160)); }
      if (rec.walkTok !== tok) return;
      this._moveNow(rec, to.x, to.y);
      rec.wrap.classList.remove('blink-out');
    } else {
      const pts = this._route({ x: rec.x, y: rec.y }, to);
      await this._glide(rec, pts, tok);
    }
    if (rec.walkTok !== tok) return;
    rec.walking = false; rec.wrap.classList.remove('walking');
    if (typeof target === 'string') rec.data.at = target;
    if (to.look) setFacing(rec.hero, 'side', { dir: to.look });
  },
  _glide(rec, pts, tok) {
    return new Promise(res => {
      if (!pts.length) return res();
      const v = 230 * this.speed; let i = 0, last = 0;
      this._faceTo(rec, pts[0]);
      const step = now => {
        if (rec.walkTok !== tok || !this.box) return res();
        const dt = last ? Math.min(50, now - last) / 1000 : 0; last = now;
        let move = v * dt;
        while (move > 0 && i < pts.length) {
          const p = pts[i], dx = p.x - rec.x, dy = p.y - rec.y, d = Math.hypot(dx, dy);
          if (d <= move) { this._moveNow(rec, p.x, p.y); move -= d; if (++i < pts.length) this._faceTo(rec, pts[i]); }
          else { this._moveNow(rec, rec.x + dx / d * move, rec.y + dy / d * move); move = 0; }
        }
        if (i >= pts.length) return res();
        tick();
      };
      /* rAF when frames are painting; a timer fallback when they aren't (hidden tab, headless) */
      const tick = () => { let done = false; const go = () => { if (!done) { done = true; step(performance.now()); } }; requestAnimationFrame(go); setTimeout(go, 48); };
      tick();
    });
  },

  /* ---------------------------------------------------------- state → look */
  setActivity(id, kind, o = {}) {
    const rec = this.actors[id]; const a = rec ? rec.data : wsAgent(id); if (!a) return;
    const act = ACTIVITY[kind] || ACTIVITY.idle;
    a.activity = Object.assign({}, a.activity, { kind, label: o.label || act.tag, detail: o.detail || o.label || act.tag, target: o.target ?? null, short: o.short || null });
    if ('featureId' in o) a.activity.featureId = o.featureId;
    a.session = kind === 'sleeping' ? 'asleep' : kind === 'idle' ? 'idle' : 'running';
    if (rec) this._apply(rec, o);
    this.deskSync(a.seat);
    if (typeof officeChanged === 'function') officeChanged(id);
  },
  _apply(rec, o = {}) {
    const a = rec.data; const act = ACTIVITY[a.activity.kind] || ACTIVITY.idle;
    const atDesk = !!a.at && (a.at === a.seat || a.at === 'director');
    const onCouch = /^couch-/.test(a.at || '');
    const seated = !!act.seated && (atDesk || onCouch);
    if (!rec.walking) {
      setPose(rec.hero, act.pose, { seated, holding: act.holding || 'none', props: false, moving: false });
      if (!rec.held) {
        if (o.facing) setFacing(rec.hero, o.facing, { dir: o.dir || 'right' });
        else if (act.pose === 'sleeping') setFacing(rec.hero, 'front');
        else setFacing(rec.hero, 'three-quarter', { dir: a.at === 'director' ? 'left' : 'right' });
      }
      rec.btn.style.setProperty('--lift', (seated && atDesk ? 16 : 0) + 'px');
    }
    rec.btn.style.setProperty('--hy', rec.hero.style.getPropertyValue('--head-y') || '10%');

    rec.wrap.classList.toggle('asleep', a.activity.kind === 'sleeping');
