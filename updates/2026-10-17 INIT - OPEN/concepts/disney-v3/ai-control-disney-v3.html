  },
  bang(id, on) {
    const r = this.actors[id]; if (!r) return;
    r.btn.querySelector('.o-bang').hidden = !on;
    r.wrap.classList.toggle('has-bang', !!on);
  },

  /* desks read their owner's state */
  deskSync(seatId) {
    const ids = seatId ? [seatId] : Object.keys(this.desks);
    ids.forEach(sid => {
      const d = this.desks[sid]; if (!d) return;
      const owner = sid === 'director' ? WS.director : WS.agents.find(a => a.seat === sid && a.onProject);
      const s = { glyph: 'off', hue: d.hue || 'grape', tray: d.tray };
      if (owner) {
        const act = ACTIVITY[owner.activity.kind] || ACTIVITY.idle;
        s.hue = agentById(owner.id === 'pixel' ? 'director' : owner.id).hue;
        s.glyph = owner.session === 'asleep' ? 'off' : act.glyph;
        d.chair.classList.toggle('empty', owner.at !== sid);
      } else d.chair.classList.add('empty');
      THEME_OFFICE.deskSync(d.el, s);
    });
  },
  /* a desk gets a (new) owner: build it if needed, dress it for them */
  adopt(seatId, agentId) {
    if (!this.desks[seatId]) this._desk(seatId, 'hot', this.plan.seats[seatId], null);
    const d = this.desks[seatId]; if (!d) return;
    const ag = agentById(agentId);
    d.el.innerHTML = THEME_OFFICE.desk(d.kind, { hue: d.hue, accent: ag.hue, item: 'mug' });
    d.chair.innerHTML = THEME_OFFICE.chair(ag.hue);
    this.deskSync(seatId);
  },
  /* a small real button floating by an actor (e.g. "Chat anyway" on a sleeper) */
  chip(id, label, onClick) {
    const r = this.actors[id]; if (!r) return;
    this.fxLayer.querySelectorAll('.o-chip').forEach(c => c.remove());
    const b = document.createElement('button'); b.type = 'button'; b.className = 'o-chip'; b.textContent = label;
    const H = parseFloat(r.btn.style.getPropertyValue('--H')) || 176; const s = THEME_OFFICE.depth(r.y);
    b.style.transform = `translate(${r.x}px,${r.y - H * s * .8}px)`;
    b.onclick = e => { e.stopPropagation(); b.remove(); onClick(); };
    this.fxLayer.appendChild(b);
    clearTimeout(this._chipT); this._chipT = setTimeout(() => b.remove(), 6000);
  },

  /* ---------------------------------------------------------- talk: "…" only */
  async say(id, text, o = {}) {
    const rec = this.actors[id]; if (!rec || this.instant) return;
    const b = rec.btn.querySelector('.o-bubble');
    b.hidden = false; b.classList.remove('to-left', 'to-right');
    if (o.to && this.actors[o.to]) b.classList.add(this.actors[o.to].x < rec.x ? 'to-left' : 'to-right');
    rec.wrap.classList.add('speaking');
    await this.sleep(o.ms || 1500);
    b.hidden = true; rec.wrap.classList.remove('speaking');
  },
  /* two agents exchange n bubbles from where they sit; max 2 conversations at once */
  async converse(a, b, n = 2) {
    while (this._convos >= 2 && !this.instant) await this.sleep(400);
    this._convos++;
    const ra = this.actors[a], rb = this.actors[b];
    if (ra && rb && !ra.walking && !ra.held) setFacing(ra.hero, 'three-quarter', { dir: rb.x < ra.x ? 'left' : 'right' });
    if (ra && rb && !rb.walking && !rb.held) setFacing(rb.hero, 'three-quarter', { dir: ra.x < rb.x ? 'left' : 'right' });
    try { for (let i = 0; i < n; i++) await this.say(i % 2 ? b : a, '', { to: i % 2 ? a : b, ms: 1300 }); }
    finally { this._convos--; }
  },

  /* ---------------------------------------------------------- facing the viewer */
  face(id) {
    const r = this.actors[id]; if (!r) return;
    r.held = true; r.wrap.classList.add('held');
    if (r.data.activity.kind !== 'sleeping') setFacing(r.hero, 'front');
  },
  unface(id) {
    const r = this.actors[id]; if (!r || !r.held) return;
    r.held = false; r.wrap.classList.remove('held');
    this._apply(r);
    const w = r.waiters.splice(0); w.forEach(f => f());
  },
  react(id, kind) {
    const r = this.actors[id]; if (!r || this.instant) return;
    const cls = 'r-' + kind;
    r.wrap.classList.remove(cls); void r.wrap.offsetWidth; r.wrap.classList.add(cls);
    clearTimeout(r._rt); r._rt = setTimeout(() => r.wrap.classList.remove(cls), 1400);
  },

  /* ---------------------------------------------------------- props in flight */
  async fly(kind, from, to, ms = 1100) {
    if (this.instant || reducedMotion() || !this.fxLayer) return;
    const el = document.createElement('div'); el.className = 'o-flyer'; el.setAttribute('aria-hidden', 'true');
    el.innerHTML = kind === 'plane'
      ? `<svg viewBox="-20 -14 40 28" width="40" height="28"><path d="M-18 2 L18 -12 L4 12 L0 4Z" fill="#fff6e9" stroke="#241a44" stroke-width="2.5" stroke-linejoin="round"/></svg>`
      : `<svg viewBox="-14 -10 28 20" width="30" height="22"><rect x="-12" y="-8" width="24" height="16" rx="2" fill="#f3d79e" stroke="#241a44" stroke-width="2.2"/><path d="M-12 -8 L0 2 L12 -8" fill="none" stroke="#241a44" stroke-width="2"/></svg>`;
    this.fxLayer.appendChild(el);
    el.style.transform = `translate(${from.x}px,${from.y}px)`;
    void el.offsetWidth;
    el.style.transitionDuration = (ms / this.speed) + 'ms';
    el.style.transform = `translate(${to.x}px,${to.y}px)`;
    await this.sleep(ms);
    el.remove();
  },
  burst(x, y) {
    if (this.instant || reducedMotion()) return;
    const cols = [PALETTE.sun, PALETTE.coral, PALETTE.teal, PALETTE.mint];
    for (let i = 0; i < 16; i++) {
      const p = document.createElement('i'); p.className = 'o-conf';
      p.style.background = cols[i % cols.length];
      p.style.left = x + 'px'; p.style.top = y + 'px';
      p.style.setProperty('--dx', (Math.random() * 200 - 100).toFixed(0) + 'px');
      p.style.setProperty('--dy', (-50 - Math.random() * 110).toFixed(0) + 'px');
      p.style.setProperty('--r', (Math.random() * 540).toFixed(0) + 'deg');
      this.fxLayer.appendChild(p); setTimeout(() => p.remove(), 1700);
    }
  },
  /* where an actor's desk-top is (for flyers) */
  deskTop(id) { const r = this.actors[id]; return r ? { x: r.x, y: r.y - 60 } : { x: this.W / 2, y: 500 }; },

  /* ---------------------------------------------------------- camera */
  fit() {
    if (!this.box) return;
    const vp = this.box.parentElement; const Wv = vp.clientWidth;
    /* narrow screens: the chat is a bottom drawer — fit the room into what's above it */
    const panel = document.getElementById('oPanel');
    const drawer = matchMedia('(max-width:899px)').matches && panel ? panel.offsetHeight : 0;
    const H = Math.max(120, vp.clientHeight - drawer);
    const k = Math.min(Wv / this.W, H / 1062);
    this.k = k;
    const ox = (Wv - this.W * k) / 2, oy = (H - 1062 * k) / 2;
    this.box.style.transform = `translate(${ox}px,${oy}px) scale(${k})`;
    this.box.style.setProperty('--k', k);
    this._ox = ox; this._oy = oy;
    if (this.zoom.obj) this.zoomTo(this.zoom.obj, true);
  },
  /* fit an object's bounds into the viewport; null = back to the office */
  zoomTo(objId, quiet) {
    if (!this.box) return null;
    const vp = this.box.parentElement; const Wv = vp.clientWidth, H = vp.clientHeight;
    let z = 1, tx = 0, ty = 0;
    if (objId) {
      const o = this.plan.objects[objId] || this.plan.objects.whiteboard;
      const bx = o.x - 16, by = o.y + 70 - 16, bw = o.w + 32, bh = o.h + 32;
      z = Math.min((Wv * 0.94) / (bw * this.k), (H * 0.9) / (bh * this.k));
      const cx = bx + bw / 2, cy = by + bh / 2;
      const ccx = (Wv / 2 - this._ox) / this.k, ccy = (H / 2 - this._oy) / this.k;
      tx = ccx - z * cx; ty = ccy - z * cy;
    }
    this.zoom = { z, tx, ty, obj: objId };
    this.cam.classList.toggle('quiet', !!quiet);
    this.cam.style.transform = objId ? `translate(${tx}px,${ty}px) scale(${z})` : '';
    this.box.style.setProperty('--z', z);
    this.box.classList.toggle('zoomed', !!objId);
    return true;
  },
};

/* the accessible name of an actor — full sentence, never colour-only */
function actorLabel(a) {
  const ag = agentById(a.id === 'pixel' ? 'director' : a.id);
  const team = a.teamId ? teamById(a.teamId) : null;
  const where = a.id === 'pixel' ? 'Director' : team ? team.name : 'Solo';
  let st = a.activity.detail || a.activity.label;
  if (a.activity.kind === 'needs-input') { const ask = WS.pending.find(p => p.agentId === a.id); st = 'needs your input' + (ask ? ': ' + ask.short : a.activity.detail ? ': ' + a.activity.detail : ''); }
  if (a.activity.kind === 'sleeping') st = 'off shift, asleep on the couch';
  return `${ag.name}, ${a.id === 'pixel' ? 'Director' : ag.role}, ${where} — ${st}`;
}

</script>
<script data-module="js/office-panel.js">
"use strict";
/* ============================================================
   office-panel.js — the chat side panel (spec-office §3.2–3.4).
   Calm: header + conversation + a text composer. Nothing else.
   One thread per agent (WS.threads), Pixel is the default; the office is the
   switcher (click an agent). "!" asks arrive as cards in the agent's thread
   (access asks show a masked credential + one button).

   Public: OP.mount(el), OP.open(id, {from}), OP.refresh(), OP.post(threadId, msg),
           OP.ask(ask) (a new "!"), OP.resolveAsk(askId, answer),
           OP.sleeperPoke(id), OP.thread, OP._name(id), OP._short(id)
   Reads: WS, OE (face/unface/say), OS.onAnswer / OS.wake, OB (voice edits)
   ============================================================ */

const OP = { el: null, thread: 'pixel', _seq: 100, _pokeIdx: 0, _pixelHold: null };

OP.mount = function (el) {
  this.el = el; this.thread = 'pixel';
  el.setAttribute('role', 'complementary');
  el.innerHTML = `
    <button class="op-grab" type="button" aria-label="Expand chat" id="opGrab"><i></i></button>
    <header class="op-head" id="opHead"></header>
    <div class="op-log" id="opLog" role="log" aria-live="polite"></div>
    <form class="op-composer" id="opForm">
      <input id="opInput" autocomplete="off" />
      <button class="btn btn-hero btn-sm" id="opSend" type="submit">Send</button>
    </form>`;
  el.querySelector('#opForm').onsubmit = e => { e.preventDefault(); this.sendTyped(); };
  el.querySelector('#opGrab').onclick = () => { document.getElementById('office').classList.toggle('drawer-up'); setTimeout(() => OE.fit(), 340); };
  const inp = el.querySelector('#opInput');
  inp.onkeydown = e => {
    if (e.key === 'Escape' && !inp.value && this.thread !== 'pixel' && !OM.layer) { e.stopPropagation(); this.open('pixel'); }
  };
  this._renderThread();
};

/* ------------------------------------------------------------ switching */
OP.open = function (id, o = {}) {
  const a = wsAgent(id); if (!a || !this.el) return;
  const prev = this.thread;
  if (prev !== id && prev !== 'pixel') OE.unface(prev);
  this.thread = id; a.unread = 0;
  if (id === 'pixel') {
    if (o.from === 'scene') {        /* Pixel turns to you for a moment, then gets back to it */
      OE.face('pixel');
      clearTimeout(this._pixelHold); this._pixelHold = setTimeout(() => OE.unface('pixel'), 2600);
    }
  } else if (a.activity.kind !== 'sleeping') {
    OE.face(id);
    if (a.activity.kind !== 'needs-input' && ['scene', 'bell', 'list'].includes(o.from)) this._summary(a);
  }
  this._renderThread();
  OM.showPanel();
  announce('Now talking to ' + this._name(id));
  const card = this.el.querySelector('.op-ask.live');
  if (card) { const f = card.querySelector('button,input'); if (f && o.from !== 'type') setTimeout(() => f.focus(), 60); }
  else if (o.from !== 'scene' && o.from !== 'type') this.el.querySelector('#opInput').focus({ preventScroll: true });
};
OP._name = id => agentById(id === 'pixel' ? 'director' : id).name;
OP._short = id => id === 'pixel' ? 'Pixel' : shortName(agentById(id));

/* "tell me what you're doing" — one plain message, only if it changed */
OP._summary = function (a) {
  const text = a.activity.kind === 'idle' ? `Free right now. ${a.activity.detail.replace(/^Free!\s*/, '')}.` : `${a.activity.detail}.`;
  const last = (WS.threads[a.id] || []).slice(-1)[0];
  if (!last || last.kind !== 'summary' || last.text !== text) this.post(a.id, { from: a.id, kind: 'summary', text });
};

/* ------------------------------------------------------------ messages */
OP.post = function (tid, msg) {
  WS.threads[tid] = WS.threads[tid] || [];
  const m = Object.assign({ id: 'm' + (++this._seq), at: Date.now() }, msg);
  WS.threads[tid].push(m);
  if (tid === this.thread && this.el) this._append(m, msg.stream);
  else { const a = wsAgent(tid); if (a) a.unread = (a.unread || 0) + 1; }
  return m;
};

OP._renderThread = function () {
  const log = this.el.querySelector('#opLog'); log.innerHTML = '';
  (WS.threads[this.thread] || []).forEach(m => this._append(m, false));
  this.refresh();
};
OP._append = function (m, stream) {
  const log = this.el.querySelector('#opLog');
  let el;
  if (m.kind === 'ask') el = this._askCard(m);
  else {
    const who = m.from === 'user' ? 'You' : this._name(m.from);
    el = document.createElement('div'); el.className = 'bubble ' + (m.from === 'user' ? 'me' : 'them');
    el.innerHTML = `<span class="who">${escapeHtml(who)}</span><span class="t"></span>${m.files ? `<ul class="op-files">${m.files.map(f => `<li>${escapeHtml(f)}</li>`).join('')}</ul>` : ''}`;
    const t = el.querySelector('.t'); const html = this._fmt(m.text);
    if (stream && !reducedMotion() && m.from !== 'user') {
      el.classList.add('streaming'); let i = 0; const plain = m.text;
      const iv = setInterval(() => { t.textContent = plain.slice(0, ++i); log.scrollTop = log.scrollHeight; if (i >= plain.length) { clearInterval(iv); el.classList.remove('streaming'); t.innerHTML = html; } }, 14);
    } else t.innerHTML = html;
  }
  log.appendChild(el); log.scrollTop = log.scrollHeight;
};
OP._fmt = s => escapeHtml(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/&lt;b&gt;(.*?)&lt;\/b&gt;/g, '<b>$1</b>');

/* ------------------------------------------------------------ header */
OP.refresh = function () {
  if (!this.el) return;
  const id = this.thread; const a = wsAgent(id); const ag = agentById(id === 'pixel' ? 'director' : id);
  const team = a.teamId ? teamById(a.teamId) : null; const act = ACTIVITY[a.activity.kind] || ACTIVITY.idle;
  const head = this.el.querySelector('#opHead');
  const key = [id, a.activity.kind, a.activity.detail, a.session].join('|');
  if (head.dataset.key === key) return;
  head.dataset.key = key;
  const status = id === 'pixel' ? 'Your director · big picture only'
    : a.activity.kind === 'needs-input' ? '❗ Needs you'
    : a.session === 'asleep' ? '💤 Off shift — Pixel can bring them in'
    : `${act.icon} ${escapeHtml(a.activity.detail || a.activity.label)}`;
  head.innerHTML = `<div class="op-portrait"></div>
    <div class="op-who"><b>${escapeHtml(ag.name)}</b>
      <span class="op-role">${escapeHtml(ag.role)}${team ? ` · ${escapeHtml(team.name.replace(/^The /, ''))}` : id === 'pixel' ? '' : ' · Solo'}</span>
      <span class="op-status">${status}</span></div>
    ${id !== 'pixel' ? `<button type="button" class="op-backpix" id="opBack" aria-label="Back to Pixel">← Pixel</button>` : ''}`;
  head.querySelector('.op-portrait').appendChild(hero(ag, { size: 72, pose: a.activity.kind === 'sleeping' ? 'sleeping' : a.activity.kind === 'needs-input' ? 'needs-input' : 'talking', facing: 'front', props: false }));
  const b = head.querySelector('#opBack'); if (b) b.onclick = () => this.open('pixel');
  this.el.setAttribute('aria-label', 'Chat with ' + ag.name);
  const inp = this.el.querySelector('#opInput');
  inp.placeholder = `Message ${this._short(id)}…`; inp.setAttribute('aria-label', 'Message ' + ag.name);
};

/* ------------------------------------------------------------ talking */
OP.sendTyped = function () {
  const inp = this.el.querySelector('#opInput'); const v = (inp.value || '').trim();
  if (!v) { inp.focus(); return; }
  inp.value = ''; this._user(v);
};

/* a user utterance (typed, or voice from the app). Saying a name first routes the thread. */
OP._user = function (text) {
  const route = this._routeName(text);
  if (route && route.id !== this.thread) {
    this.post(this.thread, { from: 'user', kind: 'text', text });
    this.open(route.id, { from: 'type' });
    this.post(route.id, { from: 'user', kind: 'text', text: route.rest || text });
    this._typing(() => this._reply(route.id, route.rest || text));
    return;
  }
  this.post(this.thread, { from: 'user', kind: 'text', text });
  const tid = this.thread;
  this._typing(() => this._reply(tid, text));
};
OP._routeName = function (text) {
  const m = /^\s*(?:@|hey\s+|hi\s+|ok\s+)?([a-z][a-z-]+)[\s,:]+(.*)$/i.exec(text); if (!m) return null;
  const word = m[1].toLowerCase(); if (word === 'pixel' && /^\s*(?:@|hey\s+)?pixel\b/i.test(text)) return { id: 'pixel', rest: m[2] };
  const hit = wsOnProject().find(a => { const n = agentById(a.id).name.toLowerCase(); return n.split(/[\s-]/).includes(word) && !['pixel', 'von', 'sir', 'the'].includes(word); });
  if (!hit || !(/^\s*(@|hey|hi|ok)/i.test(text))) return null;
  return { id: hit.id, rest: m[2] };
};
OP._typing = function (done) {
  const log = this.el.querySelector('#opLog');
  const b = document.createElement('div'); b.className = 'bubble them'; b.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  log.appendChild(b); log.scrollTop = log.scrollHeight;
  setTimeout(() => { b.remove(); done(); }, reducedMotion() ? 200 : 800);
};
OP._say = function (tid, text, extra = {}) { this.post(tid, Object.assign({ from: tid, kind: 'text', text, stream: true }, extra)); };

/* simulated replies — agents stay scoped to their task; big picture goes to Pixel */
OP._reply = function (tid, text) {
  const t = text.toLowerCase(); const a = wsAgent(tid);
  if (tid === 'pixel') {
    if (/^(pixel,?\s*)?(close|back|go back|back to the office)\b/.test(t)) { if (OM.layer) { this._say('pixel', 'Closing that.'); OB.escape(); } else this._say('pixel', 'You’re already in the office.'); return; }
    const drop = /(?:drop|remove|cut|strike)\s+(.+?)\s+from\s+(?:the\s+)?(.+?)[.!?]*$/.exec(t);
    if (drop) {
      const f = WS.features.find(x => x.name.toLowerCase().includes(drop[2].trim().split(' ')[0]));
      const word = drop[1].replace(/^the\s+/, '').trim();
      if (f && OB.stageDrop(f.id, word)) { this._say('pixel', `Took “${word}” out of the ${f.name} description — it’s on the page. Save it?`); return; }
      this._say('pixel', 'I couldn’t find that — open the feature and edit the text there?'); return;
    }
    if (/^save it/.test(t)) { this._say('pixel', OB.saveStaged() ? 'Saved — I’ll brief whoever picks it up.' : 'Nothing staged to save.'); return; }
    if (/^never mind/.test(t)) { OB.discardStaged(); this._say('pixel', 'Okay — left it as it was.'); return; }
    if (/health|modular|clean|reus/.test(t)) { this._say('pixel', 'Here’s the health report.'); setTimeout(() => go('health'), 400); return; }
    if (/board|whiteboard|progress|checklist|task/.test(t)) { this._say('pixel', 'Here’s the board.'); setTimeout(() => go('board'), 400); return; }
    if (/feature|shipped|what shipped|plan/.test(t)) { this._say('pixel', `${WS.features.filter(f => f.status === 'shipped').length} features shipped so far. Opening the folder.`); setTimeout(() => go('features'), 400); return; }
    if (/who needs|waiting/.test(t)) { const p = WS.pending[0]; this._say('pixel', p ? `${this._name(p.agentId)} — ${p.short.toLowerCase()}. Tap the “!”.` : 'Nobody right now — everyone’s unblocked.'); return; }
    if (/currenc|start it/.test(t)) { this._say('pixel', 'On it — Multi-currency is in progress. Checkout stays the priority.'); const f = wsFeature('multicur'); if (f && f.status === 'planned') { f.status = 'now'; f.pct = 2; officeChanged(); } return; }
    const wake = /wake\s+(\w+)/.exec(t);
    if (wake) { const who = wsOnProject().find(x => agentById(x.id).name.toLowerCase().includes(wake[1]) && x.session === 'asleep'); if (who) { this._say('pixel', `Bringing ${this._name(who.id)} in.`); OS.wake(who.id); return; } }
    if (/deploy|preview/.test(t)) { this._say('pixel', 'Baron handles deploys — I’ll ask him for a fresh preview after the next green run.'); return; }
    this._say('pixel', 'Got it — I’ll take that to the crew and keep you posted here.'); return;
  }
  if (/wake|come in/.test(t) && a.session === 'asleep') { this.open('pixel'); this._say('pixel', `Waking ${this._name(tid)} — give them a sec.`); OS.wake(tid); return; }
  if (a.session === 'asleep') { this._say(tid, 'zzz… (off shift — ask Pixel to bring me in)'); return; }
  if (/left|remain|plate|how.?s|going/.test(t)) { this._say(tid, a.brief ? a.brief.left : 'Nearly there.'); return; }
  if (/chang|diff|touch/.test(t)) { this._say(tid, 'Here’s what I touched:', { files: a.brief ? a.brief.changed : [] }); return; }
  if (/token/.test(t)) { this._say(tid, `${wsTok(a.tokens.total)} tokens on this project so far.`); return; }
  if (/next/.test(t)) { this._say(tid, a.activity.kind === 'idle' ? 'Whatever Pixel hands me — I’m free.' : `After ${a.activity.target || 'this'}: ${a.brief ? a.brief.left : 'whatever Pixel says.'}`); return; }
  if (/priority|plan|scope|deadline|should we|roadmap|launch/.test(t)) { this._say(tid, 'That’s Pixel’s call — ask him and he’ll steer us.'); return; }
  this._say(tid, `Noted — I’ll keep that in mind for ${a.activity.target ? '`' + a.activity.target + '`' : 'this task'}.`);
};

/* ------------------------------------------------------------ "!" asks */
OP.ask = function (ask) {
  if (WS.pending.find(p => p.id === ask.id)) return;
  WS.pending.push(ask);
  this.post(ask.agentId, { from: ask.agentId, kind: 'ask', askId: ask.id, text: ask.q });
  announce(`${this._name(ask.agentId)} needs your input: ${ask.short}.`, true);
  officeChanged();
  if (this.thread === ask.agentId) this._renderThread();
};
OP._askCard = function (m) {
  const ask = WS.pending.find(p => p.id === m.askId); const live = !!ask;
  const el = document.createElement('div'); el.className = 'op-ask' + (live ? ' live' : ' done');
  if (!live) {
    el.innerHTML = `<div class="op-aq">${m.text.replace(/<(?!\/?b>)[^>]*>/g, '')}</div><div class="op-adone">✓ ${escapeHtml((WS.answered || {})[m.askId] || 'Answered')}</div>`;
    return el;
  }
  el.setAttribute('role', 'group'); el.setAttribute('aria-label', `${this._name(ask.agentId)} is asking: ${ask.short}`);
  el.innerHTML = `<div class="op-aq">${m.text.replace(/<(?!\/?b>)[^>]*>/g, '')}</div><div class="op-actx">${escapeHtml(ask.ctx)}</div><div class="op-ain"></div>`;
  const inp = el.querySelector('.op-ain');
  if (ask.type === 'access') {
    const cred = credById(ask.want);
    inp.innerHTML = `<div class="op-cred"><span class="ic" style="background:${cred.color}" aria-hidden="true">${escapeHtml(cred.mark)}</span><b>${escapeHtml(cred.name)}</b><span class="vl">${escapeHtml(cred.val)}</span></div>`;
    const hand = document.createElement('button'); hand.type = 'button'; hand.className = 'btn btn-hero btn-sm';
    hand.textContent = WS.grants[ask.want] ? 'Hand it over' : `Grant ${cred.name} & hand over`;
    hand.onclick = () => { if (!WS.grants[ask.want]) WS.grants[ask.want] = true; this.resolveAsk(ask.id, `${cred.name} granted`); };
    inp.appendChild(hand);
  } else {
    const r = document.createElement('div'); r.className = 'op-arow';
    (ask.options || []).forEach(o => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = o; b.onclick = () => this.resolveAsk(ask.id, `“${o}”`); r.appendChild(b); });
    inp.appendChild(r);
  }
  return el;
};
OP.resolveAsk = function (askId, answer) {
  const i = WS.pending.findIndex(p => p.id === askId); if (i < 0) return;
  const ask = WS.pending.splice(i, 1)[0];
  WS.answered = WS.answered || {}; WS.answered[askId] = answer;
  this.post(ask.agentId, { from: 'user', kind: 'text', text: ask.type === 'access' ? `Granted — ${answer.replace(/ granted$/, '')} (value stays masked).` : `Go with ${answer}.` });
  if (typeof OS !== 'undefined') OS.onAnswer(ask, answer);
  if (this.thread === ask.agentId) this._renderThread();
  officeChanged();
  announce(`Handed to ${this._name(ask.agentId)}.`);
};

/* ------------------------------------------------------------ sleepers: chill, don't wake */
const OP_POKES = ['roll', 'snug', 'stretch', 'pop-z'];
OP.sleeperPoke = function (id) {
  OE.react(id, OP_POKES[this._pokeIdx++ % OP_POKES.length]);
  OE.chip(id, 'Chat anyway', () => this.open(id, { from: 'chat-anyway' }));
  announce(`${this._name(id)} is asleep — off shift. Chat anyway is available.`);
};

</script>
<script data-module="js/office-board.js">
"use strict";
/* ============================================================
   office-board.js — the three things you can zoom into (spec-office §4):
     #board          whiteboard: the big %, features in progress, the task list
     #health         health board: Modularity · Cleanliness · Reusability report
     #features       features folder: Now / Planned / Shipped (identical rows)
     #feature/<id>   one feature: Description + Vision as plain text blocks
   The camera zooms onto the object, the scene behind is covered by a still
   scrim (no filters, animations paused), the card fades in. Esc / Back = one layer.

   Public: OB.show(sub), OB.close(), OB.escape(), OB.refresh(), OB.reposition(),
           OB.stageDrop(fid, word), OB.saveStaged(), OB.discardStaged()
   ============================================================ */

const OB = { sub: '', obj: null, el: null, feature: null, draft: null, _confirm: false, _t: null, _key: '' };
const OB_OBJ = { board: 'whiteboard', health: 'health', features: 'dossier', feature: 'dossier' };

OB.show = function (sub) {
  const layers = document.getElementById('oLayers'); if (!layers) return;
  const [kind, fid] = sub.split('/');
  if (!OB_OBJ[kind]) { go('office'); return; }
  if (kind === 'feature') {
    const f = wsFeature(fid); if (!f) { go('features'); return; }
    if (!this.draft || this.feature !== fid) { this.feature = fid; this.draft = { description: f.description, vision: f.vision }; }
  } else { this.feature = null; this.draft = null; }
  this.sub = sub; this._confirm = false;
  const obj = OB_OBJ[kind];
  const fresh = !this.el || this.obj !== obj;
  if (this.obj !== obj) { OE.zoomTo(obj); this.obj = obj; }
  document.getElementById('oStage').classList.add('zooming');
  if (!this.el) {

    this.el.addEventListener('keydown', e => this._trap(e));

  }

  const first = () => { const f = this.el && this.el.querySelector('.ob-back'); if (f) f.focus({ preventScroll: true }); };
  if (fresh && !(OE.instant || reducedMotion())) {
    this.el.classList.remove('in'); clearTimeout(this._t);
    this._t = setTimeout(() => { if (this.el) { this.el.classList.add('in'); first(); } }, 480);
  } else { this.el.classList.add('in'); first(); }
};
OB.close = function () {
  this.sub = ''; this.obj = null; this.draft = null; this.feature = null; clearTimeout(this._t);
  if (this.el) { this.el.remove(); this.el = null; }
  const st = document.getElementById('oStage'); if (st) st.classList.remove('zooming');
  OE.zoomTo(null);
};
OB.escape = function () {
  const [kind] = this.sub.split('/');

    if (this._dirty() && !this._confirm) { this._confirm = true; this._key = ''; this._render(); const k = this.el.querySelector('.ob-confirm button'); if (k) k.focus(); return; }

OB.reposition = function () { if (this.obj) OE.zoomTo(this.obj, true); };

OB.refresh = function () { if (this.el && !this.sub.startsWith('feature/')) this._render(); };

const _obBack = (label, aria) => `<button type="button" class="ob-back" data-key="back" aria-label="${escapeAttr(aria)}">← ${escapeHtml(label)}</button>`;
const _obMark = st => `<span class="ob-mark m-${st}" aria-hidden="true">${st === 'shipped' ? '<svg viewBox="0 0 16 16"><path d="M4 8.5l2.6 2.6L12 5.6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}</span>`;
const OB_ST = { now: 'In progress', planned: 'Planned', shipped: 'Shipped' };

/* ------------------------------------------------------------ whiteboard */
OB._board = function () {
  const now = WS.features.filter(f => f.status === 'now').sort((a, b) => a.order - b.order);
  const C = 2 * Math.PI * 58;
  this.el.setAttribute('aria-label', 'Whiteboard');
  return `${_obBack('Office', 'Back to the office')}
    <div class="ob-wb">
      <div class="ob-big" role="img" aria-label="${WS.overall}% to ${escapeAttr(WS.target)}">
        <svg viewBox="0 0 140 140" aria-hidden="true"><circle cx="70" cy="70" r="58" fill="none" stroke="#ece8f5" stroke-width="14"/>
          <circle cx="70" cy="70" r="58" fill="none" stroke="${PALETTE.coral}" stroke-width="14" stroke-linecap="round" transform="rotate(-90 70 70)" stroke-dasharray="${(C * WS.overall / 100).toFixed(1)} ${C.toFixed(1)}"/></svg>
        <b>${WS.overall}<small>%</small></b><span>to ${escapeHtml(WS.target)}</span>
      </div>
      <div class="ob-cols">
        <section aria-labelledby="obN"><h3 id="obN">In progress</h3>
          <ul class="ob-now">${now.map(f => `<li><button type="button" data-key="f-${f.id}" data-feat="${f.id}">
            <span class="ob-fn">${escapeHtml(f.name)}</span><span class="ob-pct">${f.pct}%</span>
            <span class="ob-track${f.blocked ? ' blocked' : ''}"><i style="width:${f.pct}%"></i></span></button></li>`).join('') || '<li class="ob-empty">Nothing in progress.</li>'}</ul>
        </section>
        <section aria-labelledby="obT"><h3 id="obT">Tasks</h3>
          <ul class="ob-tasks">${WS.checklist.map(k => `<li class="${k.done ? 'done' : ''}"><span class="ob-box" aria-hidden="true">${k.done ? '<svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3L12.5 5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}</span><span class="sr-only">${k.done ? 'Done:' : 'To do:'}</span> ${escapeHtml(k.text)}</li>`).join('')}</ul>
        </section>
