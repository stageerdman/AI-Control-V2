.mic-btn.err{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.wave{display:none;align-items:center;gap:3px;height:28px}
.wave.live{display:flex}
.wave i{width:4px;border-radius:3px;background:linear-gradient(180deg,var(--sun),var(--coral));height:6px;animation:bars .9s ease-in-out infinite}
.wave i:nth-child(odd){animation-delay:.15s}.wave i:nth-child(3n){animation-delay:.3s}
@keyframes bars{50%{height:var(--h)}}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-soft);animation:typ 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes typ{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

/* ---------------- whiteboard (zoomed) ---------------- */
.o-layers{position:absolute;inset:0;z-index:5;pointer-events:none}

.ob-board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.97);width:min(1000px,calc(100% - 28px));max-height:calc(100% - 28px);overflow:auto;
  background:#fdfcf7;color:var(--ink);border-radius:12px;box-shadow:0 0 0 10px #c9c3dd,0 0 0 13px var(--ink),0 30px 60px rgba(8,4,24,.6);padding:16px 20px 12px;opacity:0;transition:opacity .25s,transform .3s var(--ease-out)}
.ob-board.in{opacity:1;transform:translate(-50%,-50%)}
.ob-back{appearance:none;border:0;cursor:pointer;font-family:inherit;font-weight:900;font-size:13px;padding:7px 13px;border-radius:999px;background:var(--ink);color:var(--cream);position:sticky;top:0;z-index:2;margin-bottom:6px}

.ob-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:14px 26px}
.ob-q{min-width:0}
.ob-q h3{margin:0 0 8px;font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--grape);display:flex;align-items:baseline;gap:8px}
.ob-q h3 span{font-weight:800;letter-spacing:.04em;text-transform:none;color:var(--ink-soft)}
.ob-ringrow{display:flex;align-items:center;gap:16px}
.ob-ring{width:104px;height:104px;flex:none}
.ob-big{display:block;font-size:22px;font-weight:900;color:#1f6fc4}
.ob-sub{font-size:12px;font-weight:800;color:var(--ink-soft)}
.ob-bars,.ob-check,.ob-tbars,.ob-who-list{list-style:none;margin:0;padding:0}
.ob-bars{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.ob-bar{appearance:none;border:0;background:transparent;width:100%;display:grid;grid-template-columns:1fr 46px;grid-template-areas:"n p" "t t";gap:3px 8px;align-items:center;font-family:inherit;color:var(--ink);cursor:pointer;padding:5px 6px;border-radius:10px;text-align:left}
.ob-bar:hover{background:rgba(36,26,68,.05)}
.ob-bar:focus-visible{outline:3px solid var(--grape)}
.ob-bn{grid-area:n;font-weight:800;font-size:13.5px}
.ob-pct{grid-area:p;font-weight:900;font-size:13px;text-align:right}
.ob-bar .ob-track{grid-area:t}
.ob-track{display:block;height:11px;border-radius:9px;box-shadow:inset 0 0 0 2px var(--ink);overflow:hidden;background:#fff}
.ob-track i{display:block;height:100%;background:var(--teal);border-radius:9px;transition:width .6s var(--ease-out)}
.ob-bar.blocked .ob-track i{background:var(--coral)}
.ob-blk{font-size:11px;font-weight:900;color:#c03540;white-space:nowrap}
.ob-check{display:flex;flex-direction:column;gap:3px}
.ob-check li{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:8px;font-size:13.5px;font-weight:700;padding:3px 0}
.ob-check li.done .ob-kt{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:rgba(36,26,68,.4)}
.ob-box{width:16px;height:16px;border-radius:3px;box-shadow:inset 0 0 0 2px var(--ink);display:grid;place-items:center}
.ob-box svg{width:14px;height:14px}
.ob-who{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.ob-as{appearance:none;border:0;cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:800;color:var(--ink);background:rgba(36,26,68,.06);padding:2px 8px 2px 2px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.ob-as:hover{background:rgba(255,155,61,.18)}
.ob-as:focus-visible{outline:3px solid var(--grape)}
.ob-face{width:18px;height:18px;border-radius:50%;background:var(--c);display:inline-grid;place-items:center;font-size:10px;font-weight:900;box-shadow:0 0 0 1.5px var(--ink);flex:none}
.ob-link{appearance:none;border:0;background:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:800;color:#b5600e;padding:6px 0 0}
.ob-link:focus-visible{outline:3px solid var(--grape)}
.ob-total{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.ob-total b{font-size:30px;font-weight:900;letter-spacing:-.02em}
.ob-total span{font-size:12px;font-weight:800;color:var(--ink-soft)}
.ob-tbars{display:flex;flex-direction:column;gap:5px}
.ob-tbars li{display:grid;grid-template-columns:132px 1fr 46px;align-items:center;gap:8px;font-size:13px;font-weight:800;border-radius:8px;padding:2px 4px;outline:none}
.ob-tbars li:focus-visible{box-shadow:0 0 0 3px var(--grape)}
.ob-tbars li b{text-align:right;font-weight:900}
.ob-tn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ob-dot{width:14px;height:14px;border-radius:50%;background:#a99bd0;box-shadow:0 0 0 1.5px var(--ink);flex:none}
.ob-split{grid-column:1/-1;font-size:11.5px;font-weight:700;color:var(--ink-soft);display:none;padding-left:22px}
.ob-tbars li:hover .ob-split,.ob-tbars li:focus .ob-split{display:block}
.ob-foot{margin:6px 0 0;font-size:11.5px;font-weight:700;color:var(--ink-soft)}
.ob-tog{display:inline-flex;gap:2px;background:rgba(36,26,68,.07);padding:3px;border-radius:999px;margin-bottom:6px}
.ob-tog button{appearance:none;border:0;background:transparent;font-family:inherit;font-weight:800;font-size:12px;padding:5px 11px;border-radius:999px;cursor:pointer;color:var(--ink-soft)}
.ob-tog button[aria-checked="true"]{background:var(--ink);color:var(--cream)}
.ob-tog button:focus-visible{outline:3px solid var(--grape)}
.ob-who-list{display:flex;flex-direction:column;gap:3px}
.ob-who-list li{display:grid;grid-template-columns:76px auto auto 1fr;align-items:center;gap:8px;font-size:12.5px;font-weight:800;justify-items:start}
.ob-who-list li.asleep{opacity:.5}
.ob-wn{border-left:4px solid var(--c);padding-left:6px;white-space:nowrap}
.ob-sheets{display:flex;align-items:center;height:16px}
.ob-sheets i{display:block;width:11px;height:15px;background:#fff;border-radius:1.5px;box-shadow:0 0 0 1.5px var(--ink),inset 0 -4px 0 -2px #e6e0f2;margin-right:-1px;transform:rotate(-2deg)}
.ob-sheets i:nth-child(3n){background:#fff3dc;transform:rotate(3deg) translateY(-1px)}
.ob-sheets i:nth-child(4n){transform:rotate(1deg) translateY(1px)}
.ob-sheets i:nth-child(5n){margin-right:4px}
.o-layers.has-sheet .ob-board{filter:brightness(.72) saturate(.8)}
.o-layers.has-sheet::before{content:"";position:absolute;inset:0;background:rgba(14,8,32,.25)}
.ob-zz{font-size:12px}
.ob-checkup{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:2px dashed #e4dff0}
.ob-ck-t{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--grape)}
.ob-ck-t span{letter-spacing:0;text-transform:none;font-weight:700;color:var(--ink-soft);margin-left:4px}
.ob-stamp{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800}
.ob-stamp>b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px;box-shadow:0 0 0 2px var(--ink)}
.ob-stamp em{display:block;font-style:normal;font-size:11px;color:var(--ink-soft)}
.ob-stamp.g-A>b{background:var(--mint)}.ob-stamp.g-B>b{background:var(--sun)}.ob-stamp.g-C>b{background:var(--coral)}
.ob-fix{appearance:none;border:0;background:none;cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:800;color:#b5600e}
.ob-fix:focus-visible{outline:3px solid var(--grape)}

/* ---------------- dossier + feature page ---------------- */
.ob-sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 28px));max-height:calc(100% - 28px);display:flex;flex-direction:column;
  background:#fffaf0;color:var(--ink);border-radius:6px 16px 16px 16px;box-shadow:0 0 0 3px var(--ink),0 0 0 10px #e9bf7a,0 0 0 13px var(--ink),0 40px 80px rgba(8,4,24,.7);z-index:2}
.ob-sheet.drop{animation:ob-drop .4s var(--spring)}
.ob-sheet.flip{animation:ob-flip .3s var(--ease-out)}
@keyframes ob-drop{from{transform:translate(-50%,-70%) scale(.5) rotate(-4deg);opacity:0}}
@keyframes ob-flip{from{transform:translate(-50%,-50%) perspective(900px) rotateY(-14deg);opacity:.4}}
.ob-shead{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 10px;border-bottom:2px dashed #ecd9b6;position:relative}

.ob-kick{font-size:10.5px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#a0661b}
.ob-meta{margin:2px 0 0;font-size:12.5px;font-weight:800;color:var(--ink-soft)}
.ob-shead>div{flex:1;min-width:0}
.ob-x{appearance:none;border:0;cursor:pointer;width:34px;height:34px;border-radius:50%;background:rgba(36,26,68,.07);font-size:15px;font-weight:900;color:var(--ink);flex:none}
.ob-x:hover{background:rgba(36,26,68,.14)}
.ob-x:focus-visible,.ob-sback:focus-visible{outline:3px solid var(--grape)}
.ob-sbody{overflow:auto;padding:4px 18px 16px;min-height:0}
.ob-sbody h3{margin:14px 0 6px;font-size:11.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--grape)}
.ob-sbody h3 span{letter-spacing:0;text-transform:none;color:var(--ink-soft);font-weight:700;margin-left:4px}
.ob-rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.ob-row{appearance:none;width:100%;border:0;cursor:pointer;font-family:inherit;color:var(--ink);text-align:left;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:4px 12px 12px 4px;
  background:#fff;box-shadow:0 0 0 1.5px #ead9bb,0 2px 0 #ead9bb;font-size:14px;font-weight:800;transition:transform .12s}
.ob-row:hover{transform:translateX(3px);box-shadow:0 0 0 2px var(--sun-deep),0 2px 0 #ead9bb}
.ob-row:focus-visible{outline:3px solid var(--grape);outline-offset:1px}
.ob-shape{width:20px;text-align:center;font-weight:900;color:var(--ink)}
.ob-row.st-now .ob-shape{color:#1f6fc4}
.ob-row.st-shipped{background:#f6f1e6}
.ob-row.st-shipped .ob-shape{color:#2b8a3e}
.ob-rn{flex:1;min-width:0}
.ob-rp{font-weight:900;font-size:13px}
.ob-own{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--ink-soft);white-space:nowrap}
.ob-chev{font-size:20px;color:var(--ink-soft)}
.ob-rev{font-size:10.5px;font-weight:900;color:#a0661b;background:rgba(233,191,122,.35);border-radius:999px;padding:2px 7px;margin-left:4px;letter-spacing:.02em}
.ob-propose{display:flex;gap:8px;margin:10px 0 0}
.ob-propose[hidden]{display:none}
.ob-propose input{flex:1;font-family:inherit;font-size:14px;font-weight:700;border:2px solid var(--line);border-radius:999px;padding:9px 14px}
.ob-propose input:focus{outline:0;border-color:var(--sun-deep)}
.ob-sback{appearance:none;border:0;cursor:pointer;font-family:inherit;font-weight:900;font-size:12.5px;padding:7px 12px;border-radius:999px;background:var(--ink);color:var(--cream);flex:none;margin-top:2px}
.ob-ftitle{display:flex;flex-direction:column;gap:4px}
.ob-st{font-size:12px;font-weight:900;color:var(--ink-soft)}
.ob-st.st-now{color:#1f6fc4}.ob-st.st-shipped{color:#2b8a3e}
.ob-ftitle .ob-rev{align-self:flex-start;margin:0}
.ob-paper{background:repeating-linear-gradient(180deg,transparent 0 33px,#e7eefb 33px 34px);background-attachment:local}
.ob-note{margin:10px 0 0;font-size:12.5px;font-weight:800;color:#2b8a3e;background:rgba(139,232,139,.2);padding:7px 10px;border-radius:8px}
.ob-lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.ob-line{display:flex;align-items:center;gap:8px;min-height:34px;border-radius:8px;padding:0 4px}
.ob-line:hover,.ob-line:focus-within{background:rgba(255,194,75,.14)}
.ob-ln{width:20px;font-size:12px;font-weight:900;color:#c9b18a;text-align:right;flex:none}
.ob-lt{appearance:none;border:0;background:none;cursor:text;font-family:inherit;font-size:14.5px;font-weight:600;color:var(--ink);text-align:left;flex:1;padding:6px 2px;border-radius:6px;line-height:1.35}
.ob-lt:focus-visible{outline:3px solid var(--grape)}
.ob-line.struck .ob-lt{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--coral);color:var(--ink-soft)}
.ob-line.added .ob-ln{color:#2b8a3e}
.ob-line.staged{background:rgba(255,111,115,.12);box-shadow:inset 3px 0 0 var(--coral)}
.ob-will{font-size:11px;font-weight:800;color:#c03540;white-space:nowrap}
.ob-lin{flex:1;font-family:inherit;font-size:14.5px;font-weight:600;color:var(--ink);border:2px solid var(--sun-deep);border-radius:8px;padding:5px 8px;background:#fff;box-shadow:0 0 0 4px rgba(255,155,61,.16)}
.ob-lin:focus{outline:0}
.ob-lacts{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.ob-line:hover .ob-lacts,.ob-line:focus-within .ob-lacts,.ob-line.struck .ob-lacts{opacity:1}
.ob-la{appearance:none;border:0;cursor:pointer;font-family:inherit;font-weight:900;font-size:13px;min-width:30px;height:30px;border-radius:8px;background:rgba(36,26,68,.07);color:var(--ink);padding:0 8px}
.ob-la:hover{background:rgba(36,26,68,.14)}
.ob-la:focus-visible{outline:3px solid var(--grape)}
.ob-add{appearance:none;border:0;background:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:13px;color:#b5600e;padding:8px 4px 4px 32px}
.ob-add:focus-visible{outline:3px solid var(--grape)}
.ob-sfoot{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:2px dashed #ecd9b6;flex-wrap:wrap}
.ob-diff{flex:1;font-size:12.5px;font-weight:800;color:var(--ink-soft)}
.ob-sfoot .btn[disabled]{opacity:.45;cursor:default;transform:none}
.ob-confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%}
.ob-confirm span{flex:1;font-weight:900;font-size:13px;color:#c03540}

@media (prefers-reduced-motion:reduce){

  .o-actor{transition:opacity .15s!important}

}

/* ---- physical touches: marker headings, clipped folder, manila ---- */
.ob-q h3{position:relative;padding-bottom:6px}
.ob-q h3::after{content:"";position:absolute;left:0;bottom:0;width:86px;height:6px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 86 6'><path d='M1 4 C12 1 22 5 33 3 S56 1 66 4 S80 3 85 2' fill='none' stroke='%239b6cff' stroke-width='2.4' stroke-linecap='round'/></svg>") no-repeat;opacity:.8}
.ob-now h3{color:#1f6fc4}.ob-now h3::after{filter:hue-rotate(-60deg)}
.ob-tok h3{color:#c26a00}.ob-tok h3::after{filter:hue-rotate(160deg) saturate(2)}
.ob-whowrap h3{color:#2b8a3e}.ob-whowrap h3::after{filter:hue-rotate(-150deg)}
.ob-board::after{content:"";position:absolute;left:30%;right:30%;bottom:-10px;height:7px;border-radius:4px;background:#8e86ad;box-shadow:0 0 0 2px var(--ink)}
.ob-clip{position:absolute;top:26px;right:18px;z-index:3;appearance:none;border:0;cursor:pointer;font-family:inherit;width:118px;padding:22px 10px 10px;border-radius:4px 4px 10px 10px;
  background:linear-gradient(180deg,#f0c985,#e3b46a);color:#4a2c10;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 0 0 2.5px var(--ink),0 8px 14px rgba(36,26,68,.25);transform:rotate(2deg);transition:transform .15s var(--spring)}
.ob-clip:hover{transform:rotate(0) translateY(2px)}
.ob-clip:focus-visible{outline:3px solid var(--grape);outline-offset:3px}
.ob-clip b{font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.ob-clip span:not(.ob-clip-c){font-size:12px;font-weight:900}
.ob-clip-c{position:absolute;top:-10px;left:50%;width:46px;height:20px;transform:translateX(-50%);background:var(--ink);border-radius:3px 3px 8px 8px}
.ob-clip-c::before,.ob-clip-c::after{content:"";position:absolute;top:-10px;width:10px;height:14px;border:3px solid #c9c3dd;border-bottom:0;border-radius:8px 8px 0 0}
.ob-clip-c::before{left:6px}.ob-clip-c::after{right:6px}
.ob-grid{padding-right:110px}
.ob-sheet{background:#fbf3df url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55 0 0 0 0 .38 0 0 0 0 .12 0 0 0 .05 0'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
.ob-chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.ob-chipf{appearance:none;border:0;cursor:pointer;font-family:inherit;font-weight:800;font-size:12.5px;color:var(--ink);background:#f6f1e6;padding:6px 11px;border-radius:999px;box-shadow:0 0 0 1.5px #ead9bb}
.ob-chipf span:first-child{color:#2b8a3e;font-weight:900}
.ob-chipf:hover{box-shadow:0 0 0 2px var(--sun-deep)}
.ob-chipf:focus-visible{outline:3px solid var(--grape);outline-offset:1px}
@media (max-width:899px){.ob-grid{grid-template-columns:1fr;padding-right:0}.ob-clip{position:static;transform:none;margin:0 0 8px auto;width:auto;flex-direction:row;padding:8px 12px}.ob-clip-c{display:none}}

/* ==== css/gallery.css ==== */
/* gallery.css — #gallery dev route only */
#gallery{position:fixed;inset:0;z-index:6;overflow:auto;color:var(--cream);background:var(--bg-0)}
.gal-head{position:sticky;top:0;z-index:3;display:flex;gap:16px;align-items:center;padding:10px 20px;background:rgba(26,20,48,.92);backdrop-filter:blur(6px)}
.gal-head nav{display:flex;gap:10px;flex-wrap:wrap}
.gal-head a{color:var(--cream-72);font-weight:700;font-size:13px;text-decoration:none}
.gal-head a[aria-current]{color:var(--sun)}
.gal-body{padding:8px 20px 60px}
.gal-sec{margin:18px 0 34px}
.gal-sec h2{font-size:16px;margin:0 0 4px}
.gal-sec>p{margin:0 0 10px;color:var(--cream-72);font-size:12px;font-weight:600}
.gal-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;padding:10px 0;border-bottom:1px solid rgba(255,246,233,.06)}
.gal-row.gray{filter:grayscale(1)}
.gal-row.gal-bottom{align-items:flex-end}
.gal-cell{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.gal-cell figcaption{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,246,233,.6);max-width:120px;text-align:center}
.gal-cell.desk::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:var(--capH,0px);width:96%;height:calc((100% - var(--capH,0px))*.24);border-radius:6px 6px 2px 2px;
  background:linear-gradient(180deg,#b9773f,#8f5a2e);box-shadow:inset 0 3px 0 rgba(255,255,255,.18),0 0 0 2px #241a44;pointer-events:none}
.gal-cell.desk figcaption{position:relative;z-index:1}
.gal-cell.desk:has(figcaption){--capH:20px}
.gal-cell.desk:has(button){--capH:58px}
.gal-rl{width:70px;flex:none;font-size:11px;font-weight:800;color:var(--sun);text-transform:uppercase;letter-spacing:.06em;align-self:center}
.gal-poses,.gal-poses-head{flex-wrap:nowrap;gap:4px}
.gal-poses .gal-cell{width:76px}
.gal-poses-head span{width:76px;flex:none;font-size:9px;font-weight:800;text-transform:uppercase;color:rgba(255,246,233,.6);text-align:center}
.gal-poses-head span:first-child{width:70px}
.gal-small{display:flex;gap:8px;align-items:center;margin-left:12px}

</style>

<script data-module="js/core.js">
"use strict";
/* ============================================================
   core.js — shared primitives every module may use.
   Public: PALETTE, COLOR_NAMES, HUES, hueHex(), shade(), hexTint(),
           escapeHtml(), escapeAttr(), reducedMotion(), toast(),
           fireConfetti(), sparkle(), announce(), openSheet(), closeSheet(),
           go(route), currentRoute()
   No DOM rendering of screens here; no knowledge of other modules.
   ============================================================ */

/* The 7 character hues (+ sun-deep, a gear/UI accent only). */
const PALETTE = {
  sun: '#ffc24b', 'sun-deep': '#ff9b3d', coral: '#ff6f73', teal: '#2fd3c3',
  sky: '#4ea8ff', grape: '#9b6cff', mint: '#8be88b', rose: '#ff9ecf',
};
const COLOR_NAMES = { sun: 'Amber', coral: 'Coral', teal: 'Teal', sky: 'Sky', grape: 'Grape', mint: 'Mint', rose: 'Rose' };
const HUES = Object.keys(COLOR_NAMES);

/* palette key or hex → hex */
function hueHex(k) { return PALETTE[k] || k || PALETTE.sun; }

/* lighten (+) / darken (−) a hex by a flat amount per channel */
function shade(hex, amt) {
  const n = parseInt(hueHex(hex).slice(1), 16);
  const r = Math.max(0, Math.min(255, (n >> 16) + amt));
  const g = Math.max(0, Math.min(255, (n >> 8 & 255) + amt));
  const b = Math.max(0, Math.min(255, (n & 255) + amt));
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function hexTint(key, a = 0.2) {
  const n = parseInt(hueHex(key).slice(1), 16);
  return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`;
}

function escapeHtml(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function escapeAttr(s) { return String(s ?? '').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
function reducedMotion() { return matchMedia('(prefers-reduced-motion:reduce)').matches; }

/* ---------- feedback ---------- */
let _toastTimer = null;
function toast(msg, ms = 2800) {
  const t = document.getElementById('toast');
  t.innerHTML = msg; t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}
function fireConfetti() {
  if (reducedMotion()) return;
  const c = document.getElementById('confetti'); const cols = Object.values(PALETTE);
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('i'); p.style.left = Math.random() * 100 + 'vw';
    p.style.background = cols[i % cols.length]; p.style.animationDuration = (1.4 + Math.random() * 1.4) + 's';
    p.style.animationDelay = (Math.random() * .3) + 's'; p.style.transform = `rotate(${Math.random() * 360}deg)`;
    c.appendChild(p); setTimeout(() => p.remove(), 3200);
  }
}
/* small scoped burst; x/y in vw/vh (default centre) */
function sparkle(x = 50, y = 40) {
  if (reducedMotion()) return;
  const c = document.getElementById('confetti'); const cols = [PALETTE.mint, PALETTE.sun, PALETTE.teal];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('i'); p.style.left = (x - 15 + Math.random() * 30) + 'vw'; p.style.top = y + 'vh';
    p.style.background = cols[i % cols.length]; p.style.animationDuration = (1 + Math.random()) + 's';
    p.style.transform = `rotate(${Math.random() * 360}deg)`;
    c.appendChild(p); setTimeout(() => p.remove(), 2200);
  }
}
function announce(msg, assertive) { document.getElementById(assertive ? 'alertlive' : 'live').textContent = msg; }

/* ---------- focus-trapped sheet (dialog) ---------- */
let _lastFocused = null, _trapHandler = null;
function openSheet(contentEl, label, opts = {}) {
  const scrim = document.getElementById('scrim');
  _lastFocused = document.activeElement;
  scrim.innerHTML = '';
  const sheet = document.createElement('div');
  sheet.className = 'sheet' + (opts.wide ? ' wide' : '');
  sheet.setAttribute('role', 'dialog'); sheet.setAttribute('aria-modal', 'true');
  sheet.setAttribute('aria-label', label || 'Dialog'); sheet.style.position = 'relative';
  sheet.appendChild(contentEl);
  scrim.appendChild(sheet); scrim.hidden = false;
  scrim.onclick = e => { if (e.target === scrim) closeSheet(); };
  const focusables = () => sheet.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"]),[contenteditable="true"]');
  setTimeout(() => { const f = focusables(); if (f.length) f[0].focus(); }, 40);
  _trapHandler = e => {
    if (e.key === 'Escape') { closeSheet(); return; }
    if (e.key !== 'Tab') return;
    const f = focusables(); if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };
  document.addEventListener('keydown', _trapHandler);
  return sheet;
}
function closeSheet() {
  const scrim = document.getElementById('scrim');
  scrim.hidden = true; scrim.innerHTML = '';
  if (_trapHandler) { document.removeEventListener('keydown', _trapHandler); _trapHandler = null; }
  if (_lastFocused && _lastFocused.focus) { try { _lastFocused.focus(); } catch (e) { /* gone */ } }
}
function sheetOpen() { return document.getElementById('scrim').hidden === false; }

/* ---------- routing ----------
   Routes are hashes: #projects, #cast, #cast/teams, #access, #blueprint,
   #office/<projectId>[/<sub>], #gallery[/<section>]. go() only changes the
   hash; app.js listens and renders. */
function go(route) {
  const h = '#' + String(route).replace(/^#/, '');
  if (location.hash === h) window.dispatchEvent(new HashChangeEvent('hashchange'));
  else location.hash = h;
}
function currentRoute() { return location.hash.replace(/^#/, '') || 'projects'; }

</script>
<script data-module="js/hero.js">
"use strict";
/* ============================================================
   hero.js — Character system v3 (spec-cast §1 + SYNTHESIS seam 1).
   THE way every screen draws a character.

   Public:
     hero(agent, opts) → HTMLDivElement.hero
     heroSVG(agent, opts) → string (same markup; setPose etc. still work on it)
     setPose(el, pose, {seated, props, holding}?)
     setFacing(el, facing, {dir, look}?)        animated head-first turn (250ms)
     setLook(el, {x,y} | 'viewer' | null)
     heroHeadAnchor(el) → {x, y} px inside el (crown point, for overlays)
     castOf(agent, mood, size)                  v2 shim
     POSES, FACINGS, BUILDS, HAIR, ACCESSORIES, ROLE_GEAR, HERO_SIZES,
     MOOD_TO_POSE, POSE_TEXT, MAT
   opts: size 'xs'|'sm'|'md'|'xl'|px · pose · facing 'side'|'three-quarter'|'front'
         dir 'right'|'left' · look · seated · props · holding
         'mug'|'envelope'|'paper'|'binder'|'pen'|'none' · role (override)
         captain · armband <hex> · ghost · label
   Geometry: viewBox 0 0 120 160, ground y=152, feet centred on x=60.
   Coordinate spaces: head-local (r normalised to 30), torso-local (40×42),
   hand-local (origin = hand centre, long axis up, kept upright).
   ============================================================ */

const MAT = { metal: '#c9c3dd', steel: '#8e86ad', wood: '#b9773f', paper: '#fff6e9' };
const HERO_INK = '#241a44';

const POSES = ['idle', 'walking', 'typing', 'writing', 'reading', 'carrying', 'talking', 'chilling', 'sleeping',
  'celebrating', 'needs-input', 'thinking', 'frustrated', 'waiting', 'pressing', 'waving', 'salute'];
const FACINGS = ['side', 'three-quarter', 'front'];
const BUILDS = ['hero', 'sprout', 'bruiser', 'lanky'];
const HAIR = ['none', 'tuft', 'spikes', 'swoop', 'bob', 'bun', 'curl'];
const ACCESSORIES = ['none', 'glasses', 'shades', 'monocle', 'mustache', 'bow', 'freckles', 'flower'];
const HOLDINGS = ['mug', 'envelope', 'paper', 'binder', 'pen', 'none'];
const HERO_SIZES = { xs: 48, sm: 96, md: 160, xl: 360 };
const MOOD_TO_POSE = { neutral: 'idle', idle: 'idle', working: 'typing', blocked: 'needs-input', celebrate: 'celebrating' };

/* per pose: mouth, eyes, whether the role tool shows, default hand-held item,
   rig-level desk prop, seated by default, fx overlay. Static key poses (arms,
   legs, lean…) live in hero.css as custom properties on .pose-<name>. */
const POSE_DEF = {
  idle: { mouth: 'smile', tool: 1 },
  walking: { mouth: 'smile', tool: 1 },
  typing: { mouth: 'focus', desk: 'laptop', seated: 1 },
  writing: { mouth: 'tongue', desk: 'paper', hold: 'implement' },
  reading: { mouth: 'focus', hold: 'binder' },
  carrying: { mouth: 'smile', hold: 'stack' },
  talking: { mouth: 'talk', tool: 1 },
  chilling: { mouth: 'smile', hold: 'mug', seated: 1 },
  sleeping: { mouth: 'o', eyes: 'sleep', fx: 'z' },
  celebrating: { mouth: 'grin', eyes: 'happy', tool: 1, fx: 'spark' },
  'needs-input': { mouth: 'worried', tool: 1, fx: 'bang' },
  thinking: { mouth: 'flat', tool: 1, fx: 'think' },
  frustrated: { mouth: 'wavy', eyes: 'squeeze', tool: 1 },
  waiting: { mouth: 'flat' },
  pressing: { mouth: 'focus', tool: 1 },
  waving: { mouth: 'grin', tool: 1 },
  salute: { mouth: 'smile', tool: 1 },
};
const POSE_TEXT = {
  idle: 'standing by', walking: 'walking', typing: 'writing code', writing: 'writing', reading: 'reading',
  carrying: 'carrying paperwork', talking: 'talking', chilling: 'taking a break', sleeping: 'sleeping, off shift',
  celebrating: 'celebrating', 'needs-input': 'needs your input', thinking: 'thinking', frustrated: 'fixing a failure',
  waiting: 'waiting on a teammate', pressing: 'pressing the button', waving: 'waving', salute: 'saluting',
};

/* Builds — anchors per spec-cast §1.2 */
const BUILD_DEF = {
  hero: { head: { cx: 60, cy: 52, r: 30 }, torso: { x: 40, y: 82, w: 40, h: 42 }, legW: 12, sh: 89 },
  sprout: { head: { cx: 60, cy: 64, r: 32 }, torso: { x: 41, y: 94, w: 38, h: 32 }, legW: 12, sh: 100 },
  bruiser: { head: { cx: 60, cy: 48, r: 27 }, torso: { x: 32, y: 74, w: 56, h: 48 }, legW: 15, sh: 82 },
  lanky: { head: { cx: 60, cy: 38, r: 26 }, torso: { x: 44, y: 64, w: 32, h: 52 }, legW: 10, sh: 70 },
};

let _heroSeq = 0;

/* ---------- geometry helpers ---------- */
/* map an absolute path (M L C Q S T H V Z) from torso-local 40×42 to rig coords */
function _tp(d, sx, sy, tx, ty) {
  let cmd = 'M', i = 0;
  return d.replace(/([MLCQSTHVZ])|(-?\d*\.?\d+)/g, (m, c, n) => {
    if (c) { cmd = c; i = 0; return c; }
    const v = parseFloat(n);
    let out;
    if (cmd === 'H') out = v * sx + tx;
    else if (cmd === 'V') out = v * sy + ty;
    else out = (i % 2 === 0) ? v * sx + tx : v * sy + ty;
    i++;
    return +out.toFixed(2);
  });
}
const _r = n => +n.toFixed(2);

/* ============================================================
   ROLE GEAR — {accent, sleeve, legs, look, top, outfit, headgear, tool, badge}
   ctx: {c, dark, light, hairC, accent, cloth, T(d), TC(x,y,r,attrs), MAT}
   headgear/tool/badge are authored in head-/hand-/badge-local coords.
   `top` = highest headgear point in head-local units (for the head anchor).
   ============================================================ */
const O = 'class="o"', O2 = 'class="o2"';
const ROLE_GEAR = {
  Frontend: {
    accent: 'teal', sleeve: 'cloth', top: -42, look: 'headphones, hoodie, giant pencil',

      <g class="h-trim">${x.TC(15, 20, 1.8, `fill="${x.accent}"`)}${x.TC(25, 20, 1.8, `fill="${x.accent}"`)}</g>`,
    headgear: x => `<path d="M-31 0 C-33 -50 33 -50 31 0" fill="none" stroke="${HERO_INK}" stroke-width="10" stroke-linecap="round"/>
      <path d="M-31 0 C-33 -50 33 -50 31 0" fill="none" stroke="${x.accent}" stroke-width="5" stroke-linecap="round"/>
      <path class="h-fine" d="M-22 -28 C-14 -36 -4 -38 4 -38" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
      <rect ${O} x="-40" y="-12" width="14" height="25" rx="7" fill="${x.accent}"/>
      <rect ${O} x="26" y="-12" width="14" height="25" rx="7" fill="${x.accent}"/>
      <rect class="h-fine" x="-37" y="-7" width="4" height="14" rx="2" fill="#fff" opacity=".45"/>
      <rect class="h-fine" x="29" y="-7" width="4" height="14" rx="2" fill="#fff" opacity=".45"/>`,
    tool: x => `<g transform="rotate(8)"><path ${O} fill="${x.accent}" d="M-5 -36 H5 V5 H-5Z"/>
      <path class="h-fine" d="M-1.6 -35 V4" stroke="${shade(x.accent, -40)}" stroke-width="1.2"/>
      <path ${O} fill="${MAT.wood}" d="M-5 -36 L0 -49 L5 -36Z"/>
      <path fill="${HERO_INK}" d="M-1.8 -44.2 L0 -49 L1.8 -44.2Z"/>
      <rect ${O} x="-5" y="4" width="10" height="5" fill="${MAT.metal}"/>
      <rect ${O} x="-5" y="9" width="10" height="5" rx="2.5" fill="${PALETTE.rose}"/></g>`,
    badge: () => `<path d="M-2.2 -3 L-4.6 0 L-2.2 3 M2.2 -3 L4.6 0 L2.2 3 M0.9 -3.6 L-0.9 3.6" fill="none" stroke="${HERO_INK}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`,
  },
  Backend: {
    accent: 'sky', sleeve: 'skin', legs: 'cloth', top: -38, look: 'welding goggles, overalls, cog',
    outfit: x => `<path ${O} fill="${x.cloth}" d="${x.T('M-2 25 H42 V44 H-2Z')}"/>
      <path ${O} fill="${x.cloth}" d="${x.T('M9 7 H31 V30 H9Z')}"/>
      <path ${O2} fill="${x.cloth}" d="${x.T('M3 -1 L9 -1 L13 9 L8 9Z M37 -1 L31 -1 L27 9 L32 9Z')}"/>
      <rect class="o2 h-trim" x="${_r(x.X(15))}" y="${_r(x.Y(13))}" width="${_r(10 * x.sx)}" height="${_r(8 * x.sy)}" rx="1.5" fill="${shade(x.cloth, -16)}"/>
      ${x.TC(10.5, 10, 2.2, `${O2} fill="${MAT.metal}"`)}${x.TC(29.5, 10, 2.2, `${O2} fill="${MAT.metal}"`)}`,
    headgear: x => `<path d="M-30 -10 C-20 -26 20 -26 30 -10" fill="none" stroke="${HERO_INK}" stroke-width="8" stroke-linecap="round"/>
      <path d="M-30 -10 C-20 -26 20 -26 30 -10" fill="none" stroke="${MAT.steel}" stroke-width="4" stroke-linecap="round"/>
      <rect ${O} x="-4" y="-27" width="8" height="5" rx="2" fill="${MAT.steel}"/>
      <circle ${O} cx="-11" cy="-27" r="10" fill="${MAT.metal}"/><circle ${O} cx="11" cy="-27" r="10" fill="${MAT.metal}"/>
      <circle ${O2} cx="-11" cy="-27" r="6" fill="${shade(x.accent, -30)}"/><circle ${O2} cx="11" cy="-27" r="6" fill="${shade(x.accent, -30)}"/>
      <circle cx="-13" cy="-29.5" r="2" fill="#fff" opacity=".85"/><circle cx="9" cy="-29.5" r="2" fill="#fff" opacity=".85"/>`,
    tool: () => {
      let d = ''; const cx = 0, cy = -21, ro = 18, ri = 13.5, n = 8;
      for (let i = 0; i < n * 4; i++) {
        const a = (i / (n * 4)) * Math.PI * 2 - Math.PI / 2; const rr = (i % 4 < 2) ? ro : ri;

    },
    badge: () => `<circle cx="0" cy="0" r="2.6" fill="none" stroke="${HERO_INK}" stroke-width="1.5"/><path d="M0 -4.6 V-3 M0 3 V4.6 M-4.6 0 H-3 M3 0 H4.6 M-3.2 -3.2 L-2.2 -2.2 M2.2 2.2 L3.2 3.2 M3.2 -3.2 L2.2 -2.2 M-2.2 2.2 L-3.2 3.2" stroke="${HERO_INK}" stroke-width="1.5" stroke-linecap="round"/>`,

  Design: {

      <path class="o2 h-trim" fill="none" d="${x.T('M8 30 H30')}"/>`,
    headgear: x => `<path ${O} fill="${x.cloth}" d="M-29 -14 C-34 -34 -6 -46 16 -42 C36 -38 46 -26 41 -15 C36 -10 22 -12 8 -12 C-6 -12 -20 -8 -29 -14Z"/>
      <path class="h-fine" d="M-20 -30 C-10 -38 4 -40 12 -39" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".35"/>
      <path ${O} fill="${x.cloth}" d="M4 -43 C3 -49 9 -51 10 -46 Z"/>`,
    tool: x => `<path ${O} fill="${MAT.wood}" d="M7 -6 L14 -50 L18 -49 L11 -5Z"/>
      <path ${O} fill="${x.accent}" d="M14 -50 C13 -56 15 -60 17 -61 C19 -58 19 -53 18 -49Z"/>

/* ---------- hair (head-local; colour = shade(c,-45)) — {back, front} ---------- */
function _hair(name, hc) {
  const f = (d, extra = '') => `<path ${O} fill="${hc}" d="${d}" ${extra}/>`;
  const side = f('M-29 -6 C-32 -14 -28 -20 -24 -22 C-26 -14 -26 -8 -24 -2Z') + f('M29 -6 C32 -14 28 -20 24 -22 C26 -14 26 -8 24 -2Z');
  switch (name) {
    case 'tuft': return { back: '', front: side + f('M-4 -28 C-10 -40 2 -46 8 -38 C3 -40 0 -36 3 -29Z') + f('M2 -29 C6 -36 14 -36 14 -30 C10 -32 7 -31 6 -28Z') };
    case 'spikes': return { back: '', front: f('M-28 -10 L-27 -27 L-17 -22 L-12 -40 L-3 -27 L5 -44 L11 -27 L22 -36 L22 -21 L30 -22 L28 -10 C18 -20 -18 -20 -28 -10Z') };
    case 'swoop': return { back: '', front: f('M-29 -4 C-33 -28 -12 -38 6 -36 C22 -34 32 -22 30 -6 C26 -16 18 -21 6 -20 C10 -16 10 -12 8 -10 C-2 -18 -18 -14 -29 -4Z') + `<path class="h-fine" d="M-16 -26 C-6 -32 8 -32 18 -26" fill="none" stroke="${shade(hc, 40)}" stroke-width="1.6" stroke-linecap="round"/>` };
    case 'bob': return { back: f('M-34 14 C-38 -20 -22 -36 0 -36 C22 -36 38 -20 34 14 C30 18 24 18 22 14 L-22 14 C-24 18 -30 18 -34 14Z'),
      front: f('M-29 -2 C-30 -28 30 -28 29 -2 C24 -12 14 -14 4 -12 C-6 -14 -20 -14 -29 -2Z') + `<path class="h-fine" d="M-12 -24 C-4 -28 6 -28 14 -24" fill="none" stroke="${shade(hc, 40)}" stroke-width="1.6" stroke-linecap="round"/>` };
    case 'bun': return { back: `<circle ${O} cx="0" cy="-35" r="10" fill="${hc}"/><path ${O2} fill="${shade(hc, 30)}" d="M-7 -28 C-3 -26 3 -26 7 -28 L6 -25 C2 -23 -2 -23 -6 -25Z"/>`,
      front: side + f('M-28 -8 C-30 -28 30 -28 28 -8 C20 -18 6 -20 0 -18 C-8 -20 -20 -18 -28 -8Z') };
    case 'curl': return { back: '', front: side + [[-22, -18, 7], [-14, -26, 7.5], [-4, -30, 7.5], [7, -29, 7.5], [17, -24, 7], [24, -15, 6]].map(([x, y, r]) => `<circle ${O} cx="${x}" cy="${y}" r="${r}" fill="${hc}"/>`).join('') +
      `<path class="h-fine" d="M-15 -27 a3 3 0 1 1 3 3 M5 -30 a3 3 0 1 1 3 3" fill="none" stroke="${shade(hc, 40)}" stroke-width="1.3"/>` };
    default: return { back: '', front: '' };
  }
}

function hero(agent, opts = {}) {

/* recover state for elements made from heroSVG strings */
function _state(el) {

    const d = el.dataset;

      opts: { size: parseFloat(el.style.getPropertyValue('--hpx')) || 96, pose: POSES.find(p => el.classList.contains('pose-' + p)) || 'idle',
        facing: el.classList.contains('face-front') ? 'front' : el.classList.contains('face-side') ? 'side' : 'three-quarter',

  opts.pose = POSES.includes(pose) ? pose : 'idle';

  const pd = POSE_DEF[opts.pose]; const seated = _seatedFor(opts.pose, opts);
  POSES.forEach(p => el.classList.remove('pose-' + p));

  el.classList.toggle('moving', !!opts.moving);

  const hp = el.querySelector('.h-prop'); if (hp) hp.innerHTML = hold ? _handProp(hold, x) : '';
  const dk = el.querySelector('.h-desk'); if (dk) dk.innerHTML = opts.props === false ? '' : _deskProp(pd.desk, x.g);
  el.style.setProperty('--head-y', _r(_anchorY(x, seated) / 160 * 100) + '%');

/* THE turn transition: head (face/eyes) turns in 250ms, arms follow 80ms later (CSS) */
function setFacing(el, facing, o = {}) {
  if (!el) return;

}
function setLook(el, look) {
  if (!el) return;
  if (look == null) { el.style.removeProperty('--lx'); el.style.removeProperty('--ly'); return el; }
  const l = look === 'viewer' ? { x: 0, y: 0 } : look;

}

/* v2 shim */
function castOf(agent, mood, size) { return hero(agent, { size: size ? parseFloat(size) : 'sm', pose: MOOD_TO_POSE[mood] || 'idle' }); }

</script>

function roleOn(team, agentId) {

/* ---- team invariants (spec-teams §3.1): captain ∈ members, ≤6, no dupes ---- */
const TEAM_MAX = 6;
function setCaptain(team, agentId) {

}
function addMember(team, agentId, role = null, instr = '') {
  if (memberOf(team, agentId) || team.members.length >= TEAM_MAX || !agentById(agentId)) return false;

}
/* returns the removed member record (for Undo) or null */
function removeMember(team, agentId) {
  const i = team.members.findIndex(m => m.agent === agentId); if (i < 0) return null;

  return { rec, index: i };

      <button type="button" class="zp-link sq-reset" hidden></button></section>
    <section class="zp-sec"><h3 class="zp-label"><label for="sqJob">Job on this team</label></h3>
      <textarea class="zp-area" id="sqJob" rows="4" placeholder="What is ${escapeAttr(first)}’s job on this crew?"></textarea>
      <p class="zp-hint-line">${escapeHtml(first)} runs with: their own brain <span aria-hidden="true">▸</span> the team rules <span aria-hidden="true">▸</span> this job.</p></section>
    <div class="sq-mactions"></div>
  </div>`;
  const $ = s => p.querySelector(s);
  const saved = () => { if (t.id) cxSaved(p); };
  const paintHead = () => { const f = $('.sq-mfig'); f.innerHTML = ''; f.appendChild(hero(a, { size: 72, facing: 'front', role: m.role || undefined, captain: t.captain === a.id, armband: t.captain === a.id ? teamHex(t) : null })); };
  paintHead();
  $('.zp-crumb').onclick = () => _backToTeam(z);

  const reset = $('.sq-reset');
  const paintReset = () => { reset.hidden = !m.role; reset.innerHTML = `↺ Use cast role (${escapeHtml(a.role)})`; };
  const applyRole = r => {
    m.role = r === a.role ? null : r;
    const b = z.querySelector(`.sq-m[data-id="${a.id}"]`);
    if (b) {
      const isCap = t.captain === a.id; const old = b.querySelector('.hero');
      cxCostume(old, () => hero(a, { size: parseFloat(old.style.getPropertyValue('--hpx')), facing: 'front', role: m.role || undefined, captain: isCap, armband: isCap ? teamHex(t) : null }));
      const pl = b.querySelector('.sq-plate span'); if (pl) pl.innerHTML = `${isCap ? `${STAR} Captain · ` : ''}${escapeHtml(r)}`;
      b.setAttribute('aria-label', `${a.name}, ${r}${isCap ? ', Captain' : ''}. Edit on this team`);
    }
    paintHead(); paintReset(); saved();
    announce(`${a.name}’s role on ${t.name || 'this team'}: ${r}`);
  };
  const tiles = roleTiles(a, m.role || a.role, applyRole, { label: 'Role on this team', castRole: a.role });
  $('.sq-mrole').insertBefore(tiles, reset);
  paintReset();
  reset.onclick = () => { tiles.set(a.role); applyRole(a.role); };

  const job = $('#sqJob'); job.value = m.instr || '';
  job.addEventListener('input', () => { m.instr = job.value; clearTimeout(job.t); job.t = setTimeout(saved, 350); });

  const acts = $('.sq-mactions');
  const paintActs = () => {
    const isCap = t.captain === a.id;
    acts.innerHTML = (isCap ? `<span class="sq-capbadge">${STAR} Captain of this crew</span>` : `<button type="button" class="btn-team sq-mkcap">${STAR} Make captain</button>`)
      + '<button type="button" class="zp-link danger sq-remove">Remove from team</button>';
    const mk = acts.querySelector('.sq-mkcap'); if (mk) mk.onclick = () => { _makeCaptain(z, a.id); paintActs(); paintHead(); acts.querySelector('.sq-capbadge')?.setAttribute('tabindex', '-1'); acts.querySelector('.sq-capbadge')?.focus(); };
    acts.querySelector('.sq-remove').onclick = () => _removeFromCrew(z, a.id);

  setTimeout(() => p.querySelector('#sqMember').focus(), 30);
}
function _backToTeam(z) {
  const id = SQ.sel;
  _panelTeam(z, { drill: true });
  const row = [...z.querySelectorAll('.sq-row')].find(b => b.getAttribute('aria-label').startsWith((agentById(id) || {}).name + ','));
  (row || z.querySelector('#sqTitle')).focus();
}

function _makeCaptain(z, id) {
  const t = SQ.team; if (t.captain === id) return;
  const before = _formationRects(z);
  setCaptain(t, id);
  _renderFormation(z, { before });
  _captainCheer(z, id);
}
function _captainCheer(z, id) {
  const t = SQ.team; const a = agentById(id);
  announce(`${a.name} is now captain of ${t.name || 'the new team'}.`);
  if (reducedMotion()) return;
  setTimeout(() => {
    const b = z.querySelector(`.sq-m[data-id="${id}"]`); if (!b) return;
    const r = b.getBoundingClientRect();
    sparkle((r.left + r.width / 2) / innerWidth * 100, (r.top + r.height * 0.35) / innerHeight * 100);
    z.querySelectorAll('.sq-m[data-id] .hero').forEach(h => { setPose(h, 'celebrating'); setTimeout(() => h.isConnected && setPose(h, 'idle'), 900); });
  }, 460);
}

function _removeFromCrew(z, id) {
  const t = SQ.team; const a = agentById(id);
  const wasCap = t.captain === id;
  const b = z.querySelector(`.sq-m[data-id="${id}"]`);
  const finish = () => {
    const before = _formationRects(z);
    const res = removeMember(t, id); if (!res) return;
    SQ.sel = null;
    _renderFormation(z, { before });
    _panelTeam(z, { drill: true });
    z.querySelector('#sqTitle').focus();
    const promoted = wasCap && t.captain ? agentById(t.captain) : null;
    if (promoted) _captainCheer(z, t.captain);
    announce(`${a.name} left the crew.${promoted ? ` ${promoted.name} is now captain.` : ''}`);
    toast(`${escapeHtml(a.name)} left the crew <button type="button" class="toast-undo">Undo</button>`, 6000);
    const u = document.querySelector('#toast .toast-undo');
    if (u) u.onclick = () => {
      if (memberOf(t, id) || t.members.length >= TEAM_MAX) return;
      t.members.splice(res.index, 0, res.rec); if (wasCap) t.captain = id;
      document.getElementById('toast').classList.remove('show');
      announce(`${a.name} is back on ${t.name}.`);
      _refreshTeamViews(t);
    };
  };
  if (!b || reducedMotion()) { finish(); return; }
  const h = b.querySelector('.hero');
  b.classList.remove('sel'); setPose(h, 'waving'); setFacing(h, 'front');
  setTimeout(() => {
    setPose(h, 'walking'); setFacing(h, 'side', { dir: 'right' });
    const st = z.querySelector('.sq-stage').getBoundingClientRect(); const r = b.getBoundingClientRect();
    cxAfter(b.animate([{ transform: 'none', opacity: 1 }, { transform: `translateX(${st.right - r.left + 40}px)`, opacity: 0 }], { duration: 520, easing: 'ease-in', fill: 'forwards' }), finish);
  }, 380);
}
/* after Undo, refresh whatever view shows this team */
function _refreshTeamViews(t) {
  const z = document.querySelector('#scene-cast .zoom-squad');
  if (z && SQ.team === t) { _renderFormation(z); if (!SQ.sel) _panelTeam(z); return; }
  const host = document.querySelector('#scene-cast #castBody');
  if (host && CAST.tab === 'teams' && !z) renderTeams(host);
}
function _deleteTeam(t) {
  const i = TEAMS.indexOf(t); if (i < 0) return;
  TEAMS.splice(i, 1);
  go('cast/teams');
  announce(`${t.name} deleted. Agents stay in your cast.`);
  setTimeout(() => {
    toast(`${escapeHtml(t.name)} deleted <button type="button" class="toast-undo">Undo</button>`, 6000);
    const u = document.querySelector('#toast .toast-undo');
    if (u) u.onclick = () => {
      if (!TEAMS.includes(t)) TEAMS.splice(Math.min(i, TEAMS.length), 0, t);
      document.getElementById('toast').classList.remove('show');
      announce(`${t.name} restored.`); _refreshTeamViews(t);
    };
  }, 60);
}
/* a draft becomes a real team once it has a name and one member */
function _commitDraft(z) {
  const t = SQ.team;
  if (!SQ.draft || t.id || !t.name.trim() || !t.members.length) return false;
  t.id = 't-' + t.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 16) + '-' + Date.now().toString(36).slice(-4);
  TEAMS.push(t); SQ.draft = null; SQ.id = t.id;
  history.replaceState(null, '', '#cast/teams/' + t.id); APP.sub = 'teams/' + t.id;
  const k = z.querySelector('.zp-kicker'); if (k) k.textContent = 'Team';
  fireConfetti();
  announce(`${t.name} is official.`);
  const del = z.querySelector('.zp-scroll');
  if (del && !z.querySelector('.sq-del') && !SQ.sel) {
    del.insertAdjacentHTML('beforeend', '<div class="sq-danger"><button type="button" class="zp-link danger sq-del">Delete team</button></div>');
    del.querySelector('.sq-del').onclick = () => _deleteTeam(t);
  }
  return true;
}

/* ============================================================
   Add to crew — the lineup strip rising from the stage floor
   ============================================================ */
function _openStrip(z) {
  const t = SQ.team;
  if (t.members.length >= TEAM_MAX) { announce(`Crew full — ${TEAM_MAX} is the max. The director can call more than one team.`); return; }
  if (SQ.sel) _panelTeam(z, { drill: true });
  SQ.strip = true;
  const strip = z.querySelector('.sq-strip'); strip.hidden = false;
  z.querySelector('.sq-stage').classList.add('strip-open');
  z.querySelector('.sq-floorbar').hidden = true;
  _paintStrip(z);
  setTimeout(() => strip.querySelector('.sq-cand,.sq-strip-done')?.focus(), 60);
}
function _paintStrip(z) {
  const t = SQ.team; const strip = z.querySelector('.sq-strip');
  const cands = AGENTS.filter(a => !memberOf(t, a.id));
  strip.innerHTML = `<div class="sq-strip-head"><b>Who joins the crew?</b><span>${t.members.length}/${TEAM_MAX} · max ${TEAM_MAX} per crew</span>
      <button type="button" class="btn-glass sq-strip-done">Done</button></div>
    <div class="sq-strip-list" role="list"></div>`;
  const list = strip.querySelector('.sq-strip-list');
  if (!cands.length) list.innerHTML = '<p class="zp-empty">Everyone in the cast is already on this crew.</p>';
  cands.forEach(a => {
    const li = _tEl('div', 'sq-cand-li'); li.setAttribute('role', 'listitem');
    const b = _tEl('button', 'sq-cand'); b.type = 'button'; b.dataset.id = a.id;
    b.setAttribute('aria-label', `Add ${a.name}, ${a.role}`);
    b.innerHTML = `<span class="sq-cand-fig"></span><b>${escapeHtml(a.name)}</b><span>${escapeHtml(a.role)}</span>`;
    b.querySelector('.sq-cand-fig').appendChild(hero(a, { size: 'sm', facing: 'front' }));
    b.addEventListener('mouseenter', () => cxHop(b.querySelector('.hero')));
    b.onclick = e => { e.stopPropagation(); _addFromStrip(z, a.id, b); };
    li.appendChild(b); list.appendChild(li);
  });
  strip.querySelector('.sq-strip-done').onclick = e => { e.stopPropagation(); _closeStrip(); };
}
function _addFromStrip(z, id, candBtn) {
  const t = SQ.team; const a = agentById(id);
  const from = candBtn.querySelector('.hero').getBoundingClientRect();
  const first = !t.members.length;
  if (!addMember(t, id)) return;
  const before = _formationRects(z);
  _renderFormation(z, { before, walkIn: id, walkFrom: from });
  if (!SQ.sel) _crewList(z, z.querySelector('.z-panel'));
  const next = candBtn.parentElement.nextElementSibling || candBtn.parentElement.previousElementSibling;
  candBtn.parentElement.remove();
  z.querySelector('.sq-strip-head span').textContent = `${t.members.length}/${TEAM_MAX} · max ${TEAM_MAX} per crew`;
  announce(`${a.name} joined ${t.name || 'the crew'}. ${t.members.length} of ${TEAM_MAX}.`);
  if (first) _captainCheer(z, id);
  if (_commitDraft(z)) { /* team birth: confetti fired in commit */ }
  else if (t.id) cxSaved(z.querySelector('.z-panel'));
  if (t.members.length >= TEAM_MAX) {
    _closeStrip();
    toast('Crew full — the director can call more than one team.');
    return;
  }
  (next && next.querySelector('.sq-cand') || z.querySelector('.sq-strip-done')).focus();
}
function _closeStrip(silent) {
  const z = document.querySelector('#scene-cast .zoom-squad'); if (!z) return;
  SQ.strip = false;
  z.querySelector('.sq-strip').hidden = true;
  z.querySelector('.sq-stage').classList.remove('strip-open');
  _floorBar(z);
  if (!silent) (z.querySelector('.sq-add') || z.querySelector('#sqTitle')).focus();
}

/* squad keyboard: Esc backs out one level (picker → strip → member → team → list) */
document.addEventListener('keydown', e => {
  if (APP.view !== 'studio' || APP.stage !== 'cast') return;
  const z = document.querySelector('#scene-cast .zoom-squad'); if (!z) return;
  if (e.key === 'Tab') { cxTrap(e, z); return; }
  if (e.key !== 'Escape') return;
  e.preventDefault();
  const pk = z.querySelector('.sq-picker:not([hidden])');
  if (pk) { const p = z.querySelector('.z-panel'); pk.hidden = true; _paintMark(z, SQ.team); const b = p.querySelector('.sq-em-btn'); b.setAttribute('aria-expanded', 'false'); b.focus(); return; }
  if (SQ.strip) { _closeStrip(); return; }
  if (SQ.sel) { _backToTeam(z); return; }
  go('cast/teams');
});

</script>
<script data-module="js/office-theme.js">
"use strict";
/* ============================================================
   office-theme.js — the Office's ART (spec-office §1). Pure drawing:
   knows what a couch looks like, never what an agent is doing.
   Swappable: another theme supplies the same functions + THEME anchors.

   Public (attached to THEME_OFFICE):
     art(ctx)               → SVG string, the dollhouse room (viewBox 0 -70 1600 1000)
                              ctx = { pods:[{id, team}] }  (team-coloured rugs)
     sync(svgRoot, ws)      → updates live bits: clock hand, whiteboard, dossier
                              thickness, outbox flag, poster grades, pennants
     desk(kind, o)          → SVG string of one desk (local coords, origin = seat)
     chair(hue, o)          → SVG string of the chair behind a seat
     couchFront()           → SVG string of the couch's front cushions (occludes sleepers)
     flag(team)             → SVG string of a pod's flag pole (emblem added by engine)
     glyph(name, hue)       → monitor screen content (32×26 box)
     deskSync(el, s)        → update a desk element: glyph, lamp, pile, jacket, stamp, tray

   ============================================================ */

const OT_INK = '#241a44';
const OT = {
  wall: '#f6e2c6', wallHi: '#fbeedb', wallLo: '#ecd0ad', stripe: '#f0d7b6',
  wains: '#93c4b0', wainsLo: '#7db29d', rail: '#b9773f', base: '#7a4b2c',
  floor: '#d9a46b', floorLo: '#c48a51', seam: '#b97d45', plank: '#e4b47c',
  wood: '#c98a50', woodLo: '#a96d3a', woodHi: '#e8b77f', metal: '#c9c3dd', steel: '#8e86ad',
  paper: '#fff6e9', glass: '#bfe6ff', screen: '#1d1638', bezel: '#3a2f5c',
  boss: '#ffe0a3', bossStripe: '#ffd27f', carpet: '#e9b38a',
};
const _o = (w = 3) => `stroke="${OT_INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
/* gentle one-point perspective for things on the floor: x drifts outward as y nears */
const _otP = (x, y) => 800 + (x - 800) * (0.9 + 0.1 * (y - 380) / 520);

    <linearGradient id="otSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a4bb0"/><stop offset=".55" stop-color="#c77bb7"/><stop offset="1" stop-color="#ffb487"/></linearGradient>

    <pattern id="otBossPaper" width="36" height="36" patternUnits="userSpaceOnUse"><rect width="18" height="36" fill="${OT.bossStripe}" opacity=".55"/></pattern>
    <pattern id="otKnit" width="14" height="10" patternUnits="userSpaceOnUse"><path d="M0 5 L7 0 L14 5 M0 10 L7 5 L14 10" fill="none" stroke="#000" stroke-opacity=".07" stroke-width="2"/></pattern>

function _otShell() {

  <ellipse cx="930" cy="560" rx="340" ry="110" fill="url(#otPool)"/>
  <ellipse cx="760" cy="800" rx="420" ry="110" fill="url(#otPool)" opacity=".8"/>
  <ellipse cx="1290" cy="790" rx="320" ry="100" fill="url(#otPool)" opacity=".8"/>`;
}

function _otCut() {

  <path d="M-12 -70 H1612 V-36 H-12Z" fill="#4b3570"/>
  <path d="M-12 -46 H1612" stroke="#6a4c94" stroke-width="5"/>
  <path d="M-12 -40 H1612" stroke="${OT_INK}" stroke-width="3"/>

}

function _otDoor() {
  return `<g id="otDoor">
    <rect x="22" y="132" width="144" height="252" rx="4" fill="${OT.woodLo}" ${_o()}/>
    <rect x="34" y="144" width="120" height="236" fill="#3b2d5e"/>
    <g id="otDoorOpen" style="display:none">
      <path d="M34 144 H154 V380 H34Z" fill="#ffe9b0"/>

      <rect x="34" y="144" width="120" height="236" fill="${OT.wood}" ${_o(2.5)}/>
      <rect x="50" y="160" width="88" height="58" rx="5" fill="${OT.glass}" ${_o(2.5)}/>
      <path d="M62 170 L78 208 M84 168 L96 196" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7"/>
      <rect x="50" y="236" width="88" height="56" rx="5" fill="none" stroke="${OT.woodLo}" stroke-width="3"/>
      <rect x="50" y="304" width="88" height="62" rx="5" fill="none" stroke="${OT.woodLo}" stroke-width="3"/>

      <rect x="64" y="176" width="60" height="24" rx="5" fill="${OT.paper}" ${_o(2)}/>
      <text x="94" y="193" text-anchor="middle" font-size="13" font-weight="900" fill="${OT_INK}">STUDIO</text>
    </g>
    <!-- "days since" sign -->
    <g transform="translate(28 66) rotate(-2)">
      <rect width="132" height="52" rx="6" fill="${OT.paper}" ${_o(2.5)}/>

function _otRug(r, hue, opts = {}) {
  const c = hueHex(hue); const y1 = r.y, y2 = r.y + r.h;
  const pts = `M${_otP(r.x, y1)} ${y1} H${_otP(r.x + r.w, y1)} L${_otP(r.x + r.w, y2)} ${y2} H${_otP(r.x, y2)}Z`;
  const inset = 14;
  const ipts = `M${_otP(r.x + inset, y1 + 10)} ${y1 + 10} H${_otP(r.x + r.w - inset, y1 + 10)} L${_otP(r.x + r.w - inset, y2 - 10)} ${y2 - 10} H${_otP(r.x + inset, y2 - 10)}Z`;
  return `<g class="ot-rug">
    <path d="${pts}" fill="${opts.neutral ? '#cbbfe4' : shade(c, 20)}" ${_o(2.5)}/>
    <path d="${ipts}" fill="none" stroke="${opts.neutral ? '#a99bd0' : shade(c, -18)}" stroke-width="4" stroke-dasharray="${opts.neutral ? '0' : '14 8'}"/>
    <path d="${pts}" fill="url(#otKnit)"/>
    ${opts.neutral ? '' : Array.from({ length: Math.floor(r.w / 26) }, (_, i) => `<path d="M${_otP(r.x + 10 + i * 26, y2)} ${y2} v8" stroke="${shade(c, -10)}" stroke-width="3" stroke-linecap="round"/>`).join('')}
  </g>`;
}

/* ---------------------------------------------------------------- live bits */
const _GRADE = { A: ['excellent', PALETTE.mint], B: ['good', PALETTE.sun], C: ['needs care', PALETTE.coral] };
function _otSync(root, ws) {
  if (!root) return;
  const $ = id => root.querySelector('#' + id);
  const pct = ws.overall;
  /* clock: the hand IS progress */
  const a = pct * 3.6;
  $('clockHand').setAttribute('transform', `rotate(${a})`);
  const rad = (a - 90) * Math.PI / 180, large = a > 180 ? 1 : 0;
  $('clockArc').setAttribute('d', pct <= 0 ? '' : `M0 0 L0 -30 A30 30 0 ${large} 1 ${(Math.cos(rad) * 30).toFixed(2)} ${(Math.sin(rad) * 30).toFixed(2)}Z`);
  $('clockLbl').textContent = `${pct}% → ${ws.target}`;
  /* whiteboard */
  $('wbPct').textContent = pct + '%';
  $('wbTarget').textContent = ws.target;
  $('wbRing').setAttribute('stroke-dasharray', `${(277 * pct / 100).toFixed(1)} 277`);
  const now = ws.features.filter(f => f.status === 'now').slice(0, 3);
  $('wbBars').innerHTML = now.map((f, i) => {
    const y = 132 + i * 50; const w = 160 * f.pct / 100;
    const col = f.blocked ? PALETTE.coral : i === 0 ? PALETTE.teal : i === 1 ? PALETTE.sky : PALETTE.mint;
    return `<text x="382" y="${y - 8}" font-size="12.5" font-weight="900" fill="${OT_INK}">${escapeHtml(f.name.split(' ')[0])}${f.blocked ? ' !' : ''}</text>
      <rect x="382" y="${y}" width="164" height="14" rx="7" fill="none" stroke="${OT_INK}" stroke-width="2"/>
      <rect x="384" y="${y + 2}" width="${Math.max(0, w).toFixed(1)}" height="10" rx="5" fill="${col}"/>
      <path d="M${(384 + w).toFixed(1)} ${y + 3} l0 8" stroke="${OT_INK}" stroke-width="1.5" opacity=".4"/>`;
  }).join('');
  const items = ws.checklist.slice(-7);
  $('wbList').innerHTML = items.map((k, i) => {
    const y = 122 + i * 22; const len = 60 + ((k.text.length * 7) % 60);
    return `<rect x="584" y="${y - 9}" width="12" height="12" rx="2" fill="none" stroke="${OT_INK}" stroke-width="2"/>
      ${k.done ? `<path class="wb-tick" d="M585 ${y - 3} l4 5 9 -12" stroke="${PALETTE.mint}" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
      <path d="M604 ${y - 3} q${len / 4} -4 ${len / 2} 0 t${len / 2} 0" stroke="${k.done ? '#b8b2cc' : OT_INK}" stroke-width="3" fill="none" stroke-linecap="round" opacity="${k.done ? .8 : .75}"/>
      ${k.done ? `<path d="M602 ${y - 3} h${len + 4}" stroke="#b8b2cc" stroke-width="2"/>` : ''}`;
  }).join('');
  /* dossier thickens as features ship */
  const shipped = ws.features.filter(f => f.status === 'shipped').length;
  const planned = ws.features.filter(f => f.status === 'planned').length;
  const pages = Math.min(6, Math.max(1, Math.round(shipped / 1.5)));
  $('dosPages').innerHTML = Array.from({ length: pages }, (_, i) => `<path d="M${6 + i * 2} ${26 - i * 3} H${62 + i * 1.5} V${96 - i * 1} H${6 + i * 2}Z" fill="${OT.paper}" stroke="${OT_INK}" stroke-width="1.6" transform="rotate(${(i % 2 ? 2 : -2)} 34 60)"/>`).join('');
  $('dosCount').textContent = `${shipped} ✓ · ${planned} ○`;
  /* outbox flag up = fresh pushes */
  $('outFlag').classList.toggle('up', !!ws.github.fresh);
  $('outFlag').setAttribute('transform', `translate(62 70)${ws.github.fresh ? '' : ' rotate(90)'}`);
  /* poster stamps: letter + word + colour */
  $('otGrades').innerHTML = Object.entries(ws.checkup.vitals).map(([k, g], i) => {
    const [word, col] = _GRADE[g] || _GRADE.B; const y = 50 + i * 24;
    return `<circle cx="22" cy="${y}" r="10" fill="${col}" stroke="${OT_INK}" stroke-width="2"/>
      <text x="22" y="${y + 4.5}" text-anchor="middle" font-size="13" font-weight="900" fill="${OT_INK}">${g}</text>
      <text x="37" y="${y - 1}" font-size="8" font-weight="900" fill="${OT_INK}">${k}</text>
      <text x="37" y="${y + 8}" font-size="6.5" font-weight="800" fill="#5b5280">${word}</text>`;
  }).join('');
}
function _otDoorState(root, open) {
  if (!root) return;
  root.querySelector('#otDoorOpen').style.display = open ? '' : 'none';
  root.querySelector('#otDoorLeaf').style.display = open ? 'none' : '';
}

/* monitor glyphs, box 0..32 × 0..26 — abstract activity, never text */

    case 'read': return `<g class="g-read"><rect x="7" y="2" width="18" height="22" rx="1.5" fill="${OT.paper}"/>${[6, 10, 14, 18].map(y => `<rect x="10" y="${y}" width="${y % 8 ? 12 : 9}" height="1.8" fill="#a9a2c4"/>`).join('')}</g>`;
    case 'caret': return `<rect class="g-caret" x="9" y="9" width="2.5" height="9" fill="${OT.paper}"/><rect x="14" y="12" width="9" height="2" rx="1" fill="#5b5280"/>`;

    case 'red': return `${[0, 1, 2, 3, 4].map(i => `<circle cx="${5 + i * 5.5}" cy="9" r="2.2" fill="${i === 1 || i === 3 ? PALETTE.coral : PALETTE.mint}"/>`).join('')}<path d="M12 15 l7 7 m0 -7 l-7 7" stroke="${PALETTE.coral}" stroke-width="3" stroke-linecap="round"/>`;
    case 'pause': return `<rect x="10" y="6" width="4" height="14" rx="1" fill="${PALETTE.sun}"/><rect x="18" y="6" width="4" height="14" rx="1" fill="${PALETTE.sun}"/>`;
    case 'hourglass': return `<path d="M10 4 H22 L16 13 L22 22 H10 L16 13Z" fill="none" stroke="${PALETTE.sun}" stroke-width="2.2" stroke-linejoin="round"/><path d="M13 20 H19 L16 16Z" fill="${PALETTE.sun}"/>`;
    case 'diff': return `<rect x="3" y="3" width="12" height="20" rx="1" fill="#3a2f5c"/><rect x="17" y="3" width="12" height="20" rx="1" fill="#3a2f5c"/>${[6, 10, 14, 18].map((y, i) => `<rect x="5" y="${y}" width="${i === 1 ? 8 : 6}" height="2" fill="${i === 1 ? PALETTE.coral : '#8e86ad'}"/><rect x="19" y="${y}" width="${i === 2 ? 8 : 7}" height="2" fill="${i === 2 ? PALETTE.mint : '#8e86ad'}"/>`).join('')}`;
    case 'emblem': return `<circle class="g-saver" cx="12" cy="11" r="6" fill="${c}"/><circle class="g-saver" cx="12" cy="11" r="2.4" fill="${OT.screen}"/>`;
    case 'check': return `<path d="M8 13 l6 6 11 -12" stroke="${PALETTE.mint}" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    case 'rocket': return `<path d="M16 3 C21 7 21 15 19 19 H13 C11 15 11 7 16 3Z" fill="${OT.paper}"/><circle cx="16" cy="11" r="2" fill="${PALETTE.sky}"/><path d="M14 20 L16 25 L18 20Z" fill="${PALETTE.sun}"/>`;
    case 'off': default: return `<path d="M3 3 L12 3 L4 14Z" fill="#fff" opacity=".07"/>`;
  }
}

<script data-module="js/office-panel.js">

  el.setAttribute('role', 'complementary');

    <button class="op-grab" type="button" aria-label="Expand chat" id="opGrab"><i></i></button>
    <header class="op-head" id="opHead"></header>
    <div class="op-wait" id="opWait" hidden></div>
    <div class="op-log" id="opLog" role="log" aria-live="polite"></div>
    <div class="op-quick" id="opQuick"></div>
    <div class="op-composer">
      <button class="mic-btn" id="opMic" type="button" aria-pressed="false"><span class="ring"></span>${OP_MIC}</button>

    const c = m.comm || {};

    el.querySelector('.op-cfrom').onclick = () => OP.open(c.from, { from: 'comm' });

    el = document.createElement('div'); el.className = 'bubble ' + (m.from === 'user' ? 'me' : 'them');
    el.innerHTML = `<span class="who">${escapeHtml(who)}</span><span class="t"></span>${m.stats ? `<span class="op-stats">${escapeHtml(m.stats)}</span>` : ''}${m.files ? `<ul class="op-files">${m.files.map(f => `<li>${escapeHtml(f)}</li>`).join('')}</ul>` : ''}`;
