OP._fmt = s => escapeHtml(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/&lt;b&gt;(.*?)&lt;\/b&gt;/g, '<b>$1</b>');

/* ------------------------------------------------------------ header + waiting row */
OP.refresh = function () {
  if (!this.el) return;
  const id = this.thread; const a = wsAgent(id); const ag = agentById(id === 'pixel' ? 'director' : id);
  const team = a.teamId ? teamById(a.teamId) : null; const act = ACTIVITY[a.activity.kind] || ACTIVITY.idle;
  const head = this.el.querySelector('#opHead');
  const key = [id, a.activity.kind, a.activity.label, a.tokens.total, a.session].join('|');
  if (head.dataset.key !== key) {
    head.dataset.key = key;
    const isCap = team && team.captain === id;
    const status = id === 'pixel' ? `<span class="op-live"><i></i>Always here</span> · ${wsTok(a.tokens.total)} tokens`
      : `${act.icon} ${escapeHtml(a.activity.kind === 'needs-input' ? 'Needs you' : a.activity.detail || a.activity.label)} · <b>${wsTok(a.tokens.total)}</b> tokens`;
    const honest = id === 'pixel' ? 'Your manager · big picture only'
      : a.session === 'asleep' ? `${escapeHtml(ag.name.split(' ')[0])} is off shift — Pixel can bring them in`
      : 'Pixel sees a summary of this chat' + (['coding', 'reading', 'testing', 'reviewing', 'planning'].includes(a.activity.kind) ? ' · still working in the background' : '');
    head.innerHTML = `<div class="op-portrait"><span class="op-spot"></span></div>
      <div class="op-who"><b>${escapeHtml(ag.name)}</b>
        <span class="op-role">${escapeHtml(ag.role)}${team ? ` · ${emblemSVG(team, 16, { decorative: true })} ${escapeHtml(team.name.replace(/^The /, ''))}` : id === 'pixel' ? '' : ' · Solo'}${isCap ? ' · ★ Captain' : ''}</span>
        <span class="op-status">${status}</span>
        <span class="op-honest">${honest}</span></div>
      ${id !== 'pixel' ? `<button type="button" class="op-backpix" id="opBack">← Pixel</button>` : ''}`;
    const portrait = hero(ag, { size: 92, pose: a.activity.kind === 'sleeping' ? 'sleeping' : id === 'pixel' ? 'talking' : a.activity.kind === 'needs-input' ? 'needs-input' : 'talking', facing: 'front',
      captain: isCap, armband: isCap ? team.color : null, props: false });
    head.querySelector('.op-portrait').appendChild(portrait);
    const b = head.querySelector('#opBack'); if (b) b.onclick = () => this.open('pixel');
    this.el.setAttribute('aria-label', 'Chat with ' + ag.name);
    const inp = this.el.querySelector('#opInput');
    inp.placeholder = `Talk or type to ${this._short(id)}…`; inp.setAttribute('aria-label', 'Message ' + ag.name);
    const mic = this.el.querySelector('#opMic'); if (this.voice === 'idle') mic.setAttribute('aria-label', 'Press to talk to ' + ag.name);
  }
  /* waiting on you */
  const w = this.el.querySelector('#opWait');
  const pend = WS.pending.filter(p => p.agentId !== id || true);
  const wkey = pend.map(p => p.id).join(',');
  if (w.dataset.key !== wkey) {
    w.dataset.key = wkey; w.hidden = !pend.length; w.innerHTML = '';
    if (pend.length) {
      w.innerHTML = '<span class="op-wl">Waiting on you</span>';
      pend.forEach(p => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'op-wface';
        b.setAttribute('aria-label', `${this._name(p.agentId)} needs you: ${p.short}`);
        b.appendChild(hero(agentById(p.agentId), { size: 46, pose: 'needs-input', facing: 'front', props: false }));
        b.insertAdjacentHTML('beforeend', `<span>${escapeHtml(this._short(p.agentId))}</span>`);
        b.onclick = () => this.open(p.agentId, { from: 'wait' });
        w.appendChild(b);
      });
    }
  }
};

/* ------------------------------------------------------------ quick replies (max 3, context-aware) */
OP._quick = function (override) {
  const q = this.el.querySelector('#opQuick'); q.innerHTML = '';
  const id = this.thread; const a = wsAgent(id);
  let chips = override;
  if (!chips) {
    if (id === 'pixel') chips = ['Show me the board', WS.pending.length ? 'Who needs me?' : 'What shipped?', 'Start Multi-currency'];
    else if (a.session === 'asleep') chips = [`Ask Pixel to wake ${this._short(id)}`];
    else if (a.activity.kind === 'needs-input') chips = ['What’s left?', 'Ask Pixel instead'];
    else if (a.activity.kind === 'idle') chips = ['What’s next?', 'Show me what changed'];
    else chips = ['What’s left?', 'Show me what changed', 'Take a break'];
  }
  chips.slice(0, 3).forEach(c => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = c;
    b.onclick = () => { q.innerHTML = ''; this._user(c, false); };
    q.appendChild(b);
  });
};

/* ------------------------------------------------------------ talking */
OP.sendTyped = function () {
  const inp = this.el.querySelector('#opInput'); const v = (inp.value || '').trim();
  if (!v) { const mb = this.el.querySelector('#opMic'); mb.classList.add('err'); setTimeout(() => mb.classList.remove('err'), 400); return; }
  inp.value = ''; this._user(v, false);
};
const OP_VOICE = {
  pixel: ['Hey Captain, how’s checkout going?', 'Pixel, show me the board.', 'Drop crypto from multi-currency.', 'Let’s start multi-currency right after checkout.'],
  agent: ['What’s left on your plate?', 'Show me what changed.'],
};
OP.toggleMic = function () {
  const mb = this.el.querySelector('#opMic'), wave = this.el.querySelector('#opWave'), inp = this.el.querySelector('#opInput');
  if (this.voice === 'idle') {
    this.voice = 'listening'; mb.setAttribute('aria-pressed', 'true'); mb.setAttribute('aria-label', 'Listening — press to stop');
    wave.classList.add('live'); inp.placeholder = 'Listening… press to stop'; announce('Listening.');
    this._lt = setTimeout(() => { if (this.voice === 'listening') this._stopMic(); }, 2400);
  } else if (this.voice === 'listening') this._stopMic();
};
OP._stopMic = function () {
  clearTimeout(this._lt);
  const mb = this.el.querySelector('#opMic'), wave = this.el.querySelector('#opWave');
  this.voice = 'idle'; mb.setAttribute('aria-pressed', 'false'); wave.classList.remove('live');
  mb.setAttribute('aria-label', 'Press to talk to ' + this._name(this.thread));
  const pool = this.thread === 'pixel' ? OP_VOICE.pixel : OP_VOICE.agent;
  const said = pool[this._voiceIdx++ % pool.length];
  announce('Heard: ' + said);
  this.refresh(); this.el.querySelector('#opHead').dataset.key = ''; this.refresh();
  this._user(said, true);
};

/* a user utterance (typed, chip, or voice). Saying a name first routes the thread. */
OP._user = function (text, voice) {
  const route = this._routeName(text);
  if (route && route.id !== this.thread) {
    this.post(this.thread, { from: 'user', kind: 'text', text, voice });
    this.open(route.id, { from: 'type' });
    OE.react(route.id, 'hop');
    this.post(route.id, { from: 'user', kind: 'text', text: route.rest || text, voice });
    this._typing(() => this._reply(route.id, route.rest || text));
    return;
  }
  this.post(this.thread, { from: 'user', kind: 'text', text, voice });
  const tid = this.thread;
  this._typing(() => this._reply(tid, text));
};
OP._routeName = function (text) {
  const m = /^\s*(?:@|hey\s+|hi\s+|ok\s+)?([a-z][a-z-]+)[\s,:]+(.*)$/i.exec(text); if (!m) return null;
  const word = m[1].toLowerCase(); if (word === 'pixel' && /^\s*(?:@|hey\s+)?pixel\b/i.test(text)) return { id: 'pixel', rest: m[2] };
  const hit = wsOnProject().find(a => { const n = agentById(a.id).name.toLowerCase(); return n.split(/[\s-]/).includes(word) && !['pixel', 'von', 'sir', 'the'].includes(word); });
  if (!hit || !(/^\s*(@|hey|hi|ok)/i.test(text))) return null;
  return { id: hit.id, rest: m[2] };
};
OP._typing = function (done) {
  const log = this.el.querySelector('#opLog');
  const b = document.createElement('div'); b.className = 'bubble them'; b.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  log.appendChild(b); log.scrollTop = log.scrollHeight;
  setTimeout(() => { b.remove(); done(); }, reducedMotion() ? 200 : 800);
};
OP._say = function (tid, text, extra = {}) { this.post(tid, Object.assign({ from: tid, kind: 'text', text, stream: true }, extra)); };

/* simulated replies — agents stay scoped to their task; big picture goes to Pixel */
OP._reply = function (tid, text) {
  const t = text.toLowerCase(); const a = wsAgent(tid);
  if (tid === 'pixel') {
    if (/^(pixel,?\s*)?(close|back|go back|back to the office)\b/.test(t)) { if (OM.layer) { this._say('pixel', 'Closing that.'); OB.escape(); } else this._say('pixel', 'You’re already in the office.'); return this._quick(); }
    const drop = /(?:drop|remove|cut|strike)\s+(.+?)\s+from\s+(?:the\s+)?(.+?)[.!?]*$/.exec(t);
    if (drop) {
      const f = WS.features.find(x => x.name.toLowerCase().includes(drop[2].trim().split(' ')[0]));
      const word = drop[1].replace(/^the\s+/, '').trim();
      const line = f && [...f.description, ...f.vision].find(l => l.text.toLowerCase().includes(word));
      if (f && line) {
        go('feature/' + f.id);
        setTimeout(() => { OB.stageStrike(f.id, line.id); }, 450);
        this._say('pixel', `Staged it — “${line.text}” is struck on the ${f.name} page. Save it?`);
        this._quick(['Save it', 'Never mind']); return;
      }
      this._say('pixel', 'I couldn’t find that line — open the feature and strike it there?'); return this._quick();
    }
    const sl = /strike (?:line )?(\d+)/.exec(t);
    if (sl && OB.sheetEl && OB.sheetEl.dataset.kind === 'feature') {
      const all = [...OB.draft.description, ...OB.draft.vision]; const l = all[+sl[1] - 1];
      if (l) { OB.stageStrike(OB.feature, l.id); this._say('pixel', `Struck line ${sl[1]} — “${l.text}”. Save it?`); this._quick(['Save it', 'Never mind']); return; }
    }
    if (/^save it/.test(t)) { if (OB.saveStaged()) this._say('pixel', 'Saved — I’ll brief whoever picks it up.'); else this._say('pixel', 'Nothing staged to save.'); return this._quick(); }
    if (/^never mind/.test(t)) { OB.discardStaged(); this._say('pixel', 'Okay — left it as it was.'); return this._quick(); }
    if (/board|whiteboard|progress|checklist/.test(t)) { this._say('pixel', 'Here’s the board — progress, the live checklist, and who’s done what.'); setTimeout(() => go('board'), 500); return this._quick(); }
    if (/feature|dossier|shipped|what shipped/.test(t)) { this._say('pixel', `${WS.features.filter(f => f.status === 'shipped').length} features shipped so far. Opening the dossier.`); setTimeout(() => go('features'), 500); return this._quick(); }
    if (/who needs|waiting/.test(t)) { const p = WS.pending[0]; this._say('pixel', p ? `${this._name(p.agentId)} — ${p.short.toLowerCase()}. Tap the “!” over their head.` : 'Nobody right now — everyone’s unblocked.'); return this._quick(); }
    if (/currenc/.test(t)) {
      this._say('pixel', 'Good call. I’ll queue Multi-currency right behind Checkout and wake Querious for the rates research.');
      this._quick(['Start it now', 'Wait for checkout', 'Show me the plan']); return;
    }
    if (/start it now/.test(t)) { this._say('pixel', 'On it — Multi-currency is in progress. Checkout stays the priority.'); const f = wsFeature('multicur'); if (f && f.status === 'planned') { f.status = 'now'; f.pct = 2; officeChanged(); } return this._quick(); }
    if (/wait for checkout/.test(t)) { this._say('pixel', 'Sensible. I’ll hold Multi-currency until Checkout ships, then kick it off.'); return this._quick(); }
    if (/plan/.test(t)) { this._say('pixel', 'Opening the features — Multi-currency is first in the planned pile.'); setTimeout(() => go('features'), 500); return this._quick(); }
    const wake = /wake\s+(\w+)/.exec(t);
    if (wake) { const who = wsOnProject().find(x => agentById(x.id).name.toLowerCase().includes(wake[1]) && x.session === 'asleep'); if (who) { this._say('pixel', `Bringing ${this._name(who.id)} in.`); OS.wake(who.id); return this._quick(); } }
    if (/deploy|preview/.test(t)) { this._say('pixel', 'Baron handles deploys — I’ll ask him to push a fresh preview after the next green run.'); return this._quick(); }
    this._say('pixel', 'Got it — I’ll take that to the crew and keep you posted here.'); return this._quick();
  }
  const short = this._short(tid);
  if (/ask pixel to wake/.test(t)) { this.open('pixel'); this._say('pixel', `Waking ${this._name(tid)} — give them a sec.`); OS.wake(tid); return; }
  if (a.session === 'asleep') { this._say(tid, 'zzz… (off shift — Pixel can bring me in)'); return this._quick(); }
  if (/ask pixel instead|that's pixel|pixel's call|ask him/.test(t)) {
    this.post('pixel', { from: 'system', kind: 'system', text: `${this._name(tid)} asked Pixel for a hand.` });
    this._say(tid, 'Passing it up to Pixel — he’ll pick it up in his thread.'); return this._quick();
  }
  if (/left|remain|plate|how.?s|going/.test(t)) { this._say(tid, a.brief ? a.brief.left : 'Nearly there.'); return this._quick(); }
  if (/chang|diff|touch/.test(t)) { this._say(tid, 'Here’s what I touched — plain words, no diffs:', { files: a.brief ? a.brief.changed : [] }); return this._quick(); }
  if (/break|rest|coffee/.test(t)) {
    if (a.activity.kind === 'idle') { this._say(tid, 'Already on one ☕'); return this._quick(); }
    this._say(tid, 'Finishing this file first, then grabbing a coffee. Pixel decides the shifts.'); return this._quick();
  }
  if (/token/.test(t)) { this._say(tid, `${wsTok(a.tokens.total)} tokens on Aurora so far — mostly ${Object.keys(a.tokens.byFeature || {})[0] || 'reading'}.`); return this._quick(); }
  if (/next/.test(t)) { this._say(tid, a.activity.kind === 'idle' ? 'Whatever Pixel hands me — I’m free.' : `After ${a.activity.target || 'this'}: ${a.brief ? a.brief.left : 'whatever Pixel says.'}`); return this._quick(); }
  if (/priority|plan|scope|deadline|should we|roadmap|launch/.test(t)) {
    this._say(tid, 'That’s Pixel’s call — want me to ask him?'); return this._quick(['Ask Pixel instead', 'What’s left?']);
  }
  this._say(tid, `Noted — I’ll keep that in mind for ${a.activity.target ? '`' + a.activity.target + '`' : 'this task'}.`); return this._quick();
};

/* ------------------------------------------------------------ "!" asks */
OP.ask = function (ask) {
  if (WS.pending.find(p => p.id === ask.id)) return;
  WS.pending.push(ask);
  this.post(ask.agentId, { from: ask.agentId, kind: 'ask', askId: ask.id, text: ask.q });
  this.system(`${this._name(ask.agentId)} needs you — ${ask.short.toLowerCase()}. Tap them to answer.`);
  announce(`${this._name(ask.agentId)} needs your input: ${ask.short}.`, true);
  officeChanged();
  if (this.thread === ask.agentId) this._renderThread();
};
OP._askCard = function (m) {
  const ask = WS.pending.find(p => p.id === m.askId); const live = !!ask;
  const el = document.createElement('div'); el.className = 'op-ask' + (live ? ' live' : ' done');
  const a = agentById(m.from);
  if (!live) {
    const res = (WS.answered || {})[m.askId];
    el.innerHTML = `<div class="op-aq">${OP._fmt(m.text)}</div><div class="op-adone">✓ ${escapeHtml(res || 'Answered')}</div>`;
    return el;
  }
  el.setAttribute('role', 'group'); el.setAttribute('aria-label', `${a.name} is asking: ${ask.short}`);
  el.innerHTML = `<div class="op-ak">❗ ${escapeHtml(a.name.split(' ')[0])} needs you</div><div class="op-aq">${m.text.replace(/<(?!\/?b>)[^>]*>/g, '')}</div><div class="op-actx">${escapeHtml(ask.ctx)}</div><div class="op-ain"></div>`;
  const inp = el.querySelector('.op-ain');
  if (ask.type === 'access') {
    const cred = credById(ask.want); const on = !!WS.grants[ask.want];
    const row = document.createElement('div'); row.className = 'toggle-row' + (on ? ' on' : '');
    row.innerHTML = `<div class="ic" style="background:${cred.color}">${cred.mark}</div>
      <div class="t"><b>${escapeHtml(cred.name)}</b> <span class="vl">${escapeHtml(cred.val)}</span><div class="sv">${cred.instr ? 'Rule: ' + escapeHtml(cred.instr) : 'You grant reach — the value stays masked.'}</div></div>`;
    const sw = document.createElement('button'); sw.type = 'button'; sw.className = 'switch'; sw.setAttribute('role', 'switch');
    sw.setAttribute('aria-checked', on); sw.setAttribute('aria-label', `Grant ${cred.name} to Aurora`);
    sw.onclick = () => { WS.grants[ask.want] = !WS.grants[ask.want]; const v = WS.grants[ask.want]; sw.setAttribute('aria-checked', v); row.classList.toggle('on', v); };
    row.appendChild(sw); inp.appendChild(row);
    const hand = document.createElement('button'); hand.type = 'button'; hand.className = 'btn btn-hero btn-sm'; hand.textContent = on ? 'Hand it over' : `Grant ${cred.name} & hand over`;
    sw.addEventListener('click', () => { hand.textContent = WS.grants[ask.want] ? 'Hand it over' : `Grant ${cred.name} & hand over`; });
    hand.onclick = () => { if (!WS.grants[ask.want]) { WS.grants[ask.want] = true; sw.setAttribute('aria-checked', true); row.classList.add('on'); toast(`🔑 ${escapeHtml(cred.name)} granted to Aurora`); } this.resolveAsk(ask.id, `${cred.name} granted`); };
    const manage = document.createElement('button'); manage.type = 'button'; manage.className = 'op-link'; manage.textContent = 'Manage all access →';
    manage.onclick = () => openProjectAccess(WS.grants, 'Aurora');
    const r = document.createElement('div'); r.className = 'op-arow'; r.append(hand, manage); inp.appendChild(r);
  } else {
    const r = document.createElement('div'); r.className = 'op-arow';
    (ask.options || []).forEach(o => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = o; b.onclick = () => this.resolveAsk(ask.id, `“${o}”`); r.appendChild(b); });
    inp.appendChild(r);
    const f = document.createElement('div'); f.className = 'op-afree';
    f.innerHTML = `<input aria-label="Or type your answer" placeholder="Or type your own…"><button type="button" class="btn btn-dark btn-sm">Hand it over</button>`;
    f.querySelector('button').onclick = () => { const v = f.querySelector('input').value.trim(); if (!v) { f.querySelector('input').focus(); return; } this.resolveAsk(ask.id, `“${v}”`); };
    f.querySelector('input').onkeydown = e => { if (e.key === 'Enter') f.querySelector('button').click(); };
    inp.appendChild(f);
  }
  const next = WS.pending.find(p => p.id !== ask.id);
  if (next) {
    const nb = document.createElement('button'); nb.type = 'button'; nb.className = 'op-next';
    nb.textContent = `Next: ${this._short(next.agentId)} is waiting on ${next.type === 'access' ? 'an access grant' : 'a quick decision'} →`;
    nb.onclick = () => this.open(next.agentId, { from: 'wait' }); el.appendChild(nb);
  }
  return el;
};
OP.resolveAsk = function (askId, answer) {
  const i = WS.pending.findIndex(p => p.id === askId); if (i < 0) return;
  const ask = WS.pending.splice(i, 1)[0];
  WS.answered = WS.answered || {}; WS.answered[askId] = answer;
  const name = this._name(ask.agentId);
  this.post(ask.agentId, { from: 'user', kind: 'text', text: ask.type === 'access' ? `Granted — ${answer.replace(/ granted$/, '')} (masked).` : `Go with ${answer}.` });
  toast(`Handed to ${escapeHtml(name.split(' ')[0])} ✓`);
  this.system(`${name} is unblocked — back to work.`);
  if (typeof OS !== 'undefined') OS.onAnswer(ask, answer);
  if (this.thread === ask.agentId) this._renderThread();
  officeChanged();
  announce(`Handed to ${name}.`);
};

/* ------------------------------------------------------------ sleepers: chill, don't wake */
const OP_POKES = [
  { say: 'five more minutes…', react: 'roll' },
  { say: 'mmh… *pulls blanket up*', react: 'snug' },
  { say: '*stretches like a cat* …zzz', react: 'stretch' },
  { say: 'zzz… (pop)', react: 'pop-z' },
];
OP.sleeperPoke = function (id) {
  const p = OP_POKES[this._pokeIdx++ % OP_POKES.length];
  OE.react(id, p.react);
  OE.say(id, p.say, { ms: 2600 });
  OE.chip(id, 'Chat anyway', () => {
    this.post(id, { from: 'system', kind: 'system', text: `${this._name(id)} is off shift — Pixel can bring them in.` });
    this.open(id, { from: 'chat-anyway' });
  });
  announce(`${this._name(id)} is asleep — off shift. Chat anyway is available.`);
};

</script>
<script data-module="js/office-board.js">
"use strict";
/* ============================================================
   office-board.js — whiteboard zoom, feature dossier, feature page (spec-office §4).
   Layer stack: Office → Board → Features → Feature (edit). Hash mirrors layers:
   #office · #board · #features · #feature/<id>. Esc / browser Back = one layer.
   The panel stays live at every level.

   Public: OB.show(sub), OB.close(), OB.escape(), OB.refresh(), OB.reposition()
   ============================================================ */

const OB = { sub: '', boardEl: null, sheetEl: null, feature: null, draft: null, whoMode: 'tasks', _confirm: false, _t: null };

OB.show = function (sub) {
  const layers = document.getElementById('oLayers'); if (!layers) return;
  const was = this.sub; this.sub = sub;
  const [kind, fid] = sub.split('/');
  if (!this.boardEl) {
    OE.zoomTo('whiteboard');
    document.getElementById('oStage').classList.add('zooming');
    this.boardEl = document.createElement('div');
    this.boardEl.className = 'ob-board'; this.boardEl.setAttribute('role', 'dialog'); this.boardEl.setAttribute('aria-modal', 'false');
    this.boardEl.setAttribute('aria-label', 'Whiteboard — progress, checklist, tokens, who did what');
    layers.appendChild(this.boardEl);
    this._renderBoard();
    const delay = (OE.instant || reducedMotion()) ? 0 : 520;
    clearTimeout(this._t);
    this._t = setTimeout(() => { if (this.boardEl) { this.boardEl.classList.add('in'); if (kind === 'board') this.boardEl.querySelector('.ob-back').focus({ preventScroll: true }); } }, delay);
  } else if (kind === 'board' && was && was !== 'board') {
    const f = this.boardEl.querySelector('.ob-back'); if (f) f.focus({ preventScroll: true });
  }
  if (kind === 'board') { this._closeSheet(); return; }
  if (kind === 'features') { this.feature = null; this.draft = null; this._sheet('dossier'); return; }
  if (kind === 'feature') {
    const f = wsFeature(fid); if (!f) { go('features'); return; }
    if (!this.draft || this.feature !== fid) { this.feature = fid; this.draft = this._mkDraft(f); }
    this._sheet('feature');
  }
};
OB.close = function () {
  this.sub = ''; this._closeSheet();
  if (this.boardEl) { const b = this.boardEl; b.classList.remove('in'); setTimeout(() => b.remove(), 180); this.boardEl = null; }
  document.getElementById('oStage') && document.getElementById('oStage').classList.remove('zooming');
  OE.zoomTo(null);
};
OB.escape = function () {
  const [kind] = this.sub.split('/');
  if (kind === 'feature') {
    if (this._dirty() && !this._confirm) { this._confirm = true; this._renderSheet(); const k = this.sheetEl.querySelector('.ob-confirm button'); if (k) k.focus(); return; }
    this._confirm = false; this.draft = null; go('features'); return;
  }
  if (kind === 'features') { go('board'); return; }
  go('office');
};
OB.reposition = function () { if (this.sub) OE.zoomTo('whiteboard', true); };
OB.refresh = function () {
  if (this.boardEl) this._renderBoard(true);
  if (this.sheetEl && this.sheetEl.dataset.kind === 'dossier') this._renderSheet();
};

/* ------------------------------------------------------------ board */
OB._renderBoard = function (keepFocus) {
  const el = this.boardEl; if (!el) return;

OB._sheet = function (kind) {
  const layers = document.getElementById('oLayers');
  if (!this.sheetEl) {
    this.sheetEl = document.createElement('div'); this.sheetEl.className = 'ob-sheet';
    this.sheetEl.setAttribute('role', 'dialog');
    layers.appendChild(this.sheetEl);
    this.sheetEl.addEventListener('keydown', e => this._trap(e));
  }
  this.sheetEl.dataset.kind = kind; this._confirm = false;
  layers.classList.add('has-sheet');
  this.sheetEl.setAttribute('aria-modal', kind === 'feature' ? 'true' : 'false');
  this.sheetEl.classList.remove('flip'); void this.sheetEl.offsetWidth; this.sheetEl.classList.add(kind === 'feature' ? 'flip' : 'drop');
  this._renderSheet();
  const f = this.sheetEl.querySelector(kind === 'feature' ? '.ob-sback' : '.ob-row'); if (f) f.focus({ preventScroll: true });
};
OB._closeSheet = function () { if (this.sheetEl) { this.sheetEl.remove(); this.sheetEl = null; } const l = document.getElementById('oLayers'); if (l) l.classList.remove('has-sheet'); };
OB._trap = function (e) {

  if (!f.length) return; const first = f[0], last = f[f.length - 1];

  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
};
OB._renderSheet = function () {

  return this._renderFeature();
};

/* voice path: Pixel stages a strike; you confirm in chat or on the page */
OB.stageStrike = function (fid, lineId) {
  if (this.feature !== fid || !this.draft) { this.feature = fid; this.draft = this._mkDraft(wsFeature(fid)); }
  [...this.draft.description, ...this.draft.vision].forEach(l => { if (l.id === lineId) { l.struck = true; l.staged = true; } });
  if (this.sheetEl && this.sheetEl.dataset.kind === 'feature') this._renderFeature();
};
OB.saveStaged = function () { if (!this.draft || !this._dirty()) return false; this._save(); if (this.sheetEl) this._renderFeature(); return true; };
OB.discardStaged = function () { if (!this.draft) return; this.draft = this._mkDraft(wsFeature(this.feature)); if (this.sheetEl && this.sheetEl.dataset.kind === 'feature') this._renderFeature(); };

/* feature page — lines of intent, editable: edit inline, strike, add, save & brief Pixel */
OB._mkDraft = f => ({ description: f.description.map(l => ({ id: l.id, text: l.text, orig: l.text, struck: false, added: false })),
  vision: f.vision.map(l => ({ id: l.id, text: l.text, orig: l.text, struck: false, added: false })) });

  const d = this.draft; if (!d) return false;
  return [...d.description, ...d.vision].some(l => l.struck || l.added || l.text !== l.orig);
};
OB._diff = function () {
  const all = [...this.draft.description, ...this.draft.vision];
  return { struck: all.filter(l => l.struck).length, added: all.filter(l => l.added && !l.struck && l.text.trim()).length, edited: all.filter(l => !l.added && !l.struck && l.text !== l.orig).length };
};
OB._renderFeature = function (focusSel) {
  const s = this.sheetEl; const f = wsFeature(this.feature); const d = this.draft;
  const shape = { now: '●', planned: '○', shipped: '✓' }[f.status]; const stName = { now: 'in progress', planned: 'planned', shipped: 'shipped' }[f.status];
  const lines = (sec) => d[sec].map((l, i) => `<li class="ob-line${l.struck ? ' struck' : ''}${l.added ? ' added' : ''}${l.staged && l.struck ? ' staged' : ''}" data-sec="${sec}" data-i="${i}">

      ${l.struck ? '<span class="ob-will">(will be removed)</span>' : ''}
      <span class="ob-lacts">
        ${l.struck ? `<button type="button" class="ob-la" data-act="restore" aria-label="Restore ${sec} line ${i + 1}">Restore</button>`

             ${l.added ? `<button type="button" class="ob-la" data-act="delete" aria-label="Delete ${sec} line ${i + 1}" title="Delete">⌫</button>`
               : `<button type="button" class="ob-la" data-act="strike" aria-label="Strike ${sec} line ${i + 1}" title="Strike"><s>S</s></button>`}`}

  const df = this._diff(); const dirty = this._dirty();

      <button type="button" class="ob-x" id="obX" aria-label="Close feature">✕</button></div>
    <div class="ob-sbody ob-paper">

    </div>
    <div class="ob-sfoot">

      inp.onkeydown = e => {

OB._save = function () {

  }

  if (tellId) OE.say('pixel', `${OP._short(tellId)}: ${f.name} brief changed`, { ms: 2400 }).then(() => OE.say(tellId, 'Got it 👍', { ms: 1400 }));
  officeChanged();
};

<script data-module="js/office-sim.js">

const OS = { timers: [], running: false, t0: 0, cycleN: 0, seed: 7, busy: {} };

OS._param = function () { const m = /[?&]demo=([^&#]+)/.exec(location.search); return m ? decodeURIComponent(m[1]).split(',') : []; };
OS.start = async function () {

  const d = WS.office.demo;
  if (d.started) { this._settle(); OE.speed = demo.includes('fast') ? 3 : 1; if (d.t > SIM_ACT1_END) this._ambient(); else this._schedule(d.t); return; }
  d.started = true;
  OE.speed = demo.includes('fast') ? 3 : 1;
  let skip = 0;
  demo.forEach(d => { const m = /^t(\d+)$/.exec(d); if (m) skip = +m[1]; });
  if (demo.includes('ask') || demo.includes('chat')) skip = Math.max(skip, 25);
  if (demo.includes('talk')) skip = Math.max(skip, 7);
  if (demo.includes('ship')) skip = Math.max(skip, 46);
  if (demo.includes('end')) skip = Math.max(skip, SIM_ACT1_END + 1);
  if (demo.includes('selftest')) { setTimeout(() => officeSelftest(), 50); return; }
  if (skip) await this.skipTo(skip);
  else this._schedule(0);
  if (demo.includes('chat')) setTimeout(() => OP.open('a-scar', { from: 'scene' }), 30);
  if (demo.includes('pete')) setTimeout(() => OP.open('a-pete', { from: 'scene' }), 30);
  if (demo.includes('sleepy')) setTimeout(() => OP.sleeperPoke('a-query'), 30);

};
OS.stop = function () {

};
OS.elapsed = function () { return (Date.now() - this.t0) / 1000 * OE.speed; };

OS._settle = function () {
  const transient = ['commit', 'handoff', 'talking', 'deploying', 'arriving', 'leaving', 'writing', 'shipped'];
  [WS.director, ...wsOnProject()].forEach(a => {
    if (!transient.includes(a.activity.kind)) return;
    a.at = a.seat || a.at;

OS.replay = function () { toast('↺ Replaying Act 1'); location.reload(); };
OS._at = function (sec, fn) { this.timers.push(setTimeout(fn, sec * 1000 / OE.speed)); };

/* schedule beats with t > from (seconds) */
OS._schedule = function (from) {

OS._run = function (b) {

    await OE.sleep(4000); await OE.free(id);
    OE.setActivity(id, 'tests-green', { short: '48 passing', detail: '48 passing — checkout verified', featureId: 'checkout' });
    if (f) f.pct = Math.min(99, f.pct + 6);
    this._check('k5'); WS.overall = Math.min(100, WS.overall + 2);
    OE.react(id, 'hop'); officeChanged();
    await OE.sleep(1800);
    OE.setActivity(id, 'reading', { short: 'Demo sign-off', detail: 'Writing the checkout demo sign-off', target: 'signoff.md', featureId: 'checkout' });
  } else {
    OP._say(id, `${answer.replace(/[“”]/g, '')} it is — updating the button.`);
    OE.setActivity(id, 'coding', { short: 'Cart button', detail: `Updating the cart button to ${answer}`, target: 'CartButton.tsx', featureId: 'cleanup' });
  }
};

/* ------------------------------------------------------------ Act 2: calm ambient loop */
OS._ambient = function () {
  const C = SIM_AMBIENT.cycle;
  const pick = (pred) => {
    const pool = wsOnProject().filter(a => pred(a) && !this.busy[a.id] && !(OE.actors[a.id] || {}).held && a.at === a.seat);
    return pool.length ? pool[this._rand(pool.length)] : null;
  };
  const awake = a => a.session === 'running' && a.activity.kind !== 'needs-input';
  const run = (b) => this._run(b);
  const cycle = () => {
    const n = this.cycleN++;
    this._at(2, () => { const a = pick(x => awake(x) && x.activity.kind === 'coding'); if (a) run({ do: 'commit', actor: a.id, n: 1 + this._rand(3) }); });
    this._at(7, () => {
      const a = pick(awake); if (!a) return;
      const b = pick(x => awake(x) && x.id !== a.id && x.teamId !== a.teamId) || pick(x => awake(x) && x.id !== a.id);
      if (b) run({ do: 'talk', actor: a.id, to: b.id, lines: SIM_AMBIENT.talks[n % SIM_AMBIENT.talks.length] });
    });
    this._at(13, async () => {
      const a = pick(x => awake(x) && x.activity.kind === 'coding'); if (!a) return;
      const red = this._rand(100) < 15;
      this.busy[a.id] = (this.busy[a.id] || 0) + 1;
      try {
        OE.setActivity(a.id, 'testing', { short: 'Running tests', detail: 'Running the test suite', featureId: a.activity.featureId });
        await OE.sleep(2200);
        if (red) { OE.setActivity(a.id, 'tests-red', { short: '1 failing', detail: '1 failing — fixing it', featureId: a.activity.featureId }); await OE.sleep(6000); }
        OE.setActivity(a.id, 'tests-green', { short: 'All green', detail: 'All tests passing', featureId: a.activity.featureId }); a.tasksDone++;
        await OE.sleep(1500);
        const file = SIM_AMBIENT.files.coding[(n + 2) % SIM_AMBIENT.files.coding.length];
        OE.setActivity(a.id, 'coding', { short: file, detail: `Writing ${file}`, target: file, featureId: a.activity.featureId });
      } finally { this.busy[a.id]--; }
    });
    this._at(18, () => {
      const a = pick(x => awake(x) && x.activity.kind === 'reading'); if (!a) return;
      const file = SIM_AMBIENT.files.coding[n % SIM_AMBIENT.files.coding.length];
      OE.setActivity(a.id, 'coding', { short: file, detail: `Writing ${file}`, target: file, featureId: a.activity.featureId });
      const b = pick(x => awake(x) && x.activity.kind === 'coding' && x.id !== a.id);
      if (b && n % 2) { const rf = SIM_AMBIENT.files.reading[n % SIM_AMBIENT.files.reading.length]; OE.setActivity(b.id, 'reading', { short: rf, detail: `Reading ${rf}`, target: rf, featureId: b.activity.featureId }); }
    });
    if (n % 3 === 2) this._at(20, async () => {
      const a = pick(x => x.session !== 'asleep' && x.activity.kind !== 'needs-input'); if (!a) return;
      this.busy[a.id] = (this.busy[a.id] || 0) + 1;
      try {
        const prev = { ...a.activity };
        OE.setActivity(a.id, 'idle', { short: 'Coffee', detail: 'Grabbing a coffee' });
        await OE.walkTo(a.id, 'coffee', { holding: 'mug', pose: 'walking' });
        await OE.sleep(2500);
        await OE.walkTo(a.id, a.seat, { holding: 'mug', pose: 'walking' });
        OE.setActivity(a.id, prev.kind, prev);
      } finally { this.busy[a.id]--; }
    });
    /* features creep, tokens tick — reading ticks fastest */
    this._at(C - 1, () => {
      WS.features.filter(f => f.status === 'now' && !f.blocked && f.pct < 96).forEach(f => f.pct += 1 + this._rand(3));
      wsOnProject().forEach(a => { if (a.session === 'running') this._tick(a.id, (a.activity.kind === 'reading' ? 3000 : 1200) + this._rand(1500)); });
      this._tick('pixel', 800);
      officeChanged();
    });
    this._at(C, cycle);
  };
  cycle();
};

</script>
<script data-module="js/office-main.js">
"use strict";
/* ============================================================
   office-main.js — The Office shell (spec-office §1.4, §5, §8).
   Owns: layout (top bar · stage · panel), the stage's object hotspots,
         the accessible list mirror, stage keyboard model, layer routing.
   Contract the router relies on:
     openOffice(projectId, sub)  sub = '' | 'board' | 'features' | 'feature/<id>'
     closeOffice()
   Public: officeChanged(id?) — any module calls this after changing WS;
           officeRefresh() — immediate full refresh of mirrors;
           OM.clickActor(id), OM.focusActor(id), OM.layer
   Demo hooks (dev only, not in UI): ?demo=<state> — see office-sim.js OS.demo.
   ============================================================ */

const OM = { project: null, mounted: false, layer: '', listOpen: false, wide: false, focusId: 'pixel', _q: false };

function openOffice(projectId, sub = '') {
  const p = projById(projectId) || PROJECTS[0];
  if (!OM.mounted || OM.project !== p.id) _omMount(p);
  _omLayer(sub || '');
}
function closeOffice() {
  if (typeof OS !== 'undefined') OS.stop();
  OE.unmount(); OM.mounted = false; OM.project = null;
  document.removeEventListener('keydown', _omKeys);
  window.removeEventListener('resize', _omResize);

function _omMount(p) {
  OM.project = p.id; OM.mounted = true;
  const host = document.getElementById('office');
  host.innerHTML = `
    <header class="o-top" role="banner">
      <a class="ws-chip o-back" href="#projects" aria-label="Back to all projects">← <span>Projects</span></a>
      <div class="o-title">${logoTile(p, true)}<div><b>${escapeHtml(p.name)}</b><span>The Office</span></div></div>
      <button class="o-prog" id="oProg" type="button" aria-label="Open the whiteboard"></button>
      <span class="spacer"></span>
      <div class="o-chips">
        <a class="ws-chip" href="#" id="oGh"></a>
        <button class="ws-chip" type="button" id="oPriv"></button>
        <a class="ws-chip live-dot" href="#" id="oTest"></a>
        <button class="ws-chip" type="button" id="oAccess">🔑 <span class="o-lbl">Access</span></button>
        <button class="ws-chip" type="button" id="oBell"></button>
      </div>
    </header>
    <div class="o-main">
      <section class="o-stagewrap" id="oStage" aria-roledescription="office scene">
        <div class="o-box" id="oBox"></div>
        <div class="o-hots" id="oHots"></div>
        <div class="o-vignette" aria-hidden="true"></div>
        <div class="o-layers" id="oLayers"></div>
        <div class="o-stagectl">
          <button class="o-ctl" type="button" id="oListBtn" aria-pressed="false" aria-controls="oList">▤ <span>List</span></button>
          <button class="o-ctl" type="button" id="oWideBtn" aria-pressed="false" aria-label="Hide the chat panel">⤢</button>
        </div>
        <div class="o-list" id="oList" role="region" aria-label="Office list — everyone and what they are doing"></div>
      </section>
      <aside class="o-panel" id="oPanel"></aside>
    </div>`;
  /* top bar wiring */
  host.querySelector('#oProg').onclick = () => go('board');
  host.querySelector('#oGh').onclick = e => { e.preventDefault(); toast(`🐙 Pushed ${escapeHtml(WS.github.pushedAgo)} · branch <span style="font-family:var(--mono)">${escapeHtml(WS.github.branch)}</span>`); };
  host.querySelector('#oTest').onclick = e => { e.preventDefault(); toast('↗ Opening the preview (prototype — no real link)'); };
  host.querySelector('#oPriv').onclick = _omPrivacy;
  host.querySelector('#oAccess').onclick = () => openProjectAccess(WS.grants, p.name.split(' ')[0]);
  host.querySelector('#oBell').onclick = () => { const ask = WS.pending[0]; if (ask) OP.open(ask.agentId, { from: 'bell' }); else toast('Nobody is waiting on you 🎈'); };
  host.querySelector('#oListBtn').onclick = () => _omToggleList();
  host.querySelector('#oWideBtn').onclick = () => _omWide(!OM.wide);

  OE.mount(host.querySelector('#oBox'));
  _omHotspots();
  OP.mount(host.querySelector('#oPanel'));
  _omStageA11y();
  document.addEventListener('keydown', _omKeys);
  window.addEventListener('resize', _omResize);
  officeRefresh();
  OS.start();
}
function _omResize() { OE.fit(); if (OM.layer) OB.reposition(); }

/* ------------------------------------------------------------ objects on the wall */
const OM_HOTS = [
  { id: 'whiteboard', label: 'Whiteboard — progress, checklist, tokens', act: () => go('board') },
  { id: 'dossier', label: 'Features dossier — shipped and planned', act: () => go('features') },
  { id: 'poster', label: 'Health checkup poster', act: () => go('board') },
  { id: 'clock', label: 'Progress clock', act: () => go('board') },
  { id: 'outbox', label: 'Outbox — pushes to main', act: () => toast(`📮 Last push ${escapeHtml(WS.github.pushedAgo)} to <span style="font-family:var(--mono)">${escapeHtml(WS.github.branch)}</span>`) },
  { id: 'printer', label: 'Printer — handoffs waiting', act: () => toast('🖨 Handoffs land here when someone is away. Tray is empty.') },
  { id: 'door', label: 'Door — who comes and goes', act: () => toast('🚪 Pixel brings people in when the plan needs them.') },
];
function _omHotspots() {
  const box = document.querySelector('#oBox .o-world');
  OM_HOTS.forEach(h => {
    const o = THEME_OFFICE.objects[h.id];
    const b = document.createElement('button'); b.type = 'button'; b.className = 'o-hot'; b.dataset.obj = h.id; b.tabIndex = -1;
    b.setAttribute('aria-label', h.label);
    b.style.cssText = `left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px`;
    b.innerHTML = `<span class="o-hot-l">${escapeHtml(o.label)}</span>`;
    b.onclick = e => { e.stopPropagation(); OM.opener = b; h.act(); };
    box.appendChild(b);
  });
}

/* ------------------------------------------------------------ actors: click + keyboard */
function _omStageA11y() {
  const stage = document.getElementById('oStage');
  stage.addEventListener('click', e => {
    const b = e.target.closest('.o-body'); if (!b) return;
    OM.opener = b; OM.clickActor(b.dataset.id);
  });
  stage.addEventListener('focusin', e => {
    const t = e.target.closest('.o-body,.o-hot'); if (!t) return;
    OM.focusId = t.dataset.id || 'obj:' + t.dataset.obj; _omRoving();
  });
  /* bubbles pause while hovered (spec §2 communication) */
  stage.addEventListener('mouseover', e => { const b = e.target.closest('.o-actor'); if (b) { const r = OE.actors[b.dataset.id]; if (r) r._hoverBubble = true; } });
  stage.addEventListener('mouseout', e => { const b = e.target.closest('.o-actor'); if (b) { const r = OE.actors[b.dataset.id]; if (r) { r._hoverBubble = false; if (r._release) { r._release(); r._release = null; } } } });
  _omRoving();
}
OM.clickActor = function (id) {
  const a = wsAgent(id); if (!a) return;
  if (a.activity.kind === 'sleeping') { OP.sleeperPoke(id); return; }
  OP.open(id, { from: 'scene' });
};
/* order: Pixel → pod A → B → C → hot desks → couch → objects */
function _omOrder() {
  const rank = id => { const a = wsAgent(id); const at = a.at || '';
    if (id === 'pixel') return 0; const m = /^([ABC])-(\d)/.exec(at); if (m) return 10 + 'ABC'.indexOf(m[1]) * 10 + +m[2];
    if (/^hot/.test(at)) return 50 + +at.slice(4); if (/^couch|^bean/.test(at)) return 60 + (+at.slice(-1) || 0); return 70; };
  const ids = ['pixel', ...wsOnProject().map(a => a.id)].sort((a, b) => rank(a) - rank(b));
  return [...ids, ...OM_HOTS.map(h => 'obj:' + h.id)];
}
function _omEl(key) { return key.startsWith('obj:') ? document.querySelector(`.o-hot[data-obj="${key.slice(4)}"]`) : document.querySelector(`.o-body[data-id="${key}"]`); }
function _omRoving() {
  document.querySelectorAll('#oStage .o-body,#oStage .o-hot').forEach(el => el.tabIndex = -1);
  const el = _omEl(OM.focusId) || _omEl('pixel'); if (el) el.tabIndex = 0;
}
OM.focusActor = function (key) { OM.focusId = key; _omRoving(); const el = _omEl(key); if (el) el.focus({ preventScroll: true }); };
function _omPos(key) {
  if (key.startsWith('obj:')) { const o = THEME_OFFICE.objects[key.slice(4)]; return { x: o.x + o.w / 2, y: o.y + o.h / 2 }; }
  const r = OE.actors[key]; return r ? { x: r.x, y: r.y - 50 } : { x: 0, y: 0 };
}
function _omKeys(e) {
  if (APP.view !== 'office' || sheetOpen()) return;
  const t = e.target; const typing = /input|textarea|select/i.test(t.tagName) || t.isContentEditable;
  if (e.key === 'Escape' && !typing) {
    if (OM.listOpen) { _omToggleList(false); return; }
    if (OM.layer) { e.preventDefault(); OB.escape(); return; }
    if (OP.thread !== 'pixel') { OP.open('pixel'); return; }
  }
  if (typing) return;
  if (e.altKey && (e.key === 'r' || e.key === 'R' || e.code === 'KeyR')) { e.preventDefault(); OS.replay(); return; }
  if (e.key === '!' ) {
    const ask = WS.pending[0]; if (!ask) { announce('Nobody needs you right now.'); return; }
    e.preventDefault(); if (OM.layer) go('office'); OM.focusActor(ask.agentId); return;
  }
  const inStage = t.closest && t.closest('#oStage .o-body,#oStage .o-hot'); if (!inStage || OM.layer) return;
  const order = _omOrder();
  if (e.key === 'Home') { e.preventDefault(); OM.focusActor('pixel'); return; }
  if (e.key === 'End') { e.preventDefault(); OM.focusActor(order[order.length - 1]); return; }
  const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const d = dirs[e.key]; if (!d) return;
  e.preventDefault();
  const cur = _omPos(OM.focusId); let best = null, bs = Infinity;
  order.forEach(k => {
    if (k === OM.focusId) return; const el = _omEl(k); if (!el || el.closest('.gone')) return;
    const p = _omPos(k); const dx = p.x - cur.x, dy = p.y - cur.y;
    const along = dx * d[0] + dy * d[1]; if (along <= 4) return;
    const across = Math.abs(dx * d[1]) + Math.abs(dy * d[0]);
    const s = along + across * 2.2; if (s < bs) { bs = s; best = k; }
  });
  if (best) OM.focusActor(best);
}

/* ------------------------------------------------------------ refresh (mirrors) */
function officeChanged() {
  if (OM._q) return; OM._q = true;
  Promise.resolve().then(() => { OM._q = false; officeRefresh(); });
}
function officeRefresh() {
  if (!OM.mounted) return;
  _omTop(); _omList();
  const n = WS.pending.length, people = 1 + wsOnProject().length;
  document.getElementById('oStage').setAttribute('aria-label', `Office — ${people} people${n ? `, ${n} need${n === 1 ? 's' : ''} you` : ''}. Arrow keys move between people; ! jumps to whoever needs you.`);
  document.getElementById('oStage').setAttribute('role', 'group');

  OP.refresh();
  if (OM.layer) OB.refresh();
}
function _omTop() {
  const $ = id => document.getElementById(id);
  $('oProg').innerHTML = `<b>${WS.overall}%</b><span class="o-pbar"><i style="width:${WS.overall}%"></i></span><span class="o-ptgt">→ ${escapeHtml(WS.target)}</span>`;
  $('oProg').setAttribute('aria-label', `${WS.overall}% to ${WS.target} — open the whiteboard`);
  $('oGh').innerHTML = `<span class="ok">●</span> <span class="o-lbl">GitHub</span> ✓`;
  $('oGh').title = `Pushed ${WS.github.pushedAgo} · branch ${WS.github.branch}`;
  $('oGh').setAttribute('aria-label', `GitHub connected — pushed ${WS.github.pushedAgo}`);
  $('oPriv').innerHTML = WS.private ? '🔒 <span class="o-lbl">Private</span>' : '🌐 <span class="o-lbl">Public</span>';
  $('oTest').innerHTML = `Test ↗ <span class="o-lbl o-url">${escapeHtml(WS.testUrl)}</span>`;
  $('oTest').title = `Preview ${WS.testFresh}`;
  $('oTest').classList.toggle('fresh', !!OM.testFresh);
  const n = WS.pending.length;
  $('oBell').innerHTML = `🔔${n ? `<span class="bell-badge">${n}</span>` : ''}`;
  $('oBell').setAttribute('aria-label', n ? `${n} ${n === 1 ? 'person needs' : 'people need'} your input — open the oldest` : 'Nobody is waiting on you');
}
function _omPrivacy() {
  const goingPublic = WS.private;
  const body = document.createElement('div');
  body.innerHTML = `<h2>${goingPublic ? 'Make Aurora public?' : 'Make Aurora private?'}</h2>
    <p class="hint" style="margin:8px 0 18px;font-size:14px">${goingPublic ? 'Anyone with the GitHub link will see the code. Secrets stay masked and never leave the vault.' : 'Only you and granted agents will see the repo.'}</p>
    <div class="row"><button class="btn btn-ghost" id="pvNo">Keep ${goingPublic ? 'private' : 'public'}</button><button class="btn btn-hero" id="pvYes">${goingPublic ? 'Make public' : 'Make private'}</button></div>`;
  openSheet(body, 'Change visibility');
  body.querySelector('#pvNo').onclick = closeSheet;
  body.querySelector('#pvYes').onclick = () => { WS.private = !WS.private; closeSheet(); toast(WS.private ? '🔒 Aurora is private' : '🌐 Aurora is public'); officeRefresh(); };
}

/* list mirror: same state, grouped; rows do what clicking the agent does */
function _omList() {
  const el = document.getElementById('oList'); if (!el) return;
  const row = a => {
    const ag = agentById(a.id === 'pixel' ? 'director' : a.id); const act = ACTIVITY[a.activity.kind] || ACTIVITY.idle;
    const needs = a.activity.kind === 'needs-input';
    return `<li><button type="button" class="o-lrow${needs ? ' needs' : ''}" data-id="${a.id}">
      <span class="o-lface" style="background:${hueHex(ag.hue)}" aria-hidden="true">${escapeHtml(ag.name[0])}</span>
      <span class="o-lt"><b>${escapeHtml(ag.name)}</b> <span class="o-lrole">${escapeHtml(ag.role)}</span><span class="o-lact">${act.icon} ${escapeHtml(a.activity.detail || a.activity.label)}</span></span>
      <span class="o-ltok">${wsTok(a.tokens.total)}</span>${needs ? '<span class="o-lneed">❗ Needs you</span>' : ''}</button></li>`;
  };
  const on = wsOnProject();
  const groups = [['Director', [WS.director]]];
  wsTeamIds().forEach(t => groups.push([teamById(t).name, on.filter(a => a.teamId === t && a.session !== 'asleep')]));
  groups.push(['Solo', on.filter(a => !a.teamId && a.session !== 'asleep')]);
  groups.push(['Off shift', on.filter(a => a.session === 'asleep')]);
  el.innerHTML = `<div class="o-lhead"><b>Everyone on ${escapeHtml(projById(OM.project).name.split(' ')[0])}</b><button type="button" class="o-ctl" id="oListClose" aria-label="Close list">✕</button></div>
    ${groups.filter(g => g[1].length).map(([name, list]) => `<h3>${escapeHtml(name)}</h3><ul>${list.map(row).join('')}</ul>`).join('')}
    <h3>Around the office</h3><ul class="o-lobj">
      <li><button type="button" class="o-lrow" data-go="board">🧾 Whiteboard — ${WS.overall}% · checklist · tokens</button></li>
      <li><button type="button" class="o-lrow" data-go="features">📁 Features — shipped and planned</button></li>
      <li><button type="button" class="o-lrow" data-go="board">🩺 Checkup — ${Object.entries(WS.checkup.vitals).map(([k, g]) => `${k} ${g}`).join(' · ')}</button></li></ul>`;
  el.querySelector('#oListClose').onclick = () => _omToggleList(false);
  el.querySelectorAll('.o-lrow').forEach(b => b.onclick = () => { OM.opener = b; if (b.dataset.go) go(b.dataset.go); else OM.clickActor(b.dataset.id); });
}
function _omToggleList(force) {
  OM.listOpen = force == null ? !OM.listOpen : force;
  document.getElementById('oStage').classList.toggle('list-open', OM.listOpen);
  const b = document.getElementById('oListBtn'); b.setAttribute('aria-pressed', OM.listOpen);
  if (OM.listOpen) { const f = document.querySelector('#oList .o-lrow'); if (f) f.focus(); } else b.focus();
}
function _omWide(on) {
  OM.wide = on; document.getElementById('office').classList.toggle('wide', on);
  const b = document.getElementById('oWideBtn'); b.setAttribute('aria-pressed', on); b.setAttribute('aria-label', on ? 'Show the chat panel' : 'Hide the chat panel');
  setTimeout(() => OE.fit(), 320); OE.fit();
}
OM.showPanel = function () {
  if (OM.wide) _omWide(false);
  const o = document.getElementById('office'); if (o.classList.contains('drawer-up')) return;
  o.classList.add('drawer-up'); setTimeout(() => OE.fit(), 340);
};

/* ------------------------------------------------------------ layers: office → board → features → feature */
function _omLayer(sub) {
  const prev = OM.layer; OM.layer = sub;
  if (!sub) { OB.close(); if (prev && OM.opener && document.contains(OM.opener)) { try { OM.opener.focus({ preventScroll: true }); } catch (e) { } } return; }
  OB.show(sub);
}

</script>
<script data-module="js/office-selftest.js">
"use strict";
/* ============================================================
   office-selftest.js — DEV ONLY. ?demo=selftest drives the real Office UI
   end to end (asks, chat, board layers, feature editing, keyboard, voice)
   and logs PASS/FAIL lines to the console. Not reachable from the UI.
   Run: Chrome --headless --enable-logging=stderr --virtual-time-budget=60000
        --dump-dom "…/ai-control-disney-v3.html?demo=selftest#office"
   ============================================================ */
async function officeSelftest() {
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = s => document.querySelector(s);
  let fails = 0;
  const ok = (cond, name) => { if (!cond) fails++; console.log((cond ? 'PASS ' : 'FAIL ') + name); };
  const key = (k, el = document.activeElement || document.body, extra = {}) => el.dispatchEvent(new KeyboardEvent('keydown', Object.assign({ key: k, bubbles: true }, extra)));

  await OS.skipTo(25); await wait(50);
  ok(WS.pending.length === 1 && WS.pending[0].agentId === 'a-scar', 'Scarlett raises a "!" at t=23');
  ok(!$('.o-body[data-id="a-scar"] .o-bang').hidden, '"!" badge visible over Scarlett');
  ok(/1/.test($('#oBell').textContent), 'bell shows 1');
  ok(!$('#opWait').hidden, 'panel "Waiting on you" row shows');
  ok(/Stripe test key/.test($('.o-body[data-id="a-scar"]').getAttribute('aria-label')), 'actor label names the ask');

  $('.o-body[data-id="a-scar"]').click(); await wait(50);
  ok(OP.thread === 'a-scar', 'click Scarlett → her thread');
  ok(OE.actors['a-scar'].wrap.classList.contains('held'), 'she stops and faces you');
  ok(OE.actors['a-scar'].hero.classList.contains('face-front'), 'facing front (looks at you)');
  ok(!!$('.op-ask.live'), 'ask card is live');
  ok(/••••/.test($('.op-ask.live .vl').textContent), 'credential value is masked');
  ok(/Grant Stripe/.test($('.op-ask.live .btn-hero').textContent), 'one button grants and hands over');
  $('.op-ask.live .btn-hero').click(); await wait(80);
  ok(WS.pending.length === 0 && WS.grants.stripe, 'grant + hand over resolves the ask');
  ok($('.o-body[data-id="a-scar"] .o-bang').hidden, '"!" cleared');
  ok(!/\d/.test($('#oBell').textContent), 'bell cleared');
  ok(wsAgent('a-scar').activity.kind === 'testing', 'Scarlett back to testing');
  ok(!/sk_live_[0-9a-z]{4}/i.test(document.getElementById('office').innerHTML), 'only masked secret values in the office DOM');

  OP.open('pixel'); await wait(20);
  ok(!OE.actors['a-scar'].held, 'leaving her thread releases her');
  $('.o-body[data-id="a-query"]').click(); await wait(50);
  ok(OP.thread === 'pixel', 'sleeper click does not open chat');
  ok(!!$('.o-chip'), '"Chat anyway" chip offered');

  const inp = $('#opInput'); inp.value = '@Captain how is checkout going?'; $('#opSend').click(); await wait(1200);
  ok(OP.thread === 'a-semic', '@Captain routes to Captain\'s thread');
  ok((WS.threads['a-semic'] || []).some(m => m.from === 'a-semic' && m.kind === 'text'), 'Captain answers in his thread');

  $('#opMic').click(); ok($('#opMic').getAttribute('aria-pressed') === 'true', 'mic is one press');
  await wait(3600);
  ok((WS.threads['a-semic'] || []).some(m => m.voice), 'voice utterance lands as a message');

  OP.open('pixel'); OP._user('Drop crypto from multi-currency.', true); await wait(1800);
  ok(location.hash === '#feature/multicur' && !!document.querySelector('.ob-line.staged'), 'voice: "drop crypto…" stages a strike on the page');
  OP._user('Save it', false); await wait(1500);
  ok(!wsFeature('multicur').description.some(l => /crypto/i.test(l.text)), 'voice: "Save it" applies the edit');
  OP._user('close', false); await wait(1500);
  go('office'); await wait(400);
  go('board'); await wait(900);
  ok(!!$('.ob-board.in'), '#board shows the whiteboard');
  ok(/Tokens/.test($('.ob-board').textContent) && /Who did what/.test($('.ob-board').textContent), 'board has tokens + who did what');
  $('[data-mode="tokens"]').click(); await wait(20);
  ok(/More tokens/.test($('.ob-board').textContent), 'who-did-what toggles to tokens with caption');
  go('features'); await wait(300);
  ok($('.ob-sheet') && $('.ob-sheet').dataset.kind === 'dossier', '#features shows the dossier');
  $('[data-fid="multicur"]').click(); await wait(300);
  ok(location.hash === '#feature/multicur', 'feature row → #feature/multicur');
  $('.ob-line[data-sec="description"][data-i="1"] [data-act="strike"]').click(); await wait(20);
  ok($('.ob-line[data-sec="description"][data-i="1"]').classList.contains('struck'), 'strike marks a line');
  $('[data-add="vision"]').click(); await wait(20);
  const li = $('.ob-line.added input'); li.value = 'Prices round like locals expect.'; li.dispatchEvent(new Event('input'));
  li.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true })); await wait(20);
  key('Escape', $('.ob-line.added input')); await wait(20);
  key('Escape', $('.ob-sheet')); await wait(50);
  ok(!!$('.ob-confirm'), 'Esc with unsaved edits asks first');
  $('.ob-confirm [data-c="keep"]').click(); await wait(20);
  $('#obSave').click(); await wait(80);
  const f = wsFeature('multicur');
  ok(f.description.length === 1 && f.vision.length === 3 && f.revisedAt, 'save removes struck, keeps added');
  ok(/updated/.test(WS.threads.pixel.slice(-1)[0].text), 'Pixel is briefed');
  key('Escape', $('.ob-sheet')); await wait(300);
  ok(location.hash === '#features', 'Esc → dossier');
  key('Escape', document.body); await wait(300);
  ok(location.hash === '#board', 'Esc → board');
  key('Escape', document.body); await wait(400);
  ok(location.hash === '#office' && !$('.ob-board'), 'Esc → office');

  OM.focusActor('pixel'); await wait(10);
  key('ArrowLeft'); await wait(10);
  ok(OM.focusId !== 'pixel', 'arrow keys move between people (' + OM.focusId + ')');
  key('Home'); await wait(10);
  ok(document.activeElement && document.activeElement.dataset.id === 'pixel', 'Home → Pixel');
  ok($('#oList').querySelectorAll('.o-lrow').length >= 10, 'list mirror lists everyone');

  /* decision ask (Twinkle) answered with a chip */
  OP.ask({ id: 'ask-test', agentId: 'a-twinkle', type: 'decision', short: 'Cart button copy', q: 'Which reads better?', ctx: 'Not blocking', options: ['Add to bag', 'Add to cart'], featureId: 'cleanup' });
  OE.setActivity('a-twinkle', 'needs-input', { short: 'Needs you', detail: 'Cart button copy' }); await wait(30);
  $('#oBell').click(); await wait(50);
  ok(OP.thread === 'a-twinkle' && !!$('.op-ask.live .chip'), 'bell opens the oldest ask (decision chips)');
  $('.op-ask.live .chip').click(); await wait(80);
  ok(!WS.pending.length && wsAgent('a-twinkle').activity.kind === 'coding', 'decision chip answers and unblocks');

  /* leave and come back: the story resumes, it does not replay */
  const pend = WS.pending.length; go('projects'); await wait(200); go('office'); await wait(600);
  ok(WS.pending.length === pend && wsAgent('a-scar').activity.kind !== 'needs-input', 'reopening resumes (no replayed asks)');
  ok(!!$('.o-body[data-id="a-merge"]') , 'office rebuilt from state');
  console.log(fails ? `SELFTEST: ${fails} FAILED` : 'SELFTEST: ALL PASS');
}

</script>
<script data-module="js/gallery.js">
"use strict";
/* ============================================================
   gallery.js — #gallery dev route: every role × pose × facing × size,
   all builds / hair / accessories, extras, and every emblem × 7 hues.
   Public: renderGallery(section)   section = '' (all) | roster | poses |
           facings | sizes | zoom | looks | extras | emblems
   Dev-only; not linked from the studio nav.
   ============================================================ */
const GALLERY_SECTIONS = ['roster', 'zoom', 'poses', 'facings', 'sizes', 'looks', 'extras', 'emblems'];

function renderGallery(section = '') {
  const host = document.getElementById('gallery');
  const only = GALLERY_SECTIONS.includes(section) ? [section] : GALLERY_SECTIONS;
  host.innerHTML = `<header class="gal-head"><b>Character gallery</b>
    <nav>${GALLERY_SECTIONS.map(s => `<a href="#gallery/${s}"${s === section ? ' aria-current="page"' : ''}>${s}</a>`).join('')}<a href="#gallery">all</a><a href="#projects">← studio</a></nav></header>
    <main class="gal-body"></main>`;
  const body = host.querySelector('.gal-body');
  const cast = [...AGENTS, DIRECTOR];
  const sec = (id, title, note) => {
    const s = document.createElement('section'); s.className = 'gal-sec'; s.id = 'gal-' + id;
    s.innerHTML = `<h2>${title}</h2>${note ? `<p>${note}</p>` : ''}`; body.appendChild(s); return s;
  };
  const row = (parent, cls = '') => { const r = document.createElement('div'); r.className = 'gal-row ' + cls; parent.appendChild(r); return r; };
  const cell = (r, el, cap) => { const c = document.createElement('figure'); c.className = 'gal-cell'; c.appendChild(el); if (cap) c.insertAdjacentHTML('beforeend', `<figcaption>${cap}</figcaption>`); r.appendChild(c); return c; };

  if (only.includes('roster')) {
    const s = sec('roster', 'Roster at 48px (legibility) · colour / greyscale', 'Each role must be nameable from headgear + tool alone.');
    const r1 = row(s), r2 = row(s, 'gray'), r3 = row(s);
    cast.forEach(a => { cell(r1, hero(a, { size: 'xs' }), a.role); cell(r2, hero(a, { size: 'xs' }), a.role); cell(r3, hero(a, { size: 'sm' }), a.name); });
  }
  if (only.includes('zoom')) {
    const s = sec('zoom', 'Hero zoom size (xl 360) — front, looking at you');
    const r = row(s);
    ['a-pete', 'a-semic', 'a-scar', 'a-lint'].forEach(id => cell(r, hero(agentById(id), id === 'a-semic' ? { size: 'xl', facing: 'front', captain: true, armband: PALETTE.sun } : { size: 'xl', facing: 'front' }), agentById(id).name));
  }
  if (only.includes('poses')) {
    const s = sec('poses', 'Every role × every pose (sm 96, three-quarter)', 'Seated poses (typing, chilling) sit on a desk stub here; the Office supplies real desks.');
    const head = row(s, 'gal-poses-head'); head.innerHTML = '<span></span>' + POSES.map(p => `<span>${p}</span>`).join('');
    cast.forEach(a => {
      const r = row(s, 'gal-poses'); r.insertAdjacentHTML('beforeend', `<span class="gal-rl">${a.role}</span>`);
      POSES.forEach(p => { const c = cell(r, hero(a, { size: 'sm', pose: p })); if (['typing', 'chilling'].includes(p)) c.classList.add('desk'); });
    });
  }
  if (only.includes('facings')) {
    const s = sec('facings', 'Facings × dir (md 128): ¾ right · side right · front · ¾ left · side left');
    cast.forEach(a => {
      const r = row(s); r.insertAdjacentHTML('beforeend', `<span class="gal-rl">${a.role}</span>`);
      [['three-quarter', 'right'], ['side', 'right'], ['front', 'right'], ['three-quarter', 'left'], ['side', 'left']].forEach(([f, d]) => cell(r, hero(a, { size: 128, facing: f, dir: d })));
      cell(r, hero(a, { size: 128, pose: 'walking', facing: 'side' }), 'walk');
      cell(r, hero(a, { size: 128, pose: 'talking', facing: 'side', dir: 'left' }), 'talk ←');
    });
  }
  if (only.includes('sizes')) {
    const s = sec('sizes', 'Sizes: 40 · 48 (xs) · 56 · 64 · 72 · 96 (sm) · 160 (md) · 360 (xl)', 'LOD (lod-xs) applies below 64px: no badge/blush/trim, thicker ink, keeps headgear, tool, eyes, catch-light.');
    ['a-baron', 'a-twinkle'].forEach(id => { const r = row(s, 'gal-bottom'); [40, 48, 56, 64, 72, 96, 160, 360].forEach(px => cell(r, hero(agentById(id), { size: px }), px + 'px')); });
  }
  if (only.includes('looks')) {
    const s = sec('looks', 'Identity: builds × hair (no role gear) · accessories · builds in gear');
    BUILDS.forEach(b => { const r = row(s); r.insertAdjacentHTML('beforeend', `<span class="gal-rl">${b}</span>`);
      HAIR.forEach((h, i) => cell(r, hero({ name: b, hue: HUES[i % 7], build: b, hair: h }, { size: 'sm' }), h)); });
    const r2 = row(s); r2.insertAdjacentHTML('beforeend', '<span class="gal-rl">extra</span>');
    ACCESSORIES.forEach((acc, i) => cell(r2, hero({ name: acc, hue: HUES[(i + 3) % 7], build: 'hero', hair: 'tuft', accessory: acc }, { size: 'sm', facing: 'front' }), acc));
    const r3 = row(s); r3.insertAdjacentHTML('beforeend', '<span class="gal-rl">gear</span>');
    BUILDS.forEach(b => ['Frontend', 'DevOps', 'Quality'].forEach(role => cell(r3, hero({ name: b, hue: 'sky', build: b, hair: 'swoop', role }, { size: 'sm' }), `${b} · ${role}`)));
    const r4 = row(s); r4.insertAdjacentHTML('beforeend', '<span class="gal-rl">hues</span>');
    HUES.forEach(hk => cell(r4, hero({ name: hk, hue: hk, build: 'hero', hair: 'curl', role: 'Research' }, { size: 'sm' }), COLOR_NAMES[hk]));
  }
  if (only.includes('extras')) {
    const s = sec('extras', 'Captain · ghost · holding · seated · role override · turn demo');
    const r = row(s, 'gal-bottom');
    const semi = agentById('a-semic'), tw = agentById('a-twinkle');
    cell(r, hero(semi, { size: 'xs', captain: true, armband: PALETTE.sun }), 'captain xs (pip)');
    cell(r, hero(semi, { size: 'sm', captain: true, armband: PALETTE.sun }), 'captain sm (pip)');
    cell(r, hero(semi, { size: 'md', captain: true, armband: PALETTE.sun, facing: 'front' }), 'captain md (armband)');
    cell(r, hero(agentById('a-lint'), { size: 'md', captain: true, armband: PALETTE.mint, pose: 'salute' }), 'captain salute');
    cell(r, hero({}, { size: 'md', ghost: true }), 'ghost / + New');
    cell(r, hero(tw, { size: 'md' }), 'Twinkle · Design');
    cell(r, hero(tw, { size: 'md', role: 'Research' }), 'role override → Research');
    const r2 = row(s, 'gal-bottom');
    HOLDINGS.forEach(h => cell(r2, hero(agentById('a-scar'), { size: 128, pose: h === 'envelope' ? 'carrying' : h === 'pen' ? 'writing' : h === 'binder' ? 'reading' : 'idle', holding: h }), 'holding ' + h));
    const r3 = row(s, 'gal-bottom');
    ['typing', 'chilling', 'sleeping', 'needs-input'].forEach(p => { const c = cell(r3, hero(agentById('a-pete'), { size: 128, pose: p, seated: true, label: true }), p + ' · seated'); c.classList.add('desk'); });
    const demo = hero(agentById('a-scar'), { size: 160, pose: 'typing', seated: true });
    const c = cell(r3, demo, 'setFacing turn demo'); c.classList.add('desk');
    const btn = document.createElement('button'); btn.className = 'btn btn-ghost on-dark btn-sm'; btn.textContent = 'Turn to me';
    btn.onclick = () => { const f = demo.classList.contains('face-front'); setFacing(demo, f ? 'three-quarter' : 'front'); btn.textContent = f ? 'Turn to me' : 'Back to work'; };
    c.appendChild(btn);
  }
  if (only.includes('emblems')) {
    const s = sec('emblems', 'Emblems × 7 hues (88px) · 24px · 16px · captain pips');
    EMBLEMS.forEach(e => {
      const r = row(s); r.insertAdjacentHTML('beforeend', `<span class="gal-rl">${e.name}</span>`);
      HUES.forEach(hk => cell(r, emblem({ emblem: e.id, color: hk }, 88)));
      const small = document.createElement('div'); small.className = 'gal-small';
      HUES.forEach(hk => { small.appendChild(emblem({ emblem: e.id, color: hk }, 24)); });
      small.appendChild(emblem({ emblem: e.id, color: 'sun' }, 16));
      r.appendChild(small);
    });
    const r = row(s); HUES.forEach(hk => r.appendChild(captainPip(hk)));
  }
}

</script>
<script data-module="js/app.js">
"use strict";
/* ============================================================
   app.js — boot, studio nav, hash router, global keys, motes.
   Routes:  #projects · #cast · #cast/teams · #access · #blueprint ·
            #office/<projectId>[/<sub>]  (also #office → aurora; #board,
            #features, #feature/<id> → office sub-layers) · #gallery[/<section>]
   Hooks into other modules (defined by them):
            renderProjects/renderAccess/renderBlueprint (studio.js),
            renderCast(tab) (cast.js), openOffice(id, sub)/closeOffice() (office-*.js),
            renderGallery(section) (gallery.js)
   Public:  STAGES, APP (current route state), route()
   ============================================================ */
const STAGES = [{ id: 'projects', label: 'Projects' }, { id: 'cast', label: 'Cast' }, { id: 'access', label: 'Access' }, { id: 'blueprint', label: 'Blueprint' }];
const APP = { view: null, stage: 'projects', sub: '' };

function _buildNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = STAGES.map(s => `<a href="#${s.id}" data-stage="${s.id}">${s.label}</a>`).join('');
}
function _showLayer(which) {
  document.getElementById('studio').hidden = which !== 'studio';
  document.getElementById('office').hidden = which !== 'office';
  document.getElementById('gallery').hidden = which !== 'gallery';
}

function route() {
  const parts = currentRoute().split('/').filter(Boolean);
  let head = parts[0] || 'projects';
  /* office shorthands from spec-office §3.5 */
  if (['board', 'features', 'feature'].includes(head)) { parts.unshift('office', 'aurora'); head = 'office'; }
  if (head === 'office' && (!parts[1] || ['board', 'features', 'feature'].includes(parts[1]))) parts.splice(1, 0, 'aurora');

  if (APP.view === 'office' && head !== 'office' && typeof closeOffice === 'function') closeOffice();
  if (sheetOpen()) closeSheet();

  if (head === 'gallery') {
    _showLayer('gallery'); APP.view = 'gallery';
    renderGallery(parts[1] || ''); return;
  }
  if (head === 'office') {
    _showLayer('office'); APP.view = 'office'; APP.sub = parts.slice(2).join('/');
    openOffice(parts[1], APP.sub); return;
  }
  const stage = STAGES.some(s => s.id === head) ? head : 'projects';
  _showLayer('studio'); APP.view = 'studio'; APP.stage = stage; APP.sub = parts.slice(1).join('/');
  document.querySelectorAll('#stage .scene').forEach(s => s.classList.toggle('active', s.id === 'scene-' + stage));
  document.querySelectorAll('#nav a').forEach(a => { if (a.dataset.stage === stage) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (stage === 'projects') renderProjects();
  if (stage === 'cast') renderCast(parts[1] === 'teams' ? 'teams' : 'agents');
  if (stage === 'access') renderAccess();
  if (stage === 'blueprint') renderBlueprint();
}

/* keyboard: '/' focuses project search; ←/→ move studio stages when focus is
   on the page itself or the nav (never steals arrows from lists/radiogroups) */
window.addEventListener('keydown', e => {
  if (e.defaultPrevented) return;
  const t = e.target;
  const typing = /input|textarea|select/i.test(t.tagName) || t.isContentEditable;
  if (APP.view !== 'studio' || sheetOpen() || typing) return;
  if (e.key === '/' && APP.stage === 'projects') {
    const s = document.getElementById('projSearch'); if (s) { e.preventDefault(); s.focus(); } return;
  }
  const free = t === document.body || t.closest('#nav') || t.classList.contains('scene');
  if (!free || (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft')) return;
  const i = STAGES.findIndex(s => s.id === APP.stage);
  const j = e.key === 'ArrowRight' ? Math.min(STAGES.length - 1, i + 1) : Math.max(0, i - 1);
  if (j !== i) { e.preventDefault(); go(STAGES[j].id); }
});

function _motes() {
  const m = document.getElementById('motes');
  for (let i = 0; i < 22; i++) {
    const d = document.createElement('span'); d.className = 'mote'; const s = 2 + Math.random() * 5;
    d.style.width = s + 'px'; d.style.height = s + 'px'; d.style.left = Math.random() * 100 + 'vw'; d.style.bottom = (-10 - Math.random() * 20) + 'vh';
    d.style.animationDuration = (14 + Math.random() * 20) + 's'; d.style.animationDelay = (-Math.random() * 20) + 's'; m.appendChild(d);
  }
}

/* ---- boot ---- */
_buildNav(); _motes();
window.addEventListener('hashchange', route);
route();

</script>
