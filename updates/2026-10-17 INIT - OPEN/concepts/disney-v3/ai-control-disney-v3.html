/* ------------------------------------------------------------ health report */
OB._health = function () {
  const word = { A: 'Great', B: 'Good', C: 'Needs work' };
  this.el.setAttribute('aria-label', 'Health check report');
  return `${_obBack('Office', 'Back to the office')}
    <header class="ob-hhead"><h2>Health check</h2><span>Checked ${escapeHtml(WS.checkup.when)}</span></header>
    <ul class="ob-health">${WS.checkup.items.map(it => `<li>
      <div class="ob-hk"><span class="ob-grade g-${it.grade}" aria-hidden="true">${it.grade}</span><b>${escapeHtml(it.name)}</b><span class="ob-hw">${word[it.grade] || ''}<span class="sr-only"> (grade ${it.grade})</span></span></div>
      <p><span class="ob-hl">Good</span>${escapeHtml(it.good)}</p>
      <p><span class="ob-hl">To fix</span>${escapeHtml(it.fix)}</p></li>`).join('')}</ul>`;
};

/* ------------------------------------------------------------ features folder */
OB._folder = function () {
  const by = st => WS.features.filter(f => f.status === st).sort((a, b) => a.order - b.order);
  this.el.setAttribute('aria-label', 'Features');
  const group = (st, title) => { const list = by(st); return list.length ? `<h3>${title}</h3><ul class="ob-rows">${list.map(f => `<li><button type="button" class="ob-row" data-key="r-${f.id}" data-fid="${f.id}">${_obMark(f.status)}<span class="sr-only">${OB_ST[f.status]}:</span><span class="ob-rn">${escapeHtml(f.name)}</span><span class="ob-chev" aria-hidden="true">›</span></button></li>`).join('')}</ul>` : ''; };
  return `${_obBack('Office', 'Back to the office')}
    <header class="ob-hhead"><h2>Features</h2></header>
    <div class="ob-scroll">${group('now', 'Now')}${group('planned', 'Planned')}${group('shipped', 'Shipped')}</div>`;
};

/* ------------------------------------------------------------ feature page */
OB._dirty = function () { const f = wsFeature(this.feature); const d = this.draft; return !!(f && d && (d.description !== f.description || d.vision !== f.vision)); };
OB._featurePage = function () {
  const f = wsFeature(this.feature), d = this.draft, dirty = this._dirty();
  this.el.setAttribute('aria-label', `Feature: ${f.name}`);
  return `${_obBack('Features', 'Back to all features')}
    <header class="ob-hhead"><h2>${escapeHtml(f.name)}</h2><span class="ob-st">${_obMark(f.status)}${OB_ST[f.status]}</span></header>
    <label class="ob-fl" for="obDesc">Description</label>
    <textarea id="obDesc" class="ob-ta${d.staged === 'description' ? ' staged' : ''}" data-key="desc" data-sec="description" rows="5">${escapeHtml(d.description)}</textarea>
    <label class="ob-fl" for="obVis">Vision</label>
    <textarea id="obVis" class="ob-ta" data-key="vis" data-sec="vision" rows="4">${escapeHtml(d.vision)}</textarea>
    <footer class="ob-foot">${this._confirm
      ? `<div class="ob-confirm" role="alert"><span>Unsaved changes.</span><button type="button" class="btn btn-ghost btn-sm" data-c="keep">Keep editing</button><button type="button" class="btn btn-ghost btn-sm" data-c="discard">Discard</button><button type="button" class="btn btn-hero btn-sm" data-c="save">Save</button></div>`
      : `<span class="ob-saved" aria-live="polite">${f.revisedAt && !dirty ? 'Saved' : ''}</span><button type="button" class="btn btn-hero btn-sm" id="obSave" data-key="save" ${dirty ? '' : 'disabled'}>Save &amp; brief Pixel</button>`}</footer>`;
};

/* ------------------------------------------------------------ wiring */
OB._wire = function (kind) {
  const el = this.el;
  el.querySelector('.ob-back').onclick = () => this.escape();
  el.querySelectorAll('[data-feat],[data-fid]').forEach(b => b.onclick = () => go('feature/' + (b.dataset.feat || b.dataset.fid)));
  if (kind !== 'feature') return;
  el.querySelectorAll('textarea').forEach(ta => ta.oninput = () => {
    this.draft[ta.dataset.sec] = ta.value;
    const s = el.querySelector('#obSave'); if (s) s.disabled = !this._dirty();
    const sv = el.querySelector('.ob-saved'); if (sv) sv.textContent = this._dirty() ? 'Unsaved' : '';
  });
  const save = el.querySelector('#obSave'); if (save) save.onclick = () => { this._save(); this._key = ''; this._render(); el.querySelector('.ob-back').focus(); };
  el.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
    const c = b.dataset.c; this._confirm = false;
    if (c === 'keep') { this._key = ''; this._render(); el.querySelector('textarea').focus(); }
    if (c === 'discard') { this.draft = null; go('features'); }
    if (c === 'save') { this._save(); go('features'); }
  });
};
OB._save = function () {
  const f = wsFeature(this.feature); const d = this.draft;
  f.description = d.description.trim(); f.vision = d.vision.trim(); f.revisedAt = 'just now';
  this.draft = { description: f.description, vision: f.vision };
  let msg = `Got it — the ${f.name} brief is updated. I'll brief whoever picks it up.`;
  let tellId = null;
  if (f.status === 'now' && f.owner) {
    tellId = teamById(f.owner) ? wsCaptain(f.owner) : f.owner;
    if (tellId && wsAgent(tellId) && wsAgent(tellId).onProject) msg += ` Telling ${OP._short(tellId)} now.`; else tellId = null;
  }
  OP.post('pixel', { from: 'pixel', kind: 'text', text: msg, stream: true });
  toast('Saved — Pixel is briefed');
  if (tellId) OE.say('pixel', '', { to: tellId, ms: 1600 });
  officeChanged();
};

/* voice path: Pixel removes the sentence that mentions <word>; you confirm with "Save it" */
OB.stageDrop = function (fid, word) {
  const f = wsFeature(fid); if (!f) return false;
  const cut = s => { const parts = s.match(/[^.!?]+[.!?]*\s*/g) || [s]; const keep = parts.filter(p => !p.toLowerCase().includes(word.toLowerCase())); return keep.length === parts.length ? null : keep.join('').trim(); };
  const base = this.feature === fid && this.draft ? this.draft : { description: f.description, vision: f.vision };
  const nd = cut(base.description), nv = nd == null ? cut(base.vision) : null;
  if (nd == null && nv == null) return false;
  this.feature = fid;
  this.draft = { description: nd ?? base.description, vision: nv ?? base.vision, staged: nd != null ? 'description' : 'vision' };
  if (this.sub === 'feature/' + fid) { this._key = ''; this._render(); } else go('feature/' + fid);
  return true;
};
OB.saveStaged = function () { if (!this.draft || !this._dirty()) return false; this._save(); if (this.el && this.sub.startsWith('feature/')) { this._key = ''; this._render(); } return true; };
OB.discardStaged = function () { const f = wsFeature(this.feature); if (!f) return; this.draft = { description: f.description, vision: f.vision }; if (this.el && this.sub.startsWith('feature/')) { this._key = ''; this._render(); } };

</script>
<script data-module="js/office-sim.js">
"use strict";
/* ============================================================
   office-sim.js — the story that makes the office feel alive (spec-office §6).
   Act 1: SIM_SCRIPT beats (Aurora only, one-shot). Act 2: a calm 30s ambient
   loop forever. Calm rule: agents stay at their desks; talk is "…" bubbles,
   hand-offs and pushes fly as paper. Walking is rare and purposeful
   (deploy, update the plan, arrive, wake up, clock off).

   Public: OS.start(), OS.stop(), OS.replay(), OS.skipTo(t),
           OS.onAnswer(ask, answer)  consequences of answering a "!"
           OS.wake(id)               Pixel brings a sleeper in
   Dev hooks (URL ?demo=…, not in UI): fast · t<sec> · ask · chat · talk ·
           ship · end · sleepy · peek · list · size2|size6|size12|size20 · selftest
   ============================================================ */

const OS = { timers: [], running: false, t0: 0, cycleN: 0, seed: 7, busy: {} };

OS._param = function () { const m = /[?&]demo=([^&#]+)/.exec(location.search); return m ? decodeURIComponent(m[1]).split(',') : []; };
OS.start = async function () {
  this.stop(); this.running = true; this.busy = {}; this.lock = {};
  const demo = this._param();
  OE.speed = demo.includes('fast') ? 3 : 1;
  /* coming back to the office resumes the story where it was — never replays it */
  const d = WS.office.demo;
  if (d.started) { this._settle(); if (WS.story !== 'aurora' || d.t > SIM_ACT1_END) this._ambient(); else this._schedule(d.t); return; }
  d.started = true;
  if (demo.includes('selftest')) { setTimeout(() => officeSelftest(), 50); return; }
  if (WS.story !== 'aurora') { this.t0 = Date.now(); this._ambient(); this._hooks(demo); return; }
  let skip = 0;
  demo.forEach(x => { const m = /^t(\d+)$/.exec(x); if (m) skip = +m[1]; });
  if (demo.includes('ask') || demo.includes('chat')) skip = Math.max(skip, 25);
  if (demo.includes('talk')) skip = Math.max(skip, 8);
  if (demo.includes('ship')) skip = Math.max(skip, 47);
  if (demo.includes('end')) skip = Math.max(skip, SIM_ACT1_END + 1);
  if (skip) await this.skipTo(skip);
  else this._schedule(0);
  this._hooks(demo);
};
OS._hooks = function (demo) {
  if (demo.includes('chat')) setTimeout(() => OP.open('a-scar', { from: 'scene' }), 30);
  if (demo.includes('pete')) setTimeout(() => OP.open('a-pete', { from: 'scene' }), 30);
  if (demo.includes('sleepy')) setTimeout(() => OP.sleeperPoke('a-query'), 30);
  if (demo.includes('list')) setTimeout(() => _omToggleList(true), 30);
  if (demo.includes('peek')) setTimeout(() => { const b = document.querySelector('.o-body[data-id="a-semic"]'); if (b) b.classList.add('peek'); }, 30);
  if (demo.includes('talk')) setTimeout(() => { const ids = wsOnProject().filter(a => a.session !== 'asleep').map(a => a.id); OE.instant = false; if (ids.length > 1) OE.converse(ids[0], ids[1], 8); }, 30);
};
OS.stop = function () {
  if (this.running && this.t0) WS.office.demo.t = Math.max(WS.office.demo.t || 0, (Date.now() - this.t0) / 1000 * OE.speed);
  this.timers.forEach(clearTimeout); this.timers = []; this.running = false;
};
/* after an interrupted visit: anyone caught mid-errand goes back to a sensible state */
OS._settle = function () {
  const transient = ['commit', 'handoff', 'talking', 'deploying', 'arriving', 'leaving', 'writing', 'shipped'];
  [WS.director, ...wsOnProject()].forEach(a => {
    if (!transient.includes(a.activity.kind)) return;
    a.at = a.seat || a.at;
    a.activity = Object.assign({}, a.activity, a.id === 'pixel' ? { kind: 'planning', short: 'Big picture' } : { kind: 'coding', short: null });
  });
};
OS.replay = function () { toast('↺ Replaying Act 1'); location.reload(); };
OS._at = function (sec, fn) { this.timers.push(setTimeout(fn, sec * 1000 / OE.speed)); };

/* schedule beats with t > from (seconds) */
OS._schedule = function (from) {
  this.t0 = Date.now() - from * 1000 / OE.speed;
  SIM_SCRIPT.filter(b => b.t >= from && !(from > 0 && b.t <= from)).forEach(b => this._at(b.t - from, () => this._run(b)));
  this._at(Math.max(0, SIM_ACT1_END - from), () => this._ambient());
};
OS.skipTo = async function (t) {
  OE.instant = true;
  for (const b of SIM_SCRIPT.filter(x => x.t <= t)) { try { await this._run(b); } catch (e) { console.error('beat failed', b.t, b.do, e && e.message); } }
  OE.instant = false;
  officeRefresh();
  WS.office.demo.t = t;
  if (t > SIM_ACT1_END) { this.t0 = Date.now() - t * 1000; this._ambient(); } else this._schedule(t);
};
/* one beat at a time per actor: a new beat waits for that actor's previous one */
OS._run = function (b) {
  const key = b.actor || '_world';
  const p = (this.lock[key] || Promise.resolve()).then(() => this._exec(b));
  this.lock[key] = p.catch(() => {});
  return p;
};
OS._exec = async function (b) {
  const h = this.H[b.do]; if (!h) return;
  if (b.actor) this.busy[b.actor] = (this.busy[b.actor] || 0) + 1;
  try { await h.call(this, b); } finally { if (b.actor) this.busy[b.actor]--; officeChanged(); }
};

/* ------------------------------------------------------------ helpers */
const _osA = id => wsAgent(id);
const _osName = id => OP._name(id);
OS._rand = function (n) { this.seed = (this.seed * 9301 + 49297) % 233280; return Math.floor(this.seed / 233280 * n); };
OS._tick = function (id, k) { const a = _osA(id); if (a) a.tokens.total += k; };
OS._restore = function (id, prev) { OE.setActivity(id, prev.kind, prev); };
OS._seat = function (id) { const a = _osA(id); return a.seat || a.at; };
OS._check = function (kid) { const k = WS.checklist.find(x => x.id === kid); if (k && !k.done) { k.done = true; k.assignees.forEach(id => { const a = _osA(id); if (a) a.tasksDone++; }); } };
OS._comm = function (from, to, kind) { WS.comms.push({ id: 'c' + WS.comms.length, at: Date.now(), from, to, kind }); };
OS._outbox = function () { const o = OE.plan.objects.outbox; return { x: o.x + 31, y: o.y + 10 }; };

/* ------------------------------------------------------------ beat handlers */
OS.H = {
  open() {
    const box = document.getElementById('oBox'); if (!box || OE.instant || reducedMotion()) return;
    box.querySelector('.o-cam').classList.add('opening');
    setTimeout(() => box.querySelector('.o-cam') && box.querySelector('.o-cam').classList.remove('opening'), 900);
  },
  activity(b) { OE.setActivity(b.actor, b.kind, b); },

  /* a push: a paper plane flies from the desk to the push box (nobody walks) */
  async commit(b) {
    const id = b.actor; await OE.free(id);
    await OE.fly('plane', OE.deskTop(id), this._outbox(), 1400);
    WS.github.fresh = true; WS.github.pushedAgo = 'just now'; _osA(id).tasksDone++; this._tick(id, 1500);
    const flag = OE.art && OE.art.querySelector('#outFlag'); if (flag && !OE.instant) { flag.classList.remove('wave'); void flag.getBBox; flag.classList.add('wave'); }
    officeChanged();
  },

  /* talk: both turn to each other and trade "…" bubbles from their seats */
  async talk(b) {
    const id = b.actor, to = b.to; await OE.free(id);
    this._comm(id, to, 'talk');
    await OE.converse(id, to, (b.lines || [1, 2]).length);
    const a = _osA(id), t = _osA(to);
    if (a) OE.setActivity(id, a.activity.kind, a.activity);
    if (t) OE.setActivity(to, t.activity.kind, t.activity);
    if (id === 'a-lint' && to === 'a-twinkle') OE.setActivity('a-lint', 'coding', { label: 'Merging card twins', detail: 'Merging the three card twins into one <Card>', target: 'Card.tsx', featureId: 'cleanup' });
  },

  /* hand-off: an envelope flies desk → desk and lands in their tray */
  async handoff(b) {
    const id = b.actor, to = b.to; await OE.free(id);
    this._comm(id, to, 'handoff');
    await OE.fly('envelope', OE.deskTop(id), OE.deskTop(to), 1300);
    const desk = OE.desks[_osA(to).seat]; if (desk) { desk.tray = 'new'; OE.deskSync(desk.id); }
    _osA(id).tasksDone++;
    await OE.free(to);
    OE.setActivity(to, 'reviewing', { short: b.artifact, detail: `Reviewing ${b.artifact}`, target: b.artifact });
    await OE.sleep(2400); this._tick(to, 3000);
    if (desk) { desk.tray = null; OE.deskSync(desk.id); }
    if (b.review) OE.react(to, 'hop');
    if (to === 'a-scar') OE.setActivity(to, 'testing', { short: '48 tests', detail: 'Running the 48-case payment suite', target: 'refund.test.ts', featureId: 'checkout' });
    else OE.setActivity(to, 'coding', { short: 'Release branch', detail: 'Cutting the release branch for v1.0', target: 'release/v1.0', featureId: 'voice' });
  },

  async tests(b) {
    const id = b.actor; await OE.free(id);
    if (_osA(id).activity.kind !== 'testing') { OE.setActivity(id, 'testing', { short: 'Running tests', detail: 'Running the test suite', featureId: _osA(id).activity.featureId }); await OE.sleep(1600); }
    this._tick(id, 2500);
    if (b.result === 'red') {
      OE.setActivity(id, 'tests-red', { short: `${b.failing} failing`, detail: `${b.failing} failing in refund.test — Captain is fixing`, featureId: 'checkout' });
      if (b.shout) { this._comm(id, b.shout.to, 'shout'); await OE.say(id, '', { to: b.shout.to }); }
      OE.setActivity(b.shout.to, 'coding', { short: 'Fixing refunds', detail: 'Fixing the 2 refund failures', target: 'refund.ts', featureId: 'checkout' });
      OE.setActivity(id, 'waiting', { short: 'on Captain', detail: 'Waiting on Captain’s refund fix', featureId: 'checkout' });
      return;
    }
    OE.setActivity(id, 'tests-green', { short: 'All green', detail: 'All tests passing', featureId: _osA(id).activity.featureId });
    if (b.check) this._check(b.check);
    if (b.feature) { const f = wsFeature(b.feature); if (f) f.pct = b.pct; }
    officeChanged();
    await OE.sleep(1600);
    if (id === 'a-pete') OE.setActivity(id, 'idle', { short: 'Voice done', detail: 'Voice search is green — waiting for the preview', featureId: 'voice' });
    else OE.setActivity(id, 'coding', { short: 'Contrast pass', detail: 'Contrast pass on the merged <Card>', target: 'Card.tsx', featureId: 'cleanup' });
  },

  async ask(b) {
    const id = b.actor; await OE.free(id);
    OE.setActivity(id, 'needs-input', { short: 'Needs you', detail: b.ask.short, featureId: b.ask.featureId });
    if (b.ask.type === 'access') { const f = wsFeature(b.ask.featureId); if (f) f.blocked = true; }
    OP.ask(Object.assign({}, b.ask));
    /* ignored for 20s → one bigger hop, once. No nagging. */
    this.timers.push(setTimeout(() => { if (WS.pending.find(p => p.id === b.ask.id)) OE.react(id, 'bighop'); }, OE.instant ? 0 : 20000));
  },

  /* nothing left to do: walk to the couch and sleep (purposeful walk #1) */
  async clockOff(b) {
    const id = b.actor; await OE.free(id);
    OE.setActivity(id, 'leaving', { short: 'Clocked off', detail: 'Session ended — heading to the couch' });
    await OE.walkTo(id, this._couch());
    OE.setActivity(id, 'sleeping', { detail: 'Cast on Aurora, no running session' });
    announce(`${_osName(id)} clocked off.`);
  },

  /* deploy: Baron walks to the deploy station on the left wall and back */
  async deploy(b) {
    const id = b.actor; await OE.free(id);
    const prev = { ..._osA(id).activity };
    const home = _osA(id).at;
    OE.setActivity(id, 'deploying', { short: 'Preview', detail: 'Deploying a fresh preview', featureId: 'voice' });
    await OE.walkTo(id, 'console');
    await OE.sleep(700);
    const btn = OE.art && OE.art.querySelector('#consoleBtn'); if (btn && !OE.instant) { btn.classList.remove('press'); void btn.getBBox; btn.classList.add('press'); }
    WS.testFresh = 'deployed just now'; OM.testFresh = true; officeChanged();
    if (!OE.instant) setTimeout(() => { OM.testFresh = false; officeChanged(); }, 6000);
    this._tick(id, 4000); _osA(id).tasksDone++;
    await OE.sleep(900);
    await OE.walkTo(id, home);
    this._restore(id, prev);
  },

  async ship(b) {
    const f = wsFeature(b.feature); if (!f) return;
    f.status = 'shipped'; f.pct = 100; f.order = 0;
    WS.checklist.filter(k => k.featureId === b.feature).forEach(k => this._check(k.id));
    WS.overall = Math.min(100, WS.overall + 6);
    const id = b.actor; const r = OE.actors[id];
    OE.setActivity(id, 'shipped', { short: f.name, detail: `Shipped ${f.name}!`, featureId: b.feature });
    if (r) OE.burst(r.x, r.y - 120);
    if (!OE.instant) toast(`✨ ${escapeHtml(f.name)} shipped`);
    announce(`${f.name} shipped.`);
    OP.post('pixel', { from: 'pixel', kind: 'text', text: `${f.name} is live on the preview 🎉 — want me to start Multi-currency?`, stream: !OE.instant });
    officeChanged();
    await OE.sleep(2600);
    OE.setActivity(id, 'idle', { short: 'Free', detail: `Free! Last thing I did: shipped ${f.name}` });
  },

  /* Pixel walks to the whiteboard and adds a line (purposeful walk) */
  async whiteboard(b) {
    const id = 'pixel'; await OE.free(id);
    const prev = { ...WS.director.activity };
    OE.setActivity(id, 'writing', { short: 'Updating plan', detail: 'Updating the plan on the whiteboard' });
    await OE.walkTo(id, 'whiteboard');
    const r = OE.actors.pixel; if (r) setFacing(r.hero, 'side', { dir: 'left' });
    await OE.sleep(1800);
    WS.checklist.push(Object.assign({ id: 'k' + (WS.checklist.length + 1), done: false }, b.addCheck));
    officeChanged();
    await OE.walkTo(id, 'director');
    OE.setActivity(id, prev.kind, prev);
  },

  /* someone new joins: in through the door, straight to their desk */
  async arrive(b) {
    const id = b.actor; const a = _osA(id); a.onProject = true; a.at = 'door'; a.seat = a.home;
    const r = OE.actors[id];
    OE.adopt(a.seat, id);
    OE.setActivity(id, 'arriving', { short: 'Just joined', detail: 'Just joined — here to cut the release' });
    THEME_OFFICE.door(OE.art, true);
    if (r) { OE._moveNow(r, OE.anchor('door').x, OE.anchor('door').y); r.wrap.classList.remove('gone'); }
    announce(`${_osName(id)} joined.`);
    await OE.sleep(500);
    await OE.walkTo(id, a.seat);
    THEME_OFFICE.door(OE.art, false);
    OE.setActivity(id, b.kind, { short: 'Release notes', detail: b.label, target: b.target, featureId: 'voice' });
  },

  /* Pixel calls a sleeper in from his desk ("…"); they stretch and walk to their desk */
  async wake(b) {
    const target = b.target; const t = _osA(target); if (!t || t.session !== 'asleep') return;
    await OE.free('pixel');
    await OE.say('pixel', '', { to: target, ms: 1400 });
    OE.react(target, 'stretch');
    t.session = 'running';
    if (!t.seat) { t.seat = t.home; OE.adopt(t.seat, target); }
    OE.setActivity(target, 'arriving', { short: 'Waking up', detail: 'Stretching — on my way' });
    await OE.say(target, '', { ms: 1000 });
    await OE.walkTo(target, t.seat);
    OE.setActivity(target, b.kind || 'reading', { short: 'Rates API', detail: b.label || 'Reading rates API docs', target: b.file || 'rates API docs', featureId: 'multicur' });
  },
};
OS._couch = function () {
  const taken = WS.agents.filter(a => a.onProject).map(a => a.at);
  for (let i = 1; i <= 3; i++) if (!taken.includes('couch-' + i)) return 'couch-' + i;
  return 'couch-3';
};
OS.wake = function (id) { this._run({ do: 'wake', actor: 'pixel', target: id }); };

/* consequences of answering a "!" */
OS.onAnswer = async function (ask, answer) {
  const id = ask.agentId; const a = _osA(id); if (!a) return;
  OE.react(id, 'hop');
  if (ask.type === 'access') {
    a.locked = (a.locked || []).filter(x => x !== ask.want); a.reach = [...new Set([...(a.reach || []), ask.want])];
    const f = wsFeature(ask.featureId); if (f) f.blocked = false;
    OE.setActivity(id, 'testing', { short: 'Payment suite', detail: 'Running the payment suite with the Stripe test key', target: 'refund.test.ts', featureId: 'checkout' });
    OP._say(id, 'Thanks! Running the payment suite now 🧪');
    await OE.sleep(4000); await OE.free(id);
    OE.setActivity(id, 'tests-green', { short: '48 passing', detail: '48 passing — checkout verified', featureId: 'checkout' });
    if (f) f.pct = Math.min(99, f.pct + 6);
    this._check('k5'); WS.overall = Math.min(100, WS.overall + 2);
    officeChanged();
    await OE.sleep(1800);
    OE.setActivity(id, 'reading', { short: 'Demo sign-off', detail: 'Writing the checkout demo sign-off', target: 'signoff.md', featureId: 'checkout' });
  } else {
    OP._say(id, `${answer.replace(/[“”]/g, '')} it is — updating the button.`);
    OE.setActivity(id, 'coding', { short: 'Cart button', detail: `Updating the cart button to ${answer}`, target: 'CartButton.tsx', featureId: 'cleanup' });
  }
};

/* ------------------------------------------------------------ Act 2: calm ambient loop (nobody walks) */
OS._ambient = function () {
  const C = SIM_AMBIENT.cycle;
  const pick = (pred) => {
    const pool = wsOnProject().filter(a => pred(a) && !this.busy[a.id] && !(OE.actors[a.id] || {}).held && a.at === a.seat);
    return pool.length ? pool[this._rand(pool.length)] : null;
  };
  const awake = a => a.session === 'running' && a.activity.kind !== 'needs-input';
  const run = (b) => this._run(b);
  const cycle = () => {
    const n = this.cycleN++;
    this._at(3, () => { const a = pick(x => awake(x) && x.activity.kind === 'coding'); if (a) run({ do: 'commit', actor: a.id, n: 1 }); });
    this._at(9, () => {
      const a = pick(awake); if (!a) return;
      const b = pick(x => awake(x) && x.id !== a.id && x.teamId && x.teamId === a.teamId) || pick(x => awake(x) && x.id !== a.id);
      if (b) run({ do: 'talk', actor: a.id, to: b.id, lines: Array(SIM_AMBIENT.talks[n % SIM_AMBIENT.talks.length]).fill('') });
    });
    this._at(16, async () => {
      const a = pick(x => awake(x) && x.activity.kind === 'coding'); if (!a) return;
      const red = this._rand(100) < 12;
      this.busy[a.id] = (this.busy[a.id] || 0) + 1;
      try {
        OE.setActivity(a.id, 'testing', { short: 'Running tests', detail: 'Running the test suite', featureId: a.activity.featureId });
        await OE.sleep(2600);
        if (red) { OE.setActivity(a.id, 'tests-red', { short: '1 failing', detail: '1 failing — fixing it', featureId: a.activity.featureId }); await OE.sleep(6000); }
        OE.setActivity(a.id, 'tests-green', { short: 'All green', detail: 'All tests passing', featureId: a.activity.featureId }); a.tasksDone++;
        await OE.sleep(1500);
        const file = SIM_AMBIENT.files.coding[(n + 2) % SIM_AMBIENT.files.coding.length];
        OE.setActivity(a.id, 'coding', { short: file, detail: `Writing ${file}`, target: file, featureId: a.activity.featureId });
      } finally { this.busy[a.id]--; }
    });
    this._at(22, () => {
      const a = pick(x => awake(x) && x.activity.kind === 'reading'); if (!a) return;
      const file = SIM_AMBIENT.files.coding[n % SIM_AMBIENT.files.coding.length];
      OE.setActivity(a.id, 'coding', { short: file, detail: `Writing ${file}`, target: file, featureId: a.activity.featureId });
      const b = pick(x => awake(x) && x.activity.kind === 'coding' && x.id !== a.id);
      if (b && n % 2) { const rf = SIM_AMBIENT.files.reading[n % SIM_AMBIENT.files.reading.length]; OE.setActivity(b.id, 'reading', { short: rf, detail: `Reading ${rf}`, target: rf, featureId: b.activity.featureId }); }
    });
    /* features creep, tokens tick */
    this._at(C - 1, () => {
      WS.features.filter(f => f.status === 'now' && !f.blocked && f.pct < 96).forEach(f => f.pct += 1 + this._rand(2));
      wsOnProject().forEach(a => { if (a.session === 'running') this._tick(a.id, (a.activity.kind === 'reading' ? 3000 : 1200) + this._rand(1500)); });
      this._tick('pixel', 800);
      officeChanged();
    });
    this._at(C, cycle);
  };
  cycle();
};

</script>
<script data-module="js/office-main.js">
"use strict";
/* ============================================================
   office-main.js — The Office shell (spec-office §1.4, §5, §8).
   Owns: layout (top bar · stage · panel), the stage's object hotspots,
         the accessible list mirror, stage keyboard model, layer routing.
   Contract the router relies on:
     openOffice(projectId, sub)  sub = '' | 'board' | 'features' | 'feature/<id>'
     closeOffice()
   Public: officeChanged(id?) — any module calls this after changing WS;
           officeRefresh() — immediate full refresh of mirrors;
           OM.clickActor(id), OM.focusActor(id), OM.layer
   Demo hooks (dev only, not in UI): ?demo=<state> — see office-sim.js OS.demo.
   ============================================================ */

const OM = { project: null, mounted: false, layer: '', listOpen: false, wide: false, focusId: 'pixel', _q: false };

function openOffice(projectId, sub = '') {
  const p = projById(projectId) || PROJECTS[0];
  if (!OM.mounted || OM.project !== p.id) _omMount(p);
  _omLayer(sub || '');
}
function closeOffice() {
  if (typeof OS !== 'undefined') OS.stop();
  OE.unmount(); OM.mounted = false; OM.project = null;
  document.removeEventListener('keydown', _omKeys);
  window.removeEventListener('resize', _omResize);
  document.getElementById('office').innerHTML = '';
}

function _omMount(p) {
  OM.project = p.id; OM.mounted = true;
  const host = document.getElementById('office');
  host.innerHTML = `
    <header class="o-top" role="banner">
      <a class="ws-chip o-back" href="#projects" aria-label="Back to all projects">← <span>Projects</span></a>
      <div class="o-title">${logoTile(p, true)}<div><b>${escapeHtml(p.name)}</b><span>The Office</span></div></div>
      <button class="o-prog" id="oProg" type="button" aria-label="Open the whiteboard"></button>
      <span class="spacer"></span>
      <div class="o-chips">
        <a class="ws-chip" href="#" id="oGh"></a>
        <button class="ws-chip" type="button" id="oPriv"></button>
        <a class="ws-chip live-dot" href="#" id="oTest"></a>
        <button class="ws-chip" type="button" id="oAccess">🔑 <span class="o-lbl">Access</span></button>
        <button class="ws-chip" type="button" id="oBell"></button>
      </div>
    </header>
    <div class="o-main">
      <section class="o-stagewrap" id="oStage" aria-roledescription="office scene">
        <div class="o-box" id="oBox"></div>
        <div class="o-hots" id="oHots"></div>
        <div class="o-scrim" aria-hidden="true"></div>
        <div class="o-layers" id="oLayers"></div>
        <div class="o-stagectl">
          <button class="o-ctl" type="button" id="oListBtn" aria-pressed="false" aria-controls="oList">▤ <span>List</span></button>
          <button class="o-ctl" type="button" id="oWideBtn" aria-pressed="false" aria-label="Hide the chat panel">⤢</button>
        </div>
        <div class="o-list" id="oList" role="region" aria-label="Office list — everyone and what they are doing"></div>
      </section>
      <aside class="o-panel" id="oPanel"></aside>
    </div>`;
  /* top bar wiring */
  host.querySelector('#oProg').onclick = () => go('board');
  host.querySelector('#oGh').onclick = e => { e.preventDefault(); toast(`🐙 Pushed ${escapeHtml(WS.github.pushedAgo)} · branch <span style="font-family:var(--mono)">${escapeHtml(WS.github.branch)}</span>`); };
  host.querySelector('#oTest').onclick = e => { e.preventDefault(); toast('↗ Opening the preview (prototype — no real link)'); };
  host.querySelector('#oPriv').onclick = _omPrivacy;
  host.querySelector('#oAccess').onclick = () => openProjectAccess(WS.grants, p.name.split(' ')[0]);
  host.querySelector('#oBell').onclick = () => { const ask = WS.pending[0]; if (ask) OP.open(ask.agentId, { from: 'bell' }); else toast('Nobody is waiting on you 🎈'); };
  host.querySelector('#oListBtn').onclick = () => _omToggleList();
  host.querySelector('#oWideBtn').onclick = () => _omWide(!OM.wide);

  OE.mount(host.querySelector('#oBox'));
  _omHotspots();
  OP.mount(host.querySelector('#oPanel'));
  _omStageA11y();
  document.addEventListener('keydown', _omKeys);
  window.addEventListener('resize', _omResize);
  officeRefresh();
  OS.start();
}
function _omResize() { OE.fit(); if (OM.layer) OB.reposition(); }

/* ------------------------------------------------------------ the only three interactive objects */
const OM_HOTS = [
  { id: 'dossier', label: 'Features — now, planned, shipped', act: () => go('features') },
  { id: 'whiteboard', label: 'Whiteboard — progress and tasks', act: () => go('board') },
  { id: 'health', label: 'Health check — modularity, cleanliness, reusability', act: () => go('health') },
];
function _omHotspots() {
  const box = document.querySelector('#oBox .o-world');
  OM_HOTS.forEach(h => {
    const o = THEME_OFFICE.plan.objects[h.id];
    const b = document.createElement('button'); b.type = 'button'; b.className = 'o-hot'; b.dataset.obj = h.id; b.tabIndex = -1;
    b.setAttribute('aria-label', h.label);
    b.style.cssText = `left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px`;
    b.innerHTML = `<span class="o-hot-l" aria-hidden="true">${escapeHtml(o.label)}</span>`;
    b.onclick = e => { e.stopPropagation(); OM.opener = b; h.act(); };
    box.appendChild(b);
  });
}

/* ------------------------------------------------------------ actors: click + keyboard */
function _omStageA11y() {
  const stage = document.getElementById('oStage');
  stage.addEventListener('click', e => {
    const b = e.target.closest('.o-body'); if (!b) return;
    OM.opener = b; OM.clickActor(b.dataset.id);
  });
  stage.addEventListener('focusin', e => {
    const t = e.target.closest('.o-body,.o-hot'); if (!t) return;
    OM.focusId = t.dataset.id || 'obj:' + t.dataset.obj; _omRoving();
  });
  /* bubbles pause while hovered (spec §2 communication) */
  _omRoving();
}
OM.clickActor = function (id) {
  const a = wsAgent(id); if (!a) return;
  if (a.activity.kind === 'sleeping') { OP.sleeperPoke(id); return; }
  OP.open(id, { from: 'scene' });
};
/* order: Pixel → desks in reading order (row, then x) → couch → objects */
function _omOrder() {
  const rank = id => { if (id === 'pixel') return -1; const r = OE.actors[id]; return r ? Math.round(r.y / 120) * 100000 + r.x : 1e9; };
  const ids = ['pixel', ...wsOnProject().map(a => a.id)].sort((a, b) => rank(a) - rank(b));
  return [...ids, ...OM_HOTS.map(h => 'obj:' + h.id)];
}
function _omEl(key) { return key.startsWith('obj:') ? document.querySelector(`.o-hot[data-obj="${key.slice(4)}"]`) : document.querySelector(`.o-body[data-id="${key}"]`); }
function _omRoving() {
  document.querySelectorAll('#oStage .o-body,#oStage .o-hot').forEach(el => el.tabIndex = -1);
  const el = _omEl(OM.focusId) || _omEl('pixel'); if (el) el.tabIndex = 0;
}
OM.focusActor = function (key) { OM.focusId = key; _omRoving(); const el = _omEl(key); if (el) el.focus({ preventScroll: true }); };
function _omPos(key) {
  if (key.startsWith('obj:')) { const o = THEME_OFFICE.plan.objects[key.slice(4)]; return { x: o.x + o.w / 2, y: o.y + o.h / 2 }; }
  const r = OE.actors[key]; return r ? { x: r.x, y: r.y - 50 } : { x: 0, y: 0 };
}
function _omKeys(e) {
  if (APP.view !== 'office' || sheetOpen()) return;
  const t = e.target; const typing = /input|textarea|select/i.test(t.tagName) || t.isContentEditable;
  if (e.key === 'Escape' && !typing) {
    if (OM.listOpen) { _omToggleList(false); return; }
    if (OM.layer) { e.preventDefault(); OB.escape(); return; }
    if (OP.thread !== 'pixel') { OP.open('pixel'); return; }
  }
  if (typing) return;
  if (e.altKey && (e.key === 'r' || e.key === 'R' || e.code === 'KeyR')) { e.preventDefault(); OS.replay(); return; }
  if (e.key === '!' ) {
    const ask = WS.pending[0]; if (!ask) { announce('Nobody needs you right now.'); return; }
    e.preventDefault(); if (OM.layer) go('office'); OM.focusActor(ask.agentId); return;
  }
  const inStage = t.closest && t.closest('#oStage .o-body,#oStage .o-hot'); if (!inStage || OM.layer) return;
  const order = _omOrder();
  if (e.key === 'Home') { e.preventDefault(); OM.focusActor('pixel'); return; }
  if (e.key === 'End') { e.preventDefault(); OM.focusActor(order[order.length - 1]); return; }
  const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const d = dirs[e.key]; if (!d) return;
  e.preventDefault();
  const cur = _omPos(OM.focusId); let best = null, bs = Infinity;
  order.forEach(k => {
    if (k === OM.focusId) return; const el = _omEl(k); if (!el || el.closest('.gone')) return;
    const p = _omPos(k); const dx = p.x - cur.x, dy = p.y - cur.y;
    const along = dx * d[0] + dy * d[1]; if (along <= 4) return;
    const across = Math.abs(dx * d[1]) + Math.abs(dy * d[0]);
    const s = along + across * 2.2; if (s < bs) { bs = s; best = k; }
  });
  if (best) OM.focusActor(best);
}

/* ------------------------------------------------------------ refresh (mirrors) */
function officeChanged() {
  if (OM._q) return; OM._q = true;
  Promise.resolve().then(() => { OM._q = false; officeRefresh(); });
}
function officeRefresh() {
  if (!OM.mounted) return;
  _omTop(); _omList();
  const n = WS.pending.length, people = 1 + wsOnProject().length;
  document.getElementById('oStage').setAttribute('aria-label', `Office — ${people} people${n ? `, ${n} need${n === 1 ? 's' : ''} you` : ''}. Arrow keys move between people; ! jumps to whoever needs you.`);
  document.getElementById('oStage').setAttribute('role', 'group');
  THEME_OFFICE.sync(OE.art, WS);
  Object.values(OE.actors).forEach(r => OE._card(r));
  OP.refresh();
  if (OM.layer) OB.refresh();
}
function _omTop() {
  const $ = id => document.getElementById(id);
  $('oProg').innerHTML = `<b>${WS.overall}%</b><span class="o-pbar"><i style="width:${WS.overall}%"></i></span><span class="o-ptgt">→ ${escapeHtml(WS.target)}</span>`;
  $('oProg').setAttribute('aria-label', `${WS.overall}% to ${WS.target} — open the whiteboard`);
  $('oGh').innerHTML = `<span class="ok">●</span> <span class="o-lbl">GitHub</span> ✓`;
  $('oGh').title = `Pushed ${WS.github.pushedAgo} · branch ${WS.github.branch}`;
  $('oGh').setAttribute('aria-label', `GitHub connected — pushed ${WS.github.pushedAgo}`);
  $('oPriv').innerHTML = WS.private ? '🔒 <span class="o-lbl">Private</span>' : '🌐 <span class="o-lbl">Public</span>';
  $('oTest').innerHTML = `Test ↗ <span class="o-lbl o-url">${escapeHtml(WS.testUrl)}</span>`;
  $('oTest').title = `Preview ${WS.testFresh}`;
  $('oTest').classList.toggle('fresh', !!OM.testFresh);
  const n = WS.pending.length;
  $('oBell').innerHTML = `🔔${n ? `<span class="bell-badge">${n}</span>` : ''}`;
  $('oBell').setAttribute('aria-label', n ? `${n} ${n === 1 ? 'person needs' : 'people need'} your input — open the oldest` : 'Nobody is waiting on you');
}
function _omPrivacy() {
  const goingPublic = WS.private;
  const body = document.createElement('div');
  body.innerHTML = `<h2>${goingPublic ? 'Make Aurora public?' : 'Make Aurora private?'}</h2>
    <p class="hint" style="margin:8px 0 18px;font-size:14px">${goingPublic ? 'Anyone with the GitHub link will see the code. Secrets stay masked and never leave the vault.' : 'Only you and granted agents will see the repo.'}</p>
    <div class="row"><button class="btn btn-ghost" id="pvNo">Keep ${goingPublic ? 'private' : 'public'}</button><button class="btn btn-hero" id="pvYes">${goingPublic ? 'Make public' : 'Make private'}</button></div>`;
  openSheet(body, 'Change visibility');
  body.querySelector('#pvNo').onclick = closeSheet;
  body.querySelector('#pvYes').onclick = () => { WS.private = !WS.private; closeSheet(); toast(WS.private ? '🔒 Aurora is private' : '🌐 Aurora is public'); officeRefresh(); };
}

/* list mirror: same state, grouped; rows do what clicking the agent does */
function _omList() {
  const el = document.getElementById('oList'); if (!el) return;
  const row = a => {
    const ag = agentById(a.id === 'pixel' ? 'director' : a.id); const act = ACTIVITY[a.activity.kind] || ACTIVITY.idle;
    const needs = a.activity.kind === 'needs-input';
    return `<li><button type="button" class="o-lrow${needs ? ' needs' : ''}" data-id="${a.id}">
      <span class="o-lface" style="background:${hueHex(ag.hue)}" aria-hidden="true">${escapeHtml(ag.name[0])}</span>
      <span class="o-lt"><b>${escapeHtml(ag.name)}</b><span class="o-lact">${act.icon} ${escapeHtml(needs ? 'Needs you' : a.session === 'asleep' ? 'Off shift' : a.activity.detail || a.activity.label)}</span></span></button></li>`;
  };
  const on = wsOnProject();
  const groups = [['Director', [WS.director]]];
  wsTeamIds().forEach(t => groups.push([teamById(t).name, on.filter(a => a.teamId === t && a.session !== 'asleep')]));
  groups.push(['Solo', on.filter(a => !a.teamId && a.session !== 'asleep')]);
  groups.push(['Off shift', on.filter(a => a.session === 'asleep')]);
  const cur = wsDemoSize();
  el.innerHTML = `<div class="o-lhead"><b>Everyone</b><button type="button" class="o-ctl" id="oListClose" aria-label="Close list">✕</button></div>
    ${groups.filter(g => g[1].length).map(([name, list]) => `<h3>${escapeHtml(name)}</h3><ul>${list.map(row).join('')}</ul>`).join('')}
    <nav class="o-dev" aria-label="Demo office size (dev)">Size ${['size2', 'size6', 'size12', 'size20'].map(k => `<a href="?demo=${k}#office"${k === cur ? ' aria-current="true"' : ''}>${k.slice(4)}</a>`).join('')}</nav>`;
  el.querySelector('#oListClose').onclick = () => _omToggleList(false);
  el.querySelectorAll('.o-lrow').forEach(b => b.onclick = () => { OM.opener = b; OM.clickActor(b.dataset.id); });
}
function _omToggleList(force) {
  OM.listOpen = force == null ? !OM.listOpen : force;
  document.getElementById('oStage').classList.toggle('list-open', OM.listOpen);
  const b = document.getElementById('oListBtn'); b.setAttribute('aria-pressed', OM.listOpen);
  if (OM.listOpen) { const f = document.querySelector('#oList .o-lrow'); if (f) f.focus(); } else b.focus();
}
function _omWide(on) {
  OM.wide = on; document.getElementById('office').classList.toggle('wide', on);
  const b = document.getElementById('oWideBtn'); b.setAttribute('aria-pressed', on); b.setAttribute('aria-label', on ? 'Show the chat panel' : 'Hide the chat panel');
  setTimeout(() => OE.fit(), 320); OE.fit();
}
OM.showPanel = function () {
  if (OM.wide) _omWide(false);
  const o = document.getElementById('office'); if (o.classList.contains('drawer-up')) return;
  o.classList.add('drawer-up'); setTimeout(() => OE.fit(), 340);
};

/* ------------------------------------------------------------ layers: office → board → features → feature */
function _omLayer(sub) {
  const prev = OM.layer; OM.layer = sub;
  if (!sub) { OB.close(); if (prev && OM.opener && document.contains(OM.opener)) { try { OM.opener.focus({ preventScroll: true }); } catch (e) { } } return; }
  OB.show(sub);
}

</script>
<script data-module="js/office-selftest.js">
"use strict";
/* ============================================================
   office-selftest.js — DEV ONLY. ?demo=selftest drives the real Office UI
   end to end (asks, chat, zoom layers, feature editing, keyboard, layout)
   and logs PASS/FAIL lines to the console. Not reachable from the UI.
   Run: Chrome --headless --enable-logging=stderr --virtual-time-budget=60000
        --dump-dom "…/ai-control-disney-v3.html?demo=selftest#office"
   ============================================================ */
async function officeSelftest() {
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = s => document.querySelector(s);
  let fails = 0;
  const ok = (cond, name) => { if (!cond) fails++; console.log((cond ? 'PASS ' : 'FAIL ') + name); };
  const key = (k, el = document.activeElement || document.body, extra = {}) => el.dispatchEvent(new KeyboardEvent('keydown', Object.assign({ key: k, bubbles: true }, extra)));

  /* calm scene */
  ok(!$('.o-tag'), 'no status tags above heads');
  ok([...document.querySelectorAll('.o-hot')].map(h => h.dataset.obj).sort().join() === 'dossier,health,whiteboard', 'only whiteboard, health, features are interactive objects');
  ok(!$('.c-jacket'), 'no jackets / headless bodies on chairs');
  ok(!$('#opMic') && !$('#opQuick') && !$('#opWait'), 'chat: no mic, no quick replies, no waiting row');
  const ob = THEME_OFFICE.plan.objects;
  ok(ob.outbox.x + ob.outbox.w < ob.dossier.x && ob.console.x + ob.console.w < ob.dossier.x, 'push + deploy sit left, away from the whiteboard');

  /* layout scales from config */
  const p2 = officeLayout({ teams: [{ id: 'a', members: ['x1', 'x2'] }], solo: [] });
  ok(p2.W === 1600 && Object.keys(p2.seats).length === 2 && p2.rows.length === 1, 'layout: 2 agents → one row, base room');
  const big = { teams: Array.from({ length: 5 }, (_, i) => ({ id: 't' + i, members: Array.from({ length: 4 }, (_, j) => `t${i}m${j}`) })), solo: ['s1', 's2'] };
  const p20 = officeLayout(big);
  ok(Object.keys(p20.seats).length === 22 && p20.W > 1600 && p20.rows.length === 2, 'layout: 22 agents → room grows, two rows (W=' + p20.W + ')');
  const inRoom = Object.values(p20.seats).every(s => s.x > 40 && s.x < p20.W - 420);
  ok(inRoom, 'layout: every desk stays inside the floor (no overflow)');
  const overlap = p20.pods.some((a, i) => p20.pods.some((b, j) => j > i && a.row === b.row && a.rug.x < b.rug.x + b.rug.w && b.rug.x < a.rug.x + a.rug.w));
  ok(!overlap, 'layout: pods never overlap');

  /* walking glides (no teleport) */
  OE.instant = false;
  const r = OE.actors['a-baron']; const p0 = r.x + ',' + r.y;
  const walk = OE.walkTo('a-baron', 'console');
  await wait(300);
  const mid = r.x + ',' + r.y;
  await walk;
  const c = OE.anchor('console');
  ok(reducedMotion() || (mid !== p0 && Math.abs(r.x - c.x) < 1 && Math.abs(r.y - c.y) < 1 && mid !== r.x + ',' + r.y), 'walks glide continuously to the target');
  await OE.walkTo('a-baron', wsAgent('a-baron').seat); OE.setActivity('a-baron', 'idle', { detail: 'Feet up' });

  /* the "!" flow */
  await OS.skipTo(25); await wait(50);
  ok(WS.pending.length === 1 && WS.pending[0].agentId === 'a-scar', 'Scarlett raises a "!" at t=23');
  ok(!$('.o-body[data-id="a-scar"] .o-bang').hidden, '"!" badge visible over Scarlett');
  ok(/1/.test($('#oBell').textContent), 'bell shows 1');
  ok(/Stripe test key/.test($('.o-body[data-id="a-scar"]').getAttribute('aria-label')), 'actor label names the ask');
  ok(/Needs you/.test($('.o-body[data-id="a-scar"] .o-card').textContent), 'hover card says what they need');

  $('.o-body[data-id="a-scar"]').click(); await wait(50);
  ok(OP.thread === 'a-scar', 'click Scarlett → her thread');
  ok(OE.actors['a-scar'].wrap.classList.contains('held'), 'she stops and faces you');
  ok(!!$('.op-ask.live'), 'ask card is live in the chat');
  ok(/••••/.test($('.op-ask.live .vl').textContent), 'credential value is masked');
  ok(/Grant Stripe/.test($('.op-ask.live .btn-hero').textContent), 'one button grants and hands over');
  $('.op-ask.live .btn-hero').click(); await wait(80);
  ok(WS.pending.length === 0 && WS.grants.stripe, 'grant + hand over resolves the ask');
  ok($('.o-body[data-id="a-scar"] .o-bang').hidden, '"!" cleared');
  ok(wsAgent('a-scar').activity.kind === 'testing', 'Scarlett back to testing');
  ok(!/sk_live_[0-9a-z]{4}/i.test(document.getElementById('office').innerHTML), 'only masked secret values in the office DOM');

  OP.open('pixel'); await wait(20);
  ok(!OE.actors['a-scar'].held, 'leaving her thread releases her');
  ok(!(WS.threads.pixel || []).some(m => m.kind === 'system' || m.kind === 'comm'), 'no "office updates" in Pixel\'s chat');
  $('.o-body[data-id="a-query"]').click(); await wait(50);
  ok(OP.thread === 'pixel', 'sleeper click does not open chat');
  ok(!!$('.o-chip'), '"Chat anyway" chip offered');

  const inp = $('#opInput'); inp.value = '@Captain how is checkout going?'; $('#opSend').click(); await wait(1200);
  ok(OP.thread === 'a-semic', '@Captain routes to Captain\'s thread');
  ok((WS.threads['a-semic'] || []).some(m => m.from === 'a-semic' && m.kind === 'text'), 'Captain answers in his thread');

  /* talking shows "…" only */
  OE.say('a-pete', 'secret words', {}); await wait(30);
  const bub = $('.o-body[data-id="a-pete"] .o-bubble');
  ok(!bub.hidden && !/secret/.test(bub.textContent), 'agent talk is a plain "…" bubble');

  /* voice path on the feature text */
  OP.open('pixel'); OP._user('Drop crypto from multi-currency.'); await wait(1600);
  ok(location.hash === '#feature/multicur' && /crypto/i.test(wsFeature('multicur').description) && !/crypto/i.test($('#obDesc').value), 'voice: "drop crypto…" stages the edit in the text block');
  OP._user('Save it'); await wait(1400);
  ok(!/crypto/i.test(wsFeature('multicur').description), 'voice: "Save it" applies the edit');
  go('office'); await wait(400);

  /* whiteboard: just the number, in-progress features, tasks */
  go('board'); await wait(900);
  const card = $('.ob-card');
  ok(card && card.classList.contains('in'), '#board zooms onto the whiteboard');
  ok(/%/.test(card.textContent) && /In progress/.test(card.textContent) && /Tasks/.test(card.textContent), 'board shows %, in progress, tasks');
  ok(!/Who did what|Tokens|Checkup/.test(card.textContent) && !card.querySelector('.ob-as'), 'board has no who-did-what, tokens or A/B/C');
  ok($('#oStage').classList.contains('zooming') && OE.box.classList.contains('zoomed'), 'scene behind is frozen under the scrim');
  key('Escape', document.body); await wait(300);
  ok(location.hash === '#office' && !$('.ob-card'), 'Esc → office');

  /* health report */
  go('health'); await wait(900);
  ok(/Modularity/.test($('.ob-card').textContent) && /Cleanliness/.test($('.ob-card').textContent) && /Reusability/.test($('.ob-card').textContent) && /To fix/.test($('.ob-card').textContent), 'health: three areas, each with good + to fix');
  ok(OE.zoom.obj === 'health', 'health zooms onto the health board');
  go('office'); await wait(300);

  /* features folder + feature page */
  go('features'); await wait(900);
  ok([...document.querySelectorAll('.ob-card h3')].map(h => h.textContent).join() === 'Now,Planned,Shipped', 'features: Now / Planned / Shipped');
  ok(!$('.ob-own') && document.querySelectorAll('.ob-row').length === WS.features.length, 'features: identical rows, no owners');
  ok(document.querySelectorAll('.ob-mark.m-shipped').length === WS.features.filter(f => f.status === 'shipped').length, 'shipped rows carry the green mark');
  $('[data-fid="recs"]').click(); await wait(300);
  ok(location.hash === '#feature/recs' && $('#obDesc') && $('#obDesc').tagName === 'TEXTAREA' && $('#obVis').tagName === 'TEXTAREA', 'feature: description + vision are text blocks');
  ok($('#obSave').disabled, 'save disabled until something changes');
  const ta = $('#obVis'); ta.value = 'Helpful, never pushy. Shows at most three items.'; ta.dispatchEvent(new Event('input'));
  ok(!$('#obSave').disabled, 'typing enables save');
  key('Escape', document.body); await wait(50);
  ok(!!$('.ob-confirm'), 'Esc with unsaved edits asks first');
  $('.ob-confirm [data-c="save"]').click(); await wait(300);
  ok(/three items/.test(wsFeature('recs').vision) && /updated/.test(WS.threads.pixel.slice(-1)[0].text), 'save stores the text and briefs Pixel');
  ok(location.hash === '#features', 'save from confirm → back to features');
  key('Escape', document.body); await wait(300);
  ok(location.hash === '#office', 'Esc → office');

  /* keyboard + list */
  OM.focusActor('pixel'); await wait(10);
  key('ArrowLeft'); await wait(10);
  ok(OM.focusId !== 'pixel', 'arrow keys move between people (' + OM.focusId + ')');
  key('Home'); await wait(10);
  ok(document.activeElement && document.activeElement.dataset.id === 'pixel', 'Home → Pixel');
  ok($('#oList').querySelectorAll('.o-lrow').length === 1 + wsOnProject().length, 'list mirror lists everyone');
  ok(!/Around the office/.test($('#oList').textContent), 'list has no "Around the office"');
  ok($('#oList .o-dev') && $('#oList .o-dev').querySelectorAll('a').length === 4, 'list has the tiny size switch');

  /* decision ask (Twinkle) answered with a chip */
  OP.ask({ id: 'ask-test', agentId: 'a-twinkle', type: 'decision', short: 'Cart button copy', q: 'Which reads better?', ctx: 'Not blocking', options: ['Add to bag', 'Add to cart'], featureId: 'cleanup' });
  OE.setActivity('a-twinkle', 'needs-input', { short: 'Needs you', detail: 'Cart button copy' }); await wait(30);
  $('#oBell').click(); await wait(50);
  ok(OP.thread === 'a-twinkle' && !!$('.op-ask.live .chip'), 'bell opens the oldest ask (decision chips)');
  $('.op-ask.live .chip').click(); await wait(80);
  ok(!WS.pending.length && wsAgent('a-twinkle').activity.kind === 'coding', 'decision chip answers and unblocks');

  /* leave and come back: the story resumes, it does not replay */
  const pend = WS.pending.length; go('projects'); await wait(200); go('office'); await wait(600);
  ok(WS.pending.length === pend && wsAgent('a-scar').activity.kind !== 'needs-input', 'reopening resumes (no replayed asks)');
  ok(!!$('.o-body[data-id="a-merge"]'), 'office rebuilt from state');
  console.log(fails ? `SELFTEST: ${fails} FAILED` : 'SELFTEST: ALL PASS');
}

</script>
<script data-module="js/gallery.js">
"use strict";
/* ============================================================
   gallery.js — #gallery dev route: every role × pose × facing × size,
   all builds / hair / accessories, extras, and every emblem × 7 hues.
   Public: renderGallery(section)   section = '' (all) | roster | poses |
           facings | sizes | zoom | looks | extras | emblems
   Dev-only; not linked from the studio nav.
   ============================================================ */
const GALLERY_SECTIONS = ['roster', 'zoom', 'poses', 'facings', 'sizes', 'looks', 'extras', 'emblems'];

function renderGallery(section = '') {
  const host = document.getElementById('gallery');
  const only = GALLERY_SECTIONS.includes(section) ? [section] : GALLERY_SECTIONS;
  host.innerHTML = `<header class="gal-head"><b>Character gallery</b>
    <nav>${GALLERY_SECTIONS.map(s => `<a href="#gallery/${s}"${s === section ? ' aria-current="page"' : ''}>${s}</a>`).join('')}<a href="#gallery">all</a><a href="#projects">← studio</a></nav></header>
    <main class="gal-body"></main>`;
  const body = host.querySelector('.gal-body');
  const cast = [...AGENTS, DIRECTOR];
  const sec = (id, title, note) => {
    const s = document.createElement('section'); s.className = 'gal-sec'; s.id = 'gal-' + id;
    s.innerHTML = `<h2>${title}</h2>${note ? `<p>${note}</p>` : ''}`; body.appendChild(s); return s;
  };
  const row = (parent, cls = '') => { const r = document.createElement('div'); r.className = 'gal-row ' + cls; parent.appendChild(r); return r; };
  const cell = (r, el, cap) => { const c = document.createElement('figure'); c.className = 'gal-cell'; c.appendChild(el); if (cap) c.insertAdjacentHTML('beforeend', `<figcaption>${cap}</figcaption>`); r.appendChild(c); return c; };

  if (only.includes('roster')) {
    const s = sec('roster', 'Roster at 48px (legibility) · colour / greyscale', 'Each role must be nameable from headgear + tool alone.');
    const r1 = row(s), r2 = row(s, 'gray'), r3 = row(s);
    cast.forEach(a => { cell(r1, hero(a, { size: 'xs' }), a.role); cell(r2, hero(a, { size: 'xs' }), a.role); cell(r3, hero(a, { size: 'sm' }), a.name); });
  }
  if (only.includes('zoom')) {
    const s = sec('zoom', 'Hero zoom size (xl 360) — front, looking at you');
    const r = row(s);
    ['a-pete', 'a-semic', 'a-scar', 'a-lint'].forEach(id => cell(r, hero(agentById(id), id === 'a-semic' ? { size: 'xl', facing: 'front', captain: true, armband: PALETTE.sun } : { size: 'xl', facing: 'front' }), agentById(id).name));
  }
  if (only.includes('poses')) {
    const s = sec('poses', 'Every role × every pose (sm 96, three-quarter)', 'Seated poses (typing, chilling) sit on a desk stub here; the Office supplies real desks.');
    const head = row(s, 'gal-poses-head'); head.innerHTML = '<span></span>' + POSES.map(p => `<span>${p}</span>`).join('');
    cast.forEach(a => {
      const r = row(s, 'gal-poses'); r.insertAdjacentHTML('beforeend', `<span class="gal-rl">${a.role}</span>`);
      POSES.forEach(p => { const c = cell(r, hero(a, { size: 'sm', pose: p })); if (['typing', 'chilling'].includes(p)) c.classList.add('desk'); });
    });
  }
  if (only.includes('facings')) {
    const s = sec('facings', 'Facings × dir (md 128): ¾ right · side right · front · ¾ left · side left');
    cast.forEach(a => {
      const r = row(s); r.insertAdjacentHTML('beforeend', `<span class="gal-rl">${a.role}</span>`);
      [['three-quarter', 'right'], ['side', 'right'], ['front', 'right'], ['three-quarter', 'left'], ['side', 'left']].forEach(([f, d]) => cell(r, hero(a, { size: 128, facing: f, dir: d })));
      cell(r, hero(a, { size: 128, pose: 'walking', facing: 'side' }), 'walk');
      cell(r, hero(a, { size: 128, pose: 'talking', facing: 'side', dir: 'left' }), 'talk ←');
    });
  }
  if (only.includes('sizes')) {
    const s = sec('sizes', 'Sizes: 40 · 48 (xs) · 56 · 64 · 72 · 96 (sm) · 160 (md) · 360 (xl)', 'LOD (lod-xs) applies below 64px: no badge/blush/trim, thicker ink, keeps headgear, tool, eyes, catch-light.');
    ['a-baron', 'a-twinkle'].forEach(id => { const r = row(s, 'gal-bottom'); [40, 48, 56, 64, 72, 96, 160, 360].forEach(px => cell(r, hero(agentById(id), { size: px }), px + 'px')); });
  }
  if (only.includes('looks')) {
    const s = sec('looks', 'Identity: builds × hair (no role gear) · accessories · builds in gear');
    BUILDS.forEach(b => { const r = row(s); r.insertAdjacentHTML('beforeend', `<span class="gal-rl">${b}</span>`);
      HAIR.forEach((h, i) => cell(r, hero({ name: b, hue: HUES[i % 7], build: b, hair: h }, { size: 'sm' }), h)); });
    const r2 = row(s); r2.insertAdjacentHTML('beforeend', '<span class="gal-rl">extra</span>');
    ACCESSORIES.forEach((acc, i) => cell(r2, hero({ name: acc, hue: HUES[(i + 3) % 7], build: 'hero', hair: 'tuft', accessory: acc }, { size: 'sm', facing: 'front' }), acc));
    const r3 = row(s); r3.insertAdjacentHTML('beforeend', '<span class="gal-rl">gear</span>');
    BUILDS.forEach(b => ['Frontend', 'DevOps', 'Quality'].forEach(role => cell(r3, hero({ name: b, hue: 'sky', build: b, hair: 'swoop', role }, { size: 'sm' }), `${b} · ${role}`)));
    const r4 = row(s); r4.insertAdjacentHTML('beforeend', '<span class="gal-rl">hues</span>');
    HUES.forEach(hk => cell(r4, hero({ name: hk, hue: hk, build: 'hero', hair: 'curl', role: 'Research' }, { size: 'sm' }), COLOR_NAMES[hk]));
  }
  if (only.includes('extras')) {
    const s = sec('extras', 'Captain · ghost · holding · seated · role override · turn demo');
    const r = row(s, 'gal-bottom');
    const semi = agentById('a-semic'), tw = agentById('a-twinkle');
    cell(r, hero(semi, { size: 'xs', captain: true, armband: PALETTE.sun }), 'captain xs (pip)');
    cell(r, hero(semi, { size: 'sm', captain: true, armband: PALETTE.sun }), 'captain sm (pip)');
    cell(r, hero(semi, { size: 'md', captain: true, armband: PALETTE.sun, facing: 'front' }), 'captain md (armband)');
    cell(r, hero(agentById('a-lint'), { size: 'md', captain: true, armband: PALETTE.mint, pose: 'salute' }), 'captain salute');
    cell(r, hero({}, { size: 'md', ghost: true }), 'ghost / + New');
    cell(r, hero(tw, { size: 'md' }), 'Twinkle · Design');
    cell(r, hero(tw, { size: 'md', role: 'Research' }), 'role override → Research');
    const r2 = row(s, 'gal-bottom');
    HOLDINGS.forEach(h => cell(r2, hero(agentById('a-scar'), { size: 128, pose: h === 'envelope' ? 'carrying' : h === 'pen' ? 'writing' : h === 'binder' ? 'reading' : 'idle', holding: h }), 'holding ' + h));
    const r3 = row(s, 'gal-bottom');
    ['typing', 'chilling', 'sleeping', 'needs-input'].forEach(p => { const c = cell(r3, hero(agentById('a-pete'), { size: 128, pose: p, seated: true, label: true }), p + ' · seated'); c.classList.add('desk'); });
    const demo = hero(agentById('a-scar'), { size: 160, pose: 'typing', seated: true });
    const c = cell(r3, demo, 'setFacing turn demo'); c.classList.add('desk');
    const btn = document.createElement('button'); btn.className = 'btn btn-ghost on-dark btn-sm'; btn.textContent = 'Turn to me';
    btn.onclick = () => { const f = demo.classList.contains('face-front'); setFacing(demo, f ? 'three-quarter' : 'front'); btn.textContent = f ? 'Turn to me' : 'Back to work'; };
    c.appendChild(btn);
  }
  if (only.includes('emblems')) {
    const s = sec('emblems', 'Emblems × 7 hues (88px) · 24px · 16px · captain pips');
    EMBLEMS.forEach(e => {
      const r = row(s); r.insertAdjacentHTML('beforeend', `<span class="gal-rl">${e.name}</span>`);
      HUES.forEach(hk => cell(r, emblem({ emblem: e.id, color: hk }, 88)));
      const small = document.createElement('div'); small.className = 'gal-small';
      HUES.forEach(hk => { small.appendChild(emblem({ emblem: e.id, color: hk }, 24)); });
      small.appendChild(emblem({ emblem: e.id, color: 'sun' }, 16));
      r.appendChild(small);
    });
    const r = row(s); HUES.forEach(hk => r.appendChild(captainPip(hk)));
  }
}

</script>
<script data-module="js/app.js">
"use strict";
/* ============================================================
   app.js — boot, studio nav, hash router, global keys, motes.
   Routes:  #projects · #cast · #cast/teams · #access · #blueprint ·
            #office/<projectId>[/<sub>]  (also #office → aurora; #board,
            #features, #feature/<id> → office sub-layers) · #gallery[/<section>]
   Hooks into other modules (defined by them):
            renderProjects/renderAccess/renderBlueprint (studio.js),
            renderCast(tab) (cast.js), openOffice(id, sub)/closeOffice() (office-*.js),
            renderGallery(section) (gallery.js)
   Public:  STAGES, APP (current route state), route()
   ============================================================ */
const STAGES = [{ id: 'projects', label: 'Projects' }, { id: 'cast', label: 'Cast' }, { id: 'access', label: 'Access' }, { id: 'blueprint', label: 'Blueprint' }];
const APP = { view: null, stage: 'projects', sub: '' };

function _buildNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = STAGES.map(s => `<a href="#${s.id}" data-stage="${s.id}">${s.label}</a>`).join('');
}
function _showLayer(which) {
  document.getElementById('studio').hidden = which !== 'studio';
  document.getElementById('office').hidden = which !== 'office';
  document.getElementById('gallery').hidden = which !== 'gallery';
}

function route() {
  const parts = currentRoute().split('/').filter(Boolean);
  let head = parts[0] || 'projects';
  /* office shorthands from spec-office §3.5 */
  if (['board', 'health', 'features', 'feature'].includes(head)) { parts.unshift('office', 'aurora'); head = 'office'; }
  if (head === 'office' && (!parts[1] || ['board', 'health', 'features', 'feature'].includes(parts[1]))) parts.splice(1, 0, 'aurora');

  if (APP.view === 'office' && head !== 'office' && typeof closeOffice === 'function') closeOffice();
  if (sheetOpen()) closeSheet();

  if (head === 'gallery') {
    _showLayer('gallery'); APP.view = 'gallery';
    renderGallery(parts[1] || ''); return;
  }
  if (head === 'office') {
    _showLayer('office'); APP.view = 'office'; APP.sub = parts.slice(2).join('/');
    openOffice(parts[1], APP.sub); return;
  }
  const stage = STAGES.some(s => s.id === head) ? head : 'projects';
  _showLayer('studio'); APP.view = 'studio'; APP.stage = stage; APP.sub = parts.slice(1).join('/');
  document.querySelectorAll('#stage .scene').forEach(s => s.classList.toggle('active', s.id === 'scene-' + stage));
  document.querySelectorAll('#nav a').forEach(a => { if (a.dataset.stage === stage) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (stage === 'projects') renderProjects();
  if (stage === 'cast') renderCast(parts[1] === 'teams' ? 'teams' : 'agents');
  if (stage === 'access') renderAccess();
  if (stage === 'blueprint') renderBlueprint();
}

/* keyboard: '/' focuses project search; ←/→ move studio stages when focus is
   on the page itself or the nav (never steals arrows from lists/radiogroups) */
window.addEventListener('keydown', e => {
  if (e.defaultPrevented) return;
  const t = e.target;
  const typing = /input|textarea|select/i.test(t.tagName) || t.isContentEditable;
  if (APP.view !== 'studio' || sheetOpen() || typing) return;
  if (e.key === '/' && APP.stage === 'projects') {
    const s = document.getElementById('projSearch'); if (s) { e.preventDefault(); s.focus(); } return;
  }
  const free = t === document.body || t.closest('#nav') || t.classList.contains('scene');
  if (!free || (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft')) return;
  const i = STAGES.findIndex(s => s.id === APP.stage);
  const j = e.key === 'ArrowRight' ? Math.min(STAGES.length - 1, i + 1) : Math.max(0, i - 1);
  if (j !== i) { e.preventDefault(); go(STAGES[j].id); }
});

function _motes() {
  const m = document.getElementById('motes');
  for (let i = 0; i < 22; i++) {
    const d = document.createElement('span'); d.className = 'mote'; const s = 2 + Math.random() * 5;
    d.style.width = s + 'px'; d.style.height = s + 'px'; d.style.left = Math.random() * 100 + 'vw'; d.style.bottom = (-10 - Math.random() * 20) + 'vh';
    d.style.animationDuration = (14 + Math.random() * 20) + 's'; d.style.animationDelay = (-Math.random() * 20) + 's'; m.appendChild(d);
  }
}

/* ---- boot ---- */
_buildNav(); _motes();
window.addEventListener('hashchange', route);
route();

</script>
