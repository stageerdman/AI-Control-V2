.hero.pose-carrying.moving .h-rig{animation:h-bob .35s ease-in-out infinite alternate}
.hero.pose-carrying.moving .h-leg-f .h-lr{animation:h-step .7s ease-in-out infinite alternate}
.hero.pose-carrying.moving .h-leg-b .h-lr{animation:h-step-b .7s ease-in-out infinite alternate}
.hero.pose-walking.moving .h-rig{animation:h-bob .35s ease-in-out infinite alternate}

.hero.pose-talking{--af:-26deg;--ef:-40deg;--by:-1.5px;--paf:-26deg;--pab:-24deg}
.hero.pose-talking .h-arm-f .h-sh{animation:h-gesture 1.6s ease-in-out infinite alternate}
.hero.pose-talking [data-m="talkA"]{animation:h-yap-a .32s steps(1) infinite}
.hero.pose-talking [data-m="talkB"]{animation:h-yap-b .32s steps(1) infinite}

.hero.pose-chilling{--lean:-6deg;--lid:.42;--af:-34deg;--ef:-96deg;--ab:-18deg;--pt:-8deg;--paf:-34deg;--pab:-18deg}
.hero.pose-chilling .h-arm-f .h-sh{animation:h-sip-s 4.5s ease-in-out infinite}
.hero.pose-chilling .h-arm-f .h-el{animation:h-sip-e 4.5s ease-in-out infinite}
.hero .h-steam path{fill:none;stroke:#fff6e9;stroke-width:1.8;stroke-linecap:round;opacity:.7}
.hero.pose-chilling .h-steam path,.hero[data-hold="mug"] .h-steam path{animation:h-steam 2s ease-in infinite}
.hero .h-steam path:nth-child(2){animation-delay:-1s}

.hero.pose-sleeping{--ht:12deg;--af:4deg;--ab:-8deg;--paf:4deg;--pab:-8deg}
.hero.pose-sleeping .h-rig{animation:h-snore 3.2s ease-in-out infinite}

.hero.pose-celebrating{--af:150deg;--ef:16deg;--ab:-150deg;--eb:-16deg;--tt:6deg;--by:-3px;--paf:150deg;--pab:-150deg}
.hero.pose-celebrating .h-rig{animation:h-jump .62s cubic-bezier(.34,1.56,.64,1) infinite}

.hero.pose-needs-input{--af:162deg;--ef:-6deg;--kf:1.22;--by:-3px;--paf:162deg;--pab:-24deg}
.hero.pose-needs-input .h-arm-f .h-sh{animation:h-wave 1.2s ease-in-out infinite alternate}
.hero.pose-needs-input .h-brow.near{transform:translateY(-3px) rotate(-14deg)}
.hero.pose-needs-input .h-brow.far{transform:translateY(-3px) rotate(14deg)}

.hero.pose-thinking{--af:-58deg;--ef:-118deg;--ly:-.8;--lx:.25;--ht:-5deg;--paf:-58deg;--pab:-24deg}
.hero.pose-thinking .h-brow.far{transform:translateY(-3px)}

.hero.pose-frustrated{--af:-166deg;--ef:-14deg;--kf:1.28;--ht:7deg;--lean:3deg;--ab:-10deg;--paf:-166deg;--pab:-10deg}
.hero.pose-frustrated .h-tilt{animation:h-shake 1.8s ease-in-out infinite}
.hero.pose-frustrated .h-brow.near{transform:translateY(1px) rotate(16deg)}
.hero.pose-frustrated .h-brow.far{transform:translateY(1px) rotate(-16deg)}

.hero.pose-waiting{--af:-48deg;--ef:-84deg;--ab:-46deg;--eb:-80deg;--lid:.34;--lx:.75;--paf:-48deg;--pab:-46deg}
.hero.pose-waiting .h-leg-f .h-lr{animation:h-tap .9s ease-in-out infinite}

.hero.pose-pressing{--af:-84deg;--ef:-8deg;--lean:4deg;--by:1.2px;--lx:.7;--ly:.3;--paf:-84deg;--pab:-24deg}
.hero.pose-pressing .h-arm-f .h-hj{animation:h-press 1.1s ease-in-out infinite}

.hero.pose-waving{--af:128deg;--ef:34deg;--paf:128deg;--pab:-24deg}
.hero.pose-waving .h-arm-f .h-el{animation:h-wave-e .5s ease-in-out infinite alternate}

.hero.pose-salute{--af:-160deg;--ef:-48deg;--kf:1.2;--by:-1px;--paf:-160deg;--pab:-24deg}
.hero.pose-salute .h-arm-f .h-sh{animation:h-salute 2.4s ease-in-out infinite}

/* ============================================================
   FX overlay — HTML above the head anchor (readable at 48px)
   ============================================================ */
.hero .h-fx{position:absolute;left:50%;top:var(--head-y);transform:translate(-50%,-100%);display:flex;flex-direction:column-reverse;align-items:center;gap:2px;pointer-events:none;
  font-size:clamp(11px,calc(var(--hpx)*.085),30px);line-height:1;z-index:2}
.hero .h-fx>span{display:none}
.hero .fx-pip{display:block!important;margin-bottom:4px}
.hero .fx-pip:empty{display:none!important}
.hero .fx-bang{min-width:18px;min-height:18px;width:1.7em;height:1.7em;border-radius:50%;background:#ff6f73;color:#fff6e9;font-weight:900;font-size:1em;
  display:grid!important;place-items:center;box-shadow:0 0 0 2px #241a44,0 4px 10px -2px rgba(0,0,0,.4);animation:h-bang 1s ease-in-out infinite;margin-bottom:.25em}
.hero:not(.pose-needs-input) .fx-bang{display:none!important}
.hero.pose-needs-input .fx-bang::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid #ff6f73;animation:h-ring 1.6s ease-out infinite}
.hero .fx-bang{position:relative}
.hero.pose-sleeping .fx-z{display:block;position:relative;width:2.4em;height:1.6em;transform:translateX(.9em)}
.hero .fx-z i{position:absolute;bottom:0;left:0;font-style:normal;font-weight:900;color:#fff6e9;text-shadow:0 0 0 #241a44,1px 1px 0 #241a44,-1px -1px 0 #241a44,1px -1px 0 #241a44,-1px 1px 0 #241a44;
  min-width:12px;font-size:max(12px,.9em);opacity:0;animation:h-zzz 3.2s linear infinite}
.hero .fx-z i:nth-child(2){animation-delay:1.05s}
.hero .fx-z i:nth-child(3){animation-delay:2.1s;font-size:max(14px,1.1em)}
.hero.pose-celebrating .fx-spark{display:block;position:relative;width:3.4em;height:1.4em}
.hero .fx-spark i{position:absolute;font-style:normal;color:#ffc24b;font-size:max(12px,1em);text-shadow:0 0 6px rgba(255,194,75,.8);animation:h-twinkle 1.1s ease-in-out infinite}
.hero .fx-spark i:nth-child(1){left:0;top:.4em}
.hero .fx-spark i:nth-child(2){left:1.2em;top:-.2em;animation-delay:.35s}
.hero .fx-spark i:nth-child(3){right:0;top:.5em;animation-delay:.7s}
.hero.pose-thinking .fx-think{display:flex;gap:.25em;transform:translateX(1.2em);margin-bottom:.2em}
.hero .fx-think i{width:max(4px,.32em);height:max(4px,.32em);border-radius:50%;background:#fff6e9;box-shadow:0 0 0 1.5px #241a44;animation:h-dots 1.4s ease-in-out infinite}
.hero .fx-think i:nth-child(2){animation-delay:.2s}.hero .fx-think i:nth-child(3){animation-delay:.4s}

/* ============================================================
   LOD below 64px: drop fine detail, keep headgear/tool/eyes/catch-light
   ============================================================ */
.hero.lod-xs .h-fine,.hero.lod-xs .h-trim,.hero.lod-xs .h-badge,.hero.lod-xs .h-blush,.hero.lod-xs .h-nose{display:none}
.hero.lod-xs .h-catch{transform:scale(1.5)}
.hero.lod-xs .h-tool>*{transform:scale(1.3)}
.hero.lod-xs .o2{stroke-width:calc(var(--ol)*.75)}

/* ---- ghost: dashed silhouette "+ New" slot ---- */
.hero.ghost .h-rig{animation:none}
.hero.ghost .o,.hero.ghost .o2{fill:rgba(255,246,233,.05)!important;stroke:rgba(255,246,233,.38);stroke-width:2px;stroke-dasharray:5 4;animation:h-dash 1.2s linear infinite}
.hero.ghost .h-arm,.hero.ghost .h-legs,.hero.ghost .h-face,.hero.ghost .h-sheen,.hero.ghost .h-fine,.hero.ghost .h-hair,.hero.ghost .h-hair-back,.hero.ghost .h-acc,.hero.ghost .h-shadow{display:none}
.hero.ghost .h-q{display:inline;fill:rgba(255,246,233,.55);font:900 30px/1 var(--font,system-ui)}

/* ---- utility moments callers can add: .hop (once), .twirl (costume change) ---- */
.hero.hop svg{animation:h-hop .38s var(--spring)}
.hero.twirl .h-rig{animation:h-twirl .36s ease-in-out}

/* ============================================================
   KEYFRAMES
   ============================================================ */
@keyframes h-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
@keyframes h-blink{0%,95%,100%{transform:scaleY(var(--lid))}97.5%{transform:scaleY(1)}}
@keyframes h-glance{0%,40%{transform:translateX(0)}45%,70%{transform:translateX(-1.1px)}75%,100%{transform:translateX(1.4px)}}
@keyframes h-step{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
@keyframes h-step-b{from{transform:rotate(18deg)}to{transform:rotate(-18deg)}}
@keyframes h-swing-f{from{transform:rotate(26deg)}to{transform:rotate(-8deg)}}
@keyframes h-swing-b{from{transform:rotate(-40deg)}to{transform:rotate(-6deg)}}
@keyframes h-bob{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
@keyframes h-type{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
@keyframes h-scribble{0%,100%{transform:translate(0,0)}25%{transform:translate(1.5px,1px)}50%{transform:translate(-1px,.5px)}75%{transform:translate(1px,-1px)}}
@keyframes h-scan{0%{transform:translateX(-2px)}100%{transform:translateX(2px)}}
@keyframes h-page{0%,80%{transform:scaleX(1)}88%,92%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
@keyframes h-wobble{from{transform:translate(8px,-6px) rotate(-2deg)}to{transform:translate(8px,-6px) rotate(2deg)}}
@keyframes h-gesture{from{transform:rotate(-10deg)}to{transform:rotate(-40deg)}}
@keyframes h-yap-a{0%{opacity:1}50%{opacity:0}}
@keyframes h-yap-b{0%{opacity:0}50%{opacity:1}}
@keyframes h-sip-s{0%,55%,82%,100%{transform:rotate(-34deg)}62%,75%{transform:rotate(-70deg)}}
@keyframes h-sip-e{0%,55%,82%,100%{transform:translateY(13px) rotate(-96deg)}62%,75%{transform:translateY(13px) rotate(-104deg)}}
@keyframes h-steam{0%{transform:translateY(0);opacity:0}30%{opacity:.75}100%{transform:translateY(-6px);opacity:0}}
@keyframes h-snore{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes h-zzz{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(1.2em,-18px);opacity:0}}
@keyframes h-jump{0%{transform:translateY(0) scale(1,1)}30%{transform:translateY(0) scale(1.08,.88)}60%{transform:translateY(-18px) scale(.94,1.08)}85%{transform:translateY(0) scale(1.04,.96)}100%{transform:translateY(0) scale(1,1)}}
@keyframes h-wave{from{transform:rotate(152deg)}to{transform:rotate(172deg)}}
@keyframes h-wave-e{from{transform:translateY(13px) rotate(16deg)}to{transform:translateY(13px) rotate(48deg)}}
@keyframes h-bang{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.12)}}
@keyframes h-ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.6)}}
@keyframes h-twinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.4}50%{transform:scale(1.2) rotate(30deg);opacity:1}}
@keyframes h-dots{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
@keyframes h-shake{0%,70%,100%{transform:rotate(7deg)}76%{transform:rotate(3deg)}82%{transform:rotate(10deg)}88%{transform:rotate(4deg)}}
@keyframes h-tap{0%,40%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}}
@keyframes h-press{0%,40%,100%{transform:translateX(0)}20%{transform:translateX(3px)}}
@keyframes h-salute{0%,70%,100%{transform:rotate(-160deg)}80%{transform:rotate(-150deg)}}
@keyframes h-hop{0%{transform:translateY(0)}40%{transform:translateY(-6px)}100%{transform:translateY(0)}}
@keyframes h-twirl{0%{transform:scaleX(1)}50%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes h-dash{to{stroke-dashoffset:-18}}

/* ============================================================
   Reduced motion: every h-* animation off; static key poses remain
   (needs-input keeps arm up + static "!", sleeping keeps arcs + static Zz,
   celebrating keeps the grin + one ✦, walking freezes mid-stride).
   ============================================================ */
@media (prefers-reduced-motion:reduce){
  .hero,.hero *,.hero *::after{animation:none!important;transition:none!important}
  .hero .fx-z i{opacity:1;position:static;display:inline-block}
  .hero .fx-z i:nth-child(1){transform:translateY(6px)}.hero .fx-z i:nth-child(2){transform:translateY(2px)}
  .hero .fx-spark i:nth-child(1),.hero .fx-spark i:nth-child(3){display:none}
  .hero.pose-needs-input .fx-bang{box-shadow:0 0 0 3px #241a44}
  .hero.pose-talking [data-m="talkB"]{display:none}
}

/* ==== css/emblem.css ==== */
/* ============================================================
   emblem.css — embroidered patch (spec-teams §5.2) + captain pip (§2.4)
   ============================================================ */
.emblem{display:inline-block;color:var(--bg-2,#2e2156);line-height:0;flex:none;vertical-align:middle}
.emblem svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.emblem .cloth{fill:currentColor}
.emblem .halo{stroke:currentColor;stroke-width:3;stroke-linejoin:round}
.emblem .thread{fill:var(--team)}
.emblem .line{fill:none;stroke:var(--team);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.emblem .stitch{fill:none;stroke:var(--team);stroke-width:1.2;stroke-dasharray:2.2 2;opacity:.75}
.emblem .cutline{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}
.emblem.em-sm .stitch,.emblem.em-sm .detail{display:none}
.emblem.em-sm svg{filter:none}

.captain-pip{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#241a44;
  box-shadow:0 0 0 2px var(--team,#ffc24b),0 3px 6px -2px rgba(0,0,0,.5);line-height:0;flex:none}
.captain-pip svg{width:14px;height:14px}
.captain-pip path{fill:#ffc24b;stroke:#241a44;stroke-width:1;stroke-linejoin:round}

/* ==== css/studio.css ==== */
/* ============================================================
   studio.css — Projects · Access · Blueprint (ported from v2)
   ============================================================ */
/* ---------- Projects ---------- */
.result-count{color:rgba(255,246,233,.7);font-weight:700;font-size:13px}
.shelf{margin-bottom:26px}
.shelf-head{display:flex;align-items:baseline;gap:12px;margin:0 0 4px;color:var(--cream)}
.shelf-head h2{margin:0;font-size:18px;letter-spacing:-.01em}
.shelf-head .cnt{font-size:12px;font-weight:800;color:rgba(255,246,233,.55);letter-spacing:.08em;text-transform:uppercase}
.shelf-hr{height:1px;background:rgba(255,255,255,.12);margin:8px 0 16px}
.shelf.active-shelf{background:linear-gradient(180deg,rgba(255,246,233,.06),transparent);border-radius:var(--r-lg);padding:14px;margin:-14px -14px 26px}
.shelf-grid{display:grid;gap:16px}
.shelf.active-shelf .shelf-grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.shelf.db-shelf .shelf-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.logo-tile{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;flex:none;box-shadow:var(--shadow-sm)}
.logo-tile.sm{width:40px;height:40px;border-radius:12px}
.logo-tile svg{width:60%;height:60%}
.pcard{background:var(--cream);border-radius:var(--r-md);padding:18px;cursor:pointer;text-align:left;font-family:inherit;
  border:2px solid transparent;box-shadow:var(--shadow-sm);transition:transform .18s,border-color .18s;position:relative;width:100%}
.pcard:hover{transform:translateY(-4px)}
.pcard:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.pcard.live{border-color:var(--teal)}
.pcard.needs{border-color:var(--coral)}
.pcard h3{margin:0 0 2px;font-size:17px}
.pcard .note{font-size:13px;color:var(--ink);font-weight:600;margin-top:4px}
/* mini-cast: real heroes at xs, standing on a little dark stage strip */
.pcard .mini-cast{display:flex;align-items:flex-end;gap:2px;margin:12px 0 10px;min-height:56px;padding:22px 10px 2px;border-radius:12px;
  background:linear-gradient(180deg,#2e2156,#241a44)}
.pcard .mini-cast .hero{margin-right:-6px}
.plus-chip{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:rgba(255,246,233,.12);border:2px dashed rgba(255,246,233,.3);font-size:11px;font-weight:900;color:var(--cream);margin:0 0 8px 10px}
.micro-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.micro-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--ink-soft);background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.pcard-db{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.9);border-radius:var(--r-md);padding:12px 14px;cursor:pointer;text-align:left;font-family:inherit;border:2px solid transparent;box-shadow:var(--shadow-sm);transition:transform .15s,border-color .15s;width:100%}
.pcard-db:hover{transform:translateY(-3px)}
.pcard-db:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.pcard-db h3{margin:0;font-size:15px}
.pcard-db .sub{font-size:12px;color:var(--ink-soft);font-weight:700}

/* ---------- Access ---------- */
.vault{background:linear-gradient(180deg,#2a1f52,#211840);color:var(--cream);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow)}
.vault h2{margin:0 0 2px;font-size:19px;display:flex;align-items:center;gap:10px}
.vault .sub{color:rgba(255,246,233,.6);font-size:13px;font-weight:600;margin:0 0 16px}
.access-entry{display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:14px;background:rgba(255,255,255,.055);margin-bottom:10px;transition:.18s}
.access-entry:hover{background:rgba(255,255,255,.1)}
.access-entry .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;font-weight:900;font-size:15px;color:#2a1a10}
.access-entry .body{flex:1;min-width:0}
.access-entry b{font-size:15px}
.access-entry .val{font-family:var(--mono);font-size:12px;color:rgba(255,246,233,.6);letter-spacing:1px;margin-left:8px}
.access-entry .serves{font-size:13px;color:rgba(255,246,233,.75);font-weight:600;margin-top:3px}
.access-entry .afford{display:flex;gap:12px;margin-top:9px;flex-wrap:wrap}
.access-entry .afford button,.access-entry .afford a{appearance:none;background:transparent;border:0;color:var(--sun);font-family:inherit;font-weight:800;font-size:12px;cursor:pointer;text-decoration:none;padding:2px}
.access-entry .afford button:focus-visible,.access-entry .afford a:focus-visible{outline:2px solid var(--sun);outline-offset:2px;border-radius:4px}
.access-entry .expand{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;color:rgba(255,246,233,.8);font-weight:600}
.masklock{font-size:12px;color:rgba(255,246,233,.55);display:inline-flex;gap:6px;align-items:center;margin-top:6px}
.keytag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:8px;background:var(--cream);color:var(--ink);border:1px solid var(--line)}
.keytag .d{width:14px;height:14px;border-radius:4px;display:grid;place-items:center;font-size:9px;color:#2a1a10;font-weight:900}
.keytag.locked{opacity:.45}
.toggle-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--cream);border:2px solid var(--line);margin-bottom:9px}
.toggle-row .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:900;color:#2a1a10}
.toggle-row .t{flex:1;min-width:0}
.toggle-row .t b{font-size:14px}
.toggle-row .t .sv{font-size:12px;color:var(--ink-soft);font-weight:700}
.toggle-row .t .vl{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.toggle-row .state{font-size:11px;font-weight:800;color:var(--ink-soft)}
.toggle-row.on .state{color:#0b7d72}

/* ---------- Blueprint ---------- */
.bp-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start}
@media (max-width:980px){.bp-grid{grid-template-columns:1fr}}
.tree{list-style:none;margin:0;padding:0;font-family:var(--mono);font-size:13px}
.tree li{padding:4px 0}
.tree .node{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;transition:.12s}
.tree .node:hover{background:var(--cream)}
.tree .glyph{flex:none}
.tree .path{font-weight:800;color:var(--ink)}
.tree .desc{color:var(--ink-soft);font-family:var(--font);font-weight:600;font-size:12.5px;background:transparent;border:1px solid transparent;border-radius:8px;padding:3px 6px;cursor:text;flex:1;min-width:120px}
.tree .desc:hover{border-color:var(--line)}
.tree .desc:focus{outline:0;border-color:var(--sun-deep);background:#fff}
.tree ul{list-style:none;margin:0;padding-left:22px;border-left:1px dashed var(--line)}
.principle-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.principle-card{background:var(--cream);border-radius:14px;padding:14px;box-shadow:var(--shadow-sm)}
.principle-card .tag{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;display:inline-block;margin-bottom:8px}
.principle-card p{margin:0;font-size:13px;font-weight:600}
.fresh-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--cream);box-shadow:var(--shadow-sm);margin-bottom:10px}
.fresh-row .st{margin-left:auto;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}

<script data-module="js/core.js">
"use strict";
/* ============================================================
   core.js — shared primitives every module may use.
   Public: PALETTE, COLOR_NAMES, HUES, hueHex(), shade(), hexTint(),
           escapeHtml(), escapeAttr(), reducedMotion(), toast(),
           fireConfetti(), sparkle(), announce(), openSheet(), closeSheet(),
           go(route), currentRoute()
   No DOM rendering of screens here; no knowledge of other modules.
   ============================================================ */

/* The 7 character hues (+ sun-deep, a gear/UI accent only). */
const PALETTE = {
  sun: '#ffc24b', 'sun-deep': '#ff9b3d', coral: '#ff6f73', teal: '#2fd3c3',
  sky: '#4ea8ff', grape: '#9b6cff', mint: '#8be88b', rose: '#ff9ecf',
};
const COLOR_NAMES = { sun: 'Amber', coral: 'Coral', teal: 'Teal', sky: 'Sky', grape: 'Grape', mint: 'Mint', rose: 'Rose' };
const HUES = Object.keys(COLOR_NAMES);

/* palette key or hex → hex */
function hueHex(k) { return PALETTE[k] || k || PALETTE.sun; }

/* lighten (+) / darken (−) a hex by a flat amount per channel */
function shade(hex, amt) {
  const n = parseInt(hueHex(hex).slice(1), 16);
  const r = Math.max(0, Math.min(255, (n >> 16) + amt));
  const g = Math.max(0, Math.min(255, (n >> 8 & 255) + amt));
  const b = Math.max(0, Math.min(255, (n & 255) + amt));
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function hexTint(key, a = 0.2) {
  const n = parseInt(hueHex(key).slice(1), 16);
  return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`;
}

function escapeHtml(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function escapeAttr(s) { return String(s ?? '').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
function reducedMotion() { return matchMedia('(prefers-reduced-motion:reduce)').matches; }

/* ---------- feedback ---------- */
let _toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = msg; t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}
function fireConfetti() {
  if (reducedMotion()) return;
  const c = document.getElementById('confetti'); const cols = Object.values(PALETTE);
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('i'); p.style.left = Math.random() * 100 + 'vw';
    p.style.background = cols[i % cols.length]; p.style.animationDuration = (1.4 + Math.random() * 1.4) + 's';
    p.style.animationDelay = (Math.random() * .3) + 's'; p.style.transform = `rotate(${Math.random() * 360}deg)`;
    c.appendChild(p); setTimeout(() => p.remove(), 3200);
  }
}
/* small scoped burst; x/y in vw/vh (default centre) */
function sparkle(x = 50, y = 40) {
  if (reducedMotion()) return;
  const c = document.getElementById('confetti'); const cols = [PALETTE.mint, PALETTE.sun, PALETTE.teal];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('i'); p.style.left = (x - 15 + Math.random() * 30) + 'vw'; p.style.top = y + 'vh';
    p.style.background = cols[i % cols.length]; p.style.animationDuration = (1 + Math.random()) + 's';
    p.style.transform = `rotate(${Math.random() * 360}deg)`;
    c.appendChild(p); setTimeout(() => p.remove(), 2200);
  }
}
function announce(msg, assertive) { document.getElementById(assertive ? 'alertlive' : 'live').textContent = msg; }

/* ---------- focus-trapped sheet (dialog) ---------- */
let _lastFocused = null, _trapHandler = null;
function openSheet(contentEl, label, opts = {}) {
  const scrim = document.getElementById('scrim');
  _lastFocused = document.activeElement;
  scrim.innerHTML = '';
  const sheet = document.createElement('div');
  sheet.className = 'sheet' + (opts.wide ? ' wide' : '');
  sheet.setAttribute('role', 'dialog'); sheet.setAttribute('aria-modal', 'true');
  sheet.setAttribute('aria-label', label || 'Dialog'); sheet.style.position = 'relative';
  sheet.appendChild(contentEl);
  scrim.appendChild(sheet); scrim.hidden = false;
  scrim.onclick = e => { if (e.target === scrim) closeSheet(); };
  const focusables = () => sheet.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"]),[contenteditable="true"]');
  setTimeout(() => { const f = focusables(); if (f.length) f[0].focus(); }, 40);
  _trapHandler = e => {
    if (e.key === 'Escape') { closeSheet(); return; }
    if (e.key !== 'Tab') return;
    const f = focusables(); if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };
  document.addEventListener('keydown', _trapHandler);
  return sheet;
}
function closeSheet() {
  const scrim = document.getElementById('scrim');
  scrim.hidden = true; scrim.innerHTML = '';
  if (_trapHandler) { document.removeEventListener('keydown', _trapHandler); _trapHandler = null; }
  if (_lastFocused && _lastFocused.focus) { try { _lastFocused.focus(); } catch (e) { /* gone */ } }
}
function sheetOpen() { return document.getElementById('scrim').hidden === false; }

/* ---------- routing ----------
   Routes are hashes: #projects, #cast, #cast/teams, #access, #blueprint,
   #office/<projectId>[/<sub>], #gallery[/<section>]. go() only changes the
   hash; app.js listens and renders. */
function go(route) {
  const h = '#' + String(route).replace(/^#/, '');
  if (location.hash === h) window.dispatchEvent(new HashChangeEvent('hashchange'));
  else location.hash = h;
}
function currentRoute() { return location.hash.replace(/^#/, '') || 'projects'; }

</script>
<script data-module="js/hero.js">
"use strict";
/* ============================================================
   hero.js — Character system v3 (spec-cast §1 + SYNTHESIS seam 1).
   THE way every screen draws a character.

   Public:
     hero(agent, opts) → HTMLDivElement.hero
     heroSVG(agent, opts) → string (same markup; setPose etc. still work on it)
     setPose(el, pose, {seated, props, holding}?)
     setFacing(el, facing, {dir, look}?)        animated head-first turn (250ms)
     setLook(el, {x,y} | 'viewer' | null)
     heroHeadAnchor(el) → {x, y} px inside el (crown point, for overlays)
     castOf(agent, mood, size)                  v2 shim
     POSES, FACINGS, BUILDS, HAIR, ACCESSORIES, ROLE_GEAR, HERO_SIZES,
     MOOD_TO_POSE, POSE_TEXT, MAT
   opts: size 'xs'|'sm'|'md'|'xl'|px · pose · facing 'side'|'three-quarter'|'front'
         dir 'right'|'left' · look · seated · props · holding
         'mug'|'envelope'|'paper'|'binder'|'pen'|'none' · role (override)
         captain · armband <hex> · ghost · label
   Geometry: viewBox 0 0 120 160, ground y=152, feet centred on x=60.
   Coordinate spaces: head-local (r normalised to 30), torso-local (40×42),
   hand-local (origin = hand centre, long axis up, kept upright).
   ============================================================ */

const MAT = { metal: '#c9c3dd', steel: '#8e86ad', wood: '#b9773f', paper: '#fff6e9' };
const HERO_INK = '#241a44';

const POSES = ['idle', 'walking', 'typing', 'writing', 'reading', 'carrying', 'talking', 'chilling', 'sleeping',
  'celebrating', 'needs-input', 'thinking', 'frustrated', 'waiting', 'pressing', 'waving', 'salute'];
const FACINGS = ['side', 'three-quarter', 'front'];
const BUILDS = ['hero', 'sprout', 'bruiser', 'lanky'];
const HAIR = ['none', 'tuft', 'spikes', 'swoop', 'bob', 'bun', 'curl'];
const ACCESSORIES = ['none', 'glasses', 'shades', 'monocle', 'mustache', 'bow', 'freckles', 'flower'];
const HOLDINGS = ['mug', 'envelope', 'paper', 'binder', 'pen', 'none'];
const HERO_SIZES = { xs: 48, sm: 96, md: 160, xl: 360 };
const MOOD_TO_POSE = { neutral: 'idle', idle: 'idle', working: 'typing', blocked: 'needs-input', celebrate: 'celebrating' };

/* per pose: mouth, eyes, whether the role tool shows, default hand-held item,
   rig-level desk prop, seated by default, fx overlay. Static key poses (arms,
   legs, lean…) live in hero.css as custom properties on .pose-<name>. */
const POSE_DEF = {
  idle: { mouth: 'smile', tool: 1 },
  walking: { mouth: 'smile', tool: 1 },
  typing: { mouth: 'focus', desk: 'laptop', seated: 1 },
  writing: { mouth: 'tongue', desk: 'paper', hold: 'implement' },
  reading: { mouth: 'focus', hold: 'binder' },
  carrying: { mouth: 'smile', hold: 'stack' },
  talking: { mouth: 'talk', tool: 1 },
  chilling: { mouth: 'smile', hold: 'mug', seated: 1 },
  sleeping: { mouth: 'o', eyes: 'sleep', fx: 'z' },
  celebrating: { mouth: 'grin', eyes: 'happy', tool: 1, fx: 'spark' },
  'needs-input': { mouth: 'worried', tool: 1, fx: 'bang' },
  thinking: { mouth: 'flat', tool: 1, fx: 'think' },
  frustrated: { mouth: 'wavy', eyes: 'squeeze', tool: 1 },
  waiting: { mouth: 'flat' },
  pressing: { mouth: 'focus', tool: 1 },
  waving: { mouth: 'grin', tool: 1 },
  salute: { mouth: 'smile', tool: 1 },
};
const POSE_TEXT = {
  idle: 'standing by', walking: 'walking', typing: 'writing code', writing: 'writing', reading: 'reading',
  carrying: 'carrying paperwork', talking: 'talking', chilling: 'taking a break', sleeping: 'sleeping, off shift',
  celebrating: 'celebrating', 'needs-input': 'needs your input', thinking: 'thinking', frustrated: 'fixing a failure',
  waiting: 'waiting on a teammate', pressing: 'pressing the button', waving: 'waving', salute: 'saluting',
};

/* Builds — anchors per spec-cast §1.2 */
const BUILD_DEF = {
  hero: { head: { cx: 60, cy: 52, r: 30 }, torso: { x: 40, y: 82, w: 40, h: 42 }, legW: 12, sh: 89 },
  sprout: { head: { cx: 60, cy: 64, r: 32 }, torso: { x: 41, y: 94, w: 38, h: 32 }, legW: 12, sh: 100 },
  bruiser: { head: { cx: 60, cy: 48, r: 27 }, torso: { x: 32, y: 74, w: 56, h: 48 }, legW: 15, sh: 82 },
  lanky: { head: { cx: 60, cy: 38, r: 26 }, torso: { x: 44, y: 64, w: 32, h: 52 }, legW: 10, sh: 70 },
};

let _heroSeq = 0;

/* ---------- geometry helpers ---------- */
/* map an absolute path (M L C Q S T H V Z) from torso-local 40×42 to rig coords */
function _tp(d, sx, sy, tx, ty) {
  let cmd = 'M', i = 0;
  return d.replace(/([MLCQSTHVZ])|(-?\d*\.?\d+)/g, (m, c, n) => {
    if (c) { cmd = c; i = 0; return c; }
    const v = parseFloat(n);
    let out;
    if (cmd === 'H') out = v * sx + tx;
    else if (cmd === 'V') out = v * sy + ty;
    else out = (i % 2 === 0) ? v * sx + tx : v * sy + ty;
    i++;
    return +out.toFixed(2);
  });
}
const _r = n => +n.toFixed(2);

/* ============================================================
   ROLE GEAR — {accent, sleeve, legs, look, top, outfit, headgear, tool, badge}
   ctx: {c, dark, light, hairC, accent, cloth, T(d), TC(x,y,r,attrs), MAT}

   `top` = highest headgear point in head-local units (for the head anchor).
   ============================================================ */
const O = 'class="o"', O2 = 'class="o2"';
const ROLE_GEAR = {

    accent: 'teal', sleeve: 'cloth', top: -42, look: 'headphones, hoodie, giant pencil',

    headgear: x => `<path d="M-31 0 C-33 -50 33 -50 31 0" fill="none" stroke="${HERO_INK}" stroke-width="10" stroke-linecap="round"/>
      <path d="M-31 0 C-33 -50 33 -50 31 0" fill="none" stroke="${x.accent}" stroke-width="5" stroke-linecap="round"/>
      <path class="h-fine" d="M-22 -28 C-14 -36 -4 -38 4 -38" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
      <rect ${O} x="-40" y="-12" width="14" height="25" rx="7" fill="${x.accent}"/>
      <rect ${O} x="26" y="-12" width="14" height="25" rx="7" fill="${x.accent}"/>
      <rect class="h-fine" x="-37" y="-7" width="4" height="14" rx="2" fill="#fff" opacity=".45"/>
      <rect class="h-fine" x="29" y="-7" width="4" height="14" rx="2" fill="#fff" opacity=".45"/>`,
    tool: x => `<g transform="rotate(8)"><path ${O} fill="${x.accent}" d="M-5 -36 H5 V5 H-5Z"/>
      <path class="h-fine" d="M-1.6 -35 V4" stroke="${shade(x.accent, -40)}" stroke-width="1.2"/>
      <path ${O} fill="${MAT.wood}" d="M-5 -36 L0 -49 L5 -36Z"/>
      <path fill="${HERO_INK}" d="M-1.8 -44.2 L0 -49 L1.8 -44.2Z"/>
      <rect ${O} x="-5" y="4" width="10" height="5" fill="${MAT.metal}"/>
      <rect ${O} x="-5" y="9" width="10" height="5" rx="2.5" fill="${PALETTE.rose}"/></g>`,
    badge: () => `<path d="M-2.2 -3 L-4.6 0 L-2.2 3 M2.2 -3 L4.6 0 L2.2 3 M0.9 -3.6 L-0.9 3.6" fill="none" stroke="${HERO_INK}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`,
  },
  Backend: {
    accent: 'sky', sleeve: 'skin', legs: 'cloth', top: -38, look: 'welding goggles, overalls, cog',
    outfit: x => `<path ${O} fill="${x.cloth}" d="${x.T('M-2 25 H42 V44 H-2Z')}"/>
      <path ${O} fill="${x.cloth}" d="${x.T('M9 7 H31 V30 H9Z')}"/>
      <path ${O2} fill="${x.cloth}" d="${x.T('M3 -1 L9 -1 L13 9 L8 9Z M37 -1 L31 -1 L27 9 L32 9Z')}"/>
      <rect class="o2 h-trim" x="${_r(x.X(15))}" y="${_r(x.Y(13))}" width="${_r(10 * x.sx)}" height="${_r(8 * x.sy)}" rx="1.5" fill="${shade(x.cloth, -16)}"/>
      ${x.TC(10.5, 10, 2.2, `${O2} fill="${MAT.metal}"`)}${x.TC(29.5, 10, 2.2, `${O2} fill="${MAT.metal}"`)}`,
    headgear: x => `<path d="M-30 -10 C-20 -26 20 -26 30 -10" fill="none" stroke="${HERO_INK}" stroke-width="8" stroke-linecap="round"/>
      <path d="M-30 -10 C-20 -26 20 -26 30 -10" fill="none" stroke="${MAT.steel}" stroke-width="4" stroke-linecap="round"/>
      <rect ${O} x="-4" y="-27" width="8" height="5" rx="2" fill="${MAT.steel}"/>
      <circle ${O} cx="-11" cy="-27" r="10" fill="${MAT.metal}"/><circle ${O} cx="11" cy="-27" r="10" fill="${MAT.metal}"/>

/* ---------- hair (head-local; colour = shade(c,-45)) — {back, front} ---------- */
function _hair(name, hc) {
  const f = (d, extra = '') => `<path ${O} fill="${hc}" d="${d}" ${extra}/>`;
  const side = f('M-29 -6 C-32 -14 -28 -20 -24 -22 C-26 -14 -26 -8 -24 -2Z') + f('M29 -6 C32 -14 28 -20 24 -22 C26 -14 26 -8 24 -2Z');
  switch (name) {
    case 'tuft': return { back: '', front: side + f('M-4 -28 C-10 -40 2 -46 8 -38 C3 -40 0 -36 3 -29Z') + f('M2 -29 C6 -36 14 -36 14 -30 C10 -32 7 -31 6 -28Z') };

function castOf(agent, mood, size) { return hero(agent, { size: size ? parseFloat(size) : 'sm', pose: MOOD_TO_POSE[mood] || 'idle' }); }

</script>

/* the role an agent plays on a team (override or own role) */
function roleOn(team, agentId) {
  const m = memberOf(team, agentId); const a = agentById(agentId);
  return (m && m.role) || (a && a.role) || null;
}

/* ---- team invariants (spec-teams §3.1): captain ∈ members, ≤6, no dupes ---- */
const TEAM_MAX = 6;
function setCaptain(team, agentId) {
  if (!memberOf(team, agentId)) return false;
  team.captain = agentId; return true;
}
function addMember(team, agentId, role = null, instr = '') {
  if (memberOf(team, agentId) || team.members.length >= TEAM_MAX || !agentById(agentId)) return false;
  team.members.push({ agent: agentId, role, instr });
  if (!team.captain) team.captain = agentId;

}
/* returns the removed member record (for Undo) or null */
function removeMember(team, agentId) {
  const i = team.members.findIndex(m => m.agent === agentId); if (i < 0) return null;

  return { rec, index: i };
}

/* project-held access grid; grants = {credId: bool}, mutated in place */
function openProjectAccess(grants, projectName = 'Aurora') {
  const count = () => Object.values(grants).filter(Boolean).length;
  const body = document.createElement('div');
  body.innerHTML = `<button class="btn btn-ghost btn-sm close" id="paClose" aria-label="Close">✕</button>
    <h2>What ${escapeHtml(projectName)} can reach</h2>
    <p class="hint" style="margin:8px 0 16px">${escapeHtml(projectName)} can reach <b id="paCount">${count()} of ${CREDENTIALS.length}</b> capabilities. Agents inherit only what you grant here — values stay masked.</p>
    <div id="paList"></div>`;
  openSheet(body, projectName + ' access');
  body.querySelector('#paClose').onclick = closeSheet;
  const list = body.querySelector('#paList');
  CREDENTIALS.forEach(c => {
    const on = !!grants[c.id];
    const row = document.createElement('div'); row.className = 'toggle-row' + (on ? ' on' : '');
    row.innerHTML = `<div class="ic" style="background:${c.color}">${c.mark}</div>
      <div class="t"><b>${escapeHtml(c.name)}</b> <span class="vl">${c.val}</span><div class="sv">${escapeHtml(c.serves)}</div></div>

      grants[c.id] = !grants[c.id]; const v = grants[c.id];

      body.querySelector('#paCount').textContent = `${count()} of ${CREDENTIALS.length}`;
      toast((v ? '🔑 ' : '🔒 ') + escapeHtml(c.name) + (v ? ' granted to ' : ' revoked from ') + escapeHtml(projectName));

    row.appendChild(sw); list.appendChild(row);

  /* the quartermaster: a DevOps hard-hat in teal, reading the kit list */
  el.querySelector('#qm').appendChild(hero({ name: 'Quartermaster', role: 'DevOps', hue: 'teal', build: 'hero', hair: 'tuft' }, { size: 72, pose: 'idle' }));
  el.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { bpTab = b.dataset.tab; renderBlueprint(); el.querySelector(`[data-tab="${bpTab}"]`).focus(); });
  const body = el.querySelector('#bpBody');
  if (bpTab === 'kit') {
    body.innerHTML = `<div class="panel"><p class="section-title">📁 Default files & folder structure</p>
      <p class="hint" style="margin:-6px 0 14px">Every new project is born from this kit. Click any description to edit it — changes auto-save.</p>
      <ul class="tree" role="tree" id="tree"></ul></div>`;
    renderTree(body.querySelector('#tree'), BLUEPRINT_TREE);
  } else {
    body.innerHTML = `
      <div class="bp-grid">
        <div class="panel"><p class="section-title">📐 Principles projects follow</p><div class="principle-grid" id="priGrid"></div></div>
        <div class="panel">
          <div class="row" style="justify-content:space-between"><p class="section-title" style="margin:0">🩺 Per-project freshness</p><button class="btn btn-hero btn-sm" id="rebuildAll">Rebuild outdated</button></div>
          <div style="margin-top:14px" id="freshList"></div>
        </div>
      </div>`;
    const pg = body.querySelector('#priGrid');
    PRINCIPLES.forEach(p => {
      const c = document.createElement('div'); c.className = 'principle-card';
      c.innerHTML = `<span class="tag" style="background:${hexTint(p.color)};color:${shade(PALETTE[p.color], -70)}">${p.mod}</span><p>${escapeHtml(p.text)}</p>`;
      pg.appendChild(c);
    });
    const fl = body.querySelector('#freshList');
    renderFreshness(fl);
    body.querySelector('#rebuildAll').onclick = () => {
      FRESHNESS.forEach(f => { if (!f.ok) { f.ok = true; f.note = 'rebuilt just now'; } });
      fireConfetti(); toast('✨ All projects back in sync'); renderFreshness(fl);
    };
  }
}
function renderFreshness(fl) {
  fl.innerHTML = '';
  FRESHNESS.forEach(f => {
    const p = projById(f.id);
    const row = document.createElement('div'); row.className = 'fresh-row';
    row.innerHTML = `${logoTile(p, true)}<div><b style="font-size:14px">${escapeHtml(p.name)}</b></div>
      <div class="st ${f.ok ? 'ok' : 'stale'}">${f.ok ? '✓ Up to date · ' + f.note : '⚠ Needs rebuild — ' + f.note}</div>`;
    if (!f.ok) {
      const b = document.createElement('button'); b.className = 'btn btn-ghost btn-sm'; b.textContent = 'Rebuild'; b.style.marginLeft = '10px';
      b.onclick = () => { f.ok = true; f.note = 'rebuilt just now'; fireConfetti(); toast(`✨ ${escapeHtml(p.name)} is back in sync`); renderFreshness(fl); };
      row.appendChild(b);
    }
    fl.appendChild(row);
  });
}
function renderTree(ul, nodes) {
  nodes.forEach(n => {
    const li = document.createElement('li'); li.setAttribute('role', 'treeitem');
    const node = document.createElement('div'); node.className = 'node';
    node.innerHTML = `<span class="glyph" aria-hidden="true">${n.glyph}</span><span class="path">${escapeHtml(n.path)}</span>
      <span class="desc" contenteditable="true" role="textbox" aria-label="Description for ${escapeAttr(n.path)}">${escapeHtml(n.desc)}</span>`;
    const d = node.querySelector('.desc');
    d.addEventListener('blur', () => { if (d.textContent !== n.desc) { n.desc = d.textContent; toast('📘 Blueprint updated'); } });
    d.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); d.blur(); } });
    li.appendChild(node);
    if (n.children) { const sub = document.createElement('ul'); sub.setAttribute('role', 'group'); renderTree(sub, n.children); li.appendChild(sub); }
    ul.appendChild(li);
  });
}

</script>
<script data-module="js/cast.js">
"use strict";
/* ============================================================
   cast.js — Cast → Agents roster + hero zoom (spec-cast §2–3).
   PLACEHOLDER from Foundation; the Cast builder (phase C) owns this file.
   Contract the router relies on:
     renderCast(tab)   tab = 'agents' | 'teams'; renders into #scene-cast
   ============================================================ */
function renderCast(tab = 'agents') {
  const el = document.getElementById('scene-cast');
  el.innerHTML = `
    <div class="scene-head">
      <h1>The Cast</h1>
      <div class="spacer"></div>
      <div class="lib-tabs" role="tablist" aria-label="Cast">
        <a role="tab" href="#cast" aria-selected="${tab === 'agents'}">Agents</a>
        <a role="tab" href="#cast/teams" aria-selected="${tab === 'teams'}">Teams</a>
      </div>
    </div>
    <div id="castBody"></div>`;
  const body = el.querySelector('#castBody');
  if (tab === 'teams' && typeof renderTeams === 'function') { renderTeams(body); return; }
  body.innerHTML = '<p class="cast-stub-note">Building the hero-select lineup…</p><ul class="cast-stub" role="list"></ul>';
  const ul = body.querySelector('ul');
  AGENTS.forEach((a, i) => {
    const li = document.createElement('li');
    li.appendChild(hero(a, { size: 'md', dir: i % 5 < 2.5 ? 'right' : 'left', label: true }));
    li.insertAdjacentHTML('beforeend', `<b>${escapeHtml(a.name)}</b><span>${escapeHtml(a.role)}</span>`);
    ul.appendChild(li);
  });
}

</script>
<script data-module="js/teams.js">

   teams.js — Cast → Teams roll call + squad zoom (spec-teams §1–2).

<script data-module="js/office-main.js">

   office-main.js — The Office (spec-office). PLACEHOLDER from Foundation;

<script data-module="js/gallery.js">
"use strict";
/* ============================================================
   gallery.js — #gallery dev route: every role × pose × facing × size,
   all builds / hair / accessories, extras, and every emblem × 7 hues.
   Public: renderGallery(section)   section = '' (all) | roster | poses |
           facings | sizes | zoom | looks | extras | emblems
   Dev-only; not linked from the studio nav.
   ============================================================ */
const GALLERY_SECTIONS = ['roster', 'zoom', 'poses', 'facings', 'sizes', 'looks', 'extras', 'emblems'];

function renderGallery(section = '') {
  const host = document.getElementById('gallery');
  const only = GALLERY_SECTIONS.includes(section) ? [section] : GALLERY_SECTIONS;
  host.innerHTML = `<header class="gal-head"><b>Character gallery</b>
    <nav>${GALLERY_SECTIONS.map(s => `<a href="#gallery/${s}"${s === section ? ' aria-current="page"' : ''}>${s}</a>`).join('')}<a href="#gallery">all</a><a href="#projects">← studio</a></nav></header>
    <main class="gal-body"></main>`;
  const body = host.querySelector('.gal-body');
  const cast = [...AGENTS, DIRECTOR];
  const sec = (id, title, note) => {
    const s = document.createElement('section'); s.className = 'gal-sec'; s.id = 'gal-' + id;
    s.innerHTML = `<h2>${title}</h2>${note ? `<p>${note}</p>` : ''}`; body.appendChild(s); return s;
  };
  const row = (parent, cls = '') => { const r = document.createElement('div'); r.className = 'gal-row ' + cls; parent.appendChild(r); return r; };
  const cell = (r, el, cap) => { const c = document.createElement('figure'); c.className = 'gal-cell'; c.appendChild(el); if (cap) c.insertAdjacentHTML('beforeend', `<figcaption>${cap}</figcaption>`); r.appendChild(c); return c; };

  if (only.includes('roster')) {
    const s = sec('roster', 'Roster at 48px (legibility) · colour / greyscale', 'Each role must be nameable from headgear + tool alone.');
    const r1 = row(s), r2 = row(s, 'gray'), r3 = row(s);
    cast.forEach(a => { cell(r1, hero(a, { size: 'xs' }), a.role); cell(r2, hero(a, { size: 'xs' }), a.role); cell(r3, hero(a, { size: 'sm' }), a.name); });
  }
  if (only.includes('zoom')) {
    const s = sec('zoom', 'Hero zoom size (xl 360) — front, looking at you');
    const r = row(s);
    ['a-pete', 'a-semic', 'a-scar', 'a-lint'].forEach(id => cell(r, hero(agentById(id), id === 'a-semic' ? { size: 'xl', facing: 'front', captain: true, armband: PALETTE.sun } : { size: 'xl', facing: 'front' }), agentById(id).name));
  }
  if (only.includes('poses')) {
    const s = sec('poses', 'Every role × every pose (sm 96, three-quarter)', 'Seated poses (typing, chilling) sit on a desk stub here; the Office supplies real desks.');
    const head = row(s, 'gal-poses-head'); head.innerHTML = '<span></span>' + POSES.map(p => `<span>${p}</span>`).join('');
    cast.forEach(a => {
      const r = row(s, 'gal-poses'); r.insertAdjacentHTML('beforeend', `<span class="gal-rl">${a.role}</span>`);
      POSES.forEach(p => { const c = cell(r, hero(a, { size: 'sm', pose: p })); if (['typing', 'chilling'].includes(p)) c.classList.add('desk'); });
    });
  }
  if (only.includes('facings')) {
    const s = sec('facings', 'Facings × dir (md 128): ¾ right · side right · front · ¾ left · side left');
    cast.forEach(a => {
      const r = row(s); r.insertAdjacentHTML('beforeend', `<span class="gal-rl">${a.role}</span>`);
      [['three-quarter', 'right'], ['side', 'right'], ['front', 'right'], ['three-quarter', 'left'], ['side', 'left']].forEach(([f, d]) => cell(r, hero(a, { size: 128, facing: f, dir: d })));
      cell(r, hero(a, { size: 128, pose: 'walking', facing: 'side' }), 'walk');
      cell(r, hero(a, { size: 128, pose: 'talking', facing: 'side', dir: 'left' }), 'talk ←');
    });
  }
  if (only.includes('sizes')) {
    const s = sec('sizes', 'Sizes: 40 · 48 (xs) · 56 · 64 · 72 · 96 (sm) · 160 (md) · 360 (xl)', 'LOD (lod-xs) applies below 64px: no badge/blush/trim, thicker ink, keeps headgear, tool, eyes, catch-light.');
    ['a-baron', 'a-twinkle'].forEach(id => { const r = row(s, 'gal-bottom'); [40, 48, 56, 64, 72, 96, 160, 360].forEach(px => cell(r, hero(agentById(id), { size: px }), px + 'px')); });
  }
  if (only.includes('looks')) {
    const s = sec('looks', 'Identity: builds × hair (no role gear) · accessories · builds in gear');
    BUILDS.forEach(b => { const r = row(s); r.insertAdjacentHTML('beforeend', `<span class="gal-rl">${b}</span>`);
      HAIR.forEach((h, i) => cell(r, hero({ name: b, hue: HUES[i % 7], build: b, hair: h }, { size: 'sm' }), h)); });
    const r2 = row(s); r2.insertAdjacentHTML('beforeend', '<span class="gal-rl">extra</span>');
    ACCESSORIES.forEach((acc, i) => cell(r2, hero({ name: acc, hue: HUES[(i + 3) % 7], build: 'hero', hair: 'tuft', accessory: acc }, { size: 'sm', facing: 'front' }), acc));
    const r3 = row(s); r3.insertAdjacentHTML('beforeend', '<span class="gal-rl">gear</span>');
    BUILDS.forEach(b => ['Frontend', 'DevOps', 'Quality'].forEach(role => cell(r3, hero({ name: b, hue: 'sky', build: b, hair: 'swoop', role }, { size: 'sm' }), `${b} · ${role}`)));
    const r4 = row(s); r4.insertAdjacentHTML('beforeend', '<span class="gal-rl">hues</span>');
    HUES.forEach(hk => cell(r4, hero({ name: hk, hue: hk, build: 'hero', hair: 'curl', role: 'Research' }, { size: 'sm' }), COLOR_NAMES[hk]));
  }
  if (only.includes('extras')) {
    const s = sec('extras', 'Captain · ghost · holding · seated · role override · turn demo');
    const r = row(s, 'gal-bottom');
    const semi = agentById('a-semic'), tw = agentById('a-twinkle');
    cell(r, hero(semi, { size: 'xs', captain: true, armband: PALETTE.sun }), 'captain xs (pip)');
    cell(r, hero(semi, { size: 'sm', captain: true, armband: PALETTE.sun }), 'captain sm (pip)');
    cell(r, hero(semi, { size: 'md', captain: true, armband: PALETTE.sun, facing: 'front' }), 'captain md (armband)');
    cell(r, hero(agentById('a-lint'), { size: 'md', captain: true, armband: PALETTE.mint, pose: 'salute' }), 'captain salute');
    cell(r, hero({}, { size: 'md', ghost: true }), 'ghost / + New');
    cell(r, hero(tw, { size: 'md' }), 'Twinkle · Design');
    cell(r, hero(tw, { size: 'md', role: 'Research' }), 'role override → Research');
    const r2 = row(s, 'gal-bottom');
    HOLDINGS.forEach(h => cell(r2, hero(agentById('a-scar'), { size: 128, pose: h === 'envelope' ? 'carrying' : h === 'pen' ? 'writing' : h === 'binder' ? 'reading' : 'idle', holding: h }), 'holding ' + h));
    const r3 = row(s, 'gal-bottom');
    ['typing', 'chilling', 'sleeping', 'needs-input'].forEach(p => { const c = cell(r3, hero(agentById('a-pete'), { size: 128, pose: p, seated: true, label: true }), p + ' · seated'); c.classList.add('desk'); });
    const demo = hero(agentById('a-scar'), { size: 160, pose: 'typing', seated: true });
    const c = cell(r3, demo, 'setFacing turn demo'); c.classList.add('desk');
    const btn = document.createElement('button'); btn.className = 'btn btn-ghost on-dark btn-sm'; btn.textContent = 'Turn to me';
    btn.onclick = () => { const f = demo.classList.contains('face-front'); setFacing(demo, f ? 'three-quarter' : 'front'); btn.textContent = f ? 'Turn to me' : 'Back to work'; };
    c.appendChild(btn);
  }
  if (only.includes('emblems')) {
    const s = sec('emblems', 'Emblems × 7 hues (88px) · 24px · 16px · captain pips');
    EMBLEMS.forEach(e => {
      const r = row(s); r.insertAdjacentHTML('beforeend', `<span class="gal-rl">${e.name}</span>`);
      HUES.forEach(hk => cell(r, emblem({ emblem: e.id, color: hk }, 88)));
      const small = document.createElement('div'); small.className = 'gal-small';
      HUES.forEach(hk => { small.appendChild(emblem({ emblem: e.id, color: hk }, 24)); });
      small.appendChild(emblem({ emblem: e.id, color: 'sun' }, 16));
      r.appendChild(small);
    });
    const r = row(s); HUES.forEach(hk => r.appendChild(captainPip(hk)));
  }
}

</script>
<script data-module="js/app.js">
"use strict";
/* ============================================================
   app.js — boot, studio nav, hash router, global keys, motes.
   Routes:  #projects · #cast · #cast/teams · #access · #blueprint ·
            #office/<projectId>[/<sub>]  (also #office → aurora; #board,
            #features, #feature/<id> → office sub-layers) · #gallery[/<section>]
   Hooks into other modules (defined by them):
            renderProjects/renderAccess/renderBlueprint (studio.js),
            renderCast(tab) (cast.js), openOffice(id, sub)/closeOffice() (office-*.js),
            renderGallery(section) (gallery.js)
   Public:  STAGES, APP (current route state), route()
   ============================================================ */
const STAGES = [{ id: 'projects', label: 'Projects' }, { id: 'cast', label: 'Cast' }, { id: 'access', label: 'Access' }, { id: 'blueprint', label: 'Blueprint' }];
const APP = { view: null, stage: 'projects', sub: '' };

function _buildNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = STAGES.map(s => `<a href="#${s.id}" data-stage="${s.id}">${s.label}</a>`).join('');
}
function _showLayer(which) {
  document.getElementById('studio').hidden = which !== 'studio';
  document.getElementById('office').hidden = which !== 'office';
  document.getElementById('gallery').hidden = which !== 'gallery';
}

function route() {
  const parts = currentRoute().split('/').filter(Boolean);
  let head = parts[0] || 'projects';
  /* office shorthands from spec-office §3.5 */
  if (['board', 'features', 'feature'].includes(head)) { parts.unshift('office', 'aurora'); head = 'office'; }
  if (head === 'office' && (!parts[1] || ['board', 'features', 'feature'].includes(parts[1]))) parts.splice(1, 0, 'aurora');

  if (APP.view === 'office' && head !== 'office' && typeof closeOffice === 'function') closeOffice();
  if (sheetOpen()) closeSheet();

  if (head === 'gallery') {
    _showLayer('gallery'); APP.view = 'gallery';
    renderGallery(parts[1] || ''); return;
  }
  if (head === 'office') {
    _showLayer('office'); APP.view = 'office'; APP.sub = parts.slice(2).join('/');
    openOffice(parts[1], APP.sub); return;
  }
  const stage = STAGES.some(s => s.id === head) ? head : 'projects';
  _showLayer('studio'); APP.view = 'studio'; APP.stage = stage; APP.sub = parts.slice(1).join('/');
  document.querySelectorAll('#stage .scene').forEach(s => s.classList.toggle('active', s.id === 'scene-' + stage));
  document.querySelectorAll('#nav a').forEach(a => { if (a.dataset.stage === stage) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (stage === 'projects') renderProjects();
  if (stage === 'cast') renderCast(parts[1] === 'teams' ? 'teams' : 'agents');
  if (stage === 'access') renderAccess();
  if (stage === 'blueprint') renderBlueprint();
}

/* keyboard: '/' focuses project search; ←/→ move studio stages when focus is
   on the page itself or the nav (never steals arrows from lists/radiogroups) */
window.addEventListener('keydown', e => {
  if (e.defaultPrevented) return;
  const t = e.target;
  const typing = /input|textarea|select/i.test(t.tagName) || t.isContentEditable;
  if (APP.view !== 'studio' || sheetOpen() || typing) return;
  if (e.key === '/' && APP.stage === 'projects') {
    const s = document.getElementById('projSearch'); if (s) { e.preventDefault(); s.focus(); } return;
  }
  const free = t === document.body || t.closest('#nav') || t.classList.contains('scene');
  if (!free || (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft')) return;
  const i = STAGES.findIndex(s => s.id === APP.stage);
  const j = e.key === 'ArrowRight' ? Math.min(STAGES.length - 1, i + 1) : Math.max(0, i - 1);
  if (j !== i) { e.preventDefault(); go(STAGES[j].id); }
});

function _motes() {
  const m = document.getElementById('motes');
  for (let i = 0; i < 22; i++) {
    const d = document.createElement('span'); d.className = 'mote'; const s = 2 + Math.random() * 5;
    d.style.width = s + 'px'; d.style.height = s + 'px'; d.style.left = Math.random() * 100 + 'vw'; d.style.bottom = (-10 - Math.random() * 20) + 'vh';
    d.style.animationDuration = (14 + Math.random() * 20) + 's'; d.style.animationDelay = (-Math.random() * 20) + 's'; m.appendChild(d);
  }
}

/* ---- boot ---- */
_buildNav(); _motes();
window.addEventListener('hashchange', route);
route();

</script>
