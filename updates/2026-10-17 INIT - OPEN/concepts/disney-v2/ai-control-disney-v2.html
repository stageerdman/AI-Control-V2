<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Control — Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
/* ============================================================
   AI CONTROL — Disney / Pixar v2 (single self-contained file)
   Agents are cast members with faces & moods. The orchestrator
   is the director. Warm, rounded, story-driven, high-signal.
   All CSS / SVG / JS inline. No external resources.
   Extends concepts/disney-pixar.html (cast SVG, palette, moods,
   confetti, toast, motes, bubble/streaming, switch, keytag).
   ============================================================ */
:root{
  --bg-0:#1a1430; --bg-1:#241a44; --bg-2:#2e2156;
  --panel:#ffffff; --ink:#241a44; --ink-soft:#5b5280; --cream:#fff6e9;
  --sun:#ffc24b; --sun-deep:#ff9b3d; --coral:#ff6f73; --teal:#2fd3c3;
  --sky:#4ea8ff; --grape:#9b6cff; --mint:#8be88b; --rose:#ff9ecf;
  --line:rgba(36,26,68,.1);
  --shadow:0 18px 40px -18px rgba(20,10,45,.55);
  --shadow-sm:0 8px 20px -10px rgba(20,10,45,.45);
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --stage-pad:clamp(16px,3vw,40px);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Apple Color Emoji",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --cast-xs:34px; --cast-sm:58px; --cast-md:86px; --cast-lg:112px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--font);color:var(--ink);
  background:
    radial-gradient(1200px 600px at 15% -5%, #3a2a6e 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #6b3b7a 0%, transparent 55%),
    linear-gradient(160deg,var(--bg-0),var(--bg-1) 60%,#15102a 100%);
  overflow:hidden;
}
.sky-motes{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.mote{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,224,160,.9),rgba(255,224,160,0));opacity:.5;animation:drift linear infinite}
@keyframes drift{0%{transform:translateY(20px)}100%{transform:translateY(-120vh)}}

/* ---------- App frame ---------- */
#studio{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
#studio[hidden]{display:none}
header.topbar{display:flex;align-items:center;gap:14px;padding:14px var(--stage-pad);color:var(--cream)}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.2px}
.brand .logo{width:42px;height:42px;border-radius:14px;
  background:conic-gradient(from 210deg,var(--sun),var(--coral),var(--grape),var(--teal),var(--sun));
  box-shadow:0 0 0 3px rgba(255,255,255,.12),0 10px 24px -8px var(--sun-deep);
  display:grid;place-items:center;animation:spinSlow 18s linear infinite;flex:none}
.brand .logo svg{width:24px;height:24px}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.brand b{font-size:17px}
.brand span{display:block;font-size:11px;font-weight:600;color:rgba(255,246,233,.6);letter-spacing:.14em;text-transform:uppercase}
nav.stages{margin-left:auto;display:flex;gap:6px;background:rgba(255,255,255,.07);padding:6px;border-radius:999px;backdrop-filter:blur(8px)}
nav.stages button{appearance:none;border:0;background:transparent;color:rgba(255,246,233,.7);
  font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;padding:9px 15px;border-radius:999px;
  display:flex;align-items:center;gap:8px;transition:.2s}
nav.stages button:hover{color:var(--cream);background:rgba(255,255,255,.08)}
nav.stages button[aria-current="true"]{background:var(--cream);color:var(--ink)}
nav.stages button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

main.stage{flex:1;min-height:0;padding:0 var(--stage-pad) var(--stage-pad);position:relative}
.scene{position:absolute;inset:0 var(--stage-pad) var(--stage-pad);display:none;
  animation:sceneIn .5s cubic-bezier(.22,1,.36,1);overflow:auto;border-radius:var(--r-lg)}
.scene.active{display:block}
@keyframes sceneIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.panel{background:linear-gradient(180deg,#ffffff,#fff9f0);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:clamp(18px,2.4vw,30px)}
.scene-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.scene-head h1{margin:0;font-size:clamp(22px,2.6vw,30px);letter-spacing:-.02em;color:var(--cream)}
.scene-head p{margin:4px 0 0;color:rgba(255,246,233,.72);font-weight:600;max-width:64ch}
.kicker{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--sun)}
.spacer{flex:1}

/* ---------- Buttons ---------- */
.btn{appearance:none;font-family:inherit;font-weight:800;cursor:pointer;border:0;border-radius:999px;
  padding:13px 22px;font-size:15px;display:inline-flex;align-items:center;gap:10px;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,filter .2s}
.btn:active{transform:scale(.95)}
.btn:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.btn-hero{background:linear-gradient(180deg,var(--sun),var(--sun-deep));color:#4a2600;box-shadow:0 12px 26px -10px var(--sun-deep)}
.btn-hero:hover{transform:translateY(-2px);filter:brightness(1.03)}
.btn-ghost{background:rgba(36,26,68,.06);color:var(--ink)}
.btn-ghost:hover{background:rgba(36,26,68,.11)}
.btn-ghost.on-dark{background:rgba(255,255,255,.1);color:var(--cream)}
.btn-ghost.on-dark:hover{background:rgba(255,255,255,.18)}
.btn-dark{background:var(--ink);color:var(--cream)}
.btn-sm{padding:8px 14px;font-size:13px}
.section-title{font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.hint{font-size:12px;color:var(--ink-soft);font-weight:600}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}

/* ============================================================ CAST ============ */
.cast{--size:66px;width:var(--size);height:var(--size);position:relative;flex:none}
.cast svg{width:100%;height:100%;overflow:visible}
.cast .body{transform-origin:50% 72%;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scaleY(1) scaleX(1)}50%{transform:scaleY(1.04) scaleX(.97)}}
.cast .arm{transform-origin:72% 56%}
.cast .pupil{transition:transform .25s}
.cast .brow{transition:transform .25s}
.cast .mouth{transition:d .25s,transform .25s}
.cast .lid{transform:scaleY(0);transform-origin:center;animation:blink 5.2s infinite}
@keyframes blink{0%,96%,100%{transform:scaleY(0)}98%{transform:scaleY(1)}}
.cast.mood-neutral .body{animation:breathe 4.2s ease-in-out infinite}
.cast.mood-working .body{animation:workbob 1.1s ease-in-out infinite}
@keyframes workbob{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-2px) scaleY(1.02)}}
.cast.mood-working .pupil{transform:translateY(2px)}
.cast.mood-blocked .arm{animation:raise 1.2s ease-in-out infinite}
@keyframes raise{0%,100%{transform:rotate(0)}50%{transform:rotate(-54deg)}}
.cast.mood-blocked .brow{transform:translateY(-3px)}
.cast.mood-blocked .body{animation:worry 1.6s ease-in-out infinite}
@keyframes worry{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.cast.mood-celebrate .body{animation:jump .62s cubic-bezier(.34,1.56,.64,1) infinite}
@keyframes jump{0%{transform:translateY(0) scaleY(1)}30%{transform:translateY(0) scaleY(.82) scaleX(1.12)}60%{transform:translateY(-16px) scaleY(1.12) scaleX(.9)}100%{transform:translateY(0) scaleY(1)}}
.cast.mood-idle .body{animation:breathe 4.8s ease-in-out infinite;opacity:.85}
.cast.director{--size:var(--cast-lg)}

/* static-blocked arm pose (so raised hand reads even when frozen) */
.cast.mood-blocked.frozen-arm .arm{transform:rotate(-50deg)}

/* ============================================================ confetti / toast == */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:120;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(120px);z-index:130;
  background:var(--ink);color:var(--cream);font-weight:800;padding:14px 22px;border-radius:999px;
  box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;transition:transform .4s cubic-bezier(.34,1.56,.64,1);max-width:min(90vw,460px)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ============================================================ shared chips ===== */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px}
.pill.live{background:rgba(47,211,195,.18);color:#0b7d72}
.pill.idle{background:rgba(91,82,128,.12);color:var(--ink-soft)}
.pill.needs{background:rgba(255,111,115,.18);color:#c03540}
.pill.draft{background:rgba(155,108,255,.16);color:#6a3fd0}
.pill.archived{background:rgba(91,82,128,.12);color:var(--ink-soft)}
.pill.public{background:rgba(78,168,255,.16);color:#1e6fd0}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.chip{appearance:none;font-family:inherit;border:2px solid var(--line);background:#fff;color:var(--ink);
  font-weight:700;font-size:13px;padding:9px 14px;border-radius:999px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--sun-deep);background:var(--cream);transform:translateY(-1px)}
.chip:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.keytag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:8px;background:var(--cream);color:var(--ink);border:1px solid var(--line)}
.keytag .d{width:14px;height:14px;border-radius:4px;display:grid;place-items:center;font-size:9px;color:#2a1a10;font-weight:900}
.keytag.locked{opacity:.45}
.statuschip{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
.statuschip.working{background:rgba(78,168,255,.16);color:#1e6fd0}
.statuschip.blocked{background:rgba(255,111,115,.18);color:#c03540}
.statuschip.celebrate{background:rgba(139,232,139,.22);color:#2b8a3e}
.statuschip.idle{background:rgba(91,82,128,.12);color:var(--ink-soft)}
.statuschip.neutral{background:rgba(91,82,128,.1);color:var(--ink-soft)}

/* progress */
.progress{height:12px;border-radius:999px;background:rgba(36,26,68,.1);overflow:hidden;position:relative}
.progress .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--sky));transition:width .5s cubic-bezier(.22,1,.36,1);position:relative}
.progress .fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);background-size:40px 100%;animation:sheen 1.2s linear infinite}
@keyframes sheen{to{background-position:40px 0}}
.progress.mint .fill{background:linear-gradient(90deg,var(--mint),var(--teal))}
.progress.coral .fill{background:linear-gradient(90deg,var(--coral),var(--sun-deep))}
.progress.sm{height:8px}

/* switch (reused) */
.switch{width:46px;height:27px;border-radius:999px;background:rgba(36,26,68,.18);position:relative;transition:.2s;flex:none;border:0;cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--teal)}
.switch[aria-checked="true"]::after{transform:translateX(19px)}
.switch:focus-visible{outline:3px solid var(--grape);outline-offset:2px}

/* ============================================================ PROJECTS HOME ==== */
.search-wrap{position:relative;flex:1;min-width:220px;max-width:560px}
.search-wrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--ink-soft);pointer-events:none}
.search-wrap input{width:100%;font-family:inherit;font-size:16px;font-weight:600;color:var(--ink);
  border:0;border-radius:999px;padding:14px 18px 14px 46px;background:rgba(255,255,255,.95);box-shadow:var(--shadow-sm)}
.search-wrap input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.result-count{color:rgba(255,246,233,.7);font-weight:700;font-size:13px}
.shelf{margin-bottom:26px}
.shelf-head{display:flex;align-items:baseline;gap:12px;margin:0 0 4px;color:var(--cream)}
.shelf-head h2{margin:0;font-size:18px;letter-spacing:-.01em}
.shelf-head .cnt{font-size:12px;font-weight:800;color:rgba(255,246,233,.55);letter-spacing:.08em;text-transform:uppercase}
.shelf-hr{height:1px;background:rgba(255,255,255,.12);margin:8px 0 16px}
.shelf.active-shelf{background:linear-gradient(180deg,rgba(255,246,233,.06),transparent);border-radius:var(--r-lg);padding:14px;margin:-14px -14px 26px}
.shelf-grid{display:grid;gap:16px}
.shelf.active-shelf .shelf-grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.shelf.db-shelf .shelf-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.logo-tile{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;flex:none;box-shadow:var(--shadow-sm)}
.logo-tile.sm{width:40px;height:40px;border-radius:12px}
.logo-tile svg{width:60%;height:60%}
.pcard{background:var(--cream);border-radius:var(--r-md);padding:18px;cursor:pointer;text-align:left;font-family:inherit;
  border:2px solid transparent;box-shadow:var(--shadow-sm);transition:transform .18s,border-color .18s;position:relative;width:100%}
.pcard:hover{transform:translateY(-4px)}
.pcard:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.pcard.live{border-color:var(--teal)}
.pcard.needs{border-color:var(--coral)}
.pcard h3{margin:0 0 2px;font-size:17px}
.pcard .note{font-size:13px;color:var(--ink);font-weight:600;margin-top:4px}
.pcard .mini-cast{display:flex;margin:12px 0 10px;min-height:34px}
.pcard .mini-cast .cast{--size:var(--cast-xs);margin-left:-8px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.12))}
.pcard .mini-cast .cast:first-child{margin-left:0}
.plus-chip{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#fff;border:2px dashed var(--line);font-size:11px;font-weight:900;color:var(--ink-soft);margin-left:-8px}
.micro-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.micro-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--ink-soft);background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.pcard-db{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.9);border-radius:var(--r-md);padding:12px 14px;cursor:pointer;text-align:left;font-family:inherit;border:2px solid transparent;box-shadow:var(--shadow-sm);transition:transform .15s,border-color .15s;width:100%}
.pcard-db:hover{transform:translateY(-3px)}
.pcard-db:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.pcard-db h3{margin:0;font-size:15px}
.pcard-db .sub{font-size:12px;color:var(--ink-soft);font-weight:700}
.empty-state{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:30px;color:rgba(255,246,233,.85)}

/* ============================================================ CAST LIBRARY ===== */
.lib-tabs{display:inline-flex;gap:4px;background:rgba(255,255,255,.08);padding:5px;border-radius:999px}
.lib-tabs button{appearance:none;border:0;background:transparent;color:rgba(255,246,233,.7);font-family:inherit;font-weight:800;font-size:13px;padding:8px 16px;border-radius:999px;cursor:pointer;transition:.15s}
.lib-tabs button[aria-selected="true"]{background:var(--cream);color:var(--ink)}
.lib-tabs button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.def-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.defcard{background:var(--cream);border-radius:var(--r-md);padding:16px;text-align:left;font-family:inherit;border:2px solid transparent;box-shadow:var(--shadow-sm);transition:transform .18s,border-color .18s;cursor:pointer;width:100%;position:relative}
.defcard:hover{transform:translateY(-4px);border-color:var(--sun)}
.defcard:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.defcard .dhead{display:flex;gap:12px;align-items:center}
.defcard .dhead .cast{--size:var(--cast-sm)}
.defcard .nm{font-weight:800;font-size:16px}
.defcard .rl{font-size:12px;color:var(--ink-soft);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.defcard .logline{font-size:13px;font-weight:600;margin:10px 0;min-height:36px}
.defcard .prompt{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;line-height:1.4;max-height:3.6em;overflow:hidden}
.defcard .meta-line{font-size:11px;font-weight:700;color:var(--ink-soft);margin-top:9px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.defcard .summon{font-size:11px;font-weight:800;color:#2b8a3e;margin-top:6px}
.teamcard{background:var(--cream);border-radius:var(--r-md);padding:18px;text-align:left;font-family:inherit;border:2px solid transparent;box-shadow:var(--shadow-sm);transition:transform .18s,border-color .18s;cursor:pointer;width:100%;display:flex;gap:16px;align-items:flex-start}
.teamcard:hover{transform:translateY(-4px);border-color:var(--sun)}
.teamcard:focus-visible{outline:3px solid var(--grape);outline-offset:2px}

/* troupe badge */
.troupe{position:relative;border-radius:18px;background:#fff;box-shadow:var(--shadow-sm);padding:10px;flex:none}
.troupe .ring{position:absolute;inset:0;border-radius:18px;border:3px solid var(--sun);pointer-events:none}
.troupe .faces{display:flex;justify-content:center;align-items:flex-end}
.troupe .faces .cast{--size:var(--cast-xs);margin-left:-8px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.12))}
.troupe .faces .cast:first-child{margin-left:0}
.troupe .emblem{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:9px;background:#fff;box-shadow:var(--shadow-sm);display:grid;place-items:center;font-size:14px}
.troupe .count{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;padding:0 5px;border-radius:999px;background:var(--ink);color:var(--cream);font-size:11px;font-weight:900;display:grid;place-items:center}

/* ============================================================ FACTORY ========== */
.factory-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:20px;align-items:start}
@media (max-width:980px){.factory-grid{grid-template-columns:1fr}}
.preview-stage{background:linear-gradient(180deg,#2a1f52,#1d1540);border-radius:var(--r-lg);color:var(--cream);padding:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px;position:sticky;top:0}
.belt{display:flex;align-items:center;gap:8px;margin:14px 0;color:rgba(255,246,233,.5);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;width:100%}
.belt .track{flex:1;height:3px;border-radius:3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.2) 0 10px,transparent 10px 20px);background-size:200% 100%;animation:belt 2s linear infinite}
@keyframes belt{to{background-position:40px 0}}
.preview-name{font-size:22px;font-weight:800;letter-spacing:-.01em}
.preview-role{color:var(--sun);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.form{display:flex;flex-direction:column;gap:18px}
.field label{display:block;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;font-family:inherit;font-size:15px;font-weight:600;color:var(--ink);
  border:2px solid var(--line);border-radius:14px;padding:13px 15px;background:#fff;transition:.15s;resize:vertical}
.field textarea.mono{font-family:var(--mono);font-size:13px}
.field input:focus,.field textarea:focus,.field select:focus{outline:0;border-color:var(--sun-deep);box-shadow:0 0 0 4px rgba(255,155,61,.16)}
.name-row{display:flex;gap:8px}
.name-row input{flex:1}
.dice{appearance:none;border:2px solid var(--line);background:#fff;border-radius:14px;width:52px;cursor:pointer;font-size:20px}
.dice:hover{border-color:var(--sun-deep);background:var(--cream)}
.dice:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:40px;height:40px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:.15s;position:relative}
.swatch:hover{transform:scale(1.1)}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px #fff inset}

.presence{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:rgba(255,246,233,.7)}

.chatlog{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:18px 20px}
.bubble{max-width:84%;padding:12px 15px;border-radius:16px;font-weight:600;font-size:14.5px;line-height:1.45;animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.bubble.me{align-self:flex-end;background:linear-gradient(180deg,var(--sun),var(--sun-deep));color:#4a2600;border-bottom-right-radius:5px}
.bubble.them{align-self:flex-start;background:var(--cream);color:var(--ink);border-bottom-left-radius:5px;box-shadow:var(--shadow-sm)}
.bubble .who{display:block;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin-bottom:3px}

@keyframes caret{50%{opacity:0}}
.casting{align-self:stretch;border-left:3px solid var(--grape);background:rgba(155,108,255,.08);color:#5b4a8a;font-weight:700;font-size:13px;padding:8px 14px;border-radius:0 12px 12px 0;animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-soft);animation:typ 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes typ{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.quick-replies{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 8px}
.composer{display:flex;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:#fff}
.composer input{flex:1;font-family:inherit;font-size:15px;font-weight:600;color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:12px 16px}
.composer input:focus-visible{outline:0;border-color:var(--sun-deep);box-shadow:0 0 0 4px rgba(255,155,61,.16)}
.mic-btn{position:relative;width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;flex:none;
  background:radial-gradient(circle at 50% 35%,#fff,#ffd98a 55%,var(--sun-deep));
  box-shadow:0 8px 20px -8px var(--sun-deep);display:grid;place-items:center;transition:transform .2s;color:#5a2d00}
.mic-btn:hover{transform:scale(1.06)}
.mic-btn:focus-visible{outline:3px solid var(--grape);outline-offset:3px}
.mic-btn svg{width:22px;height:22px}
.mic-btn .ring{position:absolute;inset:-5px;border-radius:50%;border:3px solid rgba(255,194,75,.6);opacity:0}
.mic-btn[aria-pressed="true"]{background:radial-gradient(circle at 50% 35%,#fff,#ff9ecf 55%,var(--coral))}
.mic-btn[aria-pressed="true"] .ring{animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
.mic-btn.err{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.wave{display:none;align-items:center;gap:3px;height:28px}
.wave.live{display:flex}
.wave i{width:4px;border-radius:3px;background:linear-gradient(180deg,var(--sun),var(--coral));height:6px;animation:bars .9s ease-in-out infinite}
.wave i:nth-child(odd){animation-delay:.15s}.wave i:nth-child(3n){animation-delay:.3s}
@keyframes bars{0%,100%{height:6px}50%{height:var(--h,22px)}}

/* set rail */
.set-rail{display:flex;flex-direction:column;gap:14px;min-height:0}
.set-card{background:var(--cream);border-radius:var(--r-md);box-shadow:var(--shadow-sm);color:var(--ink);overflow:hidden}
.set-card__head{width:100%;display:flex;align-items:center;gap:12px;padding:15px 18px;background:transparent;border:0;font-family:inherit;cursor:pointer;text-align:left}
.set-card__head:focus-visible{outline:3px solid var(--grape);outline-offset:-3px}
.set-card__head .lbl{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}

.set-card__body{padding:0 18px 18px}

.pulse-ring{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.pulse-ring .big{font-size:34px;font-weight:900;letter-spacing:-.02em}
.pulse-ring .lbl{font-size:13px;font-weight:700;color:var(--ink-soft)}
.feat-line{margin-top:10px}
.feat-line .top{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:4px}
.feat-line .top .who{color:var(--ink-soft);font-weight:700}

.grade{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:900;padding:5px 10px;border-radius:10px}
.grade.A{background:rgba(139,232,139,.22);color:#2b8a3e}
.grade.B{background:rgba(255,194,75,.22);color:#9a6a00}
.grade.C{background:rgba(255,111,115,.18);color:#c03540}
.vital{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.vital:first-child{border-top:0}
.vital .vn{font-weight:800;font-size:13px}
.set-card__body .note{font-size:12.5px;font-weight:600;color:var(--ink-soft);padding:2px 0 10px}
.set-card__body .note[hidden]{display:none}

.team-block{border-left:4px solid var(--sun);border-radius:10px;background:#fff;padding:12px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.team-block.blocked{border-left-color:var(--coral)}
.team-block .th{display:flex;align-items:center;gap:10px}
.team-block .th .emblem{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:15px;background:var(--cream)}
.team-block .th b{font-size:14px}
.team-block .th .bld{font-size:11px;color:var(--ink-soft);font-weight:700}
.members{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.member{display:flex;align-items:center;gap:10px;padding:7px;border-radius:10px;cursor:pointer;transition:.12s;width:100%;text-align:left;background:transparent;border:0;font-family:inherit}
.member:hover{background:var(--cream)}
.member:focus-visible{outline:3px solid var(--grape);outline-offset:-2px}
.member .cast{--size:40px}
.member .mn{font-weight:800;font-size:13px}
.member .mj{font-size:11px;color:var(--ink-soft);font-weight:700}
.member .handup{color:var(--coral);font-weight:900;margin-left:auto;font-size:16px}
.member-detail{font-size:12.5px;font-weight:600;color:var(--ink-soft);padding:4px 10px 8px 58px}
.member-detail .keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

.shot-tally{display:flex;gap:14px;font-size:12px;font-weight:800;margin-bottom:10px;flex-wrap:wrap}

.shot{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;margin-bottom:7px;font-size:13px;font-weight:700}
.shot.now{background:#fff;border-left:4px solid var(--sun);box-shadow:var(--shadow-sm)}

.shot.planned .start:focus-visible{outline:3px solid var(--grape);outline-offset:2px}

/* dialog / sheet */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(20,10,45,.5);backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px;animation:fadeIn .2s}
.scrim[hidden]{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{background:linear-gradient(180deg,#ffffff,#fff9f0);color:var(--ink);border-radius:var(--r-lg);box-shadow:var(--shadow);
  max-width:min(94vw,540px);width:100%;max-height:90vh;overflow:auto;padding:24px;animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
.sheet.wide{max-width:min(94vw,640px)}
.sheet h2{margin:0 0 4px;font-size:21px;letter-spacing:-.01em}
.sheet .close{position:absolute;top:14px;right:16px}
.greenroom-head{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.greenroom-head .cast{--size:var(--cast-md)}
.ask-q{font-size:16px;font-weight:700;line-height:1.4;margin:10px 0}
.ask-ctx{font-size:12px;font-weight:800;color:var(--coral);margin-bottom:14px}
.next-ask{font-size:12px;font-weight:700;color:var(--ink-soft);margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}

/* ============================================================ reduced motion === */
@media (prefers-reduced-motion:reduce){
  .cast .body,.cast .arm,.cast .lid,.mote,.brand .logo,
  .belt .track,.progress .fill::after,.wave i,.pill .dot,.presence .dot,
  .mic-btn .ring,.ws-chip.live-dot::after,.pcard,.scene,.bubble,.casting,.handraise,.sheet,.toast,.typing i{animation:none!important}
  .cast.mood-blocked .arm{transform:rotate(-50deg)}
  .scene{transition:none}
}

      <div><b>AI Control</b><span>The Studio</span></div>
    </div>

<script>
"use strict";
/* ============================================================
   PALETTE + helpers (reused & extended from v1)
   ============================================================ */
const PALETTE={sun:'#ffc24b','sun-deep':'#ff9b3d',coral:'#ff6f73',teal:'#2fd3c3',sky:'#4ea8ff',grape:'#9b6cff',mint:'#8be88b',rose:'#ff9ecf'};
const COLOR_NAMES={sun:'Amber',coral:'Coral',teal:'Teal',sky:'Sky',grape:'Grape',mint:'Mint',rose:'Rose'};
function shade(hex,amt){
  let n=parseInt(hex.slice(1),16);
  let r=Math.max(0,Math.min(255,(n>>16)+amt));
  let g=Math.max(0,Math.min(255,(n>>8&255)+amt));
  let b=Math.max(0,Math.min(255,(n&255)+amt));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* ---- trait (crown-zone accessory) SVG snippets ---- */
function traitSVG(name,dark,light){

function cast(color,mood,opts={}){

/* cast from an agent definition object */
function castOf(agent,mood,size){
  return cast(agent.hue,mood||'neutral',{trait:agent.trait,prop:agent.prop,size:size});
}
/* troupe badge */
function troupe(team,size){
  const el=document.createElement('div');
  el.className='troupe';
  const px=size||104;
  el.style.width=px+'px';
  const ring=document.createElement('div');ring.className='ring';
  ring.style.borderColor=PALETTE[team.color]||team.color;
  if(team.mood==='blocked') ring.style.borderColor=PALETTE.coral;
  const faces=document.createElement('div');faces.className='faces';
  team.members.slice(0,4).forEach(id=>{const a=agentById(id);if(a)faces.appendChild(castOf(a,'neutral',(px*0.34)+'px'));});
  el.appendChild(ring);el.appendChild(faces);
  el.insertAdjacentHTML('beforeend',`<div class="emblem" aria-hidden="true">${team.emblem}</div><div class="count" aria-hidden="true">${team.members.length}</div>`);
  return el;
}

function renderTree(ul,nodes){
  nodes.forEach(n=>{
    const li=document.createElement('li');li.setAttribute('role','treeitem');
    const node=document.createElement('div');node.className='node';
    node.innerHTML=`<span class="glyph" aria-hidden="true">${n.glyph}</span><span class="path">${n.path}</span>
      <span class="desc" contenteditable="true" role="textbox" aria-label="Description for ${n.path}">${n.desc}</span>`;
    const d=node.querySelector('.desc');
    d.addEventListener('blur',()=>{if(d.textContent!==n.desc){n.desc=d.textContent;toast('📘 Blueprint updated');}});
    d.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();d.blur();}});
    li.appendChild(node);
    if(n.children){const sub=document.createElement('ul');sub.setAttribute('role','group');renderTree(sub,n.children);li.appendChild(sub);}
    ul.appendChild(li);
  });
}

function startSimLoop(){

    let changed=false;
    WS.features.now.forEach(f=>{
      if(f.blocked)return;
      f.pct=Math.min(100,f.pct+Math.round(2+Math.random()*5));changed=true;
      const m=matchByFeature(f);if(m&&m.mood==='working'){m.pct=f.pct;}
      if(f.pct>=100)shipFeature(f);
    });
    // advance lone workers' display pct
    WS.teams.forEach(t=>t.members.forEach(mm=>{if(mm.mood==='working'&&!matchFeatureOf(mm)){mm.pct=Math.min(100,mm.pct+Math.round(1+Math.random()*3));}}));

  },1900);
}

function renderCast(){
  if(castView==='agent'){renderAgentDesigner();return;}
  if(castView==='team'){renderTeamDesigner();return;}
  const el=document.getElementById('scene-cast');
  el.innerHTML=`
    <div class="scene-head">
      <div><div class="kicker">The Cast</div><h1>Your cast list</h1>
      <p>Every agent is a definition — a look, a role, and its own system prompt. The orchestrator can only cast from this library. Definitions rest at neutral; they come alive inside a project.</p></div>
      <div class="spacer"></div>
      <div class="lib-tabs" role="tablist" aria-label="Library">
        <button role="tab" data-ct="agents" aria-selected="${castTab==='agents'}">Agents</button>
        <button role="tab" data-ct="teams" aria-selected="${castTab==='teams'}">Teams</button>
      </div>
    </div>
    <div class="row" style="margin-bottom:16px;gap:12px">
      <div class="search-wrap" style="max-width:420px">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="castSearch" type="search" placeholder="Search ${castTab}…" aria-label="Search ${castTab}" value="${castQuery}">
      </div>
      <div class="spacer"></div>
      <button class="btn btn-hero" id="newBtn">＋ New ${castTab==='agents'?'agent':'team'}</button>
    </div>
    <div class="panel" id="castBody"></div>`;
  el.querySelectorAll('[data-ct]').forEach(b=>b.onclick=()=>{castTab=b.dataset.ct;castQuery='';renderCast();});
  el.querySelector('#castSearch').oninput=e=>{castQuery=e.target.value;fillCastBody();};
  el.querySelector('#newBtn').onclick=()=>{castView=castTab==='agents'?'agent':'team';resetDesigners();renderCast();};
  fillCastBody();
}
function fillCastBody(){
  const body=document.getElementById('castBody');if(!body)return;
  const q=castQuery.trim().toLowerCase();
  if(castTab==='agents'){
    const list=AGENTS.filter(a=>!q||a.name.toLowerCase().includes(q)||a.role.toLowerCase().includes(q)||a.prompt.toLowerCase().includes(q));
    if(!list.length){body.innerHTML='';const es=document.createElement('div');es.className='empty-state';es.style.color='var(--ink)';es.appendChild(cast('coral','blocked',{size:'72px'}));es.insertAdjacentHTML('beforeend','<h2>No one by that name</h2>');body.appendChild(es);return;}
    const grid=document.createElement('div');grid.className='def-grid';
    list.forEach(a=>grid.appendChild(defCard(a)));
    body.innerHTML='';body.appendChild(grid);
  } else {
    const list=TEAMS.filter(t=>!q||t.name.toLowerCase().includes(q));
    const grid=document.createElement('div');grid.className='def-grid';
    list.forEach(t=>grid.appendChild(teamCard(t)));
    body.innerHTML='';body.appendChild(grid);
  }
}
function defCard(a){
  const inTeams=TEAMS.filter(t=>t.members.includes(a.id));
  const card=document.createElement('button');card.className='defcard';
  card.innerHTML=`<div class="dhead"><div class="cslot"></div><div><div class="nm">${a.name}</div><div class="rl">${a.role}</div></div></div>
    <div class="logline">“${a.logline}”</div>
    <div class="prompt">${a.prompt}</div>
    <div class="meta-line">🔒 No standing access · project-granted</div>
    <div class="meta-line">Used in: ${inTeams.length?inTeams.map(t=>t.name).join(' · '):'—'}</div>
    <div class="summon">Summonable: solo ✓ &nbsp; via team ✓</div>`;
  card.querySelector('.cslot').appendChild(castOf(a,'neutral','58px'));
  card.onclick=()=>{castView='agent';loadAgentForEdit(a);renderCast();};
  return card;
}
function teamCard(t){
  t.mood='working';
  const card=document.createElement('button');card.className='teamcard';
  card.appendChild(troupe(t,104));
  const info=document.createElement('div');info.style.flex='1';
  info.innerHTML=`<div class="nm" style="font-size:17px;font-weight:800">${t.emblem} ${t.name}</div>
    <div class="rl" style="font-size:12px;color:var(--ink-soft);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin:2px 0 8px">${t.members.length} members</div>
    <div class="logline" style="font-size:13px;font-weight:600">${t.instr}</div>
    <div class="summon">Summonable as one unit ✓ · members solo ✓</div>`;
  card.appendChild(info);
  card.onclick=()=>{castView='team';loadTeamForEdit(t);renderCast();};
  return card;
}

/* ---- Agent designer ---- */
let agentDraft;
function resetDesigners(){agentDraft={id:null,name:'',role:'Frontend',hue:'teal',trait:'beanie',prop:'paint-brush',prompt:''};teamDraft={id:null,name:'',color:'sun',emblem:'🚀',instr:'',members:[]};}
function loadAgentForEdit(a){agentDraft={id:a.id,name:a.name,role:a.role,hue:a.hue,trait:a.trait,prop:a.prop,prompt:a.prompt};}
function renderAgentDesigner(){
  const el=document.getElementById('scene-cast');const d=agentDraft;
  el.innerHTML=`
    <div class="scene-head">
      <div><div class="kicker">The Factory</div><h1>${d.id?'Edit cast member':'Mint a cast member'}</h1></div>
      <div class="spacer"></div>
      <button class="btn btn-ghost on-dark btn-sm" id="backLib">← Cast library</button>
    </div>
    <div class="factory-grid">
      <div class="preview-stage">
        <div class="belt"><span>Assembling</span><span class="track"></span></div>
        <div id="pvCast"></div>
        <div class="preview-name" id="pvName">${d.name||'New agent'}</div>
        <div class="preview-role" id="pvRole">${d.role}</div>
        <div class="hint" style="color:rgba(255,246,233,.7);margin-top:12px;text-align:center">Summonable solo · addable to teams</div>
      </div>
      <div class="panel"><form class="form" id="agentForm" onsubmit="return false">
        <div class="field"><label for="agName">Name</label><div class="name-row"><input id="agName" value="${escapeAttr(d.name)}" maxlength="22" placeholder="Captain Semicolon…" autocomplete="off"><button type="button" class="dice" id="agDice" aria-label="Surprise me with a funny name">🎲</button></div></div>
        <div class="field"><label>Look — color</label><div class="swatches" id="agSw"></div></div>
        <div class="field"><label>Look — trait</label><div class="chip-row" id="agTrait"></div></div>
        <div class="field"><label>Look — hand prop</label><div class="chip-row" id="agProp"></div></div>
        <div class="field"><label for="agRole">Role</label><select id="agRole"></select></div>
        <div class="field"><label for="agPrompt">The agent's brain — its own system prompt</label>
          <textarea id="agPrompt" class="mono" rows="4" placeholder="What this agent always knows about itself and how it works.">${escapeHtml(d.prompt)}</textarea>
          <div class="tmpl-row" id="agTmpl"></div></div>
        <div class="row"><button class="btn btn-hero" id="agSave">✨ ${d.id?'Save changes':'Save agent'}</button><span class="hint">Shortest path: name → prompt → Save.</span></div>
      </form></div>
    </div>`;
  el.querySelector('#backLib').onclick=()=>{castView='library';renderCast();};
  const sel=el.querySelector('#agRole');ROLES.forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;if(r===d.role)o.selected=true;sel.appendChild(o);});
  sel.onchange=e=>{d.role=e.target.value;updateAgentPreview();};
  el.querySelector('#agName').oninput=e=>{d.name=e.target.value;updateAgentPreview();};
  el.querySelector('#agDice').onclick=()=>{d.name=FUNNY_NAMES[Math.floor(Math.random()*FUNNY_NAMES.length)];el.querySelector('#agName').value=d.name;updateAgentPreview();};
  el.querySelector('#agPrompt').oninput=e=>{d.prompt=e.target.value;};
  const sw=el.querySelector('#agSw');
  Object.keys(COLOR_NAMES).forEach(k=>{const b=document.createElement('button');b.type='button';b.className='swatch';b.style.background=PALETTE[k];b.setAttribute('aria-pressed',k===d.hue);b.setAttribute('aria-label','Color '+COLOR_NAMES[k]);b.onclick=()=>{d.hue=k;updateAgentPreview();};sw.appendChild(b);});
  const tr=el.querySelector('#agTrait');
  TRAITS.forEach(t=>{const b=document.createElement('button');b.type='button';b.className='achip';b.textContent=t;b.setAttribute('aria-pressed',t===d.trait);b.onclick=()=>{d.trait=t==='none'?null:t;if(t==='none')d.trait=null;else d.trait=t;updateAgentPreview();};tr.appendChild(b);});
  const pr=el.querySelector('#agProp');
  PROPS.forEach(t=>{const b=document.createElement('button');b.type='button';b.className='achip';b.textContent=t;b.setAttribute('aria-pressed',(t==='none'&&!d.prop)||t===d.prop);b.onclick=()=>{d.prop=t==='none'?null:t;updateAgentPreview();};pr.appendChild(b);});
  const tm=el.querySelector('#agTmpl');
  if(PROMPT_TEMPLATES[d.role]){const b=document.createElement('button');b.type='button';b.className='chip';b.textContent='Use '+d.role+' template';b.onclick=()=>{d.prompt=PROMPT_TEMPLATES[d.role];el.querySelector('#agPrompt').value=d.prompt;};tm.appendChild(b);}
  el.querySelector('#agSave').onclick=saveAgent;
  updateAgentPreview();
}
function updateAgentPreview(){
  const d=agentDraft;const pc=document.getElementById('pvCast');if(!pc)return;
  pc.innerHTML='';pc.appendChild(cast(d.hue,'celebrate',{trait:d.trait,prop:d.prop,size:'96px'}));
  document.getElementById('pvName').textContent=d.name||'New agent';
  document.getElementById('pvRole').textContent=d.role;
  document.querySelectorAll('#agSw .swatch').forEach(b=>b.setAttribute('aria-pressed',b.getAttribute('aria-label')==='Color '+COLOR_NAMES[d.hue]));
  document.querySelectorAll('#agTrait .achip').forEach(b=>b.setAttribute('aria-pressed',(b.textContent==='none'&&!d.trait)||b.textContent===d.trait));
  document.querySelectorAll('#agProp .achip').forEach(b=>b.setAttribute('aria-pressed',(b.textContent==='none'&&!d.prop)||b.textContent===d.prop));
}
function saveAgent(){
  const d=agentDraft;
  if(!d.name.trim()){toast('Give your agent a name first');return;}
  if(d.id){const a=agentById(d.id);Object.assign(a,{name:d.name,role:d.role,hue:d.hue,trait:d.trait,prop:d.prop,prompt:d.prompt});if(!a.logline)a.logline=d.prompt.split('.')[0];}
  else{AGENTS.push({id:'a-'+Date.now(),name:d.name,role:d.role,hue:d.hue,trait:d.trait,prop:d.prop,prompt:d.prompt||'A new cast member.',logline:(d.prompt||'A new cast member').split('.')[0]});}
  fireConfetti();toast(`✨ ${d.name} joined the cast`);
  const pc=document.querySelector('#pvCast .cast');if(pc)pc.className='cast mood-celebrate';
  castView='library';setTimeout(renderCast,700);
}

/* ---- Team designer ---- */
let teamDraft;
function loadTeamForEdit(t){teamDraft={id:t.id,name:t.name,color:t.color,emblem:t.emblem,instr:t.instr,members:t.members.map(id=>({id,instr:t.perMember[id]||''}))};}
function renderTeamDesigner(){
  const el=document.getElementById('scene-cast');const d=teamDraft;
  el.innerHTML=`
    <div class="scene-head">
      <div><div class="kicker">The Factory</div><h1>${d.id?'Edit troupe':'Assemble a troupe'}</h1></div>
      <div class="spacer"></div>
      <button class="btn btn-ghost on-dark btn-sm" id="backLib">← Cast library</button>
    </div>
    <div class="factory-grid">
      <div class="preview-stage">
        <div class="belt"><span>Posing the troupe</span><span class="track"></span></div>
        <div id="pvTroupe"></div>
        <div class="preview-name" id="pvTName" style="margin-top:14px">${d.name||'New team'}</div>
        <div class="preview-role" id="pvTCount">${d.members.length} members</div>
        <div class="hint" style="color:rgba(255,246,233,.7);margin-top:12px;text-align:center">Summonable as one unit ✓</div>
      </div>
      <div class="panel"><div class="form">
        <div class="field"><label for="tmName">Team name</label><div class="name-row"><input id="tmName" value="${escapeAttr(d.name)}" placeholder="The Ship-It Squad…"><button type="button" class="dice" id="tmDice" aria-label="Surprise me">🎲</button></div></div>
        <div class="field"><label>Team color</label><div class="swatches" id="tmSw"></div></div>
        <div class="field"><label>Emblem</label><div class="emoji-row" id="tmEm"></div></div>
        <div class="field"><label for="tmInstr">Team instructions — rules for the whole team</label><textarea id="tmInstr" rows="2" placeholder="Every member reads this on top of their own brain.">${escapeHtml(d.instr)}</textarea></div>
        <div class="field"><label>Roster — compose from existing agents</label><div id="tmRoster"></div>
          <button type="button" class="btn btn-ghost btn-sm" id="tmAdd">＋ Add agent</button></div>
        <div class="recap">Each member runs with <b>its own brain + the team's rules + its job on this team</b>. The orchestrator can summon any agent alone — or this whole troupe.</div>
        <div class="row"><button class="btn btn-hero" id="tmSave">🎬 ${d.id?'Save changes':'Save team'}</button></div>
      </div></div>
    </div>`;
  el.querySelector('#backLib').onclick=()=>{castView='library';renderCast();};
  el.querySelector('#tmName').oninput=e=>{d.name=e.target.value;updateTeamPreview();};
  el.querySelector('#tmDice').onclick=()=>{d.name=['The Ship-It Squad','Polish Patrol','Night Owls','The Refactormen','Launch Crew'][Math.floor(Math.random()*5)];el.querySelector('#tmName').value=d.name;updateTeamPreview();};
  el.querySelector('#tmInstr').oninput=e=>{d.instr=e.target.value;};
  const sw=el.querySelector('#tmSw');
  Object.keys(COLOR_NAMES).forEach(k=>{const b=document.createElement('button');b.type='button';b.className='swatch';b.style.background=PALETTE[k];b.setAttribute('aria-pressed',k===d.color);b.setAttribute('aria-label','Color '+COLOR_NAMES[k]);b.onclick=()=>{d.color=k;updateTeamPreview();};sw.appendChild(b);});
  const em=el.querySelector('#tmEm');
  EMBLEMS.forEach(e2=>{const b=document.createElement('button');b.type='button';b.className='emoji-pick';b.textContent=e2;b.setAttribute('aria-pressed',e2===d.emblem);b.setAttribute('aria-label','Emblem '+e2);b.onclick=()=>{d.emblem=e2;updateTeamPreview();};em.appendChild(b);});
  renderRoster();
  el.querySelector('#tmAdd').onclick=openAgentPicker;
  el.querySelector('#tmSave').onclick=saveTeam;
  updateTeamPreview();
}
function updateTeamPreview(){
  const d=teamDraft;const slot=document.getElementById('pvTroupe');if(!slot)return;
  slot.innerHTML='';
  slot.appendChild(troupe({color:d.color,emblem:d.emblem,members:d.members.length?d.members.map(m=>m.id):['a-pete'],mood:'working'},120));
  document.getElementById('pvTName').textContent=d.name||'New team';
  document.getElementById('pvTCount').textContent=d.members.length+' members';
  document.querySelectorAll('#tmSw .swatch').forEach(b=>b.setAttribute('aria-pressed',b.getAttribute('aria-label')==='Color '+COLOR_NAMES[d.color]));
  document.querySelectorAll('#tmEm .emoji-pick').forEach(b=>b.setAttribute('aria-pressed',b.textContent===d.emblem));
}
function renderRoster(){
  const host=document.getElementById('tmRoster');if(!host)return;host.innerHTML='';
  teamDraft.members.forEach((m,i)=>{
    const a=agentById(m.id);
    const row=document.createElement('div');row.className='member-row';
    row.innerHTML=`<div class="mhead"><div class="cs"></div><div style="flex:1"><b>${a.name}</b> <span class="ctx-glyph" title="Effective context = own brain ▸ team rules ▸ this job">▸▸▸</span><div class="rl">${a.role}</div></div><button class="btn btn-ghost btn-sm" aria-label="Remove ${a.name}">× remove</button></div>
      <textarea rows="2" placeholder="On this team: what is this agent's job here?">${escapeHtml(m.instr)}</textarea>`;
    row.querySelector('.cs').appendChild(castOf(a,'neutral','44px'));
    row.querySelector('textarea').oninput=e=>{m.instr=e.target.value;};
    row.querySelector('button').onclick=()=>{teamDraft.members.splice(i,1);renderRoster();updateTeamPreview();};
    host.appendChild(row);
  });
  if(!teamDraft.members.length)host.innerHTML='<p class="hint" style="margin:0 0 10px">No members yet — add agents from the library below.</p>';
}
function openAgentPicker(){
  const taken=new Set(teamDraft.members.map(m=>m.id));
  const avail=AGENTS.filter(a=>!taken.has(a.id));
  const body=document.createElement('div');
  body.innerHTML=`<button class="btn btn-ghost btn-sm close" id="apClose" aria-label="Close">✕</button><h2>Add an agent</h2><p class="hint" style="margin:8px 0 14px">You can only add agents that already exist in the library.</p><div class="def-grid" id="apGrid"></div>`;
  openSheet(body,'Add an agent');
  body.querySelector('#apClose').onclick=closeSheet;
  const grid=body.querySelector('#apGrid');
  if(!avail.length)grid.innerHTML='<p class="hint">Every agent is already on this team.</p>';
  avail.forEach(a=>{
    const c=document.createElement('button');c.className='defcard';
    c.innerHTML=`<div class="dhead"><div class="cs"></div><div><div class="nm">${a.name}</div><div class="rl">${a.role}</div></div></div><div class="logline">“${a.logline}”</div>`;
    c.querySelector('.cs').appendChild(castOf(a,'neutral','58px'));
    c.onclick=()=>{teamDraft.members.push({id:a.id,instr:''});closeSheet();renderRoster();updateTeamPreview();};
    grid.appendChild(c);
  });
}
function saveTeam(){
  const d=teamDraft;
  if(!d.name.trim()){toast('Give your team a name first');return;}
  if(!d.members.length){toast('Add at least one agent');return;}
  const perMember={};d.members.forEach(m=>perMember[m.id]=m.instr);
  if(d.id){const t=teamById(d.id);Object.assign(t,{name:d.name,color:d.color,emblem:d.emblem,instr:d.instr,members:d.members.map(m=>m.id),perMember});}
  else TEAMS.push({id:'t-'+Date.now(),name:d.name,color:d.color,emblem:d.emblem,instr:d.instr,members:d.members.map(m=>m.id),perMember});
  fireConfetti();toast(`🎬 ${d.name} is ready to be called`);
  castView='library';castTab='teams';setTimeout(renderCast,700);
}
function escapeAttr(s){return (s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

/* ============================================================
   EFFECTS — confetti, toast, motes, dialog sheet, keyboard
   ============================================================ */
function fireConfetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const c=document.getElementById('confetti');const cols=Object.values(PALETTE);
  for(let i=0;i<60;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'vw';
    p.style.background=cols[i%cols.length];p.style.animationDuration=(1.4+Math.random()*1.4)+'s';
    p.style.animationDelay=(Math.random()*.3)+'s';p.style.transform=`rotate(${Math.random()*360}deg)`;
    c.appendChild(p);setTimeout(()=>p.remove(),3200);}
}
let toastTimer=null;
function toast(msg){const t=document.getElementById('toast');t.innerHTML=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800);}

(function(){const m=document.getElementById('motes');
  for(let i=0;i<22;i++){const d=document.createElement('span');d.className='mote';const s=2+Math.random()*5;
    d.style.width=s+'px';d.style.height=s+'px';d.style.left=Math.random()*100+'vw';d.style.bottom=(-10-Math.random()*20)+'vh';
    d.style.animationDuration=(14+Math.random()*20)+'s';d.style.animationDelay=(-Math.random()*20)+'s';m.appendChild(d);}
})();

/* focus-trapped dialog */
const scrim=document.getElementById('scrim');
let lastFocused=null, trapHandler=null;
function openSheet(contentEl,label){
  lastFocused=document.activeElement;
  scrim.innerHTML='';
  const sheet=document.createElement('div');sheet.className='sheet';sheet.setAttribute('role','dialog');sheet.setAttribute('aria-modal','true');sheet.setAttribute('aria-label',label||'Dialog');sheet.style.position='relative';
  sheet.appendChild(contentEl);
  scrim.appendChild(sheet);scrim.hidden=false;
  scrim.onclick=e=>{if(e.target===scrim)closeSheet();};
  const focusables=()=>sheet.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"]),[contenteditable="true"]');
  setTimeout(()=>{const f=focusables();if(f.length)f[0].focus();},40);
  trapHandler=e=>{
    if(e.key==='Escape'){closeSheet();return;}
    if(e.key!=='Tab')return;
    const f=focusables();if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  };
  document.addEventListener('keydown',trapHandler);
  return sheet;
}
function closeSheet(){
  scrim.hidden=true;scrim.innerHTML='';
  if(trapHandler){document.removeEventListener('keydown',trapHandler);trapHandler=null;}
  if(lastFocused&&lastFocused.focus){try{lastFocused.focus();}catch(e){}}
}

/* keyboard: '/' focuses project search; arrows move studio stages */
window.addEventListener('keydown',e=>{
  const typing=/input|textarea|select/i.test(e.target.tagName)||e.target.isContentEditable;
  const studioOpen=document.getElementById('studio').hidden===false;
  const dialogOpen=scrim.hidden===false;
  if(e.key==='/'&&!typing&&studioOpen&&current==='projects'){
    const s=document.getElementById('projSearch');if(s){e.preventDefault();s.focus();}return;
  }
  if(typing||dialogOpen||!studioOpen)return;
  const i=STAGES.findIndex(s=>s.id===current);
  if(e.key==='ArrowRight'&&i<STAGES.length-1)go(STAGES[i+1].id);
  if(e.key==='ArrowLeft'&&i>0)go(STAGES[i-1].id);
});

/* ============================================================
   INIT
   ============================================================ */
resetDesigners();
go('projects');
</script>
