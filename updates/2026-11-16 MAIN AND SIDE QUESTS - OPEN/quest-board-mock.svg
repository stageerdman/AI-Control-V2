<!-- Quest Board mock, 1:1 at the whiteboard card's width (860). Open in a browser. Not production art:
     the real board is built from HTML/CSS + the parts in ./parts. See design-quest-board.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 870" width="860" height="870"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <symbol id="fix" viewBox="0 0 16 16">
      <path d="M10.6 2.2a3.6 3.6 0 0 0-3.9 4.8L2.4 11.3a1.2 1.2 0 0 0 0 1.7l.6.6a1.2 1.2 0 0 0 1.7 0L9 9.3a3.6 3.6 0 0 0 4.8-3.9l-2.2 2.2-2.1-.6-.6-2.1z" fill="#5b5280"/>
    </symbol>
    <symbol id="look" viewBox="0 0 16 16">
      <circle cx="6.6" cy="6.6" r="4.2" fill="none" stroke="#5b5280" stroke-width="1.8"/>
      <path d="M9.8 9.8l3.8 3.8" stroke="#5b5280" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="main" viewBox="0 0 16 16">
      <path d="M3.5 2v12.5" stroke="#241a44" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M4.4 2.6h9l-2.4 3 2.4 3h-9z" fill="#ff9b3d"/>
    </symbol>
    <symbol id="tick" viewBox="0 0 16 16">
      <path d="M4 8.5l2.6 2.6L12 5.6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <!-- card -->
  <rect width="860" height="870" rx="16" fill="#fdfcf7"/>
  <rect x="26" y="20" width="84" height="30" rx="15" fill="#241a44" opacity=".07"/>
  <text x="40" y="40" font-size="13" font-weight="800" fill="#241a44">← Office</text>

  <!-- header: title + compact project ring -->
  <use href="#main" x="26" y="66" width="22" height="22"/>
  <text x="54" y="86" font-size="22" font-weight="900" fill="#241a44" letter-spacing="-.2">Quest Board</text>
  <text x="762" y="70" font-size="12.5" font-weight="800" fill="#5b5280" text-anchor="end">to v1.0</text>
  <text x="762" y="88" font-size="12" font-weight="700" fill="#5b5280" opacity=".55" text-anchor="end">Change target</text>
  <circle cx="800" cy="76" r="24" fill="none" stroke="#ece8f5" stroke-width="7"/>
  <circle cx="800" cy="76" r="24" fill="none" stroke="#ff6f73" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="63.3 150.8" transform="rotate(-90 800 76)"/>
  <text x="800" y="81" font-size="14" font-weight="900" fill="#241a44" text-anchor="middle">42%</text>

  <!-- MAIN QUESTS -->
  <text x="26" y="128" font-size="11.5" font-weight="900" fill="#5b5280" letter-spacing="1.6">MAIN QUESTS</text>
  <rect x="26" y="140" width="808" height="334" rx="14" fill="#fff" stroke="#241a44" stroke-opacity=".1"/>

  <!-- ribbon (parts/quest-ribbon.svg), overhangs the card's left edge -->
  <path d="M12 162h30v28H12l10-14z" fill="#ff9b3d"/>
  <path d="M30 184l12 6v-6z" fill="#241a44" opacity=".22"/>
  <path d="M424 162h-30v28h30l-10-14z" fill="#ff9b3d"/>
  <path d="M406 184l-12 6v-6z" fill="#241a44" opacity=".22"/>
  <rect x="30" y="154" width="376" height="30" rx="4" fill="#ffc24b"/>
  <rect x="35" y="158.5" width="366" height="21" rx="2.5" fill="none" stroke="#fff6e9" stroke-width="1.2" stroke-dasharray="4 3" opacity=".8"/>
  <text x="48" y="175" font-size="15" font-weight="900" fill="#241a44">Main Quests &amp; Side Quests</text>
  <rect x="650" y="156" width="170" height="26" rx="13" fill="#241a44" opacity=".06"/>
  <text x="664" y="173" font-size="12.5" font-weight="800" fill="#5b5280">Ships when done  ›</text>

  <!-- quest progress -->
  <text x="48" y="222" font-size="28" font-weight="900" fill="#241a44" letter-spacing="-.5">60%</text>
  <text x="112" y="220" font-size="13" font-weight="700" fill="#5b5280">3 of 5 steps</text>
  <rect x="210" y="210" width="606" height="10" rx="5" fill="#ece8f5"/>
  <rect x="210" y="210" width="364" height="10" rx="5" fill="#2fd3c3"/>

  <!-- the trail: one line through every step's mark -->
  <path d="M62 258v84" stroke="#2fd3c3" stroke-width="3" stroke-linecap="round"/>
  <path d="M62 342v100" stroke="#241a44" stroke-opacity=".25" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/>

  <!-- step 1: done -->
  <circle cx="62" cy="258" r="10" fill="#2fd3c3"/>
  <use href="#tick" x="54" y="250" width="16" height="16"/>
  <text x="86" y="263" font-size="14.5" font-weight="600" fill="#5b5280">Design the quest board look</text>
  <circle cx="742" cy="258" r="11" fill="#ff9ecf" stroke="#fff" stroke-width="2"/>
  <circle cx="738.5" cy="257" r="1.6" fill="#241a44"/><circle cx="745.5" cy="257" r="1.6" fill="#241a44"/>
  <text x="760" y="263" font-size="13" font-weight="700" fill="#241a44">Blair</text>

  <!-- step 2: done -->
  <circle cx="62" cy="300" r="10" fill="#2fd3c3"/>
  <use href="#tick" x="54" y="292" width="16" height="16"/>
  <text x="86" y="305" font-size="14.5" font-weight="600" fill="#5b5280">Server: tag each goal as a main or side quest</text>
  <circle cx="742" cy="300" r="11" fill="#4ea8ff" stroke="#fff" stroke-width="2"/>
  <circle cx="738.5" cy="299" r="1.6" fill="#241a44"/><circle cx="745.5" cy="299" r="1.6" fill="#241a44"/>
  <text x="760" y="305" font-size="13" font-weight="700" fill="#241a44">Uncle Bob</text>

  <!-- step 3: in progress (the "you are here" waypoint, gently pulsing) -->
  <circle cx="62" cy="342" r="15" fill="#4ea8ff" opacity=".18"/>
  <circle cx="62" cy="342" r="9" fill="#fff" stroke="#4ea8ff" stroke-width="2.5"/>
  <circle cx="62" cy="342" r="3.5" fill="#4ea8ff"/>
  <text x="86" y="347" font-size="14.5" font-weight="700" fill="#241a44">Build the quest board</text>
  <circle cx="664" cy="342" r="11" fill="#9b6cff" stroke="#fff" stroke-width="2"/>
  <circle cx="660.5" cy="341" r="1.6" fill="#241a44"/><circle cx="667.5" cy="341" r="1.6" fill="#241a44"/>
  <text x="682" y="347" font-size="13" font-weight="700" fill="#241a44">Jony</text>
  <text x="716" y="347" font-size="12.5" font-weight="800" fill="#5b5280">reviewing</text>

  <!-- step 4: stopped by a problem -->
  <circle cx="62" cy="384" r="10" fill="#ff6f73"/>
  <text x="62" y="389" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">!</text>
  <text x="86" y="389" font-size="14.5" font-weight="600" fill="#241a44">Agents put main quests first</text>
  <text x="86" y="409" font-size="13" font-weight="600" fill="#a3242c">Stuck: no new work after fresh starts.</text>
  <text x="332" y="409" font-size="12.5" font-weight="800" fill="#5b5280">Details ▸</text>
  <!-- the stalled bar lives on the quest it belongs to -->
  <rect x="620" y="372" width="196" height="28" rx="14" fill="#ff6f73" opacity=".1"/>
  <rect x="626" y="376" width="80" height="20" rx="10" fill="#241a44"/>
  <text x="666" y="390" font-size="12" font-weight="800" fill="#fff6e9" text-anchor="middle">Continue</text>
  <rect x="712" y="376" width="56" height="20" rx="10" fill="#fff" stroke="#241a44" stroke-opacity=".15"/>
  <text x="740" y="390" font-size="12" font-weight="800" fill="#241a44" text-anchor="middle">Drop</text>

  <!-- step 5: to do -->
  <circle cx="62" cy="442" r="9" fill="#fff" stroke="#241a44" stroke-opacity=".3" stroke-width="2"/>
  <text x="86" y="447" font-size="14.5" font-weight="600" fill="#241a44">Check it live</text>

  <!-- other main quests, folded -->
  <rect x="26" y="486" width="808" height="40" rx="12" fill="#fff" stroke="#241a44" stroke-opacity=".1"/>
  <use href="#main" x="42" y="498" width="16" height="16"/>
  <text x="66" y="511" font-size="15" font-weight="800" fill="#241a44">Agent performance</text>
  <rect x="560" y="502" width="200" height="8" rx="4" fill="#ece8f5"/>
  <rect x="560" y="502" width="80" height="8" rx="4" fill="#2fd3c3"/>
  <text x="772" y="511" font-size="14" font-weight="900" fill="#241a44">40%</text>
  <text x="816" y="512" font-size="20" fill="#5b5280">›</text>

  <rect x="26" y="534" width="808" height="40" rx="12" fill="#fff" stroke="#241a44" stroke-opacity=".1"/>
  <use href="#main" x="42" y="546" width="16" height="16"/>
  <text x="66" y="559" font-size="15" font-weight="800" fill="#241a44">Invite another</text>
  <rect x="560" y="550" width="200" height="8" rx="4" fill="#ece8f5"/>
  <rect x="560" y="550" width="160" height="8" rx="4" fill="#2fd3c3"/>
  <text x="772" y="559" font-size="14" font-weight="900" fill="#241a44">80%</text>
  <text x="816" y="560" font-size="20" fill="#5b5280">›</text>

  <!-- SIDE QUESTS -->
  <text x="26" y="616" font-size="11.5" font-weight="900" fill="#5b5280" letter-spacing="1.6">SIDE QUESTS</text>
  <text x="834" y="616" font-size="12.5" font-weight="700" fill="#5b5280" text-anchor="end">2 open · 1 stuck</text>

  <!-- card 1: research, in progress -->
  <g transform="rotate(-1.2 121 694)">
    <rect x="26" y="632" width="190" height="124" rx="10" fill="#fff" stroke="#241a44" stroke-opacity=".1"/>
    <ellipse cx="122" cy="646" rx="6" ry="2" fill="#241a44" opacity=".16"/>
    <circle cx="121" cy="636" r="7.5" fill="#ff9b3d"/><circle cx="118.4" cy="633.4" r="2.2" fill="#fff6e9" opacity=".85"/>
    <use href="#look" x="38" y="650" width="14" height="14"/>
    <text x="57" y="661" font-size="10.5" font-weight="900" fill="#5b5280" letter-spacing="1">RESEARCH</text>
    <circle cx="198" cy="657" r="8" fill="#fff" stroke="#4ea8ff" stroke-width="2.2"/><circle cx="198" cy="657" r="3" fill="#4ea8ff"/>
    <text x="38" y="688" font-size="14" font-weight="700" fill="#241a44">Why do builds stop</text>
    <text x="38" y="706" font-size="14" font-weight="700" fill="#241a44">at the step cap?</text>
    <circle cx="48" cy="736" r="10" fill="#8be88b" stroke="#fff" stroke-width="2"/>
    <circle cx="45" cy="735" r="1.5" fill="#241a44"/><circle cx="51" cy="735" r="1.5" fill="#241a44"/>
    <text x="64" y="741" font-size="13" font-weight="700" fill="#241a44">Elon</text>
  </g>

  <!-- card 2: fix, just done -->
  <g transform="rotate(0.8 327 694)">
    <rect x="232" y="632" width="190" height="124" rx="10" fill="#fff" stroke="#241a44" stroke-opacity=".1"/>
    <ellipse cx="328" cy="646" rx="6" ry="2" fill="#241a44" opacity=".16"/>
    <circle cx="327" cy="636" r="7.5" fill="#2fd3c3"/><circle cx="324.4" cy="633.4" r="2.2" fill="#fff6e9" opacity=".85"/>
    <use href="#fix" x="244" y="650" width="14" height="14"/>
    <text x="263" y="661" font-size="10.5" font-weight="900" fill="#5b5280" letter-spacing="1">FIX</text>
    <circle cx="404" cy="657" r="8" fill="#2fd3c3"/><use href="#tick" x="397" y="650" width="14" height="14"/>
    <text x="244" y="688" font-size="14" font-weight="700" fill="#5b5280">Fix the pager dot</text>
    <text x="244" y="706" font-size="14" font-weight="700" fill="#5b5280">colour</text>
    <circle cx="254" cy="736" r="10" fill="#ffc24b" stroke="#fff" stroke-width="2"/>
    <circle cx="251" cy="735" r="1.5" fill="#241a44"/><circle cx="257" cy="735" r="1.5" fill="#241a44"/>
    <text x="270" y="741" font-size="13" font-weight="700" fill="#241a44">Pete</text>
  </g>

  <!-- card 3: fix, stuck -->
  <g transform="rotate(-0.6 533 694)">
    <rect x="438" y="632" width="190" height="124" rx="10" fill="#fff" stroke="#ff6f73" stroke-opacity=".55" stroke-width="1.5"/>
    <ellipse cx="534" cy="646" rx="6" ry="2" fill="#241a44" opacity=".16"/>
    <circle cx="533" cy="636" r="7.5" fill="#ff6f73"/><circle cx="530.4" cy="633.4" r="2.2" fill="#fff6e9" opacity=".85"/>
    <use href="#fix" x="450" y="650" width="14" height="14"/>
    <text x="469" y="661" font-size="10.5" font-weight="900" fill="#5b5280" letter-spacing="1">FIX</text>
    <circle cx="610" cy="657" r="8" fill="#ff6f73"/>
    <text x="610" y="661.5" font-size="11.5" font-weight="900" fill="#fff" text-anchor="middle">!</text>
    <text x="450" y="688" font-size="14" font-weight="700" fill="#241a44">Free port 3569</text>
    <text x="450" y="708" font-size="12.5" font-weight="600" fill="#a3242c">Couldn’t start: the port</text>
    <text x="450" y="724" font-size="12.5" font-weight="600" fill="#a3242c">is already in use.</text>
    <text x="450" y="744" font-size="12.5" font-weight="800" fill="#5b5280">Details ▸</text>
  </g>

  <!-- card 4: fix, to do -->
  <g transform="rotate(1.2 739 694)">
    <rect x="644" y="632" width="190" height="124" rx="10" fill="#fff" stroke="#241a44" stroke-opacity=".1"/>
    <ellipse cx="740" cy="646" rx="6" ry="2" fill="#241a44" opacity=".16"/>
    <circle cx="739" cy="636" r="7.5" fill="#ff9b3d"/><circle cx="736.4" cy="633.4" r="2.2" fill="#fff6e9" opacity=".85"/>
    <use href="#fix" x="656" y="650" width="14" height="14"/>
    <text x="675" y="661" font-size="10.5" font-weight="900" fill="#5b5280" letter-spacing="1">FIX</text>
    <circle cx="816" cy="657" r="7.5" fill="#fff" stroke="#241a44" stroke-opacity=".3" stroke-width="2"/>
    <text x="656" y="688" font-size="14" font-weight="700" fill="#241a44">Tidy the issues list</text>
    <text x="656" y="741" font-size="12.5" font-weight="700" fill="#5b5280">Waiting</text>
  </g>

  <!-- finished side quests, folded into one strip -->
  <rect x="26" y="776" width="808" height="38" rx="19" fill="#2fd3c3" opacity=".14"/>
  <circle cx="48" cy="795" r="10" fill="#2fd3c3"/><use href="#tick" x="40" y="787" width="16" height="16"/>
  <text x="68" y="800" font-size="13.5" font-weight="800" fill="#241a44">4 side quests done today</text>
  <circle cx="262" cy="795" r="10" fill="#ffc24b" stroke="#fff" stroke-width="2"/>
  <circle cx="276" cy="795" r="10" fill="#ff6f73" stroke="#fff" stroke-width="2"/>
  <circle cx="290" cy="795" r="10" fill="#4ea8ff" stroke="#fff" stroke-width="2"/>
  <text x="308" y="800" font-size="13" font-weight="700" fill="#5b5280">Pete, Ava, Scarlett +1</text>
  <text x="814" y="800" font-size="12.5" font-weight="800" fill="#5b5280" text-anchor="end">Show ▾</text>

  <!-- footer -->
  <rect x="26" y="828" width="126" height="30" rx="15" fill="#241a44" opacity=".07"/>
  <text x="40" y="848" font-size="13" font-weight="800" fill="#241a44">How we work →</text>
</svg>
